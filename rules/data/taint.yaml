  go:
    sources:
      - re: '^(r|req|request|httpReq|hr)\.(FormValue|PostFormValue|URL\.Query\(\)\.Get|URL\.Query\(\)|Header\.Get|Header\.Values|Cookie|Cookies|Body|URL\.RawQuery|URL\.Path|Form\.Get|PostForm\.Get|FormFile|Referer|UserAgent|RequestURI|PathValue)\b'
      - re: '^(c|ctx|gc)\.(Query|DefaultQuery|Param|PostForm|DefaultPostForm|GetHeader|GetQuery|QueryArray|PostFormArray|GetPostForm|Cookie|FormFile|GetRawData)\(\)$'
        file: 'gin-gonic/gin'
      - re: '^(c|ctx)\.(QueryParam|QueryParams|FormValue|Param|Cookie|FormFile|QueryString)\(\)$'
        file: 'labstack/echo'
      - re: '^mux\.Vars\(\)'
    sanitizers:
      regex: ['^regexp\.QuoteMeta$']
      all: ['^(strconv\.(Atoi|ParseInt|ParseUint|ParseFloat|ParseBool)|len|uuid\.Parse|net\.ParseIP|strings\.(HasPrefix|HasSuffix|Contains|EqualFold)|filepath\.IsLocal)$']
      path: ['^(filepath|path)\.Base$']
      # project helpers named sanitize*/safeRedirect* that normalise a redirect target
      redirect: ['(?i)(^|\.)(sanitize\w*|safe\w*redirect\w*)$']
      # encoding/json escapes <, > and & in strings (HTMLEscape) unless SetEscapeHTML(false)
      xss: ['^(html\.EscapeString|template\.HTMLEscapeString|template\.HTMLEscaper|template\.JSEscapeString|url\.QueryEscape|url\.PathEscape|json\.Marshal|json\.MarshalIndent)$']
      ldap: ['^ldap\.(EscapeFilter|EscapeDN)$']
    sinks:
      sqli:
        - {callee: '\.(Query|QueryRow|Exec|Prepare|Raw)$', args: [0], file: '(database/sql|jmoiron/sqlx|gorm\.io|jackc/pgx)'}
        - {callee: '\.(QueryContext|QueryRowContext|ExecContext|PrepareContext)$', args: [1], file: '(database/sql|jmoiron/sqlx|jackc/pgx)'}
        - {callee: '\.(Select|Get)$', args: [1], file: 'jmoiron/sqlx'}
        - {callee: '\.(Where|Order|Group|Having|Joins)$', args: [0], file: 'gorm\.io'}
      cmdi:
        - {callee: '^exec\.(Command|CommandContext)$'}
        - {callee: '^syscall\.Exec$'}
      path:
        - {callee: '^(os\.(Open|OpenFile|ReadFile|WriteFile|Create|Remove|RemoveAll|Mkdir|MkdirAll|ReadDir|Chmod|Rename)|ioutil\.(ReadFile|WriteFile|ReadDir))$'}
        # ServeFile itself rejects ".." elements when the name is the request's own URL path
        - {callee: '^http\.ServeFile$', args: [2], unless: '^http\.ServeFile\(\w+,\w+,\w+\.URL\.Path\)$', unless_source: '^line \d+: \w+\.URL\.Path$'}
      ldap:
        - {callee: '^ldap\.NewSearchRequest$', args: [0, 6]}
      xss:
        # net/http sniffs the Content-Type from the first bytes when none is set (DetectContentType):
        # a body that starts with fixed text other than '<' is served as text/plain, not HTML
        - {callee: '^(w|rw|writer|resp|res)\.Write$', args: [0], unless: '^\w+\.Write\(\[\]byte\((fmt\.Sprintf\()?"[^<"\\]'}
        - {callee: '^fmt\.(Fprintf|Fprint|Fprintln)$', when: '^fmt\.Fprint\w*\((w|rw|writer|resp|res|c\.Writer),', unless: '^fmt\.Fprint\w*\(\w+(\.\w+)?,"[^<"\\]'}
        - {callee: '^io\.WriteString$', args: [1], when: '^io\.WriteString\((w|rw|writer|resp|res|c\.Writer),'}
        - {callee: '^template\.(HTML|JS|HTMLAttr|URL|CSS)$', args: [0]}
      ssrf:
        - {callee: '^http\.(Get|Post|Head|PostForm)$', args: [0]}
        - {callee: '^http\.NewRequest$', args: [1]}
        - {callee: '^http\.NewRequestWithContext$', args: [2]}
      redirect:
        # a function that strips or rejects a leading "//" (or "/\") only redirects to same-origin paths
        - {callee: '^http\.Redirect$', args: [2], unless: '^http\.Redirect\(\w+,\w+,"/[^/\\"]', unless_func: '"//"|Trim(Left|Prefix)?\([^()]*,\s*"/"\)'}
        - {callee: '^(c|ctx)\.Redirect$', args: [1], file: '(gin-gonic/gin|labstack/echo)', unless_func: '"//"|Trim(Left|Prefix)?\([^()]*,\s*"/"\)'}
      trust:
        - {callee: '(^|\.)Values\.__setitem__$', args: [0, 1], file: 'gorilla/sessions'}
      smtp:
        - {callee: '^smtp\.SendMail$', args: [3, 4]}
      regex:
        - {callee: '^regexp\.(Compile|MustCompile|MatchString|Match|CompilePOSIX|MustCompilePOSIX)$', args: [0]}
