- id: GHA-SEC-CURL-PIPE-SHELL
  title: 'run: pipes a download straight into a shell'
  language: yaml
  kind: security
  category: security
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - .github/workflows/*.yml
    - .github/workflows/*.yaml
    - '**/.github/workflows/*.yml'
    - '**/.github/workflows/*.yaml'
    query: |
      ((block_mapping_pair key: (flow_node) @k value: (_) @match) (#eq? @k "run") (#match? @match "(curl|wget)[^|\\n]*\\|\\s*(sudo\\s+)?(-E\\s+)?(ba|z|da)?sh\\b"))
    filters:
    - 'file.has_re:(?m)^(on|"on"|''on''|true):|(?m)^on:'
    exclude_tests: true
  message: Whatever the server returns at that moment runs on the runner, with the workflow's secrets. Download to a file, verify a pinned checksum or signature, then run it - or use a pinned action/package.
  source:
    url: https://github.com/ossf/scorecard/blob/main/docs/checks.md
    doc: 'run: pipes a download straight into a shell'
    doc_version: OpenSSF Scorecard checks (main)
    retrieved: '2026-10-09'
    quote: Medium (possible compromised dependencies) This check tries to determine if the project pins dependencies used during its build and release process.
  examples:
    bad: |
      on: push
      permissions:
        contents: read
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - run: curl -fsSL https://get.example.dev/install.sh | bash
    good: |
      on: push
      permissions:
        contents: read
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - run: |
                curl -fsSLo install.sh https://get.example.dev/install.sh
                echo "3b1f...  install.sh" | sha256sum -c -
                bash install.sh
  cwe:
  - CWE-494
  owasp:
  - A08:2021
  - A08:2025
  status: active
  rule_version: 1
- id: GHA-SEC-DUMP-CONTEXT
