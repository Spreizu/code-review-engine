- id: GHA-SEC-PR-TARGET-CHECKOUT
  title: pull_request_target/workflow_run checks out the untrusted PR head
  language: yaml
  kind: security
  category: security
  severity: critical
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - .github/workflows/*.yml
    - .github/workflows/*.yaml
    - '**/.github/workflows/*.yml'
    - '**/.github/workflows/*.yaml'
    query: |
      ((block_mapping_pair key: (flow_node) @k value: (_) @match) (#eq? @k "ref") (#match? @match "github\\.event\\.(pull_request\\.head\\.(sha|ref)|workflow_run\\.head_(sha|branch))|github\\.head_ref|refs/pull/"))
    filters:
    - 'file.has_re:(?m)^(on|"on"|''on''|true):|(?m)^on:'
    - file.has_re:pull_request_target|workflow_run
    exclude_tests: true
  message: pull_request_target and workflow_run run with the base repository's secrets and a write token; checking out the contributor's code and then building or testing it runs attacker code with those privileges. Use the pull_request trigger for untrusted code, or keep the privileged job away from the checkout.
  source:
    url: https://docs.github.com/en/actions/reference/security/secure-use
    doc: pull_request_target/workflow_run checks out the untrusted PR head
    doc_version: GitHub Docs (2026)
    retrieved: '2026-10-09'
    quote: The pull_request_target and workflow_run workflow triggers, when used with the checkout of an untrusted pull request, expose the repository to security compromises.
  examples:
    bad: |
      on: pull_request_target
      jobs:
        test:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
              with:
                ref: ${{ github.event.pull_request.head.sha }}
            - run: npm ci && npm test
    good: |
      on: pull_request
      jobs:
        test:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - run: npm ci && npm test
  cwe:
  - CWE-829
