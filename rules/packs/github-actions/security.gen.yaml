    - '**/.github/workflows/*.yaml'
    query: |
      ((block_mapping_pair key: (flow_node) @k value: (_) @match) (#match? @k "^(run|script)$") (#match? @match "toJSON\\(\\s*(secrets|github)\\s*\\)"))
    filters:
    - 'file.has_re:(?m)^(on|"on"|''on''|true):|(?m)^on:'
    exclude_tests: true
  message: The full secrets map (or github context, which carries the token) goes into the job log; masking only covers exact registered values, so derived or multi-line secrets leak. Print only the fields you need.
  source:
    url: https://github.com/ossf/scorecard/blob/main/docs/checks.md
    doc: Workflow prints the secrets or github context
    doc_version: OpenSSF Scorecard checks (main)
    retrieved: '2026-10-09'
    quote: Some examples of these patterns are untrusted code checkouts, logging github context and secrets, or use of potentially untrusted inputs in scripts.
  examples:
    bad: |
