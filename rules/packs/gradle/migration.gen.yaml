  severity: major
  applies_to:
    gradle: '>=9.4'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.gradle'
    query: |
      ((method_invocation name: (identifier) @match body: (closure)) (#match? @match "^(onOutput|beforeTest|afterTest|beforeSuite|afterSuite)$"))
  message: Deprecated in 9.4 (removed in 10); register TestListener/TestOutputListener implementations.
  source:
    url: https://docs.gradle.org/current/userguide/upgrading_version_9.html
    doc: Closure-taking Test listener methods (Groovy DSL)
    doc_version: Gradle 9.4
    retrieved: '2026-10-09'
    quote: 'methods taking Closure on Test tasks The following APIs are deprecated and will be removed in Gradle 10.0.0: AbstractTestTask.onOutput(Closure) can be replaced with AbstractTestTask.addTestOutputListener(TestOutputListener) AbstractTestTask.beforeTest(Closure) can be replac'
  examples:
    bad: |
      test {
          afterTest { desc, result -> println desc }
      }
    good: |
      test {
          addTestListener(new MyListener())
      }
