- id: GRADLE-SEC-DYNAMIC-VERSION-GROOVY
  title: Dynamic / latest.* dependency version (Groovy DSL)
  language: groovy
  kind: security
  category: supply-chain
  severity: major
  applies_to:
    gradle: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.gradle'
    query: |
      ([(character_literal) (string_literal)] @match (#match? @match "^.[\\w.\\-]+:[\\w.\\-]+:([0-9.]*\\+|latest\\.(release|integration))"))
  message: Dynamic versions make builds non-reproducible and can pull a malicious/broken release; pin versions (and use dependency locking).
  source:
    url: https://docs.gradle.org/current/userguide/dependency_versions.html
    doc: Dynamic / latest.* dependency version (Groovy DSL)
    doc_version: Gradle 9.8
    retrieved: '2026-10-09'
    quote: Therefore, use this feature with caution. For reproducible builds, it’s crucial to use dependency locking when declaring dependencies with dynamic vers
  examples:
    bad: |
      dependencies {
          implementation 'com.google.guava:guava:33.+'
      }
    good: |
      dependencies {
          implementation 'com.google.guava:guava:33.5.0-jre'
      }
  status: active
  rule_version: 1
