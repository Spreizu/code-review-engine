- id: NG-MIG-ZONE-STABILITY-OBSERVABLES
  title: NgZone.onMicrotaskEmpty/onStable/isStable
  language: typescript
  framework: angular
  kind: migration
  category: compatibility
  severity: minor
  applies_to:
    angular: '>=18.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((member_expression property: (property_identifier) @p) @match (#match? @p "^(onMicrotaskEmpty|onUnstable|onStable|isStable)$"))
    filters:
    - file.has_re:NgZone
  message: These never fire in zoneless apps; use afterNextRender/afterEveryRender.
  source:
    url: https://angular.dev/guide/zoneless
    doc: NgZone.onMicrotaskEmpty/onStable/isStable
    doc_version: Angular 22 (angular.dev)
    retrieved: '2026-10-09'
    quote: Remove NgZone.onMicrotaskEmpty , NgZone.onUnstable , NgZone.isStable , or NgZone.onStable Applications and libraries need to remove uses of NgZone.onMicrotaskEmpty , NgZone.onUnstable , and NgZone.onStable .
  examples:
    bad: |
      import { NgZone } from '@angular/core';
      this.zone.onStable.subscribe(() => this.measure());
    good: |
      afterNextRender(() => this.measure());
  status: active
  rule_version: 1
