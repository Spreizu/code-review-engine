- id: NG-MOD-CONSTRUCTOR-INJECTION
  title: Constructor parameter injection (prefer inject())
  language: typescript
  framework: angular
  kind: modernization
  category: modernization
  severity: info
  applies_to:
    angular: '>=14.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((method_definition name: (property_identifier) @c parameters: (formal_parameters (required_parameter (accessibility_modifier))) @p) @match (#eq? @c "constructor"))
    filters:
    - file.has_re:@(Component|Directive|Injectable|Pipe)\(
  message: inject() has better type inference (`ng generate @angular/core:inject`).
  source:
    url: https://angular.dev/style-guide
    doc: Constructor parameter injection (prefer inject())
    doc_version: Angular 22 (angular.dev)
    retrieved: '2026-10-09'
    quote: Dependency injection Prefer the inject function over constructor parameter injection Prefer using the inject function over injecting constructor parameters. The inject function works the same way as constructor parameter injection, but offers several style advantage
  examples:
    bad: |
      @Component({ selector: 'app-a', template: '' })
      export class A {
        constructor(private http: HttpClient) {}
      }
    good: |
      @Component({ selector: 'app-a', template: '' })
      export class A {
        private http = inject(HttpClient);
      }
  status: active
  rule_version: 1
