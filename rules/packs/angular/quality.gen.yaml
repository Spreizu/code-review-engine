- id: NG-QUAL-EFFECT-COPIES-SIGNAL
  title: effect() used to derive/copy state
  language: typescript
  framework: angular
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    angular: '>=16.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call_expression function: (identifier) @f arguments: (arguments . (arrow_function body: (_) @b))) @match (#eq? @f "effect") (#match? @b "\\.set\\s*\\("))
  message: Use computed()/linkedSignal() for derived values.
  ai_question: Is this effect only deriving state from other signals (no external side effect)?
  source:
    url: https://angular.dev/guide/signals/effect
    doc: effect() used to derive/copy state
    doc_version: Angular 22 (angular.dev)
    retrieved: '2026-10-09'
    quote: Effects should be the last API you reach for. Always prefer computed() for derived values and linkedSignal() for values that can be both derived and manually set.
  examples:
    bad: |
      export class A {
        copy = signal(0);
        e = effect(() => {
          this.copy.set(this.src() * 2);
        });
      }
    good: |
      export class A {
        copy = computed(() => this.src() * 2);
      }
  status: active
  rule_version: 1
