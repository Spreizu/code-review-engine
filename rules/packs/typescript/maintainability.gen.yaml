- id: TS-MAINT-ENUM-MIXED-INITIALIZERS
  title: Enum mixes initialized and implicit members
  language: typescript
  kind: best-practice
  category: maintainability
  severity: minor
  applies_to:
    javascript: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (enum_body (enum_assignment) (property_identifier)) @match
      (enum_body (property_identifier) (enum_assignment)) @match
  message: 'Implicit members continue from the previous value, so mixing them with explicit ones makes values easy to misread: initialize all or none.'
  source:
    url: https://www.typescriptlang.org/docs/handbook/enums.html
    doc: 'TypeScript handbook: Enums'
    doc_version: ECMAScript 2025
    retrieved: '2026-10-09'
