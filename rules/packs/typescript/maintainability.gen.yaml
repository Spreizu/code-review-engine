- id: TS-MAINT-PUBLIC-STATIC-MUTABLE
  title: Public static field is not readonly
  language: typescript
  kind: best-practice
  category: maintainability
  severity: minor
  applies_to:
    javascript: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (public_field_definition) @match
    filters:
    - node.has_re:^(public\s+)?static\s
    - node.lacks_re:\breadonly\b|^\s*(private|protected)\b|#
  message: 'Any code can reassign a public static field, which turns it into global mutable state: make it readonly or private.'
  source:
    url: https://www.typescriptlang.org/docs/handbook/2/classes.html
    doc: 'TypeScript handbook: Classes'
    doc_version: ECMAScript 2025
    retrieved: '2026-10-09'
    quote: 'ignment assertion operator , ! : ts class OKGreeter { // Not initialized, but no error name !: string ; } Try readonly Fields may be prefixed with the readonly modifier.'
  examples:
    bad: |
      class Config {
        static retries = 3;
      }
    good: |
      class Config {
        static readonly retries = 3;
