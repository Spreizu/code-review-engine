rules:
- id: TS-MAINT-ASYNC-WITHOUT-AWAIT
  title: async function that never awaits
  language: typescript
  kind: best-practice
  category: maintainability
  severity: minor
  applies_to:
    javascript: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (program (function_declaration body: (statement_block) @b) @match)
    filters:
    - node.has_re:^async\s+function
    - cap.lacks_re:b:\bawait\b
  message: 'Nothing in this async function awaits, so async only wraps the result in a promise and forces callers to await: drop async or await the real asynchronous work.'
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function
    doc: 'MDN: async function'
    doc_version: ECMAScript 2025
    retrieved: '2026-10-09'
    quote: The behavior of async / await is similar to combining generators and promises. Async functions always return a promise.
  examples:
    bad: |
      async function total(items: number[]) {
        return items.reduce((a, b) => a + b, 0);
      }
    good: |
      function total(items: number[]) {
        return items.reduce((a, b) => a + b, 0);
      }
  xref:
  - sonar:typescript:S7503
  status: active
  rule_version: 1
  tags:
  - maintainability
- id: TS-MAINT-ENUM-MIXED-INITIALIZERS
  title: Enum mixes initialized and implicit members
  language: typescript
  kind: best-practice
  category: maintainability
  severity: minor
  applies_to:
    javascript: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (enum_body (enum_assignment) (property_identifier)) @match
      (enum_body (property_identifier) (enum_assignment)) @match
  message: 'Implicit members continue from the previous value, so mixing them with explicit ones makes values easy to misread: initialize all or none.'
  source:
    url: https://www.typescriptlang.org/docs/handbook/enums.html
    doc: 'TypeScript handbook: Enums'
    doc_version: ECMAScript 2025
    retrieved: '2026-10-09'
    quote: m keyword. ts enum Direction { Up = 1 , Down , Left , Right , } Try Above, we have a numeric enum where Up is initialized with 1 .
  examples:
    bad: |
      enum Level {
        Low = 1,
        Mid,
        High = 10,
      }
    good: |
      enum Level {
        Low = 1,
        Mid = 2,
        High = 10,
      }
  xref:
  - sonar:typescript:S6572
  status: active
  rule_version: 1
  tags:
  - maintainability
