- id: TS-MIG-CFG-ALLOWSYNTHETICDEFAULTIMPORTS-FALSE-001
  title: 'allowSyntheticDefaultImports: false is no longer allowed (TypeScript 6.0)'
  language: tsconfig
  kind: removal
  category: configuration
  severity: major
  applies_to:
    typescript: '>=6.0'
  overrides:
  - when:
      typescript: '>=7.0'
    severity: critical
  detection:
    mode: deterministic
    engine: config
    files:
    - '**/tsconfig*.json'
    - '**/jsconfig*.json'
    config:
      key: compilerOptions.allowSyntheticDefaultImports
      op: equals
      value: false
  message: allowSyntheticDefaultImports is always on from TypeScript 6.0; remove the false setting and fix default-import usage.
  source:
    url: https://www.typescriptlang.org/docs/handbook/release-notes/typescript-6-0.html
    doc: 'TypeScript 6.0 - Deprecated: --esModuleInterop false and --allowSyntheticDefaultImports false'
    doc_version: TypeScript 6.0
    retrieved: '2026-10-09'
    quote: The following settings can no longer be set to false
  examples:
    bad: '{ "compilerOptions": { "allowSyntheticDefaultImports": false } }'
    good: '{ "compilerOptions": { "strict": true } }'
  status: active
  rule_version: 1
