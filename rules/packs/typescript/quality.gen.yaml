- id: TS-QUAL-BAN-TS-COMMENT-NOCHECK
  title: Disallow @ts-<directive> comments or require descriptions after directives
  language: typescript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((comment) @match (#match? @match "^///?\\s*@ts-nocheck\\b|^///?\\s*@ts-expect-error\\s*$"))
    filters:
    - file.has_re:\A(?:\s*(?://[^\n]*|/\*(?s:.*?)\*/))*?\s*///?\s*@ts-nocheck|(?m)^\s*///?\s*@ts-expect-error\s*$
  message: '@ts-nocheck disables type checking for the whole file; @ts-expect-error should carry a description.'
  source:
    url: https://typescript-eslint.io/rules/ban-ts-comment/
    doc: typescript-eslint rule @typescript-eslint/ban-ts-comment
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow @ts-<directive> comments or require descriptions after directives
  examples:
    bad: |
      // @ts-nocheck
      export const a = 1
    good: |
      export const a: number = 1
    regressions:
    - note: mentions the pragma in prose
      code: |
        // docs: never add @ts-nocheck to these files
        export const a = 1
    - note: block comment is not a pragma
      code: |
        /* @ts-nocheck */
        export const a = 1
    - note: after the first statement it has no effect
      code: |
        export const a = 1
        // @ts-nocheck
        export const b = 2
    - note: '@ts-check is fine'
      code: |
        // @ts-check
        export const a = 1
  tags:
  - typescript-eslint:ban-ts-comment
  status: active
  rule_version: 1
