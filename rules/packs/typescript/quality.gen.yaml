  severity: info
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((export_statement (function_declaration !return_type) @match))
  message: Exported functions should declare their return type (stable API, faster type-checking).
  source:
    url: https://typescript-eslint.io/rules/explicit-function-return-type/
    doc: typescript-eslint rule @typescript-eslint/explicit-function-return-type
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Require explicit return types on functions and class methods
  examples:
    bad: |
      export function total(items: Item[]) {
        return items.length
      }
    good: |
      export function total(items: Item[]): number {
        return items.length
      }
  tags:
  - typescript-eslint:explicit-function-return-type
  status: active
  rule_version: 1
- id: TS-QUAL-MAX-PARAMS
  title: Enforce a maximum number of parameters in function definitions
  language: typescript
  kind: best-practice
  category: maintainability
  severity: info
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (formal_parameters (_) (_) (_) (_)) @match
  message: 'More than 3 parameters: consider an options object.'
  source:
    url: https://typescript-eslint.io/rules/max-params/
    doc: typescript-eslint rule @typescript-eslint/max-params
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Enforce a maximum number of parameters in function definitions
  examples:
    bad: |
      function f(a: number, b: number, c: number, d: number) {}
    good: |
      function f(o: { a: number; b: number; c: number; d: number }) {}
  tags:
  - typescript-eslint:max-params
  status: active
  rule_version: 1
- id: TS-QUAL-METHOD-SIGNATURE-STYLE
  title: Enforce using a particular method signature syntax
  language: typescript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (interface_body (method_signature) @match)
    filters:
    - node.lacks_re:^\s*(get|set)\s+[\w'\x22\[]
  message: Property-style signatures are checked contravariantly under strictFunctionTypes; method shorthand is bivariant.
  source:
    url: https://typescript-eslint.io/rules/method-signature-style/
    doc: typescript-eslint rule @typescript-eslint/method-signature-style
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Enforce using a particular method signature syntax
  examples:
    bad: |
      interface Api {
        get(id: string): Item
      }
    good: |
      interface Api {
        get: (id: string) => Item
      }
  tags:
  - typescript-eslint:method-signature-style
  status: active
  rule_version: 1
- id: TS-QUAL-NO-ARRAY-DELETE
  title: Disallow using the delete operator on array values
  language: typescript
  kind: best-practice
  category: correctness
  severity: major
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (unary_expression operator: "delete" argument: (subscript_expression object: (_) @o index: [(number) (identifier)])) @match
    filters:
    - type.is:o:array|(Readonly)?Array
  message: delete on an array leaves a hole instead of removing the element.
  source:
    url: https://typescript-eslint.io/rules/no-array-delete/
    doc: typescript-eslint rule @typescript-eslint/no-array-delete
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow using the delete operator on array values
  examples:
    bad: |
      const items: string[] = load()
      delete items[i]
    good: |
      const items: string[] = load()
      items.splice(i, 1)
    regressions:
    - note: record
      code: |
        const clients: Record<string, C> = {}
        delete clients[id]
  tags:
  - typescript-eslint:no-array-delete
  status: active
  rule_version: 1
- id: TS-QUAL-NO-CONFUSING-NON-NULL-ASSERTION
  title: Disallow non-null assertion in locations that may be confusing
  language: typescript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (binary_expression left: (non_null_expression) operator: ["==" "==="]) @match
  message: a! == b looks like a !== b.
  source:
    url: https://typescript-eslint.io/rules/no-confusing-non-null-assertion/
    doc: typescript-eslint rule @typescript-eslint/no-confusing-non-null-assertion
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow non-null assertion in locations that may be confusing
  examples:
    bad: |
      if (a! == b) {}
    good: |
      if (a !== b) {}
  tags:
  - typescript-eslint:no-confusing-non-null-assertion
  status: active
  rule_version: 1
- id: TS-QUAL-NO-DUPLICATE-ENUM-VALUES
  title: Disallow duplicate enum member values
  language: typescript
  kind: best-practice
  category: correctness
  severity: major
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((enum_body (enum_assignment value: (_) @a) (enum_assignment value: (_) @b) @match) (#eq? @a @b))
  message: Two enum members share a value, so they are indistinguishable.
  source:
    url: https://typescript-eslint.io/rules/no-duplicate-enum-values/
    doc: typescript-eslint rule @typescript-eslint/no-duplicate-enum-values
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow duplicate enum member values
  examples:
    bad: |
      enum Color { Red = 'r', Blue = 'r' }
    good: |
      enum Color { Red = 'r', Blue = 'b' }
  tags:
  - typescript-eslint:no-duplicate-enum-values
  status: active
  rule_version: 1
- id: TS-QUAL-NO-DUPLICATE-TYPE-CONSTITUENTS
  title: Disallow duplicate constituents of union or intersection types
  language: typescript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((union_type . (_) @a . (_) @b .) @match (#eq? @a @b))
      ((union_type (union_type . (_) @a) . (_) @b .) @match (#eq? @a @b))
      ((union_type (union_type (_) @a .) . (_) @b .) @match (#eq? @a @b))
      ((intersection_type . (_) @a . (_) @b .) @match (#eq? @a @b))
  message: Duplicate union/intersection constituent.
  source:
    url: https://typescript-eslint.io/rules/no-duplicate-type-constituents/
    doc: typescript-eslint rule @typescript-eslint/no-duplicate-type-constituents
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow duplicate constituents of union or intersection types
  examples:
    bad: |
      type T = string | number | string
    good: |
      type T = string | number
  tags:
  - typescript-eslint:no-duplicate-type-constituents
  status: active
  rule_version: 1
- id: TS-QUAL-NO-DYNAMIC-DELETE
  title: Disallow using the delete operator on computed key expressions
  language: typescript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (unary_expression operator: "delete" argument: (subscript_expression index: [(identifier) (member_expression) (call_expression) (template_string)])) @match
  message: Deleting computed keys suggests a Map/Set should be used instead.
  source:
    url: https://typescript-eslint.io/rules/no-dynamic-delete/
    doc: typescript-eslint rule @typescript-eslint/no-dynamic-delete
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow using the delete operator on computed key expressions
  examples:
    bad: |
      delete cache[key]
    good: |
      cache.delete(key)
  tags:
  - typescript-eslint:no-dynamic-delete
  status: active
  rule_version: 1
- id: TS-QUAL-NO-EMPTY-OBJECT-TYPE
  title: Disallow accidentally using the "empty object" type
  language: typescript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((interface_declaration body: (interface_body) @b) @match (#match? @b "^\\{\\s*\\}$"))
      ((type_annotation (object_type) @match) (#match? @match "^\\{\\s*\\}$"))
    filters:
    - ancestor.lacks_re:ambient_declaration|module:^(?:declare\s+)?(?:module|global)\b
  message: The {} type means 'any non-nullish value', not 'empty object'.
  source:
    url: https://typescript-eslint.io/rules/no-empty-object-type/
    doc: typescript-eslint rule @typescript-eslint/no-empty-object-type
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow accidentally using the "empty object" type
  examples:
    bad: |
      interface Props {}
    good: |
      type Props = Record<string, never>
    regressions:
    - note: 'module augmentation: an empty interface extending another merges declarations'
      code: |
        declare module 'vitest' {
          interface Assertion<T = any> extends CustomMatchers<T> {}
        }
  tags:
  - typescript-eslint:no-empty-object-type
  status: active
  rule_version: 1
- id: TS-QUAL-NO-EXTRA-NON-NULL-ASSERTION
  title: Disallow extra non-null assertions
  language: typescript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (non_null_expression (non_null_expression)) @match
  message: Repeated non-null assertion.
  source:
    url: https://typescript-eslint.io/rules/no-extra-non-null-assertion/
    doc: typescript-eslint rule @typescript-eslint/no-extra-non-null-assertion
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow extra non-null assertions
  examples:
    bad: |
      const n = value!!.length
    good: |
      const n = value!.length
  tags:
  - typescript-eslint:no-extra-non-null-assertion
  status: active
  rule_version: 1
- id: TS-QUAL-NO-EXTRANEOUS-CLASS
  title: Disallow classes used as namespaces
  language: typescript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((class_declaration body: (class_body) @b) @match (#match? @b "^\\{\\s*\\}$"))
  message: An empty class is not useful; use a plain object or module.
  source:
    url: https://typescript-eslint.io/rules/no-extraneous-class/
    doc: typescript-eslint rule @typescript-eslint/no-extraneous-class
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow classes used as namespaces
  examples:
    bad: |
      class Empty {}
    good: |
      const helpers = {}
  tags:
  - typescript-eslint:no-extraneous-class
  status: active
  rule_version: 1
- id: TS-QUAL-NO-FLOATING-PROMISES
  title: Require Promise-like statements to be handled appropriately
  language: typescript
  kind: best-practice
  category: async
  severity: major
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((expression_statement (call_expression function: (member_expression property: (property_identifier) @p) arguments: (arguments . (_) .)) @match) (#eq? @p "then"))
      ((expression_statement (call_expression function: (identifier) @f) @match) (#match? @f "^(fetch)$"))
  message: The promise is neither awaited, returned nor given a rejection handler; errors become unhandled rejections.
  ai_question: Is this promise result intentionally fire-and-forget with errors handled elsewhere? (answer reject if so)
  source:
    url: https://typescript-eslint.io/rules/no-floating-promises/
    doc: typescript-eslint rule @typescript-eslint/no-floating-promises
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Require Promise-like statements to be handled appropriately
  examples:
    bad: |
      save(user).then(() => notify())
    good: |
      await save(user).then(() => notify())
  tags:
  - typescript-eslint:no-floating-promises
  status: active
  rule_version: 1
- id: TS-QUAL-NO-IMPORT-TYPE-SIDE-EFFECTS
  title: Enforce the use of top-level import type qualifier when an import only has specifiers with inline type qualifiers
  language: typescript
  kind: best-practice
  category: correctness
  severity: info
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((import_statement (import_clause (named_imports) @n)) @match (#match? @n "^\\{\\s*type\\s+\\w+(\\s*,\\s*type\\s+\\w+)*\\s*,?\\s*\\}$") (#not-match? @match "^import\\s+type") (#not-match? @match "^import\\s+[\\w$]+\\s*,"))
  message: With verbatimModuleSyntax an import with only inline type specifiers is kept as a side-effect import; use import type.
  source:
    url: https://typescript-eslint.io/rules/no-import-type-side-effects/
    doc: typescript-eslint rule @typescript-eslint/no-import-type-side-effects
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Enforce the use of top-level import type qualifier when an import only has specifiers with inline type qualifiers
  examples:
    bad: |
      import { type A, type B } from './types'
    good: |
      import type { A, B } from './types'
    regressions:
    - note: a default value import keeps the statement needed
      code: |
        import NextAuth, { type DefaultSession } from 'next-auth'
  tags:
  - typescript-eslint:no-import-type-side-effects
  status: active
  rule_version: 1
- id: TS-QUAL-NO-INFERRABLE-TYPES
  title: Disallow explicit type declarations for variables or parameters initialized to a number, string, or boolean
  language: typescript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((variable_declarator type: (type_annotation (predefined_type) @t) value: [(number) (string) (true) (false)]) @match (#match? @t "^(number|string|boolean)$"))
  message: The type is trivially inferred from the literal.
  source:
    url: https://typescript-eslint.io/rules/no-inferrable-types/
    doc: typescript-eslint rule @typescript-eslint/no-inferrable-types
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow explicit type declarations for variables or parameters initialized to a number, string, or boolean
  examples:
    bad: |
      const n: number = 5
    good: |
      const n = 5
  tags:
  - typescript-eslint:no-inferrable-types
  status: active
  rule_version: 1
- id: TS-QUAL-NO-INVALID-VOID-TYPE
  title: Disallow void type outside of generic or return types
  language: typescript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((union_type (predefined_type) @v) @match (#eq? @v "void"))
      ((union_type (union_type (predefined_type) @v1)) @match (#eq? @v1 "void"))
      ((union_type (union_type (union_type (predefined_type) @v2))) @match (#eq? @v2 "void"))
      ((union_type (union_type (union_type (union_type (predefined_type) @v3)))) @match (#eq? @v3 "void"))
    filters:
    - parentkind.lacks_re:union_type:.
    - node.lacks_re:^\s*\|?\s*(void|never|[\w.$]+\s*<[^|<>]*\bvoid\b[^|<>]*>)(\s*\|\s*(void|never|[\w.$]+\s*<[^|<>]*\bvoid\b[^|<>]*>))*\s*$
  message: void is only meaningful as a return type or generic argument; use undefined in unions.
  source:
    url: https://typescript-eslint.io/rules/no-invalid-void-type/
    doc: typescript-eslint rule @typescript-eslint/no-invalid-void-type
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow void type outside of generic or return types
  examples:
    bad: |
      type R = string | void
    good: |
      type R = string | undefined
    regressions:
    - note: void | Promise<void> is allowed
      code: |
        type H = (ctx: C) => Promise<void> | void
        type G = () => void | never
  tags:
  - typescript-eslint:no-invalid-void-type
  status: active
  rule_version: 1
- id: TS-QUAL-NO-MISUSED-NEW
  title: Enforce valid definition of new and constructor
  language: typescript
  kind: best-practice
  category: correctness
  severity: major
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((interface_body (method_signature name: (property_identifier) @n) @match) (#eq? @n "constructor"))
  message: Interfaces cannot declare constructors; use a construct signature (new ()).
  source:
    url: https://typescript-eslint.io/rules/no-misused-new/
    doc: typescript-eslint rule @typescript-eslint/no-misused-new
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Enforce valid definition of new and constructor
  examples:
    bad: |
      interface Point {
        constructor(): Point
      }
    good: |
      interface PointCtor {
        new (): Point
      }
  tags:
  - typescript-eslint:no-misused-new
  status: active
  rule_version: 1
- id: TS-QUAL-NO-MIXED-ENUMS
  title: Disallow enums from having both number and string members
  language: typescript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (enum_body (enum_assignment value: (number)) (enum_assignment value: (string))) @match
      (enum_body (enum_assignment value: (string)) (enum_assignment value: (number))) @match
  message: Mixing number and string members makes enum comparisons error-prone.
  source:
    url: https://typescript-eslint.io/rules/no-mixed-enums/
    doc: typescript-eslint rule @typescript-eslint/no-mixed-enums
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow enums from having both number and string members
  examples:
    bad: |
      enum E { A = 0, B = 'b' }
    good: |
      enum E { A = 'a', B = 'b' }
  tags:
  - typescript-eslint:no-mixed-enums
  status: active
  rule_version: 1
- id: TS-QUAL-NO-NON-NULL-ASSERTED-NULLISH-COALESCING
  title: Disallow non-null assertions in the left operand of a nullish coalescing operator
  language: typescript
  kind: best-practice
  category: null-handling
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (binary_expression left: (non_null_expression) operator: "??") @match
  message: Asserting non-null and then defaulting with ?? contradicts itself.
  source:
    url: https://typescript-eslint.io/rules/no-non-null-asserted-nullish-coalescing/
    doc: typescript-eslint rule @typescript-eslint/no-non-null-asserted-nullish-coalescing
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow non-null assertions in the left operand of a nullish coalescing operator
  examples:
    bad: |
      const v = maybe! ?? fallback
    good: |
      const v = maybe ?? fallback
  tags:
  - typescript-eslint:no-non-null-asserted-nullish-coalescing
  status: active
  rule_version: 1
- id: TS-QUAL-NO-NON-NULL-ASSERTED-OPTIONAL-CHAIN
  title: Disallow non-null assertions after an optional chain expression
  language: typescript
  kind: best-practice
  category: null-handling
  severity: major
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (non_null_expression (member_expression (optional_chain))) @match
  message: Optional chain followed by ! hides the undefined it was meant to handle.
  source:
    url: https://typescript-eslint.io/rules/no-non-null-asserted-optional-chain/
    doc: typescript-eslint rule @typescript-eslint/no-non-null-asserted-optional-chain
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow non-null assertions after an optional chain expression
  examples:
    bad: |
      const n = user?.name!
    good: |
      const n = user?.name ?? ''
  tags:
  - typescript-eslint:no-non-null-asserted-optional-chain
  status: active
  rule_version: 1
- id: TS-QUAL-NO-REDUNDANT-TYPE-CONSTITUENTS
  title: Disallow members of unions and intersections that do nothing or override type information
  language: typescript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((union_type (predefined_type) @t) @match (#match? @t "^(any|unknown|never)$"))
  message: any/unknown absorb, and never vanishes from, any union.
  source:
    url: https://typescript-eslint.io/rules/no-redundant-type-constituents/
    doc: typescript-eslint rule @typescript-eslint/no-redundant-type-constituents
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow members of unions and intersections that do nothing or override type information
  examples:
    bad: |
      type T = string | unknown
    good: |
      type T = unknown
  tags:
  - typescript-eslint:no-redundant-type-constituents
  status: active
  rule_version: 1
- id: TS-QUAL-NO-REQUIRE-IMPORTS
  title: Disallow invocation of require()
  language: typescript
  kind: best-practice
  category: modules
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (identifier) @f arguments: (arguments . (string))) @match (#eq? @f "require"))
    filters:
    - file.lacks_re:(?m)\b(?:var|let|const|function|class|import)\s+(?:\{[^}]*\b)?require\b|\bfunction\b[^(]*\([^)]*\brequire\b[^)]*\)|\([^()]*\brequire\b[^()]*\)\s*=>|\brequire\s*=>
  message: Use ES import syntax (typed, tree-shakeable).
  source:
    url: https://typescript-eslint.io/rules/no-require-imports/
    doc: typescript-eslint rule @typescript-eslint/no-require-imports
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow invocation of require()
  examples:
    bad: |
      const fs = require('fs')
    good: |
      import fs from 'node:fs'
    regressions:
    - note: createRequire binding
      code: |
        import { createRequire } from 'node:module'
        const require = createRequire(import.meta.url)
        const cfg = require('./cfg.json')
  tags:
  - typescript-eslint:no-require-imports
  status: active
  rule_version: 1
- id: TS-QUAL-NO-THIS-ALIAS
  title: Disallow aliasing this
  language: typescript
  kind: best-practice
  category: style
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (variable_declarator name: (identifier) value: (this)) @match
  message: Aliasing this is unnecessary with arrow functions.
  source:
    url: https://typescript-eslint.io/rules/no-this-alias/
    doc: typescript-eslint rule @typescript-eslint/no-this-alias
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow aliasing this
  examples:
    bad: |
      const self = this
    good: |
      const fn = () => this.run()
  tags:
  - typescript-eslint:no-this-alias
  status: active
  rule_version: 1
- id: TS-QUAL-NO-UNNECESSARY-BOOLEAN-LITERAL-COMPARE
  title: Disallow unnecessary equality comparisons against boolean literals
  language: typescript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      (binary_expression operator: ["===" "!=="] right: [(true) (false)]) @match
  message: Comparing a boolean to a boolean literal is redundant.
  ai_question: Is the left operand typed exactly boolean (not boolean | undefined / null)?
  source:
    url: https://typescript-eslint.io/rules/no-unnecessary-boolean-literal-compare/
    doc: typescript-eslint rule @typescript-eslint/no-unnecessary-boolean-literal-compare
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow unnecessary equality comparisons against boolean literals
  examples:
    bad: |
      if (isReady === true) {}
    good: |
      if (isReady) {}
  tags:
  - typescript-eslint:no-unnecessary-boolean-literal-compare
  status: active
  rule_version: 1
- id: TS-QUAL-NO-UNNECESSARY-PARAMETER-PROPERTY-ASSIGNMENT
  title: Disallow unnecessary assignment of constructor property parameter
  language: typescript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((method_definition name: (property_identifier) @c parameters: (formal_parameters (required_parameter (accessibility_modifier) pattern: (identifier) @p)) body: (statement_block (expression_statement (assignment_expression left: (member_expression object: (this) property: (property_identifier) @q) right: (identifier) @r) @match))) (#eq? @c "constructor") (#eq? @p @q) (#eq? @q @r))
  message: Parameter properties are assigned automatically.
  source:
    url: https://typescript-eslint.io/rules/no-unnecessary-parameter-property-assignment/
    doc: typescript-eslint rule @typescript-eslint/no-unnecessary-parameter-property-assignment
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow unnecessary assignment of constructor property parameter
  examples:
    bad: |
      class A {
        constructor(private name: string) {
          this.name = name
        }
      }
    good: |
      class A {
        constructor(private name: string) {}
      }
  tags:
  - typescript-eslint:no-unnecessary-parameter-property-assignment
  status: active
  rule_version: 1
- id: TS-QUAL-NO-UNNECESSARY-TEMPLATE-EXPRESSION
  title: Disallow unnecessary template expressions
  language: typescript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (template_substitution [(string) (number)]) @match
    filters:
    - node.lacks_re:/[*/]|^\$\{\s*['\"]\s*['\"]\s*\}$
    - ancestor.lacks_re:call_expression:^[\w$.]+\s*`
  message: Interpolating a literal into a template is redundant.
  source:
    url: https://typescript-eslint.io/rules/no-unnecessary-template-expression/
    doc: typescript-eslint rule @typescript-eslint/no-unnecessary-template-expression
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow unnecessary template expressions
  examples:
    bad: |
      const s = `${'hello'} world`
    good: |
      const s = 'hello world'
    regressions:
    - note: tagged template
      code: |
        const q = sql`${'users'}`
    - note: keeps trailing whitespace visible
      code: |
        const s = `indent:${'  '}`
    - note: commented literal
      code: |
        const s = `${/* default */ 'en'}-US`
  tags:
  - typescript-eslint:no-unnecessary-template-expression
  status: active
  rule_version: 1
- id: TS-QUAL-NO-UNNECESSARY-TYPE-CONSTRAINT
  title: Disallow unnecessary constraints on generic types
  language: typescript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((type_parameter (constraint [(predefined_type) @t])) @match (#match? @t "^(any|unknown)$"))
  message: Every type extends unknown/any; the constraint is redundant.
  source:
    url: https://typescript-eslint.io/rules/no-unnecessary-type-constraint/
    doc: typescript-eslint rule @typescript-eslint/no-unnecessary-type-constraint
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow unnecessary constraints on generic types
  examples:
    bad: |
      function f<T extends unknown>(x: T) {}
    good: |
      function f<T>(x: T) {}
  tags:
  - typescript-eslint:no-unnecessary-type-constraint
  status: active
  rule_version: 1
- id: TS-QUAL-NO-UNSAFE-DECLARATION-MERGING
  title: Disallow unsafe declaration merging
  language: typescript
  kind: best-practice
  category: correctness
  severity: major
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((program (interface_declaration name: (type_identifier) @a) (class_declaration name: (type_identifier) @b) @match) (#eq? @a @b))
      ((program (class_declaration name: (type_identifier) @a) (interface_declaration name: (type_identifier) @b) @match) (#eq? @a @b))
  message: Merging an interface into a class declares members the compiler will not check are initialised.
  source:
    url: https://typescript-eslint.io/rules/no-unsafe-declaration-merging/
    doc: typescript-eslint rule @typescript-eslint/no-unsafe-declaration-merging
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow unsafe declaration merging
  examples:
    bad: |
      interface Foo { id: string }
      class Foo {}
    good: |
      interface FooShape { id: string }
      class Foo implements FooShape { id = '' }
  tags:
  - typescript-eslint:no-unsafe-declaration-merging
  status: active
  rule_version: 1
- id: TS-QUAL-NO-UNSAFE-FUNCTION-TYPE
  title: Disallow using the unsafe built-in Function type
  language: typescript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((type_annotation (type_identifier) @match) (#eq? @match "Function"))
    filters:
    - file.lacks_re:\b(?:type|interface|class)\s+Function\b
  message: Function accepts any callable and returns any; declare the signature.
  source:
    url: https://typescript-eslint.io/rules/no-unsafe-function-type/
    doc: typescript-eslint rule @typescript-eslint/no-unsafe-function-type
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow using the unsafe built-in Function type
  examples:
    bad: |
      let cb: Function
    good: |
      let cb: () => void
    regressions:
    - note: local Function type
      code: |
        type Function = () => void
        let cb: Function
  tags:
  - typescript-eslint:no-unsafe-function-type
  status: active
  rule_version: 1
- id: TS-QUAL-NO-UNSAFE-TYPE-ASSERTION
  title: Disallow type assertions that narrow a type
  language: typescript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((as_expression (as_expression (_) [(predefined_type) @u])) @match (#match? @u "^(unknown|any)$"))
  message: A double assertion through unknown/any bypasses type checking.
  source:
    url: https://typescript-eslint.io/rules/no-unsafe-type-assertion/
    doc: typescript-eslint rule @typescript-eslint/no-unsafe-type-assertion
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow type assertions that narrow a type
  examples:
    bad: |
      const n = value as unknown as number
    good: |
      const n = Number(value)
  tags:
  - typescript-eslint:no-unsafe-type-assertion
  status: active
  rule_version: 1
- id: TS-QUAL-ONLY-THROW-ERROR
  title: Disallow throwing non-Error values as exceptions
  language: typescript
  kind: best-practice
  category: error-handling
  severity: major
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (throw_statement [(string) (template_string) (number) (object)] @match)
  message: Throw Error objects so stack traces and instanceof checks work.
  source:
    url: https://typescript-eslint.io/rules/only-throw-error/
    doc: typescript-eslint rule @typescript-eslint/only-throw-error
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow throwing non-Error values as exceptions
  examples:
    bad: |
      throw `failed: ${id}`
    good: |
      throw new Error(`failed: ${id}`)
  tags:
  - typescript-eslint:only-throw-error
  status: active
  rule_version: 1
- id: TS-QUAL-PREFER-AS-CONST
  title: Enforce the use of as const over literal type
  language: typescript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((variable_declarator type: (type_annotation (literal_type (string) @a)) value: (string) @b) @match (#eq? @a @b))
      ((as_expression (string) @a (literal_type (string) @b)) @match (#eq? @a @b))
  message: Use as const instead of repeating the literal type.
  source:
    url: https://typescript-eslint.io/rules/prefer-as-const/
    doc: typescript-eslint rule @typescript-eslint/prefer-as-const
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Enforce the use of as const over literal type
  examples:
    bad: |
      let kind: 'user' = 'user'
    good: |
      let kind = 'user' as const
  tags:
  - typescript-eslint:prefer-as-const
  status: active
  rule_version: 1
- id: TS-QUAL-PREFER-ENUM-INITIALIZERS
  title: Require each enum member value to be explicitly initialized
  language: typescript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (enum_body (property_identifier) @match)
  message: Implicit enum values shift when members are reordered/inserted (breaking persisted values).
  source:
    url: https://typescript-eslint.io/rules/prefer-enum-initializers/
    doc: typescript-eslint rule @typescript-eslint/prefer-enum-initializers
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Require each enum member value to be explicitly initialized
  examples:
    bad: |
      enum Status { Open, Closed }
    good: |
      enum Status { Open = 'open', Closed = 'closed' }
  tags:
  - typescript-eslint:prefer-enum-initializers
  status: active
  rule_version: 1
- id: TS-QUAL-PREFER-FIND
  title: Enforce the use of Array.prototype.find() over Array.prototype.filter() followed by [0] when looking for a single result
  language: typescript
  kind: best-practice
  category: performance
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((subscript_expression object: (call_expression function: (member_expression property: (property_identifier) @p)) index: (number) @n) @match (#eq? @p "filter") (#eq? @n "0"))
  message: find() stops at the first match instead of filtering the whole array.
  source:
    url: https://typescript-eslint.io/rules/prefer-find/
    doc: typescript-eslint rule @typescript-eslint/prefer-find
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Enforce the use of Array.prototype.find() over Array.prototype.filter() followed by [0] when looking for a single result
  examples:
    bad: |
      const first = users.filter((u) => u.admin)[0]
    good: |
      const first = users.find((u) => u.admin)
  tags:
  - typescript-eslint:prefer-find
  status: active
  rule_version: 1
- id: TS-QUAL-PREFER-FOR-OF
  title: Enforce the use of for-of loop over the standard for loop where possible
  language: typescript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((for_statement condition: (binary_expression right: (member_expression property: (property_identifier) @len)) body: (_) @b) @match (#eq? @len "length") (#match? @b "\\[i\\]"))
  message: Use for-of when the index is only used to read the element.
  ai_question: Is the index used only to read the current element (not for writes, neighbours or output)?
  source:
    url: https://typescript-eslint.io/rules/prefer-for-of/
    doc: typescript-eslint rule @typescript-eslint/prefer-for-of
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Enforce the use of for-of loop over the standard for loop where possible
  examples:
    bad: |
      for (let i = 0; i < xs.length; i++) {
        use(xs[i])
      }
    good: |
      for (const x of xs) {
        use(x)
      }
  tags:
  - typescript-eslint:prefer-for-of
  status: active
  rule_version: 1
- id: TS-QUAL-PREFER-FUNCTION-TYPE
  title: Enforce using function types instead of interfaces with call signatures
  language: typescript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (interface_declaration body: (interface_body . (call_signature) .)) @match
  message: An interface with only a call signature is a function type.
  source:
    url: https://typescript-eslint.io/rules/prefer-function-type/
    doc: typescript-eslint rule @typescript-eslint/prefer-function-type
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Enforce using function types instead of interfaces with call signatures
  examples:
    bad: |
      interface Fn {
        (x: number): string
      }
    good: |
      type Fn = (x: number) => string
  tags:
  - typescript-eslint:prefer-function-type
  status: active
  rule_version: 1
- id: TS-QUAL-PREFER-INCLUDES
  title: Enforce includes method over indexOf method
  language: typescript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=2016'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((binary_expression left: (call_expression function: (member_expression property: (property_identifier) @p)) right: (unary_expression operator: "-" argument: (number) @n)) @match (#eq? @p "indexOf") (#eq? @n "1"))
  message: Use includes() for membership tests.
  source:
    url: https://typescript-eslint.io/rules/prefer-includes/
    doc: typescript-eslint rule @typescript-eslint/prefer-includes
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Enforce includes method over indexOf method
  examples:
    bad: |
      if (tags.indexOf('x') !== -1) {}
    good: |
      if (tags.includes('x')) {}
  tags:
  - typescript-eslint:prefer-includes
  status: active
  rule_version: 1
- id: TS-QUAL-PREFER-LITERAL-ENUM-MEMBER
  title: Require all enum members to be literal values
  language: typescript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (enum_assignment value: [(identifier) (call_expression) (member_expression) (template_string)] @match)
  message: Enum members should be literal so they can be used as types and are not evaluated at runtime.
  source:
    url: https://typescript-eslint.io/rules/prefer-literal-enum-member/
    doc: typescript-eslint rule @typescript-eslint/prefer-literal-enum-member
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Require all enum members to be literal values
  examples:
    bad: |
      const base = 1
      enum E { A = base }
    good: |
      enum E { A = 1 }
  tags:
  - typescript-eslint:prefer-literal-enum-member
  status: active
  rule_version: 1
- id: TS-QUAL-PREFER-NULLISH-COALESCING
  title: Enforce using the nullish coalescing operator instead of logical assignments or chaining
  language: typescript
  kind: best-practice
  category: null-handling
  severity: minor
  applies_to:
    ecmascript: '>=2020'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      (assignment_expression left: (_) @a right: (binary_expression left: (_) @b operator: "||")) @match
  message: '|| also replaces 0/''''/false; use ?? / ??= when only null/undefined should be defaulted.'
  ai_question: Can the left value legitimately be 0, '', or false (so || would wrongly replace it)?
  source:
    url: https://typescript-eslint.io/rules/prefer-nullish-coalescing/
    doc: typescript-eslint rule @typescript-eslint/prefer-nullish-coalescing
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Enforce using the nullish coalescing operator instead of logical assignments or chaining
  examples:
    bad: |
      opts.timeout = opts.timeout || 1000
    good: |
      opts.timeout ??= 1000
  tags:
  - typescript-eslint:prefer-nullish-coalescing
  status: active
  rule_version: 1
- id: TS-QUAL-PREFER-REDUCE-TYPE-PARAMETER
  title: Enforce using type parameter when calling Array#reduce instead of using a type assertion
  language: typescript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression property: (property_identifier) @p) arguments: (arguments (_) (as_expression) @match)) (#eq? @p "reduce"))
  message: Use the reduce type parameter instead of asserting the initial value.
  source:
    url: https://typescript-eslint.io/rules/prefer-reduce-type-parameter/
    doc: typescript-eslint rule @typescript-eslint/prefer-reduce-type-parameter
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Enforce using type parameter when calling Array#reduce instead of using a type assertion
  examples:
    bad: |
      const ids = xs.reduce((acc, x) => [...acc, x.id], [] as string[])
    good: |
      const ids = xs.reduce<string[]>((acc, x) => [...acc, x.id], [])
  tags:
  - typescript-eslint:prefer-reduce-type-parameter
  status: active
  rule_version: 1
- id: TS-QUAL-PREFER-REGEXP-EXEC
  title: Enforce RegExp#exec over String#match if no global flag is provided
  language: typescript
  kind: best-practice
  category: performance
  severity: info
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression property: (property_identifier) @p) arguments: (arguments . (regex) @r .)) @match (#eq? @p "match") (#not-match? @r "/[a-z]*g[a-z]*$"))
    filters:
    - node.lacks_re:^\s*expect\s*\(|\.(to|be|been|is|that|which|and|not|deep|also|should)\s*\.\s*match\s*\(
  message: RegExp#exec is equivalent and faster for non-global regexes.
  source:
    url: https://typescript-eslint.io/rules/prefer-regexp-exec/
    doc: typescript-eslint rule @typescript-eslint/prefer-regexp-exec
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Enforce RegExp#exec over String#match if no global flag is provided
  examples:
    bad: |
      const m = line.match(/(\d+)/)
    good: |
      const m = /(\d+)/.exec(line)
    regressions:
    - note: chai assertion
      code: |
        expect(res.text).to.match(/engine\.io/)
        res.text.should.match(/ok/)
  tags:
  - typescript-eslint:prefer-regexp-exec
  status: active
  rule_version: 1
- id: TS-QUAL-PREFER-STRING-STARTS-ENDS-WITH
  title: Enforce using String#startsWith and String#endsWith over other equivalent methods of checking substrings
  language: typescript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((binary_expression left: (call_expression function: (member_expression property: (property_identifier) @p)) operator: ["===" "=="] right: (number) @n) @match (#eq? @p "indexOf") (#eq? @n "0"))
      ((binary_expression left: (subscript_expression index: (number) @n) operator: ["===" "=="] right: (string)) @match (#eq? @n "0"))
  message: Use startsWith/endsWith.
  source:
    url: https://typescript-eslint.io/rules/prefer-string-starts-ends-with/
    doc: typescript-eslint rule @typescript-eslint/prefer-string-starts-ends-with
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Enforce using String#startsWith and String#endsWith over other equivalent methods of checking substrings
  examples:
    bad: |
      if (path.indexOf('/api') === 0) {}
    good: |
      if (path.startsWith('/api')) {}
  tags:
  - typescript-eslint:prefer-string-starts-ends-with
  status: active
  rule_version: 1
- id: TS-QUAL-TRIPLE-SLASH-REFERENCE
  title: Disallow certain triple slash directives in favor of ES6-style import declarations
  language: typescript
  kind: best-practice
  category: modules
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((comment) @match (#match? @match "^///\\s*<reference\\s+path="))
  message: Use import instead of triple-slash path references.
  source:
    url: https://typescript-eslint.io/rules/triple-slash-reference/
    doc: typescript-eslint rule @typescript-eslint/triple-slash-reference
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Disallow certain triple slash directives in favor of ES6-style import declarations
  examples:
    bad: |
      /// <reference path="./globals.d.ts" />
      export {}
    good: |
      import './globals'
      export {}
  tags:
  - typescript-eslint:triple-slash-reference
  status: active
  rule_version: 1
- id: TS-QUAL-USE-UNKNOWN-IN-CATCH-CALLBACK-VARIABLE
  title: Enforce typing arguments in Promise rejection callbacks as unknown
  language: typescript
  kind: best-practice
  category: error-handling
  severity: minor
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression property: (property_identifier) @p) arguments: (arguments . (arrow_function parameters: (formal_parameters . (required_parameter pattern: (identifier) !type))))) @match (#eq? @p "catch"))
