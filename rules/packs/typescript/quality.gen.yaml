- id: TS-QUAL-CONSISTENT-GENERIC-CONSTRUCTORS
  title: Enforce specifying generic type arguments on type annotation or constructor name of a constructor call
  language: typescript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    typescript: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((variable_declarator type: (type_annotation (generic_type name: (type_identifier) @t)) value: (new_expression constructor: (identifier) @c !type_arguments) @match) (#eq? @t @c) (#not-match? @c "^(Float|Int|Uint|BigInt|BigUint)(8|16|32|64)(Clamped)?Array$"))
  message: Put generic type arguments on the constructor call.
  source:
    url: https://typescript-eslint.io/rules/consistent-generic-constructors/
    doc: typescript-eslint rule @typescript-eslint/consistent-generic-constructors
    doc_version: typescript-eslint v8.71
    retrieved: '2026-10-09'
    quote: Enforce specifying generic type arguments on type annotation or constructor name of a constructor call
  examples:
    bad: |
      const m: Map<string, number> = new Map()
    good: |
      const m = new Map<string, number>()
    regressions:
    - note: annotation names a different (interface) type
      code: |
        const store: Cache<string> = new LruCache()
    - note: typed array buffer parameter
      code: |
        const buf: Uint8Array<ArrayBuffer> = new Uint8Array()
  tags:
  - typescript-eslint:consistent-generic-constructors
  status: active
  rule_version: 1
