rules:
- id: YTT-MOD-ASSERT-FAIL-FOR-REQUIRED
  title: data.values.x or assert.fail(...) (use schema validation)
  language: yaml
  framework: ytt
  kind: modernization
  category: maintainability
  severity: info
  applies_to:
    ytt: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.yml'
    - '**/*.yaml'
    query: |
      ((comment) @match (#match? @match "^#@.*data\\.values\\.[A-Za-z0-9_.]+\\s+or\\s+assert\\.fail\\("))
  message: Declare the requirement once in schema (#@schema/validation min_len=1) so it's validated up front and documented.
  ai_question: Does the project use a data values schema where a validation could be declared?
  source:
    url: https://carvel.dev/ytt/docs/v0.52.x/how-to-write-validations/
    doc: data.values.x or assert.fail(...) (use schema validation)
    doc_version: ytt v0.52.x
    retrieved: '2026-10-09'
    quote: 's Look Like ¶ A validation is an annotation on a Data Value in a schema file: #@data/values-schema --- dex : #@schema/validation min_len=1 namespace : "" Here: the Data Value dex.namespace is a string to be valid, that string must be set'
  examples:
    bad: |
      #@ load("@ytt:data", "data")
      #@ load("@ytt:assert", "assert")
      ---
      password: #@ data.values.db.password or assert.fail("missing db.password")
    good: |
      #@ load("@ytt:data", "data")
      ---
      password: #@ data.values.db.password
  xref:
  - https://carvel.dev/ytt/docs/v0.52.x/faq/
  status: active
  rule_version: 1
- id: YTT-MOD-DATA-VALUES-TO-SCHEMA
  title: '#@data/values defaults file without schema'
  language: yaml
  framework: ytt
  kind: modernization
  category: modernization
  severity: info
  applies_to:
    ytt: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.yml'
    - '**/*.yaml'
    query: |
      ((comment) @match (#match? @match "^#@data/values\\s*$"))
  message: 'Declare defaults with #@data/values-schema to get types, defaults and validation; keep #@data/values for overlays of values.'
  ai_question: Is this the file that declares the defaults (not a per-environment values overlay)?
  source:
    url: https://carvel.dev/ytt/docs/v0.52.x/data-values-schema-migration-guide/
    doc: '#@data/values defaults file without schema'
    doc_version: ytt v0.52.x
    retrieved: '2026-10-09'
    quote: Schema documents provide a way to declare Data Values with their types, and default values. Without Schema, validating the presence of Data Values requires additional ytt configuration containing Starlark assertions. Learn more about writing Schema Read the detailed Data Vaues Schema Reference How do I, a configuration autho
  examples:
    bad: |
      #@data/values
      ---
      replicas: 2
      image: nginx
