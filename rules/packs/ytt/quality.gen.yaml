- id: YTT-QUAL-TEXT-TEMPLATE-NOT-ENABLED
  title: (@ ... @) in a string without @yaml/text-templated-strings
  language: yaml
  framework: ytt
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ytt: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.yml'
    - '**/*.yaml'
    query: |
      ((string_scalar) @match (#match? @match "\\(@[-=]?.*@\\)"))
      ((double_quote_scalar) @match (#match? @match "\\(@[-=]?.*@\\)"))
    filters:
    - file.lacks_re:@yaml/text-templated-strings
    - file.has_re:(?m)^\s*#@
  message: Without the annotation the (@ @) markers are emitted literally.
  source:
    url: https://carvel.dev/ytt/docs/v0.52.x/ytt-text-templating/
    doc: (@ ... @) in a string without @yaml/text-templated-strings
    doc_version: ytt v0.52.x
    retrieved: '2026-10-09'
    quote: refix, name_suffix) However, occasionally it might be useful to use text templating directly in YAML strings. To do so YAML node must be annotated with @yaml/text-templated-strings (v0.17.0+). Annotation will apply to node and its child nodes.
  examples:
    bad: |
      #@ load("@ytt:data", "data")
      ---
      host: "(@= data.values.name @).example.com"
    good: |
      #@ load("@ytt:data", "data")
      ---
      host: #@ data.values.name + ".example.com"
  status: active
  rule_version: 1
- id: YTT-QUAL-UNKNOWN-COMMENT-SYNTAX
  title: 'Plain # comment in a ytt template'
  language: yaml
  framework: ytt
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ytt: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.yml'
    - '**/*.yaml'
    query: |
      ((comment) @match (#not-match? @match "^#[@!]"))
    filters:
    - file.has_re:(?m)^\s*#@
  message: 'ytt rejects plain YAML comments in templates ("Unknown comment syntax") unless --ignore-unknown-comments; use #! — it also catches a forgotten @.'
  source:
    url: https://carvel.dev/ytt/docs/v0.52.x/faq/
    doc: 'Plain # comment in a ytt template'
    doc_version: ytt v0.52.x
    retrieved: '2026-10-09'
    quote: 'Why is ytt complaining about “Unknown comment syntax”; can’t I write standard YAML comments (#)? ¶ You can, but it is discouraged to avoid tricky errors that can go unchecked. The recommended approach is when writing ytt templated files, use ytt comments: #!'
  examples:
    bad: |
      #@ load("@ytt:data", "data")
      ---
      # number of pods
      replicas: #@ data.values.replicas
    good: |
      #@ load("@ytt:data", "data")
      ---
      #! number of pods
      replicas: #@ data.values.replicas
  xref:
  - https://carvel.dev/ytt/docs/v0.52.x/file-marks/
  status: active
  rule_version: 1
