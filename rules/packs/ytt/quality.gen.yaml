    doc_version: ytt 0.32.0+
    retrieved: '2026-10-09'
    quote: 'History: v0.32.0 — omitting @overlay/append annotation implies a merge operation and 0 matches, defaulting to insert after the last item. @overlay/assert ¶ Checks assertion that value of “left” matched node equals that of the annotated “right” nod'
