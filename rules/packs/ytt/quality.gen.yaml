    - '**/*.yaml'
    query: |
      ((comment) @match (#match? @match "^#@schema/type\\s+any\\s*=\\s*True"))
  message: any=True disables type checking/defaults for the subtree; declare the shape when it's known.
  ai_question: Is the subtree's shape actually known/stable (so it could be declared)?
  source:
    url: https://carvel.dev/ytt/docs/v0.52.x/lang-ref-ytt-schema/
    doc: '#@schema/type any=True'
    doc_version: ytt v0.52.x
    retrieved: '2026-10-09'
    quote: 'any=True where: any ( bool ) — whether or not any and all types are permitted on this node and its children. The annotated node and its nested children are not checked by schema, and has no schema defaulting behavior. However, (as of v0.39.0) any nested @schema annotation that alters type or value of a child would conflict wi'
  examples:
    bad: |
      #@data/values-schema
      ---
      #@schema/type any=True
      resources: {}
    good: |
      #@data/values-schema
      ---
      resources:
        cpu: 100m
        memory: 128Mi
  status: active
  rule_version: 1
