- id: YTT-QUAL-ANCHOR-WITH-DIRECTIVE
  title: YAML anchor on a templated node
  language: yaml
  framework: ytt
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ytt: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.yml'
    - '**/*.yaml'
    query: |
      ((block_mapping (block_mapping_pair value: (flow_node (anchor) .)) . (comment) @match) (#match? @match "^#@ "))
  message: Anchors resolve before ytt evaluates, so the alias gets null; use a Starlark variable or function instead.
  source:
    url: https://carvel.dev/ytt/docs/v0.52.x/known-limitations/
    doc: YAML anchor on a templated node
    doc_version: ytt v0.52.x
    retrieved: '2026-10-09'
    quote: 't Contributing Carvel Development Guidelines Security Known Limitations Playground Examples Known Limitations YAML anchors and templating directive for the same YAML node are not supported. first : &content #@ 123 second : *content second key-value pair will not contain 123 since YAML anchors are r'
  examples:
    bad: |
      #@ load("@ytt:data", "data")
      ---
      first: &content #@ data.values.port
      second: *content
    good: |
      #@ load("@ytt:data", "data")
      ---
      #@ port = data.values.port
      first: #@ port
      second: #@ port
  status: active
  rule_version: 1
- id: YTT-QUAL-BLOCK-WITHOUT-END
  title: '#@ def/for/if without a closing #@ end'
  language: yaml
  framework: ytt
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ytt: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.yml'
    - '**/*.yaml'
    query: |
      ((comment) @match (#match? @match "^#@ +(def|for|if) .*:\\s*$"))
    filters:
    - file.lacks_re:(?m)^\s*#@ +end\b
  message: 'Every multi-line #@ def/for/if block must be closed with #@ end (ytt Starlark is indentation-insensitive).'
  source:
    url: https://carvel.dev/ytt/docs/v0.52.x/lang-ref-def/
    doc: '#@ def/for/if without a closing #@ end'
    doc_version: ytt v0.52.x
    retrieved: '2026-10-09'
    quote: 'les Functions Refer to Starlark function specification for details about various types of function arguments. Note that ytt’s Starlark use requires functions to be closed with an end . function definition within YAML Labels returns map with two keys: test1, and test2: #@ def my_labels(): test1'
  examples:
    bad: |
      #@ def labels():
      app: web
      ---
      metadata:
        labels: #@ labels()
    good: |
      #@ def labels():
      app: web
      #@ end
      ---
      metadata:
        labels: #@ labels()
  xref:
  - https://carvel.dev/ytt/docs/v0.52.x/lang-ref-if/
  - https://carvel.dev/ytt/docs/v0.52.x/lang-ref-for/
  status: active
  rule_version: 1
- id: YTT-QUAL-LOAD-NEEDS-SPACE
  title: 'Directive written without a space (#@load / #@if / #@def)'
  language: yaml
  framework: ytt
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ytt: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.yml'
    - '**/*.yaml'
    query: |
      ((comment) @match (#match? @match "^#@(load|if|for|def|end|else|elif|return)\\b"))
  message: Without the space ytt reads it as an annotation named 'load'/'if' and fails; code directives are '#@ <code>', annotations are '#@name'.
  source:
    url: https://carvel.dev/ytt/docs/v0.52.x/faq/
    doc: 'Directive written without a space (#@load / #@if / #@def)'
    doc_version: ytt v0.52.x
    retrieved: '2026-10-09'
    quote: 'Is it #@load or #@ load ? #@overlay/match or #@ overlay/match ¶ The space is subtly meaningful, and directly, load needs a space, while overlay/match does not – but why?'
  examples:
    bad: |
      #@load("@ytt:data", "data")
      ---
      replicas: #@ data.values.replicas
    good: |
      #@ load("@ytt:data", "data")
      ---
      replicas: #@ data.values.replicas
  status: active
  rule_version: 1
