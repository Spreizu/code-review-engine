- id: YTT-QUAL-OVERLAY-MISSING-OK-NEW-KEY
  title: Data value added via --data-value-style override
  language: yaml
  framework: ytt
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    ytt: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.yml'
    - '**/*.yaml'
    query: |
      ((comment) @match (#match? @match "^#@data/values\\s*$"))
    filters:
    - file.lacks_re:missing_ok\s*=\s*True
  message: 'Keys that aren''t in the base data values/schema need #@overlay/match missing_ok=True (or a schema entry).'
  ai_question: Do these keys not exist in the base data values/schema (so the override would fail)?
  source:
    url: https://carvel.dev/ytt/docs/v0.52.x/faq/
    doc: Data value added via --data-value-style override
    doc_version: ytt v0.52.x
    retrieved: '2026-10-09'
    quote: ata values doc Is it possible to add a new key to my values via the --data-value command line argument? ¶ No. As with all data values, those passed through --data-value must be overrides, not new values. Instead, overlays are the intended way to provide new keys. See the data values vs overlays doc for more information.
  examples:
    bad: |
      #@data/values
      ---
      new_key: 1
    good: |
      #@ load("@ytt:overlay", "overlay")
      #@data/values
      ---
      #@overlay/match missing_ok=True
      new_key: 1
  status: active
  rule_version: 1
- id: YTT-QUAL-REQUIRE-MIN-VERSION
  title: Library without version.require_at_least
  language: yaml
  framework: ytt
  kind: best-practice
  category: compatibility
  severity: info
  applies_to:
    ytt: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.yml'
    - '**/*.yaml'
    query: |
      ((comment) @match (#match? @match "^#@data/values-schema"))
    filters:
    - file.lacks_re:require_at_least
  message: Declare the minimum ytt version (e.g. in 0-min-version.star) so old binaries fail fast instead of misrendering.
  ai_question: Is there no version.require_at_least elsewhere in this library (e.g. a 0-min-version.star file)?
  source:
    url: https://carvel.dev/ytt/docs/v0.52.x/lang-ref-ytt-version/
    doc: Library without version.require_at_least
    doc_version: ytt v0.52.x
    retrieved: '2026-10-09'
    quote: on . require_at_least( "0.26.0" ) Note that ytt sorts files alphanumerically and executes templates in order. Most of the time it’s best to check version first before processing other templates, hence, in the above example we’ve named file 0-min-version.star so that it’s first alphanumerically.
  examples:
    bad: |
      #@data/values-schema
      ---
      replicas: 2
    good: |
      #@ load("@ytt:version", "version")
      #@ version.require_at_least("0.50.0")
      #@data/values-schema
      ---
      replicas: 2
  status: active
  rule_version: 1
- id: YTT-QUAL-SCHEMA-ARRAY-MULTIPLE-ITEMS
  title: Schema array with more than one item
  language: yaml
  framework: ytt
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ytt: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.yml'
    - '**/*.yaml'
    query: |
      (block_sequence (block_sequence_item) (block_sequence_item)) @match
      (flow_sequence (flow_node) "," (flow_node)) @match
    filters:
    - file.has_re:#@data/values-schema
    - node.lacks_re:#@schema/(type|default)
  message: 'Schema arrays describe the item type with exactly one element (default is []); use #@schema/default for default items.'
  source:
    url: https://carvel.dev/ytt/docs/v0.52.x/lang-ref-ytt-schema/
    doc: Schema array with more than one item
    doc_version: ytt v0.52.x
    retrieved: '2026-10-09'
    quote: Types of Arrays ¶ An array is a sequence of array items. The schema of an array must contain exactly one (1) item. The type inferred from that item becomes the type of all items in that array.
  examples:
    bad: |
      #@data/values-schema
      ---
      domains:
      - apps.example.com
      - api.example.com
    good: |
      #@data/values-schema
      ---
      #@schema/default ["apps.example.com", "api.example.com"]
      domains:
      - ""
  status: active
  rule_version: 1
- id: YTT-QUAL-SCHEMA-TYPE-ANY
  title: '#@schema/type any=True'
  language: yaml
  framework: ytt
  kind: best-practice
  category: maintainability
  severity: info
  applies_to:
    ytt: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
