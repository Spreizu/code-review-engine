- id: JAVA-MOD-STREAM-TOLIST-001
  title: Prefer Stream.toList() over collect(Collectors.toList()) (Java 16+)
  language: java
  kind: modernization
  category: modernization
  severity: info
  applies_to:
    java: '>=16'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_invocation name: (identifier) @m arguments: (argument_list . (method_invocation object: (identifier) @c name: (identifier) @t) .)) @match (#eq? @m "collect") (#eq? @c "Collectors") (#eq? @t "toList"))
  message: Stream.toList() (Java 16) is shorter and returns an unmodifiable list. Confirm callers do not mutate the result before switching.
  ai_question: Is the collected list ever mutated (add/remove/set/sort) afterwards? If not, Stream.toList() is a safe replacement.
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/Stream.html
    doc: 'Javadoc: Stream.toList'
    doc_version: JDK 16+ (JDK 25 docs)
    retrieved: '2026-10-09'
    quote: The returned List is unmodifiable; calls to any mutator method will always cause UnsupportedOperationException to be thrown.
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          List<String> names = users.stream().map(User::name).collect(Collectors.toList());
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          List<String> names = users.stream().map(User::name).toList();
        }
      }
  status: active
  rule_version: 1
