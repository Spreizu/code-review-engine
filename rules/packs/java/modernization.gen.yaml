- id: JAVA-MOD-COMPACT-MAIN-001
  title: Simple programs can use an instance main method (Java 25+)
  language: java
  kind: modernization
  category: modernization
  severity: info
  applies_to:
    java: '>=25'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_declaration (modifiers) @mods name: (identifier) @n parameters: (formal_parameters (formal_parameter type: (array_type)))) @match (#eq? @n "main") (#match? @mods "public static"))
  message: Java 25 (JEP 512) allows instance main methods and compact source files; for scripts and small tools `void main()` is enough. Keep the classic form for libraries / launch-compatible apps.
  ai_question: Is this a small stand-alone program or script (not a framework entry point that must stay public static main)?
  source:
    url: https://openjdk.org/jeps/512
    doc: 'JEP 512: Compact Source Files and Instance Main Methods'
    doc_version: JEP 512 (final in JDK 25)
    retrieved: '2026-10-09'
    quote: Compact Source Files and Instance Main Methods
  examples:
    bad: |
      public class Hello {
        public static void main(String[] args) {
          System.out.println("hi");
        }
      }
    good: |
      void main() {
        IO.println("hi");
      }
  status: active
  rule_version: 1
- id: JAVA-MOD-COR-REQUIRENONNULL-001
  title: Use Objects.requireNonNull for parameter null checks
  language: java
  kind: modernization
  category: null-handling
  severity: info
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((if_statement condition: (parenthesized_expression (binary_expression operator: "==" right: (null_literal))) consequence: [(throw_statement (object_creation_expression type: (type_identifier) @t)) (block . (throw_statement (object_creation_expression type: (type_identifier) @t)) .)]) @match (#eq? @t "NullPointerException"))
  message: Objects.requireNonNull(x, "msg") is the idiomatic, shorter null check for parameters.
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Objects.html
    doc: 'Javadoc: Objects.requireNonNull'
    doc_version: JDK 25 API
    retrieved: '2026-10-09'
    quote: This method is designed primarily for doing parameter validation in methods and constructors
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          if (name == null) throw new NullPointerException("name");
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          this.name = Objects.requireNonNull(name, "name");
        }
      }
  status: active
  rule_version: 1
- id: JAVA-MOD-COR-REQUIRENONNULLELSE-001
  title: Use Objects.requireNonNullElse instead of a null-check ternary
  language: java
  kind: modernization
  category: null-handling
  severity: info
  applies_to:
    java: '>=9'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((ternary_expression condition: (binary_expression left: (identifier) @a operator: "!=" right: (null_literal)) consequence: (identifier) @b) @match (#eq? @a @b))
  message: 'x != null ? x : fallback can be written as Objects.requireNonNullElse(x, fallback) (Java 9).'
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Objects.html
    doc: 'Javadoc: Objects.requireNonNullElse'
    doc_version: JDK 25 API
    retrieved: '2026-10-09'
    quote: Returns the first argument if it is non- null and otherwise the second argument if it is non- null
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          String n = name != null ? name : "anonymous";
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          String n = Objects.requireNonNullElse(name, "anonymous");
        }
      }
  status: active
  rule_version: 1
- id: JAVA-MOD-FLEX-CTOR-001
  title: Validate arguments before super(...) with flexible constructor bodies (Java 25+)
  language: java
  kind: modernization
  category: modernization
  severity: info
  applies_to:
    java: '>=25'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((constructor_body . (explicit_constructor_invocation arguments: (argument_list (method_invocation name: (identifier) @m)))) @match (#match? @m "^(validate|verify|check|require)"))
  message: Since Java 25 (JEP 513) statements may precede super(...)/this(...), so argument validation no longer needs static helper calls inside the super() argument list.
  source:
    url: https://openjdk.org/jeps/513
    doc: 'JEP 513: Flexible Constructor Bodies'
    doc_version: JEP 513 (final in JDK 25)
    retrieved: '2026-10-09'
    quote: Flexible Constructor Bodies
  examples:
    bad: |
      class Positive extends Num {
        Positive(long v) { super(verify(v)); }
      }
    good: |
      class Positive extends Num {
        Positive(long v) {
          if (v <= 0) throw new IllegalArgumentException();
          super(v);
        }
      }
  status: active
  rule_version: 1
- id: JAVA-MOD-MATH-CLAMP-001
  title: Use Math.clamp (Java 21+) instead of nested Math.max/Math.min
  language: java
  kind: modernization
  category: modernization
  severity: info
  applies_to:
    java: '>=21'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((method_invocation object: (identifier) @a name: (identifier) @b arguments: (argument_list (method_invocation object: (identifier) @c name: (identifier) @d))) @match (#eq? @a "Math") (#eq? @c "Math") (#match? @b "^(max|min)$") (#match? @d "^(max|min)$") (#not-eq? @b @d))
  message: Math.clamp(value, min, max) (Java 21) states the intent and validates min <= max.
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Math.html
    doc: 'Javadoc: Math.clamp'
    doc_version: JDK 21+ (JDK 25 docs)
    retrieved: '2026-10-09'
    quote: Clamps the value to fit between min and max.
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          int v = Math.max(lo, Math.min(hi, x));
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          int v = Math.clamp(x, lo, hi);
        }
      }
