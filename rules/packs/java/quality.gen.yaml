- id: JAVA-QUAL-COR-OPTIONAL-NULL-RETURN-001
  title: Method returning Optional returns null
  language: java
  kind: anti-pattern
  category: null-handling
  severity: major
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((method_declaration type: (generic_type (type_identifier) @t) body: (block (return_statement (null_literal)))) @match (#eq? @t "Optional"))
      ((method_declaration type: (generic_type (type_identifier) @t) body: (block (if_statement consequence: [(return_statement (null_literal)) (block (return_statement (null_literal)))]))) @match (#eq? @t "Optional"))
  message: An Optional-returning method must never return null; return Optional.empty().
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Optional.html
    doc: 'Javadoc: Optional (API Note)'
    doc_version: JDK 25 API
    retrieved: '2026-10-09'
    quote: A variable whose type is Optional should never itself be null
  examples:
    bad: |
      class R {
        Optional<User> find(String id) {
          if (id == null) { return null; }
          return Optional.of(load(id));
        }
      }
    good: |
      class R {
        Optional<User> find(String id) {
          if (id == null) { return Optional.empty(); }
          return Optional.of(load(id));
        }
      }
  status: active
  rule_version: 1
