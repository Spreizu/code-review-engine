    query: |
      ((while_statement body: (block (_ (method_invocation object: (identifier) @c name: (identifier) @m)))) @match (#eq? @c "Thread") (#eq? @m "sleep"))
  message: Polling a flag with sleep wastes CPU and adds latency; wait on a condition (CountDownLatch, CompletableFuture, BlockingQueue, wait/notify).
  ai_question: Is the loop polling a condition another thread sets (rather than a deliberate rate-limited retry/backoff)?
  source:
    url: https://docs.oracle.com/javase/tutorial/essential/concurrency/guardmeth.html
    doc: 'The Java Tutorials: Guarded Blocks'
    doc_version: Java Tutorials
    retrieved: '2026-10-09'
    quote: A more efficient guard invokes Object.wait to suspend the current thread.
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          while (!done) { Thread.sleep(50); }
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          latch.await();
        }
      }
  status: active
  rule_version: 1
