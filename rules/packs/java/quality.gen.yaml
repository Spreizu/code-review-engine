    doc: 'Javadoc: StringBuffer'
    doc_version: JDK 8+ (JDK 25 docs)
    retrieved: '2026-10-09'
    quote: The StringBuilder class should generally be used in preference to this one, as it supports all of the same operations but it is faster, as it performs no synchronization.
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          StringBuffer sb = new StringBuffer();
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          StringBuilder sb = new StringBuilder();
        }
      }
  status: active
  rule_version: 1
