      ((method_invocation name: (identifier) @m) @match (#eq? @m "wait"))
    filters:
    - node.lacks_ancestor:while_statement|do_statement|for_statement
  message: wait() outside a while loop is vulnerable to spurious wakeups and missed conditions.
  ai_question: Is this Object.wait() (not an unrelated method named wait) and is the condition not re-checked in a loop?
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Object.html
    doc: 'Javadoc: Object.wait'
    doc_version: JDK 25 API
    retrieved: '2026-10-09'
    quote: The recommended approach to waiting is to check the condition being awaited in a while loop around the call to wait
  examples:
    bad: |
      class Q {
        synchronized void take() throws InterruptedException {
          if (items.isEmpty()) wait();
        }
      }
    good: |
      class Q {
        synchronized void take() throws InterruptedException {
          while (items.isEmpty()) wait();
        }
      }
