- id: JAVA-QUAL-COR-NAN-EQ-001
  title: Comparison with Double.NaN / Float.NaN is always false
  language: java
  kind: anti-pattern
  category: correctness
  severity: critical
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((binary_expression operator: ["==" "!="] (field_access object: (identifier) @c field: (identifier) @f)) @match (#match? @c "^(Double|Float)$") (#eq? @f "NaN"))
  message: x == NaN is always false (and != always true); use Double.isNaN(x)/Float.isNaN(x).
  source:
    url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-15.html
    doc: JLS §15.21.1 Numerical Equality Operators
    doc_version: JLS Java SE 25
    retrieved: '2026-10-09'
    quote: If either operand is NaN, then the result of == is false but the result of != is true .
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          if (x == Double.NaN) reset();
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          if (Double.isNaN(x)) reset();
        }
      }
  status: active
  rule_version: 1
- id: JAVA-QUAL-COR-OPTIONAL-ISPRESENT-GET-001
  title: 'isPresent() followed by get(): use ifPresent / map / orElse'
  language: java
  kind: best-practice
  category: null-handling
  severity: info
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((if_statement condition: (parenthesized_expression (method_invocation name: (identifier) @p)) consequence: (_) @c) @match (#eq? @p "isPresent") (#match? @c "\\.get\\(\\)"))
  message: The isPresent()/get() pair re-implements a null check; ifPresent, map, orElse(Get/Throw) express it without the unchecked get().
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Optional.html
    doc: 'Javadoc: Optional.ifPresent'
    doc_version: JDK 25 API
    retrieved: '2026-10-09'
    quote: If a value is present, performs the given action with the value, otherwise does nothing.
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          if (user.isPresent()) { send(user.get()); }
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          user.ifPresent(this::send);
        }
      }
  status: active
