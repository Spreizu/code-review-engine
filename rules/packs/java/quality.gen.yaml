- id: JAVA-QUAL-CONC-EXECUTOR-CLOSE-001
  title: ExecutorService created but never shut down
  language: java
  kind: anti-pattern
  category: resource-leak
  severity: major
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_invocation object: (identifier) @c name: (identifier) @m) @match (#eq? @c "Executors") (#match? @m "^new(Fixed|Cached|SingleThread|Scheduled|WorkStealing|VirtualThreadPerTask|ThreadPerTask)"))
    filters:
    - node.not_in_try_with_resources
    - file.lacks_text:shutdown
  message: 'An ExecutorService that is never shut down leaks threads. Since Java 19 it is AutoCloseable: use try-with-resources, or shut it down in a lifecycle hook.'
  ai_question: Is this executor leaked (created per call, never shut down) rather than a managed long-lived component?
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ExecutorService.html
    doc: 'Javadoc: ExecutorService'
    doc_version: JDK 25 API
    retrieved: '2026-10-09'
    quote: An unused ExecutorService should be shut down to allow reclamation of its resources.
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          ExecutorService ex = Executors.newFixedThreadPool(4); ex.submit(task);
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          try (ExecutorService ex = Executors.newFixedThreadPool(4)) { ex.submit(task); }
        }
      }
  tags:
  - resource-leak
  status: active
  rule_version: 1
- id: JAVA-QUAL-CONC-INTERRUPTED-001
  title: InterruptedException swallowed without restoring the interrupt status
  language: java
  kind: anti-pattern
  category: concurrency
  severity: major
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((catch_clause (catch_formal_parameter (catch_type (type_identifier) @t)) body: (block) @b) @match (#eq? @t "InterruptedException") (#not-match? @b "interrupt\\(|throw"))
  message: Catching InterruptedException without re-interrupting (Thread.currentThread().interrupt()) or rethrowing loses the cancellation request.
  source:
    url: https://docs.oracle.com/javase/tutorial/essential/concurrency/interrupt.html
    doc: 'The Java Tutorials: Interrupts'
    doc_version: Java Tutorials
    retrieved: '2026-10-09'
    quote: An interrupt is an indication to a thread that it should stop what it is doing and do something else.
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          try { Thread.sleep(100); } catch (InterruptedException e) { log.warn("x"); }
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          try { Thread.sleep(100); } catch (InterruptedException e) { Thread.currentThread().interrupt(); return; }
