- id: JAVA-QUAL-CONC-VT-SYNC-IO-001
  title: Blocking calls inside synchronized pin virtual threads on JDK 21-23
  language: java
  kind: anti-pattern
  category: concurrency
  severity: minor
  applies_to:
    java: '>=21 <24'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((synchronized_statement body: (block (_ (method_invocation name: (identifier) @m)))) @match (#match? @m "^(sleep|read|readAllBytes|send|executeQuery|join|take|accept)$"))
  message: With virtual threads on JDK 21-23, blocking inside synchronized pins the carrier thread; JDK 24 (JEP 491) removes most pinning. Use ReentrantLock on older JDKs.
  ai_question: Does this code run on virtual threads, and does the call block (I/O, sleep, remote call)?
  source:
    url: https://openjdk.org/jeps/491
    doc: 'JEP 491: Synchronize Virtual Threads without Pinning'
    doc_version: JEP 491 (JDK 24)
    retrieved: '2026-10-09'
    quote: Synchronize Virtual Threads without Pinning
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          synchronized (this) { Thread.sleep(1000); }
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          lock.lock(); try { Thread.sleep(1000); } finally { lock.unlock(); }
        }
      }
