    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((object_creation_expression type: (type_identifier) @t) @match (#eq? @t "ServerSocket"))
    filters:
    - node.not_in_try_with_resources
    - node.lacks_ancestor:object_creation_expression|return_statement|field_declaration
  message: ServerSocket holds an OS resource; open it in try-with-resources so it is closed even when exceptions occur.
  ai_question: Is this ServerSocket closed on every path (try/finally, or returned/owned by a Closeable)? Answer rejected if it is.
  source:
    url: https://docs.oracle.com/javase/tutorial/essential/exceptions/tryResourceClose.html
    doc: 'The Java Tutorials: The try-with-resources Statement'
    doc_version: Java Tutorials (JDK 7+ language feature)
    retrieved: '2026-10-09'
    quote: The try -with-resources statement ensures that each resource is closed at the end of the statement.
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          var r = new ServerSocket(arg); use(r);
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          try (var r = new ServerSocket(arg)) { use(r); }
        }
      }
  tags:
  - resource-leak
  status: active
  rule_version: 1
