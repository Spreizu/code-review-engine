  kind: best-practice
  category: resource-leak
  severity: minor
  applies_to:
    java: '>=21'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_invocation object: (identifier) @c name: (identifier) @m) @match (#eq? @c "HttpClient") (#eq? @m "newHttpClient"))
    filters:
    - node.not_in_try_with_resources
    - node.lacks_ancestor:field_declaration
  message: HttpClient owns threads and connections; create it once and share it, or close it (try-with-resources) on Java 21+.
  ai_question: Is this HttpClient created per request (leaking its selector thread) instead of being shared or closed?
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.net.http/java/net/http/HttpClient.html
    doc: 'Javadoc: java.net.http.HttpClient'
