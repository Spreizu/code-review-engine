    retrieved: '2026-10-09'
    quote: An HttpClient can be used to send requests and retrieve their responses
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          var resp = HttpClient.newHttpClient().send(req, BodyHandlers.ofString());
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          try (var client = HttpClient.newHttpClient()) { client.send(req, BodyHandlers.ofString()); }
        }
      }
