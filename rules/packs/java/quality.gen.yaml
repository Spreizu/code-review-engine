- id: JAVA-QUAL-CONC-CF-COMMONPOOL-001
  title: CompletableFuture supplyAsync/runAsync without an Executor run on the common pool
  language: java
  kind: anti-pattern
  category: concurrency
  severity: minor
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_invocation object: (identifier) @c name: (identifier) @m arguments: (argument_list . (_) .)) @match (#eq? @c "CompletableFuture") (#match? @m "^(supplyAsync|runAsync)$"))
  message: Blocking work (I/O, JDBC, HTTP) on the common pool starves parallel streams and other async stages; pass an explicit Executor (e.g. virtual threads).
  ai_question: Does the supplied task block (I/O, sleep, locks, remote calls)?
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/CompletableFuture.html
    doc: 'Javadoc: CompletableFuture'
    doc_version: JDK 25 API
    retrieved: '2026-10-09'
    quote: All async methods without an explicit Executor argument, as well as those involving delays are performed using the ForkJoinPool.commonPool() .
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          CompletableFuture.supplyAsync(() -> http.get(url));
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          CompletableFuture.supplyAsync(() -> http.get(url), ioExecutor);
        }
      }
  tags:
  - concurrency
  status: active
  rule_version: 1
- id: JAVA-QUAL-CONC-CHECKPUT-001
  title: Check-then-act on a Map (containsKey + put) is not atomic
  language: java
  kind: anti-pattern
  category: concurrency
  severity: minor
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((if_statement condition: (parenthesized_expression (unary_expression operand: (method_invocation object: (_) @m1 name: (identifier) @c))) consequence: (_ (expression_statement (method_invocation object: (_) @m2 name: (identifier) @p)))) @match (#eq? @c "containsKey") (#eq? @p "put") (#eq? @m1 @m2))
  message: containsKey followed by put is a race on concurrent maps and does two lookups; use putIfAbsent / computeIfAbsent.
  ai_question: Is this map shared between threads (field, ConcurrentHashMap, cache)? If so the check-then-act is a race.
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Map.html
    doc: 'Javadoc: Map.putIfAbsent / computeIfAbsent'
    doc_version: JDK 25 API
    retrieved: '2026-10-09'
    quote: If the specified key is not already associated with a value (or is mapped to null ) associates it with the given value and returns null
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          if (!cache.containsKey(k)) { cache.put(k, load(k)); }
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          cache.computeIfAbsent(k, this::load);
        }
      }
  tags:
  - concurrency
  status: active
  rule_version: 1
- id: JAVA-QUAL-CONC-CME-001
