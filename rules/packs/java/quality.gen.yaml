    query: |
      ((object_creation_expression type: [(type_identifier) @t (generic_type (type_identifier) @t)]) @match (#eq? @t "Stack"))
  message: java.util.Stack extends Vector (synchronized); the javadoc recommends Deque/ArrayDeque.
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Stack.html
    doc: 'Javadoc: Stack'
    doc_version: JDK 8+ (JDK 25 docs)
    retrieved: '2026-10-09'
    quote: A more complete and consistent set of LIFO stack operations is provided by the Deque interface and its implementations, which should be used in preference to this class.
  examples:
    bad: |
      class Example {
