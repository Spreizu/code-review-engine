    quote: by the enumeration. static <T extends Object & Comparable <? super T>> T max ( Collection <? extends T> coll) Returns the maximum element of the given collection, according to the natural ordering of its elements.
  examples:
    bad: |
      class A {
        int top(List<Integer> xs) {
          int m = xs.get(0);
          for (int x : xs) {
            if (x > m) m = x;
          }
          return m;
        }
      }
    good: |
      class A {
        int top(List<Integer> xs) {
          return Collections.max(xs);
        }
      }
