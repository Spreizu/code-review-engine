               ((synchronized_statement (parenthesized_expression (field_access field: (identifier) @f))) @match (#match? @f "^(TRUE|FALSE)$"))]
    exclude_tests: true
  message: String literals and cached boxed values are shared across the whole JVM, so unrelated code (or a library) can take the same lock and deadlock or slow you down. Lock on a private final Object.
  source:
    url: https://openjdk.org/jeps/390
    doc: synchronized on a string literal or boxed constant (LCK01-J)
    doc_version: JDK 25 API / JLS SE 25 (SEI CERT Java as xref)
    retrieved: '2026-10-09'
    quote: pper classes as value-based and deprecate their constructors for removal, prompting new deprecation warnings. Provide warnings about improper attempts to synchronize on instances of any value-based classes in the Java Platform.
  examples:
    bad: |
      class A {
        void run() {
          synchronized ("lock") {
            work();
          }
        }
        void work() {}
      }
    good: |
      class A {
        private final Object lock = new Object();
        void run() {
          synchronized (lock) {
            work();
          }
        }
        void work() {}
      }
