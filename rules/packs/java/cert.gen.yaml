- id: JAVA-CERT-ERR09-SYSTEM-EXIT
  title: System.exit() outside main (ERR09-J)
  language: java
  kind: anti-pattern
  category: reliability
  severity: minor
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((method_invocation object: (identifier) @o name: (identifier) @m) @match (#match? @o "^(System|Runtime)$") (#match? @m "^(exit|halt)$"))
    filters:
    - func.lacks_re:static\s+void\s+main\s*\(
    exclude_tests: true
  message: Library or server code that calls System.exit() kills the whole JVM, including every other request, thread and application in it. Throw an exception or return a status and let main() decide.
  ai_question: Is this server, library or framework code (not a command-line entry point or its direct helpers)?
  source:
    url: https://wiki.sei.cmu.edu/confluence/display/java/ERR09-J.+Do+not+allow+untrusted+code+to+terminate+the+JVM
    doc: System.exit() outside main (ERR09-J)
    doc_version: SEI CERT Oracle Coding Standard for Java (wiki, 2026)
    retrieved: '2026-10-09'
    quote: Do not allow untrusted code to terminate the JVM Invocation of System.exit() terminates the Java Virtual Machine (JVM), consequently terminating all running programs and threads. This can result in denial-of-service (DoS) attacks .
  examples:
    bad: |
      class A {
        void handle(String cmd) {
          if (cmd.equals("stop")) {
            System.exit(0);
          }
        }
      }
    good: |
      class A {
        void handle(String cmd) {
          if (cmd.equals("stop")) {
            throw new IllegalStateException("stop requested");
          }
        }
      }
  cwe:
  - CWE-382
  status: active
  rule_version: 1
  tags:
  - cert
- id: JAVA-CERT-FIO02-FILE-RESULT-IGNORED
  title: File.delete/mkdir/renameTo result ignored (FIO02-J)
  language: java
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((expression_statement (method_invocation object: (_) name: (identifier) @m arguments: (argument_list) @a) @match) (#match? @m "^(delete|mkdir|mkdirs|createNewFile|setReadOnly|setLastModified|setExecutable|setReadable|setWritable|renameTo)$"))
    filters:
    - file.has_re:import java\.io\.(File|\*);
    - node.lacks_re:^(this\.)?\w*(repo|repository|dao|service|client|cache|map|session|em|entityManager|template)\w*\.
    - node.lacks_re:\(\s*[^)\s]
    exclude_tests: true
  message: java.io.File reports failure only through the boolean result, which is dropped here, so a file that was not deleted/created/renamed goes unnoticed. Check the result, or use java.nio.file.Files, which throws an IOException with the reason.
  source:
    url: https://wiki.sei.cmu.edu/confluence/display/java/FIO02-J.+Detect+and+handle+file-related+errors
    doc: File.delete/mkdir/renameTo result ignored (FIO02-J)
    doc_version: SEI CERT Oracle Coding Standard for Java (wiki, 2026)
    retrieved: '2026-10-09'
    quote: Noncompliant Code Example ( delete() ) This noncompliant code example attempts to delete a specified file but gives no indication of its success.
  examples:
    bad: |
      import java.io.File;

      class A {
        void clean(File f) {
          f.delete();
        }
      }
    good: |
      import java.io.File;

      class A {
        void clean(File f) throws java.io.IOException {
          java.nio.file.Files.delete(f.toPath());
        }
      }
    regressions:
    - code: |
        import java.io.File;

        class A {
          void d(Repo repository, User u) {
            repository.delete(u);
          }
        }
  cwe:
  - CWE-252
  status: active
  rule_version: 1
  tags:
  - cert
- id: JAVA-CERT-FIO03-TEMP-FILE-NOT-REMOVED
  title: Temporary file created without being removed (FIO03-J)
  language: java
  kind: security
  category: security
  severity: minor
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((method_invocation object: (identifier) @o name: (identifier) @m) @match (#match? @o "^(File|Files)$") (#match? @m "^(createTempFile)$"))
    filters:
    - func.lacks_re:\.delete\(|deleteIfExists|deleteOnExit|DELETE_ON_CLOSE
    exclude_tests: true
  message: The temporary file is never deleted on this path, so data (possibly sensitive) accumulates in a shared directory. Delete it in a finally block (Files.deleteIfExists) or open it with DELETE_ON_CLOSE.
  ai_question: Is the temporary file left behind on some path (not deleted by the caller or a finally block elsewhere)?
  source:
    url: https://wiki.sei.cmu.edu/confluence/display/java/FIO03-J.+Remove+temporary+files+before+termination
    doc: Temporary file created without being removed (FIO03-J)
    doc_version: SEI CERT Oracle Coding Standard for Java (wiki, 2026)
    retrieved: '2026-10-09'
    quote: '( IOException x ) { // Handle error } } } } } Noncompliant Code Example ( createTempFile() , deleteOnExit() ) This noncompliant code example invokes the File.createTempFile() method, which generates a unique temporary file name based on two parameters: a prefix and an extension.'
  examples:
    bad: |
      import java.io.File;

      class A {
        File export(byte[] data) throws Exception {
          File f = File.createTempFile("export", ".csv");
          java.nio.file.Files.write(f.toPath(), data);
          return f;
        }
      }
    good: |
      import java.io.File;

      class A {
        void export(byte[] data) throws Exception {
          java.nio.file.Path p = java.nio.file.Files.createTempFile("export", ".csv");
          try {
            java.nio.file.Files.write(p, data);
          } finally {
            java.nio.file.Files.deleteIfExists(p);
          }
        }
      }
  cwe:
  - CWE-459
  - CWE-377
  status: active
  rule_version: 1
  tags:
  - cert
- id: JAVA-CERT-LCK01-SYNC-SHARED-LITERAL
  title: synchronized on a string literal or boxed constant (LCK01-J)
  language: java
  kind: anti-pattern
  category: concurrency
  severity: major
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      [((synchronized_statement (parenthesized_expression [(string_literal) (method_invocation object: (identifier) @o name: (identifier) @m)])) @match (#match? @o "^(Boolean|Integer|Long|Short|Byte|Character|String)$") (#match? @m "^(valueOf|intern)$"))
               ((synchronized_statement (parenthesized_expression (string_literal))) @match)
               ((synchronized_statement (parenthesized_expression (field_access field: (identifier) @f))) @match (#match? @f "^(TRUE|FALSE)$"))]
    exclude_tests: true
  message: String literals and cached boxed values are shared across the whole JVM, so unrelated code (or a library) can take the same lock and deadlock or slow you down. Lock on a private final Object.
  source:
    url: https://wiki.sei.cmu.edu/confluence/display/java/LCK01-J.+Do+not+synchronize+on+objects+that+may+be+reused
    doc: synchronized on a string literal or boxed constant (LCK01-J)
    doc_version: SEI CERT Oracle Coding Standard for Java (wiki, 2026)
    retrieved: '2026-10-09'
    quote: Noncompliant Code Example ( String Literal) This noncompliant code example locks on a final String literal. Non-compliant code Copy to clipboard Toggle fullscreen // This bug was found in jetty-6.1.3 BoundedThreadPool
  examples:
    bad: |
      class A {
        void run() {
          synchronized ("lock") {
            work();
          }
        }
        void work() {}
      }
    good: |
      class A {
        private final Object lock = new Object();
        void run() {
          synchronized (lock) {
            work();
          }
        }
        void work() {}
      }
  cwe:
  - CWE-412
  status: active
  rule_version: 1
  tags:
  - cert
- id: JAVA-CERT-LCK02-SYNC-GETCLASS
  title: synchronized (getClass()) (LCK02-J)
  language: java
  kind: anti-pattern
  category: concurrency
  severity: major
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((synchronized_statement (parenthesized_expression (method_invocation name: (identifier) @m arguments: (argument_list) .))) @match (#eq? @m "getClass"))
    exclude_tests: true
  message: In a subclass getClass() returns the subclass's Class object, so subclass and parent instances take different locks and the static state is no longer protected. Lock on A.class or a private static final lock object.
  source:
    url: https://wiki.sei.cmu.edu/confluence/display/java/LCK02-J.+Do+not+synchronize+on+the+class+object+returned+by+getClass%28%29
    doc: synchronized (getClass()) (LCK02-J)
    doc_version: SEI CERT Oracle Coding Standard for Java (wiki, 2026)
    retrieved: '2026-10-09'
    quote: getClass() Synchronizing on the return value of the Object.getClass() method can lead to unexpected behavior. Whenever the implementing class is subclassed, the subclass locks on the subclass's type. The Class object of the subclass is entirely distinct from the Class object of the parent class.
  examples:
    bad: |
      class A {
        static int count;
        void inc() {
          synchronized (getClass()) {
            count++;
          }
        }
      }
    good: |
      class A {
        static int count;
        void inc() {
          synchronized (A.class) {
            count++;
          }
        }
      }
  cwe:
  - CWE-667
  status: active
  rule_version: 1
  tags:
  - cert
- id: JAVA-CERT-NUM09-FLOAT-LOOP-COUNTER
  title: Floating-point loop counter (NUM09-J)
  language: java
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((for_statement init: (local_variable_declaration type: (floating_point_type))) @match)
    exclude_tests: true
  message: 0.1 has no exact binary representation, so the counter drifts and the loop runs one time more or less than intended (or forever). Count with an integer and derive the float value.
  source:
    url: https://wiki.sei.cmu.edu/confluence/display/java/NUM09-J.+Do+not+use+floating-point+variables+as+loop+counters
    doc: Floating-point loop counter (NUM09-J)
    doc_version: SEI CERT Oracle Coding Standard for Java (wiki, 2026)
    retrieved: '2026-10-09'
    quote: Do not use floating-point variables as loop counters Floating-point variables must not be used as loop counters. Limited-precision IEEE 754 floating-point types cannot represent All simple fractions exactly.
  examples:
    bad: |
      class A {
        void steps() {
          for (float x = 0.1f; x <= 1.0f; x += 0.1f) {
            System.out.println(x);
          }
        }
      }
    good: |
      class A {
        void steps() {
          for (int i = 1; i <= 10; i++) {
            float x = i / 10.0f;
            System.out.println(x);
          }
        }
      }
  cwe:
  - CWE-1339
  status: active
  rule_version: 1
  tags:
  - cert
