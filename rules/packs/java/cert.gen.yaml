- id: JAVA-CERT-THI02-NOTIFY
  title: notify() instead of notifyAll() (THI02-J)
  language: java
  kind: anti-pattern
  category: concurrency
  severity: minor
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((method_invocation name: (identifier) @m arguments: (argument_list) .) @match (#eq? @m "notify"))
    exclude_tests: true
  message: notify() wakes one arbitrary waiter; if it is waiting for a different condition it goes back to sleep and the thread that could proceed is never woken. Use notifyAll() (or java.util.concurrent conditions).
  ai_question: Can more than one thread wait on this monitor for different conditions (so waking a single arbitrary one may wake the wrong one)?
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Object.html
    doc: notify() instead of notifyAll() (THI02-J)
    doc_version: JDK 25 API / JLS SE 25 (SEI CERT Java as xref)
    retrieved: '2026-10-09'
    quote: If any threads are waiting on this object, one of them is chosen to be awakened. The choice is arbitrary and occurs at the discretion of the implementation.
  examples:
    bad: |
      class A {
        boolean ready;
        synchronized void done() {
          ready = true;
          notify();
        }
      }
    good: |
      class A {
        boolean ready;
        synchronized void done() {
          ready = true;
          notifyAll();
        }
      }
  xref:
  - https://wiki.sei.cmu.edu/confluence/display/java/THI02-J.+Notify+all+waiting+threads+rather+than+a+single+thread
  cwe:
  - CWE-662
  status: active
  rule_version: 1
  tags:
  - cert
