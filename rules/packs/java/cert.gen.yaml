- id: JAVA-CERT-ERR09-SYSTEM-EXIT
  title: System.exit() outside main (ERR09-J)
  language: java
  kind: anti-pattern
  category: reliability
  severity: minor
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((method_invocation object: (identifier) @o name: (identifier) @m) @match (#match? @o "^(System|Runtime)$") (#match? @m "^(exit|halt)$"))
    filters:
    - func.lacks_re:static\s+void\s+main\s*\(
    exclude_tests: true
  message: Library or server code that calls System.exit() kills the whole JVM, including every other request, thread and application in it. Throw an exception or return a status and let main() decide.
  ai_question: Is this server, library or framework code (not a command-line entry point or its direct helpers)?
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Runtime.html
    doc: System.exit() outside main (ERR09-J)
    doc_version: JDK 25 API / JLS SE 25 (SEI CERT Java as xref)
    retrieved: '2026-10-09'
    quote: onding method exec(String[], String[], File) or ProcessBuilder should be used instead. void exit (int status) Initiates the shutdown sequence of the Java Virtual Machine.
  examples:
    bad: |
      class A {
        void handle(String cmd) {
          if (cmd.equals("stop")) {
            System.exit(0);
          }
        }
      }
    good: |
      class A {
        void handle(String cmd) {
          if (cmd.equals("stop")) {
            throw new IllegalStateException("stop requested");
          }
        }
      }
  xref:
  - https://wiki.sei.cmu.edu/confluence/display/java/ERR09-J.+Do+not+allow+untrusted+code+to+terminate+the+JVM
  - https://openjdk.org/jeps/486
  cwe:
  - CWE-382
  status: active
  rule_version: 1
  tags:
  - cert
- id: JAVA-CERT-FIO02-FILE-RESULT-IGNORED
