  language: java
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((expression_statement (method_invocation object: (_) name: (identifier) @m arguments: (argument_list) @a) @match) (#match? @m "^(delete|mkdir|mkdirs|createNewFile|setReadOnly|setLastModified|setExecutable|setReadable|setWritable|renameTo)$"))
    filters:
    - file.has_re:import java\.io\.(File|\*);
    - node.lacks_re:^(this\.)?\w*(repo|repository|dao|service|client|cache|map|session|em|entityManager|template)\w*\.
    - node.lacks_re:\(\s*[^)\s]
    exclude_tests: true
  message: java.io.File reports failure only through the boolean result, which is dropped here, so a file that was not deleted/created/renamed goes unnoticed. Check the result, or use java.nio.file.Files, which throws an IOException with the reason.
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/io/File.html
    doc: File.delete/mkdir/renameTo result ignored (FIO02-J)
    doc_version: JDK 25 API / JLS SE 25 (SEI CERT Java as xref)
    retrieved: '2026-10-09'
    quote: 'Returns: true if and only if the file or directory is successfully deleted; false otherwise deleteOnExit public void deleteOnExit () Requests that the file or directory denoted by this'
  examples:
    bad: |
      import java.io.File;

      class A {
        void clean(File f) {
          f.delete();
        }
      }
    good: |
      import java.io.File;

      class A {
        void clean(File f) throws java.io.IOException {
          java.nio.file.Files.delete(f.toPath());
        }
      }
    regressions:
    - code: |
        import java.io.File;

        class A {
          void d(Repo repository, User u) {
            repository.delete(u);
          }
