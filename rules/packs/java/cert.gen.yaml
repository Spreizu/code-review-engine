- id: JAVA-CERT-FIO03-TEMP-FILE-NOT-REMOVED
  title: Temporary file created without being removed (FIO03-J)
  language: java
  kind: security
  category: security
  severity: minor
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((method_invocation object: (identifier) @o name: (identifier) @m) @match (#match? @o "^(File|Files)$") (#match? @m "^(createTempFile)$"))
    filters:
    - func.lacks_re:\.delete\(|deleteIfExists|deleteOnExit|DELETE_ON_CLOSE
    exclude_tests: true
  message: The temporary file is never deleted on this path, so data (possibly sensitive) accumulates in a shared directory. Delete it in a finally block (Files.deleteIfExists) or open it with DELETE_ON_CLOSE.
  ai_question: Is the temporary file left behind on some path (not deleted by the caller or a finally block elsewhere)?
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/io/File.html
    doc: Temporary file created without being removed (FIO03-J)
    doc_version: JDK 25 API / JLS SE 25 (SEI CERT Java as xref)
    retrieved: '2026-10-09'
    quote: This method provides only part of a temporary-file facility. To arrange for a file created by this method to be deleted automatically, use the deleteOnExit() method.
  examples:
    bad: |
      import java.io.File;

      class A {
        File export(byte[] data) throws Exception {
          File f = File.createTempFile("export", ".csv");
          java.nio.file.Files.write(f.toPath(), data);
          return f;
        }
      }
    good: |
      import java.io.File;

      class A {
        void export(byte[] data) throws Exception {
          java.nio.file.Path p = java.nio.file.Files.createTempFile("export", ".csv");
          try {
            java.nio.file.Files.write(p, data);
          } finally {
            java.nio.file.Files.deleteIfExists(p);
          }
        }
      }
  xref:
  - https://wiki.sei.cmu.edu/confluence/display/java/FIO03-J.+Remove+temporary+files+before+termination
  - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/nio/file/StandardOpenOption.html#DELETE_ON_CLOSE
  cwe:
  - CWE-459
  - CWE-377
  status: active
  rule_version: 1
  tags:
  - cert
- id: JAVA-CERT-LCK01-SYNC-SHARED-LITERAL
  title: synchronized on a string literal or boxed constant (LCK01-J)
  language: java
  kind: anti-pattern
  category: concurrency
  severity: major
  applies_to:
    java: '>=8'
  detection:
