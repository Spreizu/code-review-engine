    exclude_tests: true
  message: Request data reaches a SQL string in this function. Bind it as a query parameter instead of concatenating or formatting it into the statement.
  ai_question: Does untrusted request data really flow, along the path shown in the evidence, into this sql built from sink without an effective guard (allow-list, type conversion, encoder or parameter binding) for this context? Answer no if the value is constant on every path, validated, or the sink is not reachable with attacker data.
  source:
    url: https://www.oracle.com/java/technologies/javase/seccodeguide.html
    doc: Secure Coding Guidelines for Java SE (INJECT-2)
    doc_version: current
    retrieved: '2026-10-09'
    quote: Avoid dynamic SQL It is well known that dynamically created SQL statements including untrusted input are subject to command injection.
  examples:
    bad: |
      import java.sql.*;
      import javax.servlet.http.*;
      class C {
        ResultSet find(HttpServletRequest request, Connection conn) throws SQLException {
          String id = request.getParameter("id");
          Statement st = conn.createStatement();
          return st.executeQuery("SELECT * FROM users WHERE id = '" + id + "'");
        }
      }
    good: |
      import java.sql.*;
      import javax.servlet.http.*;
      class C {
        ResultSet find(HttpServletRequest request, Connection conn) throws SQLException {
          String id = request.getParameter("id");
          PreparedStatement ps = conn.prepareStatement("SELECT * FROM users WHERE id = ?");
          ps.setString(1, id);
          return ps.executeQuery();
        }
      }
