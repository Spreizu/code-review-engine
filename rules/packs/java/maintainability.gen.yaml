    url: https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html
    doc: JLS 15.14.2 Postfix Increment Operator
    doc_version: Java 21
    retrieved: '2026-10-09'
    quote: ( §5.1.3 ) and/or subjected to boxing conversion ( §5.1.7 ) to the type of the variable before it is stored. The value of the postfix increment expression is the value of the variable before the new value is stored.
  examples:
    bad: |
      class A {
          void f(int count) {
              count = count++;
          }
      }
    good: |
      class A {
          void f(int count) {
              count++;
          }
      }
