    - ancestor.has_re:finally_clause|for_statement|enhanced_for_statement|while_statement|do_statement|switch_block|lambda_expression|method_declaration:^finally\b
  message: 'Leaving a finally block with return/break/continue discards any exception (or earlier return value) from the try block: move the jump out of finally.'
