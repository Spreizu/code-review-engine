- id: JAVA-MAINT-VIRTUAL-THREAD-DAEMON-PRIORITY
  title: Daemon/priority/thread group used on a virtual thread
  language: java
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    java: '>=21'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (method_invocation object: (_) @o name: (identifier) @n (#match? @n "^(setDaemon|setPriority|getThreadGroup)$") (#match? @o "ofVirtual\\(|startVirtualThread\\(")) @match
  message: 'Virtual threads are always daemon, ignore priority and share one placeholder thread group: setDaemon(false) throws, the rest has no effect.'
  source:
    url: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Thread.html
    doc: 'Java SE 21 API: Thread'
    doc_version: Java 21
    retrieved: '2026-10-09'
    quote: The shutdown sequence begins when all started non-daemon threads have terminated. The daemon status of a virtual thread is always true and cannot be changed by this method to false .
  examples:
    bad: |
      class A {
          void f() {
              Thread.ofVirtual().unstarted(task).setDaemon(false);
          }
      }
    good: |
      class A {
          void f() {
              Thread.ofVirtual().start(task);
          }
      }
