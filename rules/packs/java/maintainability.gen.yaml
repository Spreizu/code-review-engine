- id: JAVA-MAINT-ALL-BRANCHES-SAME
  title: Every branch runs the same code
  language: java
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    java: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      [(if_statement) (switch_expression)] @match
    filters:
    - branches.all_same
    - parentkind.lacks_re:if_statement:.
  message: 'All branches of this if/switch (including the else/default) do the same thing, so the condition has no effect: drop the condition or make the branches differ as intended.'
  source:
    url: https://docs.oracle.com/javase/specs/jls/se21/html/jls-14.html
    doc: JLS 14.11 The switch statement
    doc_version: Java 21
    retrieved: '2026-10-09'
    quote: The switch Statement The switch statement transfers control to one of several statements or expressions, depending on the value of an expression.
  examples:
    bad: |
      class A {
          int f(int a) {
              if (a == 1) {
                  save(1);
              } else {
                  save(1);
              }
              return 0;
          }
      }
    good: |
      class A {
          int f(int a) {
              if (a == 1) {
                  save(1);
              } else {
                  save(2);
              }
              return 0;
          }
      }
    regressions:
    - code: |
        class A {
            int f(int a) {
                if (a == 1) {
                    save(1);
                } else if (a == 2) {
                    save(1);
                }
                return 0;
            }
        }
