- id: JAVA-MAINT-WAIT-NOTIFY-UNSYNCHRONIZED
  title: wait()/notify() called outside synchronized code
  language: java
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    java: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      (method_invocation name: (identifier) @m (#match? @m "^(wait|notify|notifyAll)$")) @match
    filters:
    - node.lacks_ancestor:synchronized_statement
    - ancestor.lacks_re:method_declaration|lambda_expression:^[^{]*\bsynchronized\b
    - node.has_re:^[\w.]*\b(wait|notify|notifyAll)\(\s*\d*\s*\)$
  message: 'Without holding the object''s monitor these calls throw IllegalMonitorStateException: wrap them in synchronized on the same object.'
  ai_question: Is the caller not already holding the monitor (e.g. via a synchronized caller)?
  source:
    url: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html
    doc: 'Java SE 21 API: Object.notify'
    doc_version: Java 21
    retrieved: '2026-10-09'
    quote: he awakened thread enjoys no reliable privilege or disadvantage in being the next thread to lock this object. This method should only be called by a thread that is the owner of this object's monitor.
  examples:
    bad: |
      class A {
          void f() {
              lock.notifyAll();
          }
      }
    good: |
      class A {
          void f() {
              synchronized (lock) {
                  lock.notifyAll();
              }
          }
      }
  xref:
  - sonar:java:S2273
  status: active
  rule_version: 1
  tags:
  - maintainability
- id: JAVA-MAINT-WAIT-ON-THREAD
  title: wait/notify called on a Thread object
  language: java
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    java: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (method_invocation object: (method_invocation object: (identifier) @t name: (identifier) @c) name: (identifier) @n (#eq? @t "Thread") (#eq? @c "currentThread") (#match? @n "^(wait|notify|notifyAll)$")) @match
  message: Thread uses its own monitor for join(); waiting or notifying on it interferes with join and is notified when threads end.
  source:
    url: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Thread.html
    doc: 'Java SE 21 API: Thread.join'
    doc_version: Java 21
    retrieved: '2026-10-09'
    quote: It is recommended that applications not use wait , notify , or notifyAll on Thread instances.
  examples:
    bad: |
      class A {
          void f() throws InterruptedException {
              synchronized (Thread.currentThread()) {
                  Thread.currentThread().wait(100);
              }
          }
      }
    good: |
      class A {
          void f() throws InterruptedException {
              synchronized (lock) {
                  lock.wait(100);
              }
          }
      }
