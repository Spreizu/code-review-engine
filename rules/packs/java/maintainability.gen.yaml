- id: JAVA-MAINT-VOLATILE-COMPOUND-UPDATE
  title: Compound update of a volatile field
  language: java
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    java: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (update_expression (identifier) @v) @match
    filters:
    - file.has_re:\bvolatile\s+(int|long|short|byte|double|float|Integer|Long)\s+{cap:v}\b
  message: 'volatile makes reads and writes visible but ++/-- is read-modify-write, so concurrent updates are lost: use an Atomic* type.'
  source:
    url: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html
    doc: JLS 8.3.1.4 volatile Fields
    doc_version: Java 21
    retrieved: '2026-10-09'
    quote: anguage provides a second mechanism, volatile fields, that is more convenient than locking for some purposes. A field may be declared volatile , in which case the Java Memory Model ensures that all threads see a consistent value for the variable ( §17.
  examples:
    bad: |
      class A {
          private volatile int hits;

          void hit() {
              hits++;
          }
      }
    good: |
      class A {
          private final AtomicInteger hits = new AtomicInteger();

          void hit() {
              hits.incrementAndGet();
          }
      }
