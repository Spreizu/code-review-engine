    doc_version: OWASP Error Handling Cheat Sheet
    retrieved: '2026-10-09'
    quote: The outcome being that when an unexpected error occurs then a generic response is returned by the application but the error details are logged server side for investigation, and not returned to the user.
  examples:
    bad: |
      class S extends HttpServlet {
        void h(HttpServletResponse resp, Exception e) throws IOException {
          e.printStackTrace(resp.getWriter());
        }
      }
    good: |
      class S extends HttpServlet {
        void h(HttpServletResponse resp, Exception e) throws IOException {
          log.error("request failed", e);
          resp.sendError(500);
        }
      }
  cwe:
  - CWE-209
