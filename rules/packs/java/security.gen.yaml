- id: JAVA-SEC-SESSION-FIXATION-NONE-001
  title: Session fixation protection turned off
  language: java
  kind: security
  category: security
  severity: major
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((method_invocation object: (_) @o name: (identifier) @m) @match (#eq? @m "none") (#match? @o "sessionFixation\\(\\)$"))
      ((method_invocation name: (identifier) @sf arguments: (argument_list (lambda_expression body: (method_invocation name: (identifier) @m)))) @match (#eq? @sf "sessionFixation") (#eq? @m "none"))
  message: With session fixation protection disabled, the session id chosen before login survives authentication. Keep changeSessionId() (the default) or newSession().
  source:
    url: https://docs.spring.io/spring-security/reference/servlet/authentication/session-management.html
    doc: 'Spring Security: Session Management'
    doc_version: Spring Security 6.x/7.x
    retrieved: '2026-10-09'
    quote: Understanding Session Fixation Attack Protection Session fixation attacks are a potential risk where it is possible for a malicious attacker to create a session by accessing a site, then persuade another
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          http.sessionManagement(s -> s.sessionFixation(f -> f.none()));
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          http.sessionManagement(s -> s.sessionFixation(f -> f.changeSessionId()));
        }
      }
  tags:
  - security
  xref:
  - sonar:java:S5876
  status: active
  rule_version: 1
- id: JAVA-SEC-SPEL-DYNAMIC
  title: SpEL expression parsed from a non-constant string
  language: java
  kind: security
  category: security
  severity: critical
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((method_invocation name: (identifier) @m arguments: (argument_list . [(identifier) (binary_expression) (method_invocation)])) @match (#match? @m "^(parseExpression|parseRaw)$"))
    filters:
    - file.has_re:org\.springframework\.expression|ExpressionParser|SpelExpressionParser
    exclude_tests: true
  message: An expression string that is not a constant is evaluated with SpEL. With the default (standard) context, user-controlled text can call constructors and static methods (T(java.lang.Runtime)), which is remote code execution. Evaluate fixed expressions, or use SimpleEvaluationContext.
  ai_question: Can the expression text come from request data or other untrusted input, and is it evaluated with a StandardEvaluationContext (or none)?
  source:
    url: https://docs.spring.io/spring-framework/reference/core/expressions/evaluation.html
    doc: SpEL expression parsed from a non-constant string
    doc_version: Spring Framework reference
    retrieved: '2026-10-09'
    quote: You can use it to specify a default root object and to configure every available evaluation-related strategy. SimpleEvaluationContext is designed to support only a subset of the SpEL language syntax. For example, it excludes Java type references, constructors, and bean references.
  examples:
    bad: |
      class C {
        Object eval(ExpressionParser parser, String expr) {
          return parser.parseExpression(expr).getValue();
        }
      }
    good: |
      class C {
        Object eval(ExpressionParser parser, Order o) {
          return parser.parseExpression("total * 1.2").getValue(SimpleEvaluationContext.forReadOnlyDataBinding().build(), o);
        }
      }
  cwe:
  - CWE-917
  asvs:
  - V1.3.5
  status: active
  rule_version: 1
  tags:
  - appsec
- id: JAVA-SEC-SPRING-HEADERS-OFF
  title: Spring Security response headers disabled
  language: java
  kind: security
  category: security
  severity: minor
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((method_invocation object: (method_invocation name: (identifier) @h) name: (identifier) @d) @match (#match? @h "^(headers|httpStrictTransportSecurity|contentTypeOptions|contentSecurityPolicy|referrerPolicy|crossOriginOpenerPolicy)$") (#eq? @d "disable"))
    exclude_tests: true
  message: Spring Security's default security headers (HSTS, nosniff, frame options, cache control) are removed. Keep the defaults and customise single headers instead.
  ai_question: Are these headers not set by another layer (proxy, CDN, gateway) for this application?
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.html
    doc: Spring Security response headers disabled
    doc_version: OWASP HTTP Headers Cheat Sheet
    retrieved: '2026-10-09'
    quote: 'Use Content-Type: application/octet-stream for unknown or binary files. Ensure X-Content-Type-Options: nosniff is set to prevent MIME type sniffing. These headers help reduce risks such as Cross-Site Scripting (XSS) and unintended file execution.'
  examples:
    bad: |
      class Sec {
        SecurityFilterChain chain(HttpSecurity http) throws Exception {
          http.headers().disable();
          return http.build();
        }
      }
    good: |
      class Sec {
        SecurityFilterChain chain(HttpSecurity http) throws Exception {
          http.headers(h -> h.contentSecurityPolicy(c -> c.policyDirectives("script-src 'self'")));
          return http.build();
        }
      }
  cwe:
  - CWE-693
  asvs:
  - V3.4.1
  - V3.4.4
  status: active
  rule_version: 1
  tags:
  - appsec
