- id: JAVA-SEC-REGEX-INJECTION
  title: Request parameter compiled as a regex Pattern
  language: java
  kind: security
  category: security
  severity: major
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((method_invocation object: (identifier) @o name: (identifier) @n arguments: (argument_list . (method_invocation name: (identifier) @g))) @match (#eq? @o "Pattern") (#match? @n "^(compile|matches)$") (#match? @g "^(getParameter|getHeader|getQueryString)$"))
    exclude_tests: true
  message: Request data becomes a regular expression, so a user can inject metacharacters to change what matches or send a catastrophically backtracking pattern that ties up the server (ReDoS). Escape the value first (Pattern.quote) or match it as plain text.
  source:
    url: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/regex/Pattern.html
    doc: Request parameter compiled as a regex Pattern
    doc_version: Java SE 21 API
    retrieved: '2026-10-09'
    quote: ttern () Returns the regular expression from which this pattern was compiled. static String quote ( String s) Returns a literal pattern String for the specified String .
  examples:
    bad: |
      class S {
        boolean find(HttpServletRequest req, String text) {
          return Pattern.compile(req.getParameter("q")).matcher(text).find();
        }
      }
    good: |
      class S {
        boolean find(HttpServletRequest req, String text) {
          return Pattern.compile(Pattern.quote(req.getParameter("q"))).matcher(text).find();
        }
      }
  cwe:
  - CWE-730
  asvs:
  - V1.2.9
  status: active
  rule_version: 1
  tags:
  - appsec
- id: JAVA-SEC-REQUESTMAPPING-NO-METHOD
  title: Handler @RequestMapping without an HTTP method
  language: java
  kind: security
  category: security
  severity: minor
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((method_declaration (modifiers (annotation name: (identifier) @a) @ann)) @match (#eq? @a "RequestMapping"))
    filters:
    - cap.lacks_re:ann:\bmethod\s*=
    exclude_tests: true
  message: A method-level @RequestMapping without method= answers every HTTP verb, including GET, so a state-changing handler can be triggered by a link or image tag and slips past CSRF protection that only covers POST. Use @PostMapping/@PutMapping/@DeleteMapping (or @GetMapping for read-only handlers).
  ai_question: Does this handler change server-side state (write, delete, send, log out)?
  source:
    url: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html
    doc: Handler @RequestMapping without an HTTP method
    doc_version: Spring Framework 6.2 reference
    retrieved: '2026-10-09'
    quote: 'There are also HTTP method specific shortcut variants of @RequestMapping : @GetMapping @PostMapping @PutMapping @DeleteMapping @PatchMapping The shortcuts are Cust'
  examples:
    bad: |
      @RestController
      class AccountController {
        @RequestMapping("/account/delete")
        void delete(@RequestParam long id) { accounts.delete(id); }
      }
    good: |
      @RestController
      class AccountController {
        @PostMapping("/account/delete")
        void delete(@RequestParam long id) { accounts.delete(id); }
      }
  cwe:
  - CWE-650
  - CWE-352
  asvs:
  - V3.5.3
  status: active
  rule_version: 1
  tags:
  - appsec
- id: JAVA-SEC-SERIAL-FILTER-002
  title: readObject() on a stream without any serialization filter
  language: java
  kind: security
  category: security
  severity: major
