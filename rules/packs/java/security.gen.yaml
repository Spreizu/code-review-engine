    query: |
      ((object_creation_expression type: [(type_identifier) (scoped_type_identifier)] @t) @match (#match? @t "^(java\.util\.)?Random$"))
  message: java.util.Random is predictable. For tokens, passwords, nonces or keys use SecureRandom.
  ai_question: Is the random value used for anything security-sensitive (token, password, session id, nonce, key, OTP)?
