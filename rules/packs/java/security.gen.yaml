  category: security
  severity: minor
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((method_invocation object: (identifier) @o name: (identifier) @m arguments: (argument_list (_) @a)) @match (#match? @o "^(log|logger|LOG|LOGGER|Log)$") (#match? @m "^(trace|debug|info|warn|error|fine|finer|finest|severe|warning)$") (#match? @a "(?i)^(\\w+\\.)*(password|passwd|pwd|secret|token|apikey|accesstoken|credentials?|privatekey)(\\(\\))?$|\\+\\s*(\\w+\\.)*(password|passwd|secret|token|apikey|accesstoken)\\b"))
    exclude_tests: true
  message: A password, token or key is written to the log, where it is kept, shipped and readable by far more people than the secret itself. Log an identifier or a masked value instead.
  ai_question: Is the logged value an actual secret (password, token, key) rather than e.g. a boolean, a length or a redacted form?
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
    doc: Secret written to a log
    doc_version: OWASP Cheat Sheet Series (current)
    retrieved: '2026-10-09'
    quote: ome forms of personally identifiable information (PII) e.g. health, government identifiers, vulnerable people Authentication passwords Database connection strings Encryption keys and other primary secrets Bank account or payment card holder dat
