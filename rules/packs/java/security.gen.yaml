- id: JAVA-SEC-STATIC-DATEFORMAT
  title: Shared static DateFormat/MessageDigest instance
  language: java
  kind: security
  category: security
  severity: major
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((field_declaration (modifiers) @mods type: (type_identifier) @t) @match (#match? @t "^(SimpleDateFormat|DateFormat|DecimalFormat|NumberFormat|MessageFormat|MessageDigest)$") (#match? @mods "\\bstatic\\b"))
    filters:
    - node.lacks_re:ThreadLocal
    exclude_tests: true
  message: This formatter/digest keeps internal mutable state but is shared through a static field, so concurrent threads corrupt each other's results (wrong dates, exceptions, bad hashes) with no error. Use java.time's immutable DateTimeFormatter, a ThreadLocal, or a new instance per call.
  source:
    url: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/text/SimpleDateFormat.html
    doc: Shared static DateFormat/MessageDigest instance
    doc_version: Java SE 21 API
    retrieved: '2026-10-09'
    quote: 5-0700 "yyyy-MM-dd'T'HH:mm:ss.SSSXXX" 2001-07-04T12:08:56.235-07:00 "YYYY-'W'ww-u" 2001-W27-3 Synchronization Date formats are not synchronized.
  examples:
    bad: |
      class Dates {
        private static final SimpleDateFormat FMT = new SimpleDateFormat("yyyy-MM-dd");
        static String day(Date d) { return FMT.format(d); }
      }
    good: |
      class Dates {
        private static final DateTimeFormatter FMT = DateTimeFormatter.ofPattern("yyyy-MM-dd");
        static String day(LocalDate d) { return FMT.format(d); }
      }
  cwe:
  - CWE-567
  - CWE-362
  asvs:
  - V15.4.1
  status: active
  rule_version: 1
  tags:
  - appsec
- id: JAVA-SEC-STATIC-IV
  title: IvParameterSpec built from a constant
  language: java
  kind: security
  category: security
  severity: major
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((object_creation_expression type: (type_identifier) @t arguments: (argument_list . [(array_creation_expression) (method_invocation object: (string_literal) name: (identifier) @g)])) @match (#match? @t "^(IvParameterSpec|GCMParameterSpec)$"))
    exclude_tests: true
  message: 'The IV/nonce is a constant, so every message encrypted with this key reuses it: equal plaintexts give equal ciphertexts (CBC) or the keystream repeats (CTR/GCM). Generate a fresh random IV per message and store it with the ciphertext.'
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    doc: IvParameterSpec built from a constant
    doc_version: OWASP Cheat Sheet Series (current)
    retrieved: '2026-10-09'
    quote: Enforce the mode's limits on message size, encryption operations, and initialization vector (IV) uniqueness across all instances sharing the key.
  examples:
    bad: |
      class C {
        Cipher c(Key k) throws Exception {
          Cipher c = Cipher.getInstance("AES/CBC/PKCS5Padding");
          c.init(Cipher.ENCRYPT_MODE, k, new IvParameterSpec(new byte[16]));
          return c;
        }
      }
    good: |
      class C {
        Cipher c(Key k, SecureRandom r) throws Exception {
          byte[] iv = new byte[16];
          r.nextBytes(iv);
          Cipher c = Cipher.getInstance("AES/CBC/PKCS5Padding");
          c.init(Cipher.ENCRYPT_MODE, k, new IvParameterSpec(iv));
          return c;
        }
      }
    regressions:
    - code: |
        class C { GCMParameterSpec s(byte[] iv) { return new GCMParameterSpec(128, iv); } }
  cwe:
  - CWE-329
  - CWE-1204
  asvs:
  - V11.3.4
  status: active
  rule_version: 1
  tags:
  - appsec
- id: JAVA-SEC-TIMING-COMPARE
  title: Secret compared with equals() instead of MessageDigest.isEqual
  language: java
  kind: security
  category: security
  severity: minor
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      [((method_invocation object: (identifier) @o name: (identifier) @m arguments: (argument_list . (_) .)) @match (#eq? @m "equals") (#match? @o "(?i)(signature|hmac|digest|secret|api_?key|(api|access|auth|csrf|xsrf|reset|session|bearer|refresh|expected|stored|provided|given|user|verify|verification|webhook)_?token)$"))
               ((method_invocation object: (identifier) @o2 name: (identifier) @m2 arguments: (argument_list . (_) . (_) .)) @match (#eq? @o2 "Arrays") (#eq? @m2 "equals") (#match? @match "(?i)(signature|hmac|digest|secret)"))]
    filters:
    - file.lacks_re:MessageDigest\.isEqual
    exclude_tests: true
  message: A secret (token, signature, HMAC) is compared with an ordinary equality operator, which returns as soon as a byte differs; the response time leaks how much of a guess was right. Use a constant-time comparison.
  ai_question: Is one side a secret (HMAC, signature, API token, password hash) and the other an attacker-supplied value, e.g. from a request?
  source:
    url: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/security/MessageDigest.html
    doc: Secret compared with equals() instead of MessageDigest.isEqual
    doc_version: Java SE 21 API
    retrieved: '2026-10-09'
    quote: ) Returns the provider of this message digest object. static boolean isEqual (byte[] digesta, byte[] digestb) Compares two digests for equality. void reset () Resets the digest for further use.
  examples:
    bad: |
      class V {
        boolean ok(String given, String expectedSignature) {
          return expectedSignature.equals(given);
        }
      }
    good: |
      class V {
        boolean ok(byte[] given, byte[] expectedSignature) {
          return java.security.MessageDigest.isEqual(expectedSignature, given);
        }
      }
  cwe:
  - CWE-208
  asvs:
  - V11.2.4
  status: active
  rule_version: 1
  tags:
  - appsec
- id: JAVA-SEC-WEBVIEW-DEBUG-001
  title: WebView remote debugging enabled
  language: java
  kind: security
  category: security
  severity: major
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_invocation object: (identifier) @c name: (identifier) @m arguments: (argument_list . (true) .)) @match (#eq? @c "WebView") (#eq? @m "setWebContentsDebuggingEnabled"))
  message: Remote debugging exposes every WebView's DOM, storage and JavaScript to anyone with USB/adb access. Enable it only in debug builds (pass BuildConfig.DEBUG).
