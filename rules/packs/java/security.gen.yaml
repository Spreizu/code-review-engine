- id: JAVA-SEC-LOG-INJECTION
  title: Request parameter concatenated into a log message
  language: java
  kind: security
  category: security
  severity: minor
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((method_invocation object: (identifier) @l name: (identifier) @n arguments: (argument_list (binary_expression) @msg)) @match (#match? @l "(?i)^(log|logger)$") (#match? @n "^(trace|debug|info|warn|error)$") (#match? @msg "\\.(getParameter|getHeader|getQueryString|getRequestURI)\\("))
    exclude_tests: true
  message: Request data goes into the log line unchanged, so CR/LF in it forges extra log entries (and other control characters can attack log viewers). Pass it as a structured/parameterised argument and strip or encode CR/LF (or use a JSON log encoder).
  source:
    url: https://owasp.org/www-community/attacks/Log_Injection
    doc: Request parameter concatenated into a log message
    doc_version: OWASP Cheat Sheet Series (current)
    retrieved: '2026-10-09'
    quote: Writing invalidated user input to log files can allow an attacker to forge log entries or inject malicious content into the logs.
  examples:
    bad: |
      class L {
        void login(HttpServletRequest req) {
          log.info("login attempt for " + req.getParameter("user"));
        }
      }
    good: |
      class L {
        void login(HttpServletRequest req) {
          log.info("login attempt for {}", Encode.forJava(req.getParameter("user")));
        }
      }
  cwe:
  - CWE-117
  asvs:
  - V16.4.1
  status: active
