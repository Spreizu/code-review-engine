- id: JAVA-SEC-POSIX-WORLD-WRITABLE-001
  title: File permissions grant write access to others
  language: java
  kind: security
  category: security
  severity: major
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((method_invocation object: (identifier) @c name: (identifier) @m arguments: (argument_list . (string_literal) @match .)) (#eq? @c "PosixFilePermissions") (#eq? @m "fromString") (#match? @match "^\"[-r][-w][-x][-r][-w][-x][-r]w[-x]\"$"))
      ((method_invocation name: (identifier) @m arguments: (argument_list . (field_access object: (identifier) @o field: (identifier) @match) .)) (#eq? @m "add") (#eq? @o "PosixFilePermission") (#eq? @match "OTHERS_WRITE"))
  message: Every local user can modify this file. Drop the write bit for others (and usually group) unless the file is meant to be shared.
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/nio/file/attribute/PosixFilePermissions.html
    doc: 'Javadoc: PosixFilePermissions'
    doc_version: JDK 25 API (javadoc, current LTS; unchanged in 26/27)
    retrieved: '2026-10-09'
    quote: t indicate the owner has read, write, and execute permissions, the group has read and execute permissions and others have none.
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          Files.setPosixFilePermissions(path, PosixFilePermissions.fromString("rwxrwxrwx"));
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          Files.setPosixFilePermissions(path, PosixFilePermissions.fromString("rwxr-x---"));
        }
      }
    regressions:
    - code: |
        class Example {
          void run() throws Exception {
            perms.remove(PosixFilePermission.OTHERS_WRITE);
          }
        }
  tags:
  - security
  xref:
  - sonar:java:S2612
  status: active
  rule_version: 1
