- id: JAVA-SEC-STACKTRACE-TO-RESPONSE
  title: printStackTrace written to the HTTP response
  language: java
  kind: security
  category: security
  severity: major
  applies_to:
    java: '>=8'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((method_invocation name: (identifier) @m arguments: (argument_list [(method_invocation name: (identifier) @g) (object_creation_expression arguments: (argument_list (method_invocation name: (identifier) @g)))])) @match (#eq? @m "printStackTrace") (#match? @g "^(getWriter|getOutputStream)$"))
