- id: JAVA-SEC-DESER-001
  title: Deserialization with ObjectInputStream without a filter
  language: java
  kind: security
  category: security
  severity: critical
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((object_creation_expression type: (type_identifier) @t) @match (#eq? @t "ObjectInputStream"))
    filters:
    - file.lacks_text:setObjectInputFilter
  message: Java deserialization of untrusted data can lead to remote code execution. Avoid it, or set an ObjectInputFilter (JEP 290/415) that allow-lists classes.
  ai_question: Can the stream contain data from outside the trust boundary (network, uploads, message queues)? Is there a JVM-wide jdk.serialFilter?
  source:
    url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/io/ObjectInputStream.html
    doc: 'Javadoc: ObjectInputStream'
    doc_version: JDK 25 API
    retrieved: '2026-10-09'
    quote: 'Warning: Deserialization of untrusted data is inherently dangerous and should be avoided.'
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          Object o = new ObjectInputStream(socket.getInputStream()).readObject();
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          var in = new ObjectInputStream(socket.getInputStream()); in.setObjectInputFilter(ObjectInputFilter.Config.createFilter("com.acme.*;!*")); Object o = in.readObject();
        }
      }
  tags:
  - security
  status: active
  rule_version: 1
- id: JAVA-SEC-FAIL-OPEN-CATCH
  title: Security check returns true from its catch block
  language: java
  kind: security
  category: security
  severity: major
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((method_declaration name: (identifier) @n body: (block (try_statement (catch_clause body: (block (return_statement (true))))))) @match (#match? @n "(?i)^(is|has|can|check|verify|validate)[A-Za-z]*(auth|allow|permi|access|valid|admin|role|grant|token|signature)"))
    exclude_tests: true
  message: When the check throws (directory, policy service or token store down) this security decision returns true, so failures grant access. Return false / deny (or rethrow) on error and log the failure.
  ai_question: Is this function's true result a security permission (authorised, valid token, allowed)?
  source:
    url: https://owasp.org/www-community/Fail_securely
    doc: Security check returns true from its catch block
    doc_version: OWASP Cheat Sheet Series (current)
    retrieved: '2026-10-09'
    quote: Examples isAdmin isAdmin = true; try { codeWhichMayFail(); isAdmin = isUserInRole( “Administrator” ); } catch (Exception ex) {
  examples:
    bad: |
      class Guard {
        boolean isAuthorized(User u, String res) {
          try {
            return policy.allows(u, res);
          } catch (Exception e) {
            return true;
          }
        }
      }
    good: |
      class Guard {
        boolean isAuthorized(User u, String res) {
          try {
            return policy.allows(u, res);
          } catch (Exception e) {
            log.warn("policy check failed", e);
            return false;
          }
