    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_invocation name: (identifier) @m arguments: (argument_list) @a) @match (#eq? @m "readObject") (#eq? @a "()"))
    filters:
    - file.lacks_text:ObjectInputFilter
    - file.has_text:ObjectInputStream
  message: readObject() on data that may be untrusted should be protected by a serialization filter (ObjectInputFilter / jdk.serialFilter).
  ai_question: Does this readObject() read data that could come from outside the trust boundary, without any ObjectInputFilter configured?
  source:
    url: https://www.oracle.com/java/technologies/javase/seccodeguide.html
    doc: Secure Coding Guidelines for Java SE - SERIAL-6
    doc_version: Secure Coding Guidelines for Java SE (current)
    retrieved: '2026-10-09'
    quote: 'Guideline 8-6 / SERIAL-6: Filter untrusted serial data'
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          ObjectInputStream in = open(); Object o = in.readObject();
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          ObjectInputStream in = open(); in.setObjectInputFilter(filter); Object o = in.readObject();
        }
      }
