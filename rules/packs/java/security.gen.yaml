          response.setHeader("X-Trace", request.getParameter("trace"));
        }
      }
    good: |
      class H {
        void h(HttpServletRequest request, HttpServletResponse response) {
          response.setHeader("X-Trace", request.getParameter("trace").replaceAll("[\\r\\n]", ""));
