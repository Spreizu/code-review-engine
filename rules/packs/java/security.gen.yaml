    filters:
    - node.lacks_re:replace(All)?\(|encode|sanitize|matches\(
    exclude_tests: true
  message: A request value goes straight into a response header. If the server stack does not reject CR/LF, the value can split the response or inject headers/cookies. Validate it against an allow-list or strip CR and LF.
  ai_question: Does the header value come from the request without CR/LF filtering, on a server stack that does not reject CR/LF in header values itself?
  source:
