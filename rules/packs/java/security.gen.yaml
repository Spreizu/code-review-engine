- id: JAVA-SEC-SQL-PREP-CONCAT-002
  title: PreparedStatement created from a concatenated SQL string defeats parameterisation
  language: java
  kind: security
  category: security
  severity: critical
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_invocation name: (identifier) @m arguments: (argument_list . (binary_expression) .)) @match (#eq? @m "prepareStatement"))
    filters:
    - taint.clean:sqli
  message: prepareStatement() is called with concatenated SQL, so values are not bound as parameters.
  ai_question: Is any concatenated part derived from untrusted input (as opposed to a fixed identifier)?
  source:
    url: https://www.oracle.com/java/technologies/javase/seccodeguide.html
    doc: Secure Coding Guidelines for Java SE - INJECT-2
    doc_version: Secure Coding Guidelines for Java SE (current)
    retrieved: '2026-10-09'
    quote: It is well known that dynamically created SQL statements including untrusted input are subject to command injection.
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          var ps = con.prepareStatement("DELETE FROM t WHERE name = '" + name + "'");
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          var ps = con.prepareStatement("DELETE FROM t WHERE name = ?");
        }
      }
  tags:
  - security
  status: active
  rule_version: 2
- id: JAVA-SEC-SQLI-001
  title: Dynamic SQL built by string concatenation
  language: java
  kind: security
  category: security
  severity: critical
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_invocation name: (identifier) @m arguments: (argument_list . (binary_expression operator: "+"))) @match (#match? @m "^(executeQuery|executeUpdate|execute|executeLargeUpdate|addBatch|createQuery|createNativeQuery|queryForObject|queryForList|queryForMap|query|update|batchUpdate)$"))
    filters:
    - taint.clean:sqli
  message: SQL text is concatenated with variables. Untrusted input in dynamic SQL is an injection vector; use PreparedStatement / bind parameters.
  ai_question: Can any concatenated value originate from user/untrusted input (not a constant or allow-listed identifier)?
  source:
    url: https://www.oracle.com/java/technologies/javase/seccodeguide.html
    doc: Secure Coding Guidelines for Java SE - INJECT-2
    doc_version: Secure Coding Guidelines for Java SE (current)
    retrieved: '2026-10-09'
    quote: 'Guideline 3-2 / INJECT-2: Avoid dynamic SQL'
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          ResultSet rs = stmt.executeQuery("SELECT * FROM users WHERE id = '" + id + "'");
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          PreparedStatement ps = con.prepareStatement("SELECT * FROM users WHERE id = ?"); ps.setString(1, id);
        }
      }
  tags:
  - security
  status: active
  rule_version: 2
