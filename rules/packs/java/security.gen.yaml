  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_invocation object: (identifier) @c name: (identifier) @m arguments: (argument_list) @args) @match (#eq? @c "Math") (#eq? @m "random") (#eq? @args "()"))
  message: Math.random() is not a cryptographically secure generator; it must not produce security-sensitive values.
  ai_question: Is the value used for a security-sensitive purpose (OTP, token, password, id that must be unguessable)?
