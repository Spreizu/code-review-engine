- id: JAVA-SEC-CMD-001
  title: Process command line built from variables
  language: java
  kind: security
  category: security
  severity: critical
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_invocation name: (identifier) @m arguments: (argument_list . (binary_expression operator: "+"))) @match (#eq? @m "exec"))
      ((object_creation_expression type: (type_identifier) @t arguments: (argument_list (binary_expression operator: "+"))) @match (#eq? @t "ProcessBuilder"))
    filters:
    - taint.clean:cmdi
  message: A process command line is assembled by concatenation. Untrusted data on the command line can inject options or shell commands.
  ai_question: 'Could the concatenated value be attacker-controlled? Answer yes at high confidence for either risk: shell injection (a shell such as sh -c / cmd /c parses the string) or argument injection (Runtime.exec(String) splits the string on whitespace, so a value can add extra arguments or options to the program even without a shell). Answer no only if every concatenated part is a constant, a number, or validated against an allow-list.'
  source:
    url: https://www.oracle.com/java/technologies/javase/seccodeguide.html
    doc: Secure Coding Guidelines for Java SE - INJECT-4
    doc_version: Secure Coding Guidelines for Java SE (current)
    retrieved: '2026-10-09'
    quote: 'Guideline 3-4 / INJECT-4: Avoid any untrusted data on the command line'
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          new ProcessBuilder("sh", "-c", "convert " + userFile).start();
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          new ProcessBuilder("convert", userFile.toString()).start();
        }
      }
    regressions:
    - note: 'OWASP Benchmark Java cmdi: concatenated value is constant on every path'
      code: |
        import javax.servlet.http.*;
        class C {
          void p(HttpServletRequest request) throws Exception {
            String param = request.getParameter("p");
            String bar = "safe!";
            Runtime.getRuntime().exec("echo " + bar);
          }
        }
  tags:
  - security
  status: active
  rule_version: 3
- id: JAVA-SEC-CONTENT-DISPOSITION-CONCAT
  title: Content-Disposition built by string concatenation
  language: java
  kind: security
  category: security
  severity: minor
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.java'
    query: |
      ((method_invocation name: (identifier) @n arguments: (argument_list . (string_literal) @h . (binary_expression) .)) @match (#match? @n "^(setHeader|addHeader|header)$") (#match? @h "(?i)^\"content-disposition\"$"))
    exclude_tests: true
  message: 'The download file name is concatenated into Content-Disposition as-is: quotes, semicolons or CR/LF in it break the header (header injection, a different file name or type). Build the header with a helper that quotes and encodes it (Spring ContentDisposition.attachment().filename(name, UTF_8)) or use filename*=UTF-8''''<percent-encoded>.'
  ai_question: Can the file name come from users or uploaded metadata?
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Disposition
    doc: Content-Disposition built by string concatenation
    doc_version: MDN (current)
    retrieved: '2026-10-09'
    quote: 'sition: attachment Content-Disposition: attachment; filename="file name.jpg" Content-Disposition: attachment; filename*=UTF-8''''file%20name.jpg The quotes around the file name are optional, but are necessary if you use special cha'
  examples:
    bad: |
      class D {
        void send(HttpServletResponse resp, String name) {
          resp.setHeader("Content-Disposition", "attachment; filename=" + name);
        }
      }
    good: |
      class D {
        void send(HttpServletResponse resp, String name) {
          resp.setHeader("Content-Disposition", ContentDisposition.attachment().filename(name, StandardCharsets.UTF_8).build().toString());
        }
      }
  cwe:
  - CWE-113
  asvs:
  - V5.4.2
  status: active
  rule_version: 1
  tags:
  - appsec
- id: JAVA-SEC-CORS-WILDCARD-001
