- id: JAVA-SEC-XXE-DOCUMENTBUILDER-001
  title: DocumentBuilderFactory used without restricting DTDs/external entities (XXE)
  language: java
  kind: security
  category: security
  severity: major
  applies_to:
    java: '>=8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_invocation object: (identifier) @c name: (identifier) @m) @match (#eq? @c "DocumentBuilderFactory") (#match? @m "^(new(Instance|DefaultInstance|Factory|DefaultFactory)|createXMLReader)$"))
    filters:
    - file.lacks_text:disallow-doctype-decl
    - file.lacks_text:SUPPORT_DTD
    - file.lacks_text:ACCESS_EXTERNAL_DTD
  message: DocumentBuilderFactory parsing untrusted XML must disable DTDs/external entities (or restrict ACCESS_EXTERNAL_DTD/SCHEMA), otherwise it is open to XXE.
  ai_question: Is the XML parsed from an untrusted source, and are DTDs/external entities left enabled for this factory?
  source:
    url: https://www.oracle.com/java/technologies/javase/seccodeguide.html
    doc: Secure Coding Guidelines for Java SE - INJECT-5
    doc_version: Secure Coding Guidelines for Java SE (current)
    retrieved: '2026-10-09'
    quote: XML External Entity (XXE) attacks insert local files into XML data which may then be accessible to the client.
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          var f = DocumentBuilderFactory.newInstance();
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          var f = DocumentBuilderFactory.newInstance(); f.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
        }
      }
  tags:
  - security
  status: active
  rule_version: 1
