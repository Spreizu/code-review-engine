    retrieved: '2026-10-09'
    quote: This method has plain memory effects but the method name implies volatile memory effects
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          counter.weakCompareAndSet(1, 2);
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          counter.weakCompareAndSetPlain(1, 2);
        }
      }
  tags:
  - jdk-deprecated
  status: active
  rule_version: 1
