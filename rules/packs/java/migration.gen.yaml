    doc_version: JDK 25 API (javadoc, current LTS; unchanged in 26/27)
    retrieved: '2026-10-09'
    quote: This class was only useful in conjunction with the Security Manager
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          String v = AccessController.doPrivileged((PrivilegedAction<String>) () -> System.getProperty("k"));
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          String v = System.getProperty("k");
        }
      }
  tags:
  - jdk-deprecated
