- id: PY-SIMP-LOOP-MAX
  title: Loop that is max()/min()
  language: python
  kind: modernization
  category: simplification
  severity: minor
  applies_to:
    python: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (for_statement left: (identifier) @x body: (block . (if_statement condition: (comparison_operator (identifier) @a) consequence: (block . (expression_statement (assignment right: (identifier) @v)) .) !alternative) .) (#eq? @x @v) (#eq? @a @x)) @match
  message: Use max(...) / min(...), with key= for a custom ordering.
  fix: Prefer the simplest code that works. When a shortcut is deliberate, add a `limit:` comment saying how far it holds (e.g. input size, request rate) and what to switch to beyond that.
  source:
    url: https://docs.python.org/3/library/functions.html
    doc: Loop that is max()/min()
    doc_version: Python 3.14
    retrieved: '2026-10-09'
    quote: key = None ) ¶ max ( iterable , / , * , default , key = None ) max ( arg1 , arg2 , / , * args , key = None ) Return the largest item in an iterable or the largest of two or more arguments.
  examples:
    bad: |
      def top(xs):
          m = xs[0]
          for x in xs:
              if x > m:
                  m = x
          return m
    good: |
      def top(xs):
          return max(xs)
  tags:
  - simplify
  - collapsible-loop
  - simplification
  status: active
  rule_version: 1
- id: PY-SIMP-LOOP-SUM
  title: Accumulator loop that is sum()
  language: python
  kind: modernization
  category: simplification
  severity: minor
  applies_to:
    python: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((expression_statement (assignment left: (identifier) @t right: (integer) @z)) . (for_statement body: (block . (expression_statement (augmented_assignment left: (identifier) @t2 operator: "+=")) .)) @match (#eq? @t @t2) (#eq? @z "0"))
  message: Use sum(...) with a generator expression.
  fix: Prefer the simplest code that works. When a shortcut is deliberate, add a `limit:` comment saying how far it holds (e.g. input size, request rate) and what to switch to beyond that.
  source:
    url: https://docs.python.org/3/library/functions.html
    doc: Accumulator loop that is sum()
    doc_version: Python 3.14
    retrieved: '2026-10-09'
    quote: For general information about strings, see Text Sequence Type — str . sum ( iterable , / , start = 0 ) ¶ Sums start and the items of an iterable from left to right and returns the total.
  examples:
    bad: |
      def total(items):
          t = 0
          for i in items:
              t += i.price
          return t
    good: |
      def total(items):
          return sum(i.price for i in items)
  tags:
  - simplify
  - collapsible-loop
  - simplification
  status: active
  rule_version: 1
