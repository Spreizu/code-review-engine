- id: PY-QUAL-ZIP-WITHOUT-STRICT
  title: zip() without strict=
  language: python
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    python: '>=3.10'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call function: (identifier) @f arguments: (argument_list (_) (_)) @args) @match (#eq? @f "zip") (#not-match? @args "strict\\s*="))
  message: zip silently truncates to the shortest input.
  ai_question: Must the iterables have equal length (truncation would be a bug)?
  source:
    url: https://docs.astral.sh/ruff/rules/zip-without-explicit-strict/
    doc: zip() without strict=
    doc_version: Ruff (2026)
    retrieved: '2026-10-09'
    quote: What it does Checks for zip calls without an explicit strict parameter when called with two or more iterables, or any starred argument.
  examples:
    bad: |
      for a, b in zip(xs, ys):
          pass
    good: |
      for a, b in zip(xs, ys, strict=True):
          pass
  status: active
  rule_version: 1
