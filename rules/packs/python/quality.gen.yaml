- id: PY-QUAL-OPEN-NO-ENCODING
  title: open() in text mode without encoding
  language: python
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    python: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call function: (identifier) @f arguments: (argument_list) @args) @match (#eq? @f "open") (#not-match? @args "encoding\\s*=|['\"][rwax+]*b[rwax+]*['\"]"))
    filters:
    - cap.lacks_re:args:\*|^\(\s*[^,()]+,\s*[^,()]+,\s*[^,()]+,\s*[^,()]+|mode\s*=\s*[A-Za-z_]|^\(\s*[^,()]+,\s*[A-Za-z_][\w.\[\]]*\s*[,)]
  message: The default is locale-dependent (PEP 597); Python 3.15 switches to UTF-8 mode by default. Be explicit.
  source:
    url: https://docs.astral.sh/ruff/rules/unspecified-encoding/
    doc: open() in text mode without encoding
    doc_version: Ruff (2026)
    retrieved: '2026-10-09'
    quote: What it does Checks for uses of open and related calls without an explicit encoding argument.
  examples:
    bad: |
      with open(path) as f:
          data = f.read()
    good: |
      with open(path, encoding="utf-8") as f:
          data = f.read()
    regressions:
    - note: encoding as the 4th positional argument
      code: |
        with open(path, "r", -1, "utf-8") as f:
            data = f.read()
    - note: arguments forwarded
      code: |
        def opener(*args, **kwargs):
            return open(*args, **kwargs)
    - note: mode decided at runtime
      code: |
        def load(path, mode):
            return open(path, mode=mode)
  status: active
  rule_version: 1
