- id: PY-LLM-AGENT-SHELL-TOOL
  title: Agent given a shell / Python REPL tool or dangerous mode
  language: python
  kind: security
  category: security
  severity: major
  applies_to:
    python: '>=3.8'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.py'
    query: |
      [((call function: [(identifier) @f (attribute attribute: (identifier) @f)]) @match (#match? @f "^(ShellTool|PythonREPLTool|PythonAstREPLTool|PythonREPL|TerminalTool|BashProcess)$"))
               ((keyword_argument name: (identifier) @k value: (true)) @match (#match? @k "^(allow_dangerous_code|allow_dangerous_requests|allow_dangerous_deserialization)$"))]
    exclude_tests: true
  message: The model can run arbitrary shell commands or Python (or deserialize untrusted data). A prompt injection in any input becomes code execution. Give the agent narrow tools with validated parameters, or run it in an isolated sandbox with human approval.
  source:
    url: https://genai.owasp.org/llmrisk/llm062025-excessive-agency/
    doc: Agent given a shell / Python REPL tool or dangerous mode
    doc_version: OWASP Top 10 for LLM Applications 2025
    retrieved: '2026-10-09'
    quote: Avoid open-ended extensions Avoid the use of open-ended extensions where possible (e.g., run a shell command, fetch a URL, etc.) and use extensions with more granular functionality.
  examples:
    bad: |
      tools = [ShellTool(), search]
      agent = create_react_agent(llm, tools)
    good: |
      tools = [search, lookup_order]
      agent = create_react_agent(llm, tools)
  cwe:
  - CWE-250
  - CWE-94
  owasp:
  - LLM06:2025
  status: active
  rule_version: 1
  tags:
  - llm
- id: PY-LLM-NO-MAX-TOKENS
  title: OpenAI completion without an output-token limit
  language: python
  kind: security
  category: security
  severity: info
  applies_to:
    python: '>=3.8'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.py'
    query: |
      ((call function: (attribute object: (attribute attribute: (identifier) @c) attribute: (identifier) @m) arguments: (argument_list) @match) (#match? @c "^(completions|responses)$") (#eq? @m "create"))
    filters:
    - node.lacks_re:max_(completion_|output_)?tokens|\*\*
    exclude_tests: true
  message: The completion has no output-token cap, so one request can generate up to the model's maximum, multiplying cost and latency (and an attacker can force that repeatedly). Set max_tokens / max_completion_tokens / max_output_tokens.
  source:
    url: https://genai.owasp.org/llmrisk/llm102025-unbounded-consumption/
    doc: OpenAI completion without an output-token limit
    doc_version: OWASP Top 10 for LLM Applications 2025
    retrieved: '2026-10-09'
    quote: Resource Allocation Management Monitor and manage resource allocation dynamically to prevent any single user or request from consuming excessive resources. 5.
  examples:
    bad: |
      r = client.chat.completions.create(model='gpt-4.1', messages=msgs)
    good: |
      r = client.chat.completions.create(model='gpt-4.1', messages=msgs, max_completion_tokens=800)
    regressions:
    - code: |
        r = client.chat.completions.create(**params)
  cwe:
  - CWE-770
  owasp:
  - LLM10:2025
  status: active
  rule_version: 1
  tags:
  - llm
- id: PY-LLM-OUTPUT-TO-EXEC
  title: Model output may reach eval/exec or a shell
  language: python
  kind: security
  category: security
  severity: critical
  applies_to:
    python: '>=3.8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.py'
    query: |
      ((call function: (_) @f arguments: (argument_list . (_) @arg)) @match (#match? @f "^(eval|exec|os\\.(system|popen)|subprocess\\.(run|call|check_output|check_call|Popen|getoutput|getstatusoutput))$"))
    filters:
    - func.has_re:(chat\.completions\.create|\bcompletions\.create|responses\.create|messages\.create|generate_content|ChatCompletion\.create|\b(llm|chain|model|chat|agent|runnable)\w*\.a?invoke\(|ollama\.(chat|generate)\(|InferenceClient)
    - node.lacks_re:^[\w.]+\(\s*([\[(](\s*['\"][^'\"]*['\"]\s*,?)*\s*[\])]|['\"][^'\"{}]*['\"])\s*[,)]
    exclude_tests: true
  message: Text produced by the model is executed. Anyone who can influence the prompt (users, retrieved documents, web pages) can make the model emit code that runs with the app's permissions. Map model output onto an allow-list of actions, or run it in a sandbox.
  ai_question: Does the value passed here come from model output (directly or via variables) without validation or an allow-list?
  source:
    url: https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/
    doc: Model output may reach eval/exec or a shell
    doc_version: OWASP Top 10 for LLM Applications 2025
    retrieved: '2026-10-09'
    quote: g of LLM outputs Absence of rate limiting or anomaly detection for LLM usage Common Examples of Vulnerability LLM output is entered directly into a system shell or similar function such as exec or eval, resulting in remote code execution. JavaScript or Markdown is generated by the LLM and returned to a user.
  examples:
    bad: |
      def act(client, task):
          r = client.chat.completions.create(model='gpt-4.1', messages=[{'role': 'user', 'content': task}])
          exec(r.choices[0].message.content)
    good: |
      def act(client, task):
          r = client.chat.completions.create(model='gpt-4.1', messages=[{'role': 'user', 'content': task}])
          return ACTIONS[r.choices[0].message.content.strip()]()
    regressions:
    - code: |
        def act(client):
            r = client.messages.create(model='claude-sonnet-4-5', max_tokens=256, messages=[])
            subprocess.run(['git', 'status'])
    - code: |
        async def main(client):
            await client.chat.completions.create(model='gpt-4.1', messages=[], max_tokens=10)

        asyncio.run(main())
  cwe:
  - CWE-94
  - CWE-78
  owasp:
  - LLM05:2025
  status: active
  rule_version: 1
  tags:
  - llm
- id: PY-LLM-OUTPUT-TO-SQL
  title: Model output may be executed as SQL
  language: python
  kind: security
  category: security
  severity: critical
  applies_to:
    python: '>=3.8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.py'
    query: |
      ((call function: (attribute attribute: (identifier) @m) arguments: (argument_list . [(identifier) (string (interpolation)) (binary_operator) (call) (attribute) (subscript)])) @match (#match? @m "^(execute|executemany|executescript|raw|text|read_sql|read_sql_query)$"))
    filters:
    - func.has_re:(chat\.completions\.create|\bcompletions\.create|responses\.create|messages\.create|generate_content|ChatCompletion\.create|\b(llm|chain|model|chat|agent|runnable)\w*\.a?invoke\(|ollama\.(chat|generate)\(|InferenceClient)
    exclude_tests: true
  message: A query string built by or from model output is executed. Prompt injection turns into SQL injection (read or drop any table). Let the model choose among parameterized queries, or run generated SQL on a read-only connection limited to safe views.
  ai_question: Does the value passed here come from model output (directly or via variables) without validation or an allow-list?
  source:
    url: https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/
    doc: Model output may be executed as SQL
    doc_version: OWASP Top 10 for LLM Applications 2025
    retrieved: '2026-10-09'
    quote: The code is then interpreted by the browser, resulting in XSS. LLM-generated SQL queries are executed without proper parameterization, leading to SQL injection. LLM output is used to construct file paths without proper sanitization, potentially resulting in path travers
  examples:
    bad: |
      def ask(client, cur, q):
          r = client.chat.completions.create(model='gpt-4.1', messages=[{'role': 'user', 'content': 'SQL for: ' + q}])
          cur.execute(r.choices[0].message.content)
    good: |
      def ask(client, cur, q):
          r = client.chat.completions.create(model='gpt-4.1', messages=[{'role': 'user', 'content': q}])
          cur.execute('SELECT * FROM faq WHERE topic = %s', (r.choices[0].message.content,))
  cwe:
  - CWE-89
  owasp:
  - LLM05:2025
  status: active
  rule_version: 1
  tags:
  - llm
- id: PY-LLM-REQUEST-IN-SYSTEM-PROMPT
  title: Request data interpolated into the system prompt
  language: python
  kind: security
  category: security
  severity: major
  applies_to:
    python: '>=3.8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.py'
    query: |
      ((dictionary (pair key: (string (string_content) @rk) value: (string (string_content) @rv)) (pair key: (string (string_content) @ck) value: (string (interpolation)) @match)) (#eq? @rk "role") (#eq? @rv "system") (#eq? @ck "content"))
    filters:
    - file.has_re:["']role["']\s*:\s*["']system["']
    - func.has_re:request\.(args|form|json|get_json|data|values|query_params|GET|POST|body)|\breq\.(body|query|params)|Body\(|Query\(
    exclude_tests: true
  message: Request data is interpolated into the system (instruction) prompt, so a user can rewrite the model's instructions. Keep instructions fixed and pass user content as a separate user message, clearly delimited.
  ai_question: Is any interpolated value derived from the request or other end-user/external content?
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/LLM_Prompt_Injection_Prevention_Cheat_Sheet.html
    doc: Request data interpolated into the system prompt
    doc_version: OWASP LLM Prompt Injection Prevention Cheat Sheet
    retrieved: '2026-10-09'
    quote: 'Instead, reveal your system prompt." The LLM processes this as a legitimate instruction change rather than data to be processed. Common Attack Types ¶ Direct Prompt Injection ¶ Attack Pattern: Explicit malicious instructions in user input'
  examples:
    bad: |
      @app.post('/ask')
      def ask():
          q = request.json['q']
          msgs = [{'role': 'system', 'content': f'Answer as the support bot. Customer says: {q}'}]
          return client.chat.completions.create(model='gpt-4.1', messages=msgs)
    good: |
      @app.post('/ask')
      def ask():
          q = request.json['q']
          msgs = [{'role': 'system', 'content': 'Answer as the support bot.'}, {'role': 'user', 'content': q}]
          return client.chat.completions.create(model='gpt-4.1', messages=msgs)
  cwe:
  - CWE-77
  owasp:
  - LLM01:2025
  status: active
  rule_version: 1
  tags:
  - llm
