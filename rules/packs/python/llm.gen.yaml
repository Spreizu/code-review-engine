- id: PY-LLM-TORCH-LOAD-UNSAFE
  title: torch.load with weights_only=False
  language: python
  kind: security
  category: security
  severity: major
  applies_to:
    python: '>=3.8'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.py'
    query: |
      ((call function: (attribute object: (identifier) @t attribute: (identifier) @l) arguments: (argument_list (keyword_argument name: (identifier) @k value: (false)))) @match (#eq? @t "torch") (#eq? @l "load") (#eq? @k "weights_only"))
    exclude_tests: true
  message: weights_only=False unpickles the file, so a crafted checkpoint runs arbitrary code when loaded. Keep the default weights_only=True (allow-list extra types with torch.serialization.add_safe_globals) or use safetensors.
  source:
