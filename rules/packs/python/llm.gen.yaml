    retrieved: '2026-10-09'
    quote: 'Re-running `torch.load` with `weights_only` set to `False` will likely succeed, " "but it can result in arbitrary code execution. Do it only if you got the file from a " "trusted source." ) if not IS_WINDOWS: from mmap import MAP_PRIVATE, MAP_SHARED else: MAP_SHARED, MAP_PRIVA'
  examples:
    bad: |
      state = torch.load(path, weights_only=False)
    good: |
      state = torch.load(path, weights_only=True)
