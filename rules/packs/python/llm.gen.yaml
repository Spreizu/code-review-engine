  tags:
  - llm
- id: PY-LLM-TRUST-REMOTE-CODE
  title: Model loaded with trust_remote_code=True
  language: python
  kind: security
  category: security
  severity: major
  applies_to:
    python: '>=3.8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.py'
    query: |
      ((keyword_argument name: (identifier) @k value: (true)) @match (#eq? @k "trust_remote_code"))
    exclude_tests: true
  message: Python files from the model repository are executed when the model loads. Whoever controls that repo (or a later commit) runs code in your process. Use built-in architectures, or pin revision= to an audited commit.
  ai_question: Is the repository id not a fixed, audited model pinned to a specific revision commit?
