- id: PY-MAINT-UNUSED-PRIVATE-METHOD
  title: Private function is never called
  language: python
  kind: best-practice
  category: maintainability
  severity: minor
  applies_to:
    python: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      (class_definition body: (block (function_definition name: (identifier) @name (#match? @name "^__[A-Za-z0-9_]*[A-Za-z0-9]_?$")) @match))
    filters:
    - file.count_lt:2:\b{cap:name}\b
  message: 'This private method is not referenced anywhere in the file: delete it, or call it where it was meant to be used.'
  ai_question: Is the private function unreferenced (no reflection, framework callback, or string reference)?
  source:
    url: https://docs.python.org/3/tutorial/classes.html
    doc: 'Python tutorial: Private Variables'
    doc_version: Python 3.14
    retrieved: '2026-10-09'
    quote: Multiple Inheritance 9.6. Private Variables 9.7.
  examples:
    bad: |
      class A:
          def f(self):
              return 1

          def __helper(self):
              return 2
    good: |
      class A:
          def f(self):
              return self.__helper()

          def __helper(self):
              return 2
    regressions:
    - code: |
        class A:
            def __init__(self):
                pass
  xref:
  - sonar:python:S1144
  status: active
  rule_version: 1
  tags:
  - maintainability
