- id: PY-MAINT-ALL-BRANCHES-SAME
  title: Every branch runs the same code
  language: python
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    python: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      [(if_statement) (match_statement)] @match
    filters:
    - branches.all_same
  message: 'All branches of this if/switch (including the else/default) do the same thing, so the condition has no effect: drop the condition or make the branches differ as intended.'
  source:
    url: https://docs.astral.sh/ruff/rules/if-with-same-arms/
    doc: ruff SIM114 (if-with-same-arms)
    doc_version: Python 3.14
    retrieved: '2026-10-09'
    quote: What it does Checks for if branches with identical arm bodies.
  examples:
    bad: |
      def f(a):
          if a == 1:
              save(1)
          else:
              save(1)
          return 0
    good: |
      def f(a):
          if a == 1:
              save(1)
          else:
              save(2)
          return 0
    regressions:
    - code: |
        def f(a):
            if a == 1:
                save(1)
            elif a == 2:
                save(1)
            return 0
  xref:
  - sonar:python:S3923
  status: active
  rule_version: 1
  tags:
  - maintainability
