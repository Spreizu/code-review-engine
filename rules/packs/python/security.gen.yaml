- id: PY-SEC-ACCESS-THEN-OPEN
  title: os.access() check before using the file (TOCTOU)
  language: python
  kind: security
  category: security
  severity: minor
  applies_to:
    python: '>=3.8'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.py'
    query: |
      ((if_statement condition: (call function: (attribute object: (identifier) @o attribute: (identifier) @a)) consequence: (block) @b) @match (#eq? @o "os") (#eq? @a "access"))
    filters:
    - node.has_re:\bopen\(|os\.(remove|unlink|rename|chmod|chown)\(
    exclude_tests: true
  message: The file can be swapped (e.g. for a symlink) between the access() check and the open, so the check protects nothing. Open the file directly and handle the error.
  source:
    url: https://docs.python.org/3/library/os.html
    doc: os.access() check before using the file (TOCTOU)
    doc_version: Python 3 docs
    retrieved: '2026-10-09'
    quote: Note Using access() to check if a user is authorized to e.g. open a file before actually doing so using open() creates a security hole, because the user might exploit the short time interval between checking and opening the file to manipulate i
  examples:
    bad: |
      if os.access(path, os.W_OK):
          with open(path, 'w') as f:
              f.write(data)
    good: |
      try:
          with open(path, 'w') as f:
              f.write(data)
      except PermissionError:
          log.warning('no write access to %s', path)
  cwe:
  - CWE-367
  asvs:
  - V15.4.2
  status: active
  rule_version: 1
  tags:
  - appsec
- id: PY-SEC-ARCHIVE-EXTRACT-NO-LIMIT
  title: Archive extracted without size or entry limits
  language: python
  kind: security
  category: security
  severity: minor
  applies_to:
    python: '>=3.8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.py'
    query: |
      ((call function: (attribute attribute: (identifier) @f)) @match (#eq? @f "extractall"))
    filters:
    - func.lacks_re:file_size|\.size\b|infolist|getmembers|namelist|MAX_|max_
    exclude_tests: true
  message: The whole archive is unpacked without checking total uncompressed size or entry count, so a small zip bomb can fill the disk or memory. Sum ZipInfo.file_size / TarInfo.size (and count entries) against a limit before extracting.
  ai_question: Can the archive come from users or another untrusted source?
  source:
    url: https://docs.python.org/3/library/zipfile.html
    doc: Archive extracted without size or entry limits
    doc_version: Python 3 docs
    retrieved: '2026-10-09'
    quote: es ZipFile objects Path objects PyZipFile objects ZipInfo objects Command-line interface Command-line options Decompression pitfalls From file itself File system limitations Resources limitations Interruption Default behaviors of extraction P
  examples:
    bad: |
      import zipfile

      def unpack(upload, dest):
          with zipfile.ZipFile(upload) as z:
              z.extractall(dest)
    good: |
      import zipfile

      def unpack(upload, dest):
          with zipfile.ZipFile(upload) as z:
              if sum(i.file_size for i in z.infolist()) > MAX_BYTES:
                  raise ValueError('archive too large')
              z.extractall(dest)
  cwe:
  - CWE-409
  asvs:
  - V5.2.3
  status: active
  rule_version: 1
  tags:
  - appsec
