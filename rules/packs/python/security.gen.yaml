    doc: CSV export of request-derived values
    doc_version: OWASP Cheat Sheet Series (current)
    retrieved: '2026-10-09'
    quote: 'Timo Goosen, Albinowax Contributor(s): kingthorin, Prasun Srivastav CSV Injection, also known as Formula Injection, occurs when websites embed untrusted input inside CSV files.'
  examples:
    bad: |
      import csv
      from flask import request

      def export(out):
          w = csv.writer(out)
          w.writerow([request.form['name'], request.form['comment']])
    good: |
      import csv

      def export(out, totals):
          w = csv.writer(out)
          w.writerow(['total', totals])
