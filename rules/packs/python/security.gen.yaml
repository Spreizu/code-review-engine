    - '**/*.py'
    query: |
      ((call function: (attribute object: (_) @o attribute: (identifier) @f) arguments: (argument_list) @args) @match (#match? @f "^(extractall|extract)$") (#match? @o "(?i)tar"))
    filters:
    - cap.lacks_re:args:\bfilter\s*=
    exclude_tests: true
  message: Without filter='data' the archive may create symlinks or hard links pointing outside the destination, absolute paths, device files and setuid bits, so a crafted tarball can overwrite files elsewhere. Pass filter='data' (Python 3.12+, backported to security releases).
