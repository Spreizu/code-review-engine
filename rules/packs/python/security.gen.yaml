- id: PY-SEC-CSV-FORMULA-INJECTION
  title: CSV export of request-derived values
  language: python
  kind: security
  category: security
  severity: minor
  applies_to:
    python: '>=3.8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.py'
    query: |
      ((call function: (attribute attribute: (identifier) @f) arguments: (argument_list . (_))) @match (#match? @f "^(writerow|writerows)$"))
    filters:
    - file.has_re:\bimport csv\b|\bfrom csv import\b
    - file.has_re:\b(request|flask|django|fastapi|starlette)\b
    exclude_tests: true
  message: Cells starting with =, +, -, @, tab or CR are run as formulas when the export is opened in a spreadsheet, so user-supplied text can execute formulas or exfiltrate data. Prefix such values with a single quote (and quote every field) before writing.
  ai_question: Do any of the written cell values come from users (form fields, names, comments) without neutralising a leading = + - @ tab or CR?
  source:
