- id: PY-SEC-HEADER-FROM-REQUEST
  title: Request value written into a response header
  language: python
  kind: security
  category: security
  severity: minor
  applies_to:
    python: '>=3.8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.py'
