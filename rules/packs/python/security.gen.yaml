    python: '>=3.8'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.py'
    query: |
      [((call function: (attribute object: (identifier) @o attribute: (identifier) @n) arguments: (argument_list . (string (string_content) @k))) @match (#match? @o "^(AES|DES3|ChaCha20|ChaCha20_Poly1305|Blowfish|Salsa20|hmac|algorithms)$") (#match? @n "^(new|AES|ChaCha20|TripleDES|Camellia)$") (#not-match? @k "(?i)^(changeme|xxx+|<.*>)$"))
               ((call function: (identifier) @f arguments: (argument_list . (string (string_content) @k))) @match (#match? @f "^(Fernet|AESGCM|ChaCha20Poly1305|AESCCM)$"))]
    exclude_tests: true
  message: The key is a literal in the source, so everyone with the code (or the binary) has it, and it cannot be rotated without a release. Load it from a secret store or the environment.
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    doc: Encryption/HMAC key is a string literal
    doc_version: OWASP Cheat Sheet Series (current)
    retrieved: '2026-10-09'
    quote: Many organizations have them hardcoded within the source code in plaintext, littered throughout configuration files and configuration management tools.
