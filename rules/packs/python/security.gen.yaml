- id: PY-SEC-TEMPLATE-FROM-STRING
  title: Template compiled from a non-constant string (SSTI)
  language: python
  kind: security
  category: security
  severity: critical
  applies_to:
    python: '>=3.8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.py'
    query: |
      ((call function: [(identifier) @f (attribute attribute: (identifier) @f)] arguments: (argument_list . [(identifier) (string (interpolation)) (binary_operator) (call) (attribute) (subscript)])) @match (#match? @f "^(render_template_string|from_string|Template)$"))
    filters:
    - file.has_re:jinja2|flask|mako|render_template_string|django\.template
    - file.lacks_re:from string import .*Template|string\.Template
    exclude_tests: true
  message: The template source is built from data. If any part comes from a user, template syntax in it runs on the server (SSTI, often remote code execution in Jinja2/Mako). Render a fixed template and pass values as variables.
  ai_question: Can any part of the template source come from request data or other untrusted input?
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Template_Injection_Prevention_Cheat_Sheet.html
    doc: Template compiled from a non-constant string (SSTI)
    doc_version: OWASP SSTI Prevention Cheat Sheet
    retrieved: '2026-10-09'
    quote: 'Prevention ¶ Treat templates as code ¶ Keep templates with the application source, review changes to them like code, and never build them from untrusted data. Do not let untrusted data choose a template name, path, or include target either: map the user''s choice to a'
  examples:
    bad: |
      @app.route('/hello')
      def hello():
          name = request.args.get('name', '')
          return render_template_string('<h1>Hello ' + name + '</h1>')
    good: |
      @app.route('/hello')
      def hello():
          name = request.args.get('name', '')
          return render_template_string('<h1>Hello {{ name }}</h1>', name=name)
