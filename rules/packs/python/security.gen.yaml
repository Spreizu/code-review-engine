  - appsec
- id: PY-SEC-TIMING-COMPARE
  title: Secret compared with == instead of hmac.compare_digest
  language: python
  kind: security
  category: security
  severity: minor
  applies_to:
    python: '>=3.8'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.py'
    query: |
      [((comparison_operator . [(identifier) (attribute)] @l . [(identifier) (attribute)] @r .) @match (#match? @match "^\\S+\\s*[!=]=\\s*\\S+$") (#match? @l "(?i)(signature|hmac|digest|secret|api_?key|(api|access|auth|csrf|xsrf|reset|session|bearer|refresh|expected|stored|provided|given|user|verify|verification|webhook)_?token)$") (#not-match? @r "^(null|nil|None|undefined|NaN|true|false)$"))
               ((comparison_operator . [(identifier) (attribute)] @l2 . [(identifier) (attribute)] @r2 .) @match (#match? @match "^\\S+\\s*[!=]=\\s*\\S+$") (#match? @r2 "(?i)(signature|hmac|digest|secret|api_?key|(api|access|auth|csrf|xsrf|reset|session|bearer|refresh|expected|stored|provided|given|user|verify|verification|webhook)_?token)$") (#not-match? @l2 "^(null|nil|None|undefined|NaN|true|false)$"))]
    filters:
    - file.lacks_re:compare_digest|secrets\.compare
    exclude_tests: true
  message: A secret (token, signature, HMAC) is compared with an ordinary equality operator, which returns as soon as a byte differs; the response time leaks how much of a guess was right. Use a constant-time comparison.
  ai_question: Is one side a secret (HMAC, signature, API token, password hash) and the other an attacker-supplied value, e.g. from a request?
  source:
    url: https://docs.python.org/3/library/hmac.html
    doc: Secret compared with == instead of hmac.compare_digest
    doc_version: Python 3 docs
    retrieved: '2026-10-09'
    quote: This function uses an approach designed to prevent timing analysis by avoiding content-based short circuiting behaviour, making it appropriate for cryptography.
  examples:
    bad: |
      def check(sig, body):
          expected_signature = sign(body)
          return sig == expected_signature
    good: |
      import hmac

      def check(sig, body):
          expected_signature = sign(body)
          return hmac.compare_digest(sig, expected_signature)
    regressions:
    - code: |
        if token is None:
            pass
    - code: |
        if token_type == 'bearer':
            pass
    - code: |
        if token.type == tokenize.NAME:
            pass
  cwe:
  - CWE-208
  asvs:
  - V11.2.4
  status: active
  rule_version: 1
  tags:
  - appsec
