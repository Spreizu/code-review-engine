  rule_version: 1
- id: CSS-QUAL-UNKNOWN-TYPE-SELECTOR
  title: Unknown type selector
  language: css
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (tag_name) @match
    filters:
    - css.unknown_type
  message: 'Not an HTML, SVG or MathML element name, so this type selector never matches: use a real tag, a class, or a custom element (with a hyphen).'
  source:
    url: https://www.w3.org/TR/selectors-4/
    doc: Selectors Level 4
    doc_version: CSS (W3C TR, 2026)
    retrieved: '2026-10-09'
    quote: A type selector is the name of a document language element type, and it represents an instance of that element type in the document tree.
  examples:
    bad: |
      foo {
        color: red;
      }
    good: |
      div {
        color: red;
      }
      my-widget {
        color: red;
      }
  xref:
  - stylelint:selector-type-no-unknown
  - sonar:css:S4670
  status: active
  rule_version: 1
- id: CSS-QUAL-UNKNOWN-UNIT
  title: Unknown unit
  language: css
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((integer_value (unit) @match) (#not-match? @match "^(?i)(px|cm|mm|q|in|pt|pc|em|rem|ex|rex|cap|rcap|ch|rch|ic|ric|lh|rlh|vw|vh|vi|vb|vmin|vmax|svw|svh|svi|svb|svmin|svmax|lvw|lvh|lvi|lvb|lvmin|lvmax|dvw|dvh|dvi|dvb|dvmin|dvmax|cqw|cqh|cqi|cqb|cqmin|cqmax|deg|grad|rad|turn|s|ms|hz|khz|dpi|dpcm|dppx|x|fr|%)$"))
      ((float_value (unit) @match) (#not-match? @match "^(?i)(px|cm|mm|q|in|pt|pc|em|rem|ex|rex|cap|rcap|ch|rch|ic|ric|lh|rlh|vw|vh|vi|vb|vmin|vmax|svw|svh|svi|svb|svmin|svmax|lvw|lvh|lvi|lvb|lvmin|lvmax|dvw|dvh|dvi|dvb|dvmin|dvmax|cqw|cqh|cqi|cqb|cqmin|cqmax|deg|grad|rad|turn|s|ms|hz|khz|dpi|dpcm|dppx|x|fr|%)$"))
    filters:
