- id: CSS-QUAL-UNMATCHABLE-NTH
  title: An+B selector that never matches
  language: css
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((pseudo_class_selector (class_name) @n (arguments (integer_value) @v)) @match (#match? @n "^(?i)nth-(last-)?(child|of-type)$") (#eq? @v "0"))
      ((pseudo_class_selector (class_name) @n (arguments (plain_value) @v)) @match (#match? @n "^(?i)nth-(last-)?(child|of-type)$") (#match? @v "^(?i)0n$"))
  message: ':nth-child(0) and :nth-child(0n) never match (elements are counted from 1): use 1, odd/even, or An+B with a positive B.'
  source:
    url: https://www.w3.org/TR/selectors-4/#the-nth-child-pseudo
    doc: Selectors Level 4
    doc_version: CSS (W3C TR, 2026)
    retrieved: '2026-10-09'
    quote: The :nth-child(An+B) pseudo-class notation represents elements that have An+B-1 siblings before them in the document tree.
  examples:
    bad: |
      li:nth-child(0) {
        color: red;
      }
    good: |
      li:nth-child(2n) {
        color: red;
      }

      li:nth-child(1) {
        color: red;
      }
  xref:
  - stylelint:selector-anb-no-unmatchable
  - sonar:css:S8774
  status: active
  rule_version: 1
- id: CSS-QUAL-UNNEEDED-VENDOR-PREFIX
  title: Vendor prefix on a property every current browser supports unprefixed
  language: css
  kind: best-practice
  category: maintainability
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((declaration (property_name) @match) (#match? @match "^-(webkit|moz|ms|o)-(border-radius|box-shadow|box-sizing|transition(-[a-z-]+)?|transform(-origin|-style)?|animation(-[a-z-]+)?|border-image|opacity|flex(-grow|-shrink|-basis|-direction|-wrap|-flow)?|justify-content|align-items|align-self|align-content|order|column-count|column-gap|column-width|columns|perspective|backface-visibility)$"))
  message: 'Every supported browser understands the unprefixed property: drop the prefixed copy (let a build-time prefixer add what an old target needs).'
  source:
    url: https://developer.mozilla.org/en-US/docs/Glossary/Vendor_Prefix
    doc: 'MDN glossary: Vendor prefix'
    doc_version: CSS (W3C TR, 2026)
    retrieved: '2026-10-09'
    quote: 'Vendor prefix - Glossary | MDN Skip to main content Skip to search MDN HTML HTML: Markup language HTML reference Elements G'
  examples:
    bad: |
      .card {
        -webkit-border-radius: 4px;
        border-radius: 4px;
      }
    good: |
      .card {
        border-radius: 4px;
        -webkit-background-clip: text;
        -webkit-user-select: none;
      }
  tags:
