    url: https://www.w3.org/TR/selectors-4/
    doc: Selectors Level 4
    doc_version: CSS (W3C TR, 2026)
    retrieved: '2026-10-09'
    quote: do-elements 3.6.5 Internal Structure 3.7 Characters and case sensitivity 3.8 Declaring Namespace Prefixes 3.9 Invalid Selectors and Error Handling 3.10 Legacy Aliases 4 Logical Combinations 4.1 Selector Lists 4.2 The Matches-Any Pseudo-
  examples:
    bad: |
      .card::befor {
        content: "";
      }

      .link:hovr {
        color: red;
      }
    good: |
      .card::before {
        content: "";
      }

      .link:hover,
      .link:focus-visible {
        color: red;
      }

      :deep(.x) {
        color: red;
      }

      input::-webkit-input-placeholder {
        color: gray;
      }
  xref:
