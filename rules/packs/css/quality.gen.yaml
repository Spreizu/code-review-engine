- id: CSS-QUAL-CALC-UNSPACED-OPERATOR
  title: calc() with + or - not surrounded by spaces
  language: css
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression (function_name) @f) @match (#match? @f "^(?i)(calc|min|max|clamp)$"))
    filters:
    - node.has_re:(\d|%|\))(\+|-)(\d|\.\d|\()|(\d[a-zA-Z%]+|\))\+[\w(.]
    - node.lacks_re:\[|var\(--[\w-]+\s*,
  message: Without spaces around + and - the expression is invalid ("100%-2rem" reads as one token) and the declaration is dropped.
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/calc
    doc: 'MDN: calc()'
    doc_version: CSS (W3C TR, 2026)
    retrieved: '2026-10-09'
    quote: The * and / operators do not require whitespace, but adding it for consistency is recommended.
  examples:
    bad: |
      .card {
        width: calc(100%-2rem);
      }
    good: |
      .card {
        width: calc(100% - 2rem);
        margin: calc(-1 * 1rem);
        height: calc(var(--h)*2);
      }
  xref:
  - stylelint:function-calc-no-unspaced-operator
  - sonar:css:S4650
  status: active
  rule_version: 1
