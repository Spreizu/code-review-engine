- id: CSS-A11Y-FOCUS-OUTLINE-REMOVED
  title: Focus outline removed without a replacement style
  language: css
  kind: best-practice
  category: accessibility
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((rule_set (selectors) @s (block) @b) @match (#match? @s ":focus([^-a-zA-Z]|$)"))
    filters:
    - cap.has_re:b:(?i)(^|[;{\s])outline(-style)?\s*:\s*(none|0(px)?)\s*(!important\s*)?(;|\}|$)|outline-color\s*:\s*transparent|outline-width\s*:\s*0(px)?\s*(;|\}|$)
    - cap.lacks_re:b:(?i)(box-shadow|(^|[;{\s])color|border(-[a-z-]+)?|background(-color)?|text-decoration(-[a-z-]+)?|text-underline-offset|filter|transform)\s*:|outline\s*:\s*(auto|thin|medium|thick|[1-9]|\.\d|0?\.\d*[1-9])|outline-style\s*:\s*(solid|dotted|dashed|double|groove|ridge|inset|outset|auto)
    - cap.lacks_re:s::not\(\s*:focus-visible\s*\)
    - file.lacks_re::focus-visible
  message: 'This removes the keyboard focus indicator and nothing replaces it, so keyboard users cannot see where they are: keep an outline or add another visible focus style.'
  source:
    url: https://www.w3.org/WAI/WCAG22/Techniques/failures/F78
    doc: 'WCAG failure F78: removing the visual focus indicator'
    doc_version: WCAG 2.2
    retrieved: '2026-10-09'
    quote: Failure of Success Criterion 1.4.11, 2.4.7 and 2.4.13 due to styling element outlines and borders in a way that removes or renders non-visible the visual focus indicator | WAI | W3C Skip to cont
  examples:
    bad: |
      a:focus {
        outline: none;
      }
    good: |
      a:focus {
        outline: none;
        box-shadow: 0 0 0 3px #1a73e8;
      }

      button:focus:not(:focus-visible) {
        outline: none;
      }
    regressions:
    - code: |
        a:focus {
          outline: none;
        }

        a:focus-visible {
          outline: 2px solid #1a73e8;
        }
      note: :focus-visible restores the ring for keyboard users
  xref:
  - axe:focus-order-semantics
  - stylelint:a11y/no-outline-none
  wcag:
  - 2.4.7
  status: active
  rule_version: 1
  tags:
  - accessibility
