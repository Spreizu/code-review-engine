- id: CSS-A11Y-TEXT-JUSTIFIED
  title: Justified text
  language: css
  kind: best-practice
  category: accessibility
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((declaration (property_name) @p (plain_value) @v) @match (#match? @p "^(?i)text-align$") (#match? @v "^(?i)justify$"))
  message: 'Justified text creates uneven word gaps ("rivers") that make reading hard for people with dyslexia: align to the start edge.'
  source:
    url: https://www.w3.org/WAI/WCAG22/Understanding/visual-presentation.html
    doc: Understanding SC 1.4.8 Visual Presentation
    doc_version: WCAG 2.2
    retrieved: '2026-10-09'
    quote: Width is no more than 80 characters or glyphs (40 if CJK). Text is not justified (aligned to both the left and the right margins).
  examples:
    bad: |
      article p {
        text-align: justify;
      }
    good: |
      article p {
        text-align: start;
      }
  wcag:
  - 1.4.8
  status: active
  rule_version: 1
  tags:
  - accessibility
