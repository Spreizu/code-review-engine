    - cap.lacks_re:b:(?i)(box-shadow|(^|[;{\s])color|border(-[a-z-]+)?|background(-color)?|text-decoration(-[a-z-]+)?|text-underline-offset|filter|transform)\s*:|outline\s*:\s*(auto|thin|medium|thick|[1-9]|\.\d|0?\.\d*[1-9])|outline-style\s*:\s*(solid|dotted|dashed|double|groove|ridge|inset|outset|auto)
