- id: SB-MIG-BOOT3-BATCH-ENABLE-001
  title: '@EnableBatchProcessing disables Spring Boot''s batch auto-configuration'
  language: java
  framework: spring-boot
  kind: migration
  category: migration
  severity: major
  applies_to:
    spring-boot: '>=3.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((marker_annotation name: (identifier) @an) @match (#eq? @an "EnableBatchProcessing"))
  message: Since 3.0 @EnableBatchProcessing tells Boot's batch auto-configuration to back off; remove it unless you configure Batch yourself.
  ai_question: Does the application expect Spring Boot's batch auto-configuration (job launching at startup, schema init)?
  source:
    url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
    doc: Spring Boot 3.0 Migration Guide - @EnableBatchProcessing is now discouraged
    doc_version: Spring Boot 3.0
    retrieved: '2026-10-09'
    quote: It is no longer required and should be removed from applications that want to use Boot's auto-configuration.
  examples:
    bad: |
      @Configuration
      @EnableBatchProcessing
      class BatchCfg {}
    good: |
      @Configuration
      class BatchCfg {}
  status: active
  rule_version: 1
- id: SB-MIG-BOOT3-EMBEDDED-MONGO-001
  title: Flapdoodle embedded MongoDB auto-configuration was removed in Spring Boot 3
  language: manifest
  framework: spring-boot
  kind: removal
  category: build
  severity: major
  applies_to:
    spring-boot: '>=3.0'
  detection:
