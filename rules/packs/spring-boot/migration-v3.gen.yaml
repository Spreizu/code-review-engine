  status: active
  rule_version: 1
- id: SB-MIG-BOOT3-HTTPTRACE-001
  title: HttpTraceRepository was renamed to HttpExchangeRepository (httpexchanges endpoint)
  language: java
  framework: spring-boot
  kind: removal
  category: migration
  severity: critical
  applies_to:
    spring-boot: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((import_declaration) @match (#match? @match "org\\.springframework\\.boot\\.actuate\\.trace\\.http"))
  message: The httptrace endpoint and its infrastructure were renamed to httpexchanges in 3.0.
  source:
    url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
    doc: Spring Boot 3.0 Migration Guide - 'httptrace' Endpoint Renamed to 'httpexchanges'
    doc_version: Spring Boot 3.0
    retrieved: '2026-10-09'
    quote: For example, HttpTraceRepository is now named HttpExchangeRepository and can be found in the org.springframework.boot.actuate.web.exchanges package.
  examples:
    bad: |
      import org.springframework.boot.actuate.trace.http.HttpTraceRepository;
      class A {}
    good: |
      import org.springframework.boot.actuate.web.exchanges.HttpExchangeRepository;
      class A {}
  status: active
  rule_version: 1
