  message: Use Testcontainers or Flapdoodle's own Spring integration (Spring Boot 3.0).
  source:
    url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
    doc: Spring Boot 3.0 Migration Guide - Embedded MongoDB
    doc_version: Spring Boot 3.0
    retrieved: '2026-10-09'
    quote: Auto-configuration and dependency management for Flapdoodle embedded MongoDB has been removed.
  examples:
