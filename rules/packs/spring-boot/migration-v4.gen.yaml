    spring-boot: '>=4.0'
  detection:
    mode: deterministic
    engine: manifest
    manifest:
      check: has_dependency
      value: org.springframework.boot:spring-boot-starter-batch
  message: In 4.0 spring-boot-starter-batch runs Spring Batch in-memory; use spring-boot-starter-batch-jdbc to keep job metadata in your database.
  source:
    url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
    doc: Spring Boot 4.0 Migration Guide - Spring Batch
    doc_version: Spring Boot 4.0
    retrieved: '2026-10-09'
    quote: To go back to using a database, you need to change to spring-boot-starter-batch-jdbc .
  examples:
    bad: <project><dependencies><dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-batch</artifactId></dependency></dependencies></project>
    good: <project><dependencies><dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-batch-jdbc</artifactId></dependency></dependencies></project>
  status: active
  rule_version: 1
