- id: SB-MIG-BOOT4-MOCKITO-LISTENER-001
  title: '@Mock/@Captor fields in Spring tests need MockitoExtension in Spring Boot 4'
  language: java
  framework: spring-boot
  kind: migration
  category: testing
  severity: major
  applies_to:
    spring-boot: '>=4.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((field_declaration (modifiers (marker_annotation name: (identifier) @an))) @match (#match? @an "^(Mock|Captor|Spy|InjectMocks)$"))
    filters:
    - file.has_text:SpringBootTest
    - file.lacks_text:MockitoExtension
  message: MockitoTestExecutionListener was removed in 4.0; @Mock/@Captor fields are no longer initialised unless MockitoExtension is used.
  source:
    url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
    doc: Spring Boot 4.0 Migration Guide - Mockito Captor and Mock Annotations
    doc_version: Spring Boot 4.0
    retrieved: '2026-10-09'
    quote: If you find your @Mock or @Captor annotated fields aren't working as expected, you should use MockitoExtension from Mockito itself.
  examples:
    bad: |
      @SpringBootTest
      class T {
        @Mock Repo repo;
      }
    good: |
      @SpringBootTest
      @ExtendWith(MockitoExtension.class)
      class T {
        @Mock Repo repo;
      }
  status: active
  rule_version: 1
