- id: SB-QUAL-TX-SWALLOW-001
  title: Exception swallowed inside @Transactional method prevents rollback
  language: java
  framework: spring-boot
  kind: anti-pattern
  category: transactions
  severity: major
  applies_to:
    spring-boot: '>=2.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_declaration (modifiers (_ name: (identifier) @an)) body: (block (try_statement (catch_clause body: (block) @cb)))) @match (#eq? @an "Transactional") (#not-match? @cb "throw|setRollbackOnly"))
  message: The exception is caught and not rethrown inside a @Transactional method, so the transaction infrastructure never sees it and commits.
  ai_question: Does the catch block swallow an exception that should roll back the transaction (no rethrow, no setRollbackOnly)?
  source:
    url: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/rolling-back.html
    doc: Rolling Back a Declarative Transaction
    doc_version: Spring Framework 7.0 reference (current)
    retrieved: '2026-10-09'
    quote: The recommended way to indicate to the Spring Framework’s transaction infrastructure that a transaction’s work is to be rolled back is to throw an Exception from code that is currently executing in the context of a transaction.
  examples:
    bad: |
      class S {
        @Transactional
        public void save() {
          try { repo.save(a); repo.save(b); } catch (RuntimeException e) { log.warn("fail", e); }
        }
      }
    good: |
      class S {
        @Transactional
        public void save() {
          try { repo.save(a); repo.save(b); } catch (RuntimeException e) { log.warn("fail", e); throw e; }
        }
      }
  status: active
  rule_version: 1
