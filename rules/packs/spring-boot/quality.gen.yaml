- id: SB-QUAL-CFG-DDL-AUTO-001
  title: Hibernate ddl-auto modifies the schema at startup
  language: properties
  framework: spring-boot
  kind: anti-pattern
  category: data
  severity: major
  applies_to:
    spring-boot: '>=2.0'
  detection:
    mode: ai-confirm
    engine: config
    files:
    - '**/application*.properties'
    - '**/application*.yml'
    - '**/application*.yaml'
    - '**/bootstrap*.properties'
    - '**/bootstrap*.yml'
    - '**/bootstrap*.yaml'
