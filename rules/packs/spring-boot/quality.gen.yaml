- id: SB-QUAL-ASYNC-PRIVATE-001
  title: '@Async on a private method has no effect'
  language: java
  framework: spring-boot
  kind: anti-pattern
  category: async
  severity: major
  applies_to:
    spring-boot: '>=2.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((method_declaration (modifiers (_ name: (identifier) @an)) @mods) @match (#eq? @an "Async") (#match? @mods "(^|\\s)private(\\s|$)"))
  message: Proxies cannot intercept private methods, so @Async on a private method is ignored.
  source:
    url: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
    doc: Task Execution and Scheduling - @Async
    doc_version: Spring Framework 7.0 reference (current)
    retrieved: '2026-10-09'
    quote: Local calls within the same class cannot get intercepted that way.
  examples:
    bad: |
      class J {
        @Async
        private void run() {}
      }
    good: |
      class J {
        @Async
        public void run() {}
      }
  status: active
  rule_version: 1
- id: SB-QUAL-ASYNC-RETURN-001
  title: '@Async method returns a plain value (result is lost)'
  language: java
  framework: spring-boot
  kind: anti-pattern
  category: async
  severity: major
  applies_to:
    spring-boot: '>=2.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((method_declaration (modifiers (_ name: (identifier) @an)) type: [(type_identifier) (generic_type (type_identifier) @gt) (integral_type) (boolean_type) (floating_point_type)] @rt) @match (#eq? @an "Async") (#not-match? @rt "^(Future|CompletableFuture|ListenableFuture|CompletionStage|Mono|Flux)"))
  message: An @Async method must return void or a Future/CompletableFuture; a plain return value is not delivered to the caller (it gets null).
  source:
    url: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
    doc: Task Execution and Scheduling - @Async
    doc_version: Spring Framework 7.0 reference (current)
    retrieved: '2026-10-09'
    quote: '@Async methods may not only declare a regular java.util.concurrent.Future return type but also java.util.concurrent.CompletableFuture'
  examples:
    bad: |
      class J {
        @Async
        public String compute() { return "x"; }
      }
    good: |
      class J {
        @Async
        public CompletableFuture<String> compute() { return CompletableFuture.completedFuture("x"); }
      }
  status: active
  rule_version: 1
