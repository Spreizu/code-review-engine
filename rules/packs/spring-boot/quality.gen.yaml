- id: SB-QUAL-TX-CHECKED-001
  title: '@Transactional does not roll back on checked exceptions by default'
  language: java
  framework: spring-boot
  kind: anti-pattern
  category: transactions
  severity: major
  applies_to:
    spring-boot: '>=2.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_declaration (modifiers (_ name: (identifier) @an)) (throws) @thr) @match (#eq? @an "Transactional") (#not-match? @match "rollbackFor|rollbackOn") (#match? @thr "Exception"))
  message: The method is @Transactional and declares checked exceptions; by default the transaction commits when a checked exception is thrown. Add rollbackFor if it must roll back.
  ai_question: Can this method throw a checked exception after it has written data that must be rolled back? (RuntimeException subclasses are fine.)
  source:
    url: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/rolling-back.html
    doc: Rolling Back a Declarative Transaction
    doc_version: Spring Framework 7.0 reference (current)
    retrieved: '2026-10-09'
    quote: marks a transaction for rollback only in the case of runtime, unchecked exceptions
  examples:
    bad: |
      class S {
        @Transactional
        public void transfer() throws IOException { debit(); credit(); }
      }
    good: |
      class S {
        @Transactional(rollbackFor = IOException.class)
        public void transfer() throws IOException { debit(); credit(); }
      }
  status: active
  rule_version: 1
