- id: SB-QUAL-ASYNC-VOID-EXC-001
  title: '@Async void method: exceptions are not propagated'
  language: java
  framework: spring-boot
  kind: best-practice
  category: async
  severity: minor
  applies_to:
    spring-boot: '>=2.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_declaration (modifiers (_ name: (identifier) @an)) type: (void_type)) @match (#eq? @an "Async"))
    filters:
    - file.lacks_text:AsyncUncaughtExceptionHandler
  message: Exceptions thrown by @Async void methods are not visible to callers; configure an AsyncUncaughtExceptionHandler or return CompletableFuture.
  ai_question: Can this @Async void method throw, and is there no AsyncUncaughtExceptionHandler configured anywhere in the project?
  source:
    url: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
    doc: Task Execution and Scheduling - Exception Management with @Async
    doc_version: Spring Framework 7.0 reference (current)
    retrieved: '2026-10-09'
    quote: With a void return type, however, the exception is uncaught and cannot be transmitted.
  examples:
    bad: |
      class J {
        @Async
        public void sync() { remote.call(); }
      }
    good: |
      class J implements AsyncConfigurer {
        public AsyncUncaughtExceptionHandler getAsyncUncaughtExceptionHandler() { return handler; }
      }
  status: active
  rule_version: 1
