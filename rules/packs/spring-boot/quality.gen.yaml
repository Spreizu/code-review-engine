      key: spring.jpa.hibernate.ddl-auto
      op: in
      value:
      - create
      - create-drop
      - update
      case_insensitive: true
  message: Schema generation (create/create-drop/update) at startup can drop or alter production tables; use a migration tool (Flyway/Liquibase) and ddl-auto=validate/none outside dev.
  ai_question: Is this configuration used for a persistent (non-throwaway, non-test) database?
