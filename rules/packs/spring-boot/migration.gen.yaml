- id: SB-MIG-NULL-SPRING-LANG-001
  title: org.springframework.lang null-safety annotations are superseded by JSpecify (Spring Framework 7)
  language: java
  framework: spring-boot
  kind: deprecation
  category: null-handling
  severity: minor
  applies_to:
    spring-framework: '>=7.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((import_declaration) @match (#match? @match "org\\.springframework\\.lang\\.(Nullable|NonNull|NonNullApi|NonNullFields)"))
  message: Spring Framework 7 uses JSpecify (@NullMarked, @Nullable); migrate from org.springframework.lang.* annotations (Spring Boot 4 actuator no longer honours them).
  source:
    url: https://docs.spring.io/spring-framework/reference/core/null-safety.html
    doc: Null-safety
    doc_version: Spring Framework 7.0 reference (current)
    retrieved: '2026-10-09'
    quote: the Spring Framework codebase is annotated with JSpecify annotations
  examples:
    bad: |
      import org.springframework.lang.Nullable;
      class A {}
    good: |
      import org.jspecify.annotations.Nullable;
      class A {}
  status: active
  rule_version: 1
- id: SB-MIG-SEC-ANTMATCHERS-001
  title: antMatchers/mvcMatchers/regexMatchers were removed in Spring Security 6
  language: java
  framework: spring-boot
  kind: removal
  category: security
  severity: critical
  applies_to:
    spring-security: '>=6.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((method_invocation name: (identifier) @m) @match (#match? @m "^(antMatchers|mvcMatchers|regexMatchers|antMatcher|mvcMatcher|regexMatcher)$"))
  message: antMatchers/mvcMatchers/regexMatchers do not exist in Spring Security 6+; use requestMatchers(...).
  source:
    url: https://docs.spring.io/spring-security/reference/servlet/authorization/authorize-http-requests.html
    doc: Authorize HttpServletRequests
    doc_version: Spring Security 7.0 reference (current)
    retrieved: '2026-10-09'
    quote: requestMatchers
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          http.authorizeHttpRequests(a -> a.antMatchers("/admin/**").hasRole("ADMIN"));
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          http.authorizeHttpRequests(a -> a.requestMatchers("/admin/**").hasRole("ADMIN"));
        }
      }
  status: active
  rule_version: 1
- id: SB-MIG-SEC-GLOBAL-METHOD-001
  title: '@EnableGlobalMethodSecurity is superseded by @EnableMethodSecurity'
  language: java
  framework: spring-boot
  kind: deprecation
  category: security
  severity: minor
  applies_to:
    spring-security: '>=5.6'
  overrides:
  - when:
      spring-security: '>=7.0'
    severity: critical
    message: '@EnableGlobalMethodSecurity is not available in Spring Security 7; use @EnableMethodSecurity.'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ([(marker_annotation name: (identifier) @an) (annotation name: (identifier) @an)] @match (#eq? @an "EnableGlobalMethodSecurity"))
  message: Use @EnableMethodSecurity (AuthorizationManager based, pre/post enabled by default) instead of @EnableGlobalMethodSecurity.
  source:
    url: https://docs.spring.io/spring-security/reference/servlet/authorization/method-security.html
    doc: Method Security
    doc_version: Spring Security 7.0 reference (current)
    retrieved: '2026-10-09'
    quote: This annotation and XML element supercede @EnableGlobalMethodSecurity and <sec:global-method-security/> , respectively.
  examples:
    bad: |
      @EnableGlobalMethodSecurity(prePostEnabled = true)
      class SecCfg {}
    good: |
      @EnableMethodSecurity
      class SecCfg {}
