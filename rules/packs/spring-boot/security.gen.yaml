rules:
- id: SB-SEC-CFG-CONFIGPROPS-VALUES-001
  title: Actuator configprops values shown unsanitized
  language: properties
  framework: spring-boot
  kind: security
  category: security
  severity: major
  applies_to:
    spring-boot: '>=3.0'
  detection:
    mode: deterministic
    engine: config
    files:
    - '**/application*.properties'
    - '**/application*.yml'
    - '**/application*.yaml'
    - '**/bootstrap*.properties'
    - '**/bootstrap*.yml'
    - '**/bootstrap*.yaml'
    config:
      key: management.endpoint.configprops.show-values
      op: equals
      value: always
      case_insensitive: true
  message: show-values=always prints bound configuration values including secrets.
  source:
    url: https://docs.spring.io/spring-boot/reference/actuator/endpoints.html
    doc: Actuator Endpoints - Sanitize Sensitive Values
    doc_version: Spring Boot reference (current 4.x)
    retrieved: '2026-10-09'
    quote: The show-values property can be configured for sanitizable endpoints to one of the following values
  examples:
    bad: management.endpoint.configprops.show-values=always
    good: management.endpoint.configprops.show-values=when-authorized
  status: active
  rule_version: 1
- id: SB-SEC-CFG-H2-CONSOLE-001
  title: H2 console enabled
  language: properties
  framework: spring-boot
  kind: security
  category: security
  severity: major
  applies_to:
    spring-boot: '>=2.0'
  detection:
    mode: ai-confirm
    engine: config
    files:
    - '**/application*.properties'
    - '**/application*.yml'
    - '**/application*.yaml'
    - '**/bootstrap*.properties'
    - '**/bootstrap*.yml'
    - '**/bootstrap*.yaml'
    config:
      key: spring.h2.console.enabled
      op: equals
      value: 'true'
      case_insensitive: true
  message: The H2 web console is enabled; it is a development tool and must not be enabled in production profiles.
  ai_question: Is this a production (non-dev, non-test) configuration file or profile?
  source:
    url: https://docs.spring.io/spring-boot/reference/data/sql.html
    doc: SQL Databases - Using H2's Web Console
    doc_version: Spring Boot reference (current 4.x)
    retrieved: '2026-10-09'
    quote: The H2 console is only intended for use during development, so you should take care to ensure that spring.h2.console.enabled is not set to true in production.
  examples:
    bad: spring.h2.console.enabled=true
    good: spring.h2.console.enabled=false
  status: active
  rule_version: 1
