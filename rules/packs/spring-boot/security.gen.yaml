- id: SB-SEC-CSRF-001
  title: CSRF protection disabled
  language: java
  framework: spring-boot
  kind: security
  category: security
  severity: major
  applies_to:
    spring-security: '>=5.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_invocation name: (identifier) @m) @match (#eq? @m "csrf") (#match? @match "disable"))
  message: CSRF protection is disabled. Keep it for any endpoint a browser can call with ambient credentials (cookies/sessions).
  ai_question: Is this filter chain reachable by browsers with cookie/session authentication? (Pure stateless token APIs may legitimately disable CSRF.)
  source:
    url: https://docs.spring.io/spring-security/reference/features/exploits/csrf.html
    doc: Cross Site Request Forgery (CSRF)
    doc_version: Spring Security 7.0 reference (current)
    retrieved: '2026-10-09'
    quote: Our recommendation is to use CSRF protection for any request that could be processed by a browser by normal users.
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          http.csrf(csrf -> csrf.disable());
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          http.csrf(Customizer.withDefaults());
        }
      }
  status: active
  rule_version: 1
- id: SB-SEC-DEFAULT-ENCODER-001
  title: User.withDefaultPasswordEncoder() is not intended for production
  language: java
  framework: spring-boot
  kind: security
  category: security
  severity: major
  applies_to:
    spring-security: '>=5.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((method_invocation object: (identifier) @c name: (identifier) @m) @match (#eq? @c "User") (#eq? @m "withDefaultPasswordEncoder"))
  message: withDefaultPasswordEncoder() hashes at runtime from a plain-text password in source; it is for demos only.
  source:
    url: https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html
    doc: Password Storage - withDefaultPasswordEncoder
    doc_version: Spring Security 7.0 reference (current)
    retrieved: '2026-10-09'
    quote: There are convenience mechanisms to make this easier, but this is still not intended for production.
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          UserDetails u = User.withDefaultPasswordEncoder().username("u").password("p").roles("USER").build();
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          UserDetails u = User.withUsername("u").password(encoder.encode(raw)).roles("USER").build();
        }
      }
  status: active
  rule_version: 1
- id: SB-SEC-FRAMEOPTIONS-001
  title: X-Frame-Options disabled
  language: java
  framework: spring-boot
  kind: security
  category: security
  severity: minor
  applies_to:
    spring-security: '>=5.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_invocation name: (identifier) @m) @match (#eq? @m "frameOptions") (#match? @match "disable"))
  message: Disabling X-Frame-Options exposes pages to clickjacking; use sameOrigin() or a CSP frame-ancestors directive.
  ai_question: Is disabling frame options needed (e.g. only for the H2 console in dev) and is clickjacking otherwise mitigated (CSP frame-ancestors)?
  source:
    url: https://docs.spring.io/spring-security/reference/servlet/exploits/headers.html
    doc: Security HTTP Response Headers
    doc_version: Spring Security 7.0 reference (current)
    retrieved: '2026-10-09'
    quote: X-Frame-Options
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          http.headers(h -> h.frameOptions(f -> f.disable()));
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          http.headers(h -> h.frameOptions(f -> f.sameOrigin()));
        }
      }
  status: active
  rule_version: 1
- id: SB-SEC-LEGACY-ENCODER-001
  title: Deprecated legacy PasswordEncoder implementations
  language: java
  framework: spring-boot
  kind: security
  category: security
  severity: major
  applies_to:
    spring-security: '>=5.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((object_creation_expression type: (type_identifier) @t) @match (#match? @t "^(MessageDigestPasswordEncoder|StandardPasswordEncoder|Md4PasswordEncoder|LdapShaPasswordEncoder)$"))
  message: This PasswordEncoder exists only for backward compatibility and is not considered secure; migrate via DelegatingPasswordEncoder to bcrypt/argon2.
  source:
    url: https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html
    doc: Password Storage - Other PasswordEncoders
    doc_version: Spring Security 7.0 reference (current)
    retrieved: '2026-10-09'
    quote: They are all deprecated to indicate that they are no longer considered secure.
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          PasswordEncoder enc = new MessageDigestPasswordEncoder("MD5");
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          PasswordEncoder enc = new BCryptPasswordEncoder();
        }
      }
  status: active
  rule_version: 1
- id: SB-SEC-NOOP-ENCODER-001
  title: NoOpPasswordEncoder stores plain-text passwords
  language: java
  framework: spring-boot
  kind: security
  category: security
  severity: critical
  applies_to:
    spring-security: '>=5.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((method_invocation object: (identifier) @c) @match (#eq? @c "NoOpPasswordEncoder"))
  message: NoOpPasswordEncoder keeps passwords in plain text; use the DelegatingPasswordEncoder (bcrypt/argon2/scrypt/pbkdf2).
  source:
    url: https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html
    doc: Password Storage
    doc_version: Spring Security 7.0 reference (current)
    retrieved: '2026-10-09'
    quote: Prior to Spring Security 5.0, the default PasswordEncoder was NoOpPasswordEncoder , which required plain-text passwords.
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          PasswordEncoder enc = NoOpPasswordEncoder.getInstance();
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          PasswordEncoder enc = PasswordEncoderFactories.createDelegatingPasswordEncoder();
        }
      }
  status: active
  rule_version: 1
- id: SB-SEC-PERMITALL-001
  title: anyRequest().permitAll() leaves every endpoint public
  language: java
  framework: spring-boot
  kind: security
  category: security
  severity: major
  applies_to:
    spring-security: '>=5.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_invocation object: (method_invocation name: (identifier) @a) name: (identifier) @p) @match (#eq? @a "anyRequest") (#eq? @p "permitAll"))
  message: The catch-all rule permits every request; prefer deny-by-default (anyRequest().authenticated() or denyAll()).
  ai_question: Is this an application where unauthenticated access to every remaining endpoint is intended (e.g. a public site behind another gateway)?
  source:
    url: https://docs.spring.io/spring-security/reference/servlet/authorization/authorize-http-requests.html
    doc: Authorize HttpServletRequests
    doc_version: Spring Security 7.0 reference (current)
    retrieved: '2026-10-09'
    quote: anyRequest
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          http.authorizeHttpRequests(a -> a.anyRequest().permitAll());
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          http.authorizeHttpRequests(a -> a.requestMatchers("/public/**").permitAll().anyRequest().authenticated());
        }
      }
  status: active
  rule_version: 1
- id: SB-SEC-WEB-CORS-ALL-001
  title: '@CrossOrigin without origins allows all origins'
  language: java
  framework: spring-boot
  kind: security
  category: security
  severity: minor
  applies_to:
    spring-boot: '>=2.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((marker_annotation name: (identifier) @an) @match (#eq? @an "CrossOrigin"))
  message: A bare @CrossOrigin allows all origins, headers and mapped methods; list the allowed origins explicitly.
  ai_question: Should this endpoint really be callable from any origin?
  source:
    url: https://docs.spring.io/spring-framework/reference/web/webmvc-cors.html
    doc: CORS - @CrossOrigin
    doc_version: Spring Framework 7.0 reference (current)
    retrieved: '2026-10-09'
    quote: 'By default, @CrossOrigin allows: All origins.'
  examples:
    bad: |
      @RestController
      @CrossOrigin
      class Api {}
    good: |
      @RestController
      @CrossOrigin(origins = "https://app.example.com")
      class Api {}
  status: active
  rule_version: 1
- id: SB-SEC-WEB-CORS-CRED-001
  title: CORS with allowCredentials(true) widens trust
  language: java
  framework: spring-boot
  kind: security
  category: security
  severity: minor
  applies_to:
    spring-boot: '>=2.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((method_invocation name: (identifier) @m arguments: (argument_list . (true) .)) @match (#eq? @m "allowCredentials"))
  message: Credentialed CORS establishes a high level of trust in the configured origins; keep the origin list explicit and minimal.
  ai_question: Are the allowed origins a short explicit list of trusted domains (no wildcard / pattern that matches arbitrary sites)?
  source:
    url: https://docs.spring.io/spring-framework/reference/web/webmvc-cors.html
    doc: CORS - Credentialed Requests
    doc_version: Spring Framework 7.0 reference (current)
    retrieved: '2026-10-09'
    quote: Be aware that this option establishes a high level of trust with the configured domains and also increases the surface of attack of the web application
  examples:
    bad: |
      class Example {
        void run() throws Exception {
          registry.addMapping("/**").allowedOriginPatterns("*").allowCredentials(true);
        }
      }
    good: |
      class Example {
        void run() throws Exception {
          registry.addMapping("/api/**").allowedOrigins("https://app.example.com");
        }
      }
  status: active
  rule_version: 1
