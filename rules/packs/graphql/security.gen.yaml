rules:
- id: GRAPHQL-SEC-ALIAS-FAN-OUT
  title: Same field aliased 5+ times in one selection set
  language: graphql
  kind: security
  category: security
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.graphql'
    - '**/*.gql'
    - '**/*.graphqls'
    query: |
      ((selection_set (selection (field (alias) (name) @a0)) (selection (field (alias) (name) @a1)) (selection (field (alias) (name) @a2)) (selection (field (alias) (name) @a3)) (selection (field (alias) (name) @a4))) @match (#eq? @a0 @a1) (#eq? @a0 @a2) (#eq? @a0 @a3) (#eq? @a0 @a4))
  message: Alias fan-out multiplies resolver work in one request (a classic GraphQL DoS); fetch once or enforce breadth/complexity limits server-side.
  ai_question: Is this alias fan-out generated/unbounded or a legit small fixed set?
  source:
    url: https://graphql.org/learn/security/
    doc: Same field aliased 5+ times in one selection set
    doc_version: GraphQL spec September 2025 / GraphQL ESLint 4
    retrieved: '2026-10-09'
    quote: 'Breadth and batch limiting In addition to limiting operation depth, there should also be guardrails in place to limit the number of top-level fields and field aliases included in a single operation. Consider what would happen during the execution of the following query operation: query { viewer { friends1 :'
  examples:
    bad: |
      query Friends {
        viewer {
          f1: friends(limit: 1) { name }
          f2: friends(limit: 2) { name }
          f3: friends(limit: 3) { name }
          f4: friends(limit: 4) { name }
          f5: friends(limit: 5) { name }
        }
      }
    good: |
      query Friends {
        viewer {
          friends(limit: 5) { name }
        }
      }
  status: active
  rule_version: 1
- id: GRAPHQL-SEC-LIST-FIELD-NOT-PAGINATED
  title: Unbounded list field without arguments
  language: graphql
  kind: security
  category: security
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.graphql'
    - '**/*.gql'
    - '**/*.graphqls'
    query: |
      (field_definition (name) . [(type (list_type)) (type (non_null_type (list_type)))]) @match
  message: Unbounded lists let a single request pull the whole table; paginate (first/after) or cap the size.
  ai_question: Can this list grow unbounded (rows from a datastore, not a small fixed set)?
  source:
    url: https://graphql.org/learn/security/
    doc: Unbounded list field without arguments
    doc_version: GraphQL spec September 2025 / GraphQL ESLint 4
    retrieved: '2026-10-09'
    quote: ting demand control for a GraphQL API is limiting the amount of data that can be queried from a single field. When a field outputs a List type and the resulting list could potentially return a lot of data, it should be paginated to limit the maximum number of items that may be returned in a single request.
  examples:
    bad: |
      type Query {
        users: [User!]!
      }
    good: |
      type Query {
        users(first: Int!, after: String): UserConnection!
      }
  xref:
  - https://graphql.org/learn/pagination/
  status: active
  rule_version: 1
