    - '**/*.gql'
    - '**/*.graphqls'
    query: |
      ((directive (name) @n) @match (#eq? @n "deprecated") (#not-match? @match "deletionDate"))
  message: Track when deprecated fields may be removed.
  ai_question: Does this project use deletionDate on other @deprecated directives (i.e. the convention is established)?
