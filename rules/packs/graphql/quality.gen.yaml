- id: GRAPHQL-QUAL-RESERVED-DOUBLE-UNDERSCORE
  title: Name starting with __
  language: graphql
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.graphqls'
    - '**/schema*.graphql'
    - '**/*.schema.graphql'
    - '**/schema/**/*.graphql'
    - '**/*.graphql'
    - '**/*.gql'
    query: |
      ((name) @match (#match? @match "^__"))
    filters:
    - node.lacks_re:^__(typename|schema|type)$
  message: Names beginning with __ are reserved for introspection; schema builders reject them.
  source:
    url: https://spec.graphql.org/September2025/
    doc: Name starting with __
    doc_version: GraphQL spec September 2025 / GraphQL ESLint 4
    retrieved: '2026-10-09'
    quote: All types and directives defined within a schema must not have a name which begins with "__" (two underscores), as this is used exclusively by GraphQL’s introspection system. 3.3.1 Root Operation Types A schema defines the initial root operation type for each kind of operation it sup
  examples:
    bad: |
      type User {
        __internal: String
      }
    good: |
      type User {
        internal: String
      }
  status: active
  rule_version: 1
- id: GRAPHQL-QUAL-ROOT-NON-NULL-RESULT
