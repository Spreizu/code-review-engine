    url: https://the-guild.dev/graphql/eslint/rules/require-deprecation-date
    doc: '@deprecated without a removal date'
    doc_version: GraphQL ESLint 4.x
    retrieved: '2026-10-09'
    quote: 'aphql-eslint/require-deprecation-date Requires GraphQL Schema: false ℹ️ Requires GraphQL Operations: false ℹ️ Require deletion date on @deprecated directive. Suggest removing deprecated things after deprecated date. Usage Examples Incorrect # eslint @graphql-eslint/require-deprecation-date: ''error'' type User { firstname : S'
  examples:
    bad: |
      type User {
        name: String @deprecated(reason: "Use fullName.")
      }
    good: |
      type User {
        name: String @deprecated(reason: "Use fullName.", deletionDate: "31/12/2026")
      }
