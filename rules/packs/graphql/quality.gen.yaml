- id: GRAPHQL-QUAL-VERSIONED-NAMES
  title: Versioned type/field name (V2, _v2)
  language: graphql
  kind: best-practice
  category: maintainability
  severity: info
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.graphql'
    - '**/*.gql'
    - '**/*.graphqls'
    query: |
      ((object_type_definition (name) @match) (#match? @match "V[0-9]+$"))
      ((field_definition . (name) @match) (#match? @match "(V|_v)[0-9]+$"))
  message: Evolve the schema additively (new fields + @deprecated) instead of versioned copies.
  ai_question: Is the version suffix an API version (not a domain term like 'ipV4')?
  source:
    url: https://graphql.org/learn/schema-design/
    doc: Versioned type/field name (V2, _v2)
    doc_version: GraphQL spec September 2025 / GraphQL ESLint 4
    retrieved: '2026-10-09'
    quote: ersioning While there’s nothing that prevents a GraphQL service from being versioned just like any other API, GraphQL takes a strong opinion on avoiding versioning by providing the tools for the continuous evolution of a GraphQL schema. Why do most APIs version?
  examples:
    bad: |
      type Query {
        userV2(id: ID!): User
      }
    good: |
      type Query {
        user(id: ID!): User
      }
  status: active
  rule_version: 1
