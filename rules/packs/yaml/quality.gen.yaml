    query: |
      (ERROR) @match
    filters:
    - file.lacks_re:\{\{[-~]?\s|\{%
  message: The document does not parse as YAML.
  source:
    url: https://yaml.org/spec/1.2.2/
    doc: YAML syntax error
    doc_version: YAML 1.2.2
    retrieved: '2026-10-09'
    quote: specifying a higher major version (e.g. “ %YAML 2.0 ”) should be rejected with an appropriate error message. A version 1.2 YAML processor must also accept documents with an explicit “ %YAML 1.1 ” directive.
  examples:
    bad: |
      a: [1, 2
      b: 3
    good: |
      a: [1, 2]
      b: 3
  status: active
  rule_version: 1
- id: YAML-QUAL-TAB-INDENT
  title: Tab characters used for indentation
  language: yaml
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '!**/templates/**'
    - '!**/*.j2'
    - '!**/*.jinja*'
    query: |
      [(stream) (ERROR)] @match
    filters:
    - node.is_root
    - file.has_re:(?m)^ *\t+ *[^\s#]
  message: Tabs are not allowed in YAML indentation.
  source:
    url: https://yaml.org/spec/1.2.2/
    doc: Tab characters used for indentation
    doc_version: YAML 1.2.2
    retrieved: '2026-10-09'
    quote: To maintain portability, tab characters must not be used in indentation, since different systems treat tabs differently.
  examples:
    bad: "a:\n\tb: 1\n"
    good: |
      a:
        b: 1
  status: active
  rule_version: 1
- id: YAML-QUAL-TRAILING-SPACES
  title: Trailing whitespace
  language: yaml
  kind: anti-pattern
  category: style
  severity: info
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '!**/templates/**'
    - '!**/*.j2'
    - '!**/*.jinja*'
    query: |
      [(stream) (ERROR)] @match
    filters:
    - node.is_root
    - file.has_re:[ \t]+\r?\n
    requires_config:
    - yamllint
    - editorconfig
  message: Trailing spaces (they can change block-scalar content).
  source:
    url: https://yamllint.readthedocs.io/en/stable/rules.html
    doc: Trailing whitespace
    doc_version: YAML 1.2.2 / yamllint 1.37
    retrieved: '2026-10-09'
    quote: '"foo:bar" : baz trailing-spaces  Use this rule to forbid trailing spaces at the end of lines.'
  examples:
    bad: "a: 1   \nb: 2\n"
    good: |
      a: 1
      b: 2
  status: active
  rule_version: 1
- id: YAML-QUAL-TRUTHY
  title: YAML 1.1 boolean-like plain value (yes/no/on/off)
  language: yaml
  kind: anti-pattern
  category: interoperability
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '!**/templates/**'
    - '!**/*.j2'
    - '!**/*.jinja*'
    query: |
      (block_mapping_pair value: (flow_node (plain_scalar (string_scalar) @match (#match? @match "^(yes|Yes|YES|no|No|NO|on|On|ON|off|Off|OFF|y|Y|n|N)$"))))
  message: YAML 1.1 loaders (PyYAML, SnakeYAML 1.x, Go yaml.v2) turn yes/no/on/off into booleans while YAML 1.2 keeps strings; write true/false or quote.
  source:
    url: https://yamllint.readthedocs.io/en/stable/rules.html
    doc: YAML 1.1 boolean-like plain value (yes/no/on/off)
    doc_version: YAML 1.2.2 / yamllint 1.37
    retrieved: '2026-10-09'
    quote: 'aces the following code snippet would FAIL : this document contains trailing spaces on lines 1 and 3 truthy  Use this rule to forbid non-explicitly typed truthy values other than allowed ones (by default: true and false ), for example YES or off .'
  examples:
    bad: |
      enabled: yes
      country: NO
    good: |
      enabled: true
      country: "NO"
  status: active
  rule_version: 1
- id: YAML-QUAL-TRUTHY-CASE
  title: Boolean not written as lowercase true/false
  language: yaml
  kind: anti-pattern
  category: style
  severity: info
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '!**/templates/**'
    - '!**/*.j2'
    - '!**/*.jinja*'
    query: |
      ((boolean_scalar) @match (#not-match? @match "^(true|false)$"))
    requires_config:
    - yamllint
  message: Only lowercase true/false are portable booleans (yamllint truthy default allowed-values).
  source:
    url: https://yamllint.readthedocs.io/en/stable/rules.html
    doc: Boolean not written as lowercase true/false
    doc_version: YAML 1.2.2 / yamllint 1.37
    retrieved: '2026-10-09'
    quote: 'aces the following code snippet would FAIL : this document contains trailing spaces on lines 1 and 3 truthy  Use this rule to forbid non-explicitly typed truthy values other than allowed ones (by default: true and false ), for example YES or off .'
  examples:
    bad: |
      debug: True
    good: |
      debug: true
  status: active
  rule_version: 1
- id: YAML-QUAL-UNDECLARED-ALIAS
  title: Alias references an undeclared anchor
  language: yaml
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '!**/templates/**'
    - '!**/*.j2'
    - '!**/*.jinja*'
    query: |
      (alias (alias_name) @match)
    filters:
    - file.count_lt:1:&{text}(\s|$)
  message: 'The alias has no matching &anchor: loading fails.'
  source:
    url: https://yamllint.readthedocs.io/en/stable/rules.html
    doc: Alias references an undeclared anchor
    doc_version: YAML 1.2.2 / yamllint 1.37
    retrieved: '2026-10-09'
    quote: Options Set forbid-undeclared-aliases to true to avoid aliases that reference an anchor that hasn’t been declared (either not declared at all, or declared later in the document).
  examples:
    bad: |
      a: *missing
    good: |
      x: &missing 1
      a: *missing
  status: active
  rule_version: 1
- id: YAML-QUAL-UNUSED-ANCHOR
  title: Anchor declared but never aliased
  language: yaml
  kind: anti-pattern
  category: style
  severity: info
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '!**/templates/**'
    - '!**/*.j2'
    - '!**/*.jinja*'
    query: |
      (anchor (anchor_name) @match)
    filters:
    - file.count_lt:1:\*{text}\b
    requires_config:
    - yamllint
  message: Remove the unused anchor.
  source:
    url: https://yamllint.readthedocs.io/en/stable/rules.html
    doc: Anchor declared but never aliased
    doc_version: YAML 1.2.2 / yamllint 1.37
    retrieved: '2026-10-09'
    quote: Set forbid-duplicated-anchors to true to avoid duplications of a same anchor. Set forbid-unused-anchors to true to avoid anchors being declared but not used anywhere in the YAML document via alias.
  examples:
    bad: |
      a: &x 1
    good: |
      a: &x 1
      b: *x
  status: active
  rule_version: 1
- id: YAML-QUAL-VERSION-AS-FLOAT
  title: Version-like value parsed as a float (3.10 → 3.1)
  language: yaml
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '!**/templates/**'
    - '!**/*.j2'
    - '!**/*.jinja*'
    query: |
      (block_mapping_pair key: (flow_node) @k value: (flow_node (plain_scalar (float_scalar) @match (#match? @match "^[0-9]+[.][0-9]*0$"))) (#match? @k "(?i)version|python|node|go|java|php|ruby|terraform"))
  message: An unquoted 3.10 is the float 3.1; quote version numbers.
  source:
    url: https://yaml.org/spec/1.2.2/
    doc: Version-like value parsed as a float (3.10 → 3.1)
    doc_version: YAML 1.2.2
    retrieved: '2026-10-09'
    quote: Integer 10.2.1.4. Floating Point 10.2.2.
  examples:
    bad: |
      python-version: 3.10
    good: |
      python-version: "3.10"
  status: active
  rule_version: 1
- id: YAML-QUAL-VERSION-LIST-AS-FLOAT
  title: Version-like list item parsed as a float
  language: yaml
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '!**/templates/**'
    - '!**/*.j2'
    - '!**/*.jinja*'
    query: |
      (block_mapping_pair key: (flow_node) @k value: [(flow_node (flow_sequence (flow_node (plain_scalar (float_scalar) @match)))) (block_node (block_sequence (block_sequence_item (flow_node (plain_scalar (float_scalar) @match)))))] (#match? @k "(?i)version|python|node|go|java|php|ruby") (#match? @match "^[0-9]+[.][0-9]*0$"))
  message: 3.10 in a version matrix is the float 3.1; quote it.
  source:
    url: https://yaml.org/spec/1.2.2/
    doc: Version-like list item parsed as a float
    doc_version: YAML 1.2.2
    retrieved: '2026-10-09'
    quote: Integer 10.2.1.4. Floating Point 10.2.2.
  examples:
    bad: |
      python: [3.9, 3.10]
    good: |
      python: ["3.9", "3.10"]
  status: active
  rule_version: 1
