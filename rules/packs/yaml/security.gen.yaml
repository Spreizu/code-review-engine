- id: YAML-SEC-ALIAS-BOMB
  title: Many aliases (possible billion-laughs expansion)
  language: yaml
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '!**/templates/**'
    - '!**/*.j2'
    - '!**/*.jinja*'
    query: |
      [(stream) (ERROR)] @match
    filters:
    - node.is_root
    - file.count_ge:25:\*[A-Za-z0-9_-]+
  message: Nested alias fan-out can expand exponentially when loaded; cap alias expansion in the loader.
  ai_question: Do the aliases here form nested fan-out (aliases of collections that themselves alias collections) large enough to be an expansion bomb?
  source:
    url: https://yaml.org/spec/1.2.2/
    doc: Many aliases (possible billion-laughs expansion)
    doc_version: YAML 1.2.2
    retrieved: '2026-10-09'
    quote: Mapping Key Order 3.2.2.2. Anchors and Aliases 3.2.3.
  examples:
    bad: |
      a: &a [x,x,x,x,x,x,x,x,x]
      b: &b [*a,*a,*a,*a,*a,*a,*a,*a,*a]
      c: &c [*b,*b,*b,*b,*b,*b,*b,*b,*b]
      d: &d [*c,*c,*c,*c,*c,*c,*c,*c,*c]
    good: |
      a: &a [x]
      b: *a
  status: active
  rule_version: 1
- id: YAML-SEC-AWS-ACCESS-KEY
  title: AWS access key ID committed
  language: yaml
  kind: security
  category: security
  severity: critical
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '!**/templates/**'
    - '!**/*.j2'
    - '!**/*.jinja*'
    query: |
      ([(string_scalar) (double_quote_scalar) (single_quote_scalar) (block_scalar)] @match (#match? @match "(^|[^A-Z0-9])(AKIA|ASIA)[0-9A-Z]{16}([^A-Z0-9]|$)"))
  message: 'Long-term AWS access key committed: rotate it and load credentials from the environment/role instead.'
  source:
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
    doc: AWS access key ID committed
    doc_version: AWS IAM User Guide
    retrieved: '2026-10-09'
    quote: 'Access keys consist of two parts: an access key ID (for example, AKIAIOSFODNN7EXAMPLE ) and a secret access key (for example, wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY ).'
  examples:
    bad: |
      aws_access_key_id: AKIAIOSFODNN7EXAMPLE
    good: |
      aws_profile: deploy
  status: active
  rule_version: 1
