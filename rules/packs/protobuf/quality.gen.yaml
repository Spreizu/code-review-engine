- id: PROTO-QUAL-ANY-PREFER-EXTENSIONS
  title: google.protobuf.Any field
  language: proto
  kind: best-practice
  category: maintainability
  severity: info
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.proto'
    query: |
      ((field (type) @match) (#match? @match "^\\.?google\\.protobuf\\.Any$"))
  message: Any loses static typing and requires type URLs at runtime; prefer a oneof or extensions where the set of types is known.
  ai_question: Is the set of payload types closed/known (so a oneof would do)?
  source:
    url: https://protobuf.dev/best-practices/dos-donts/
    doc: google.protobuf.Any field
    doc_version: Protobuf 33 / Editions 2024
    retrieved: '2026-10-09'
    quote: Do prefer extensions over Any where possible If you plan to use Any , first double-check if extensions can satisfy the use case instead. If yes, prefer using extensions.
  examples:
    bad: |
      syntax = "proto3";

      package acme.user.v1;

      import "google/protobuf/any.proto";

      message User {
        google.protobuf.Any payload = 1;
      }
    good: |
      syntax = "proto3";

      package acme.user.v1;

      message User {
        oneof payload {
          Email email = 1;
          Sms sms = 2;
        }
      }
  status: active
  rule_version: 1
