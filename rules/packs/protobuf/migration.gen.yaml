- id: PROTO-MIG-EDITIONS-CTYPE-DEPRECATED
  title: ctype option (prefer string_type)
  language: proto
  kind: deprecation
  category: compatibility
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.proto'
    query: |
      ((field_option (identifier) @n) @match (#eq? @n "ctype"))
    filters:
    - file.has_re:(?m)^\s*edition\s*=\s*"2023"
  message: Switch to features.(pb.cpp).string_type now; ctype is removed in Edition 2024.
  source:
    url: https://protobuf.dev/editions/features/
    doc: ctype option (prefer string_type)
    doc_version: Edition 2023
    retrieved: '2026-10-09'
    quote: This replaces the ctype option from proto2 and proto3, and offers a new string_type feature. In Edition 2023, you can specify either ctype or string_type on a field, but not both.
  examples:
    bad: |
      edition = "2023";

      package acme.user.v1;

      message User {
        string blob = 1 [ctype = CORD];
      }
    good: |
      edition = "2023";

      package acme.user.v1;

      message User {
        string blob = 1 [features.(pb.cpp).string_type = CORD];
      }
  status: active
  rule_version: 1
- id: PROTO-MIG-EDITIONS-CTYPE-REMOVED
  title: ctype option in Edition 2024
  language: proto
  kind: removal
  category: compatibility
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.proto'
    query: |
      ((field_option (identifier) @n) @match (#eq? @n "ctype"))
    filters:
    - file.has_re:(?m)^\s*edition\s*=\s*"20(2[4-9]|[3-9][0-9])"
  message: ctype no longer compiles in Edition 2024; use features.(pb.cpp).string_type.
  source:
    url: https://protobuf.dev/editions/features/
    doc: ctype option in Edition 2024
    doc_version: Edition 2024
    retrieved: '2026-10-09'
    quote: 'In Edition 2023, you can specify either ctype or string_type on a field, but not both. In Edition 2024, the ctype option is removed. Values available: VIEW : Generates string_view accessors for the field.'
  examples:
    bad: |
      edition = "2024";

      package acme.user.v1;

      message User {
        string blob = 1 [ctype = CORD];
      }
    good: |
      edition = "2024";

      package acme.user.v1;

      message User {
        string blob = 1 [features.(pb.cpp).string_type = CORD];
      }
  status: active
  rule_version: 1
- id: PROTO-MIG-EDITIONS-GROUP
  title: group syntax in an editions file
  language: proto
  kind: removal
  category: compatibility
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.proto'
    query: |
      (group) @match
    filters:
    - file.has_re:(?m)^\s*edition\s*=\s*"
  message: Groups don't compile in editions; use a nested message with features.message_encoding = DELIMITED.
  source:
    url: https://protobuf.dev/editions/overview/
    doc: group syntax in an editions file
    doc_version: Edition 2023+
    retrieved: '2026-10-09'
    quote: 'ut field names and enum value names in quotation marks when reserving them: reserved foo , bar ; Group Syntax Group syntax, available in proto2, is removed in editions. The special wire-format that groups used is still available by using DELIMITED message encoding.'
  examples:
    bad: |
      edition = "2023";

      package acme.user.v1;

      message SearchResponse {
        repeated group Result = 1 {
          string url = 2;
        }
      }
    good: |
      edition = "2023";

      package acme.user.v1;

      message SearchResponse {
        message Result {
          string url = 1;
        }
        repeated Result results = 1 [features.message_encoding = DELIMITED];
      }
  status: active
  rule_version: 1
- id: PROTO-MIG-EDITIONS-JAVA-MULTIPLE-FILES
  title: java_multiple_files in Edition 2024+
  language: proto
  kind: removal
  category: compatibility
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.proto'
    query: |
      ((option (identifier) @n) @match (#eq? @n "java_multiple_files"))
    filters:
    - file.has_re:(?m)^\s*edition\s*=\s*"20(2[4-9]|[3-9][0-9])"
  message: Edition 2024 replaces java_multiple_files with features.(pb.java).nest_in_file_class.
  source:
    url: https://protobuf.dev/editions/features/
    doc: java_multiple_files in Edition 2024+
    doc_version: Edition 2024
    retrieved: '2026-10-09'
    quote: s feature controls whether the Java generator will nest the generated class in the Java generated file class. Setting this option to NO is the equivalent of setting java_multiple_files = true in proto2/proto3/edition 2023. The default outer classname is also updated to always be the camel-cased .proto filename suffixed with Proto
  examples:
    bad: |
      edition = "2024";

      package acme.user.v1;

      option java_multiple_files = true;

      message User {
        string name = 1;
      }
    good: |
      edition = "2024";

      package acme.user.v1;

      option features.(pb.java).nest_in_file_class = NO;

      message User {
        string name = 1;
      }
  status: active
  rule_version: 1
