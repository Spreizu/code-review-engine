      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <a href="#" onclick="save()">Save</a>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <button type="button" onclick="save()">Save</button>
