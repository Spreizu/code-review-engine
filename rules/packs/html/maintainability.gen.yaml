- id: HTML-MAINT-VIEWPORT-BLOCKS-ZOOM
  title: Viewport meta tag disables zooming
  language: html
  kind: best-practice
  category: accessibility
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (start_tag (tag_name) @t (#match? @t "^(?i)meta$")) @match
    filters:
    - node.has_re:(?i)name\s*=\s*[\x22']?viewport
    - node.has_re:(?i)user-scalable\s*=\s*(no|0)\b|maximum-scale\s*=\s*1(\.0*)?\b
  message: 'user-scalable=no / maximum-scale=1 stops low-vision users from pinch-zooming: remove them.'
  source:
    url: https://www.w3.org/WAI/WCAG22/Understanding/resize-text.html
    doc: WCAG 2.2 Understanding 1.4.4 Resize Text
    doc_version: HTML Living Standard
    retrieved: '2026-10-09'
    quote: cess Criterion (SC) Except for captions and images of text , text can be resized without assistive technology up to 200 percent without loss of content or functionality.
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title><meta name="viewport" content="width=device-width, user-scalable=no"></head>
      <body>
      <p>Hi</p>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title><meta name="viewport" content="width=device-width, initial-scale=1"></head>
      <body>
      <p>Hi</p>
      </body>
      </html>
  xref:
  - sonar:Web:S7926
  status: active
  rule_version: 1
  tags:
  - maintainability
