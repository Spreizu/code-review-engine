    doc: 'MDN: ARIA button role'
    doc_version: HTML Living Standard
    retrieved: '2026-10-09'
    quote: be used in combination with the aria-pressed attribute to create toggle buttons . html <div id="saveChanges" tabindex="0" role="button" aria-pressed="false">Save</div> The above example creates a focusable button, but requires
  examples:
    bad: |
