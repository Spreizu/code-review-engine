- id: HTML-MAINT-SCOPE-ON-NON-TH
  title: scope attribute on an element other than th
  language: html
  kind: best-practice
  category: accessibility
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (start_tag (tag_name) @t (attribute (attribute_name) @a) (#match? @a "^(?i)scope$")) @match
    filters:
    - cap.lacks_re:t:(?i)^th$
  message: scope only has meaning on th header cells; elsewhere assistive technology ignores it.
