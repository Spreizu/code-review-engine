      <table><tr><td scope="col">Name</td></tr></table>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <table><tr><th scope="col">Name</th></tr></table>
