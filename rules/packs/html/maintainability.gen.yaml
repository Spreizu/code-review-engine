- id: HTML-MAINT-AUTOPLAY-MEDIA
  title: Audio/video set to autoplay with sound
  language: html
  kind: best-practice
  category: accessibility
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (start_tag (tag_name) @t (attribute (attribute_name) @a) (#match? @t "^(?i)(audio|video)$") (#match? @a "^(?i)autoplay$")) @match
    filters:
    - node.lacks_re:(?i)\bmuted\b
  message: Sound that starts on its own talks over screen readers and startles users; let them start playback (or autoplay muted).
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/video
    doc: 'MDN: <video> autoplay'
    doc_version: HTML Living Standard
    retrieved: '2026-10-09'
    quote: block audio (or videos with an unmuted audio track) from autoplaying, as sites that automatically play audio can be an unpleasant experience for users.
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <video src="intro.mp4" autoplay></video>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <video src="intro.mp4" controls></video>
      </body>
      </html>
