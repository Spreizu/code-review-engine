    - node.lacks_re:(?i)\shref\s*=\s*[\x22'][^#j\x22']
  message: 'An anchor with a dummy href and a click handler is announced as a link, is not triggered by Space and pollutes history: use <button>.'
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/a
    doc: 'MDN: <a> onclick events'
    doc_version: HTML Living Standard
    retrieved: '2026-10-09'
    quote: 'efits all users — the "list all links" shortcut emulates how sighted users quickly scan pages. onclick events Anchor elements are often abused as fake buttons by setting their href to # or javascript:void(0) to prevent the page from refreshing, then listening for thei'
  examples:
    bad: |
