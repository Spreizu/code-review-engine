- id: HTML-MAINT-SRCSET-WITHOUT-DESCRIPTOR
  title: srcset candidate without a width or density descriptor
  language: html
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((attribute (attribute_name) @a) @match (#match? @a "^(?i)srcset$"))
    filters:
    - node.has_re:,
    - node.has_re:[\x22',]\s*[^\s,\x22']+\s*(,|[\x22']\s*$)
  message: 'With several candidates, one without a w/x descriptor defaults to 1x and can collide with another, so the browser may pick the wrong file: give every entry a descriptor.'
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/img
    doc: 'MDN: <img> srcset'
    doc_version: HTML Living Standard
    retrieved: '2026-10-09'
    quote: The spec requires that the sizes attribute only be present when srcset uses width descriptors.
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <img src="a.jpg" srcset="a.jpg, a-2x.jpg 2x" alt="A">
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <img src="a.jpg" srcset="a.jpg 1x, a-2x.jpg 2x" alt="A">
      </body>
      </html>
  xref:
  - sonar:Web:S8697
  status: active
  rule_version: 1
  tags:
  - maintainability
