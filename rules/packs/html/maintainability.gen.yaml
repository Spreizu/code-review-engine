- id: HTML-MAINT-ACCESSKEY-ATTRIBUTE
  title: accesskey attribute used
  language: html
  kind: best-practice
  category: accessibility
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((attribute (attribute_name) @a) @match (#match? @a "^(?i)accesskey$"))
  message: 'Access keys clash with browser and assistive-technology shortcuts: rely on normal focus order instead.'
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes/accesskey
    doc: 'MDN: accesskey'
    doc_version: HTML Living Standard
    retrieved: '2026-10-09'
    quote: In this article Try it Accessibility concerns Specifications Browser compatibility See also Try it <p>If you need to relax, press the <b>S</b>tress relieve
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <button accesskey="s">Save</button>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <button>Save</button>
      </body>
      </html>
  xref:
  - sonar:Web:S6846
  status: active
  rule_version: 1
  tags:
  - maintainability
- id: HTML-MAINT-ANCHOR-AS-BUTTON
  title: <a> used as a button
  language: html
  kind: best-practice
  category: accessibility
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (start_tag (tag_name) @t (#match? @t "^(?i)a$")) @match
    filters:
