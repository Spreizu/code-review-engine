- id: HTML-MAINT-CLICK-WITHOUT-KEYBOARD
  title: Click handler on a non-interactive element without a key handler
  language: html
  kind: best-practice
  category: accessibility
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (start_tag (tag_name) @t (attribute (attribute_name) @a) (#match? @a "^(?i)onclick$")) @match
    filters:
    - cap.lacks_re:t:(?i)^(a|button|input|select|textarea|summary|option|label|details|body|form)$
    - node.lacks_re:(?i)\sonkey(down|up|press)\s*=
  message: 'Keyboard users cannot trigger this element: use a <button>, or add tabindex, a role and a key handler.'
  source:
    url: https://www.w3.org/WAI/WCAG22/Understanding/keyboard.html
    doc: WCAG 2.2 Understanding 2.1.1 Keyboard
    doc_version: HTML Living Standard
    retrieved: '2026-10-09'
    quote: Success Criterion (SC) All functionality of the content is operable through a keyboard interface without requiring specific timings for individual keystrokes, except where the underlying function requires i
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <div onclick="openMenu()">Menu</div>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <div role="button" tabindex="0" onclick="openMenu()" onkeydown="menuKey(event)">Menu</div>
      </body>
