    doc: 'MDN glossary: Doctype'
    doc_version: HTML Living Standard
    retrieved: '2026-10-09'
    quote: Its sole purpose is to prevent a browser from switching into so-called "quirks mode" when rendering a document; that is, the <!doctype html> doctype ensures that the browser makes a best-effort
  examples:
    bad: |
      <html lang="en">
      <head><title>x</title></head>
      <body><p>Hi</p></body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <p>Hi</p>
      </body>
      </html>
