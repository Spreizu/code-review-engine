- id: HTML-MAINT-META-REFRESH
  title: <meta http-equiv="refresh"> reload or redirect
  language: html
  kind: best-practice
  category: accessibility
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (start_tag (tag_name) @t (#match? @t "^(?i)meta$")) @match
    filters:
    - node.has_re:(?i)http-equiv\s*=\s*[\x22']?refresh
  message: A timed refresh/redirect moves users before they finish reading and breaks the Back button; redirect on the server (301/302) or let the user follow a link.
  source:
    url: https://www.w3.org/WAI/WCAG22/Techniques/failures/F41
    doc: WCAG 2.2 failure F41
    doc_version: HTML Living Standard
    retrieved: '2026-10-09'
    quote: Failure of Success Criterion 2.2.1, 2.2.4, and 3.2.5 due to using meta refresh to reload the page | WAI | W3C Skip to content WCAG 2.2 Techniques Examples of ways to meet WCAG; not require
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title><meta http-equiv="refresh" content="5; url=/new"></head>
      <body>
      <p>Moved</p>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <p>Moved: <a href="/new">new page</a></p>
      </body>
      </html>
  xref:
  - sonar:Web:MetaRefreshCheck
  status: active
  rule_version: 1
  tags:
  - maintainability
- id: HTML-MAINT-MISSING-DOCTYPE
