- id: HTML-MAINT-IMG-WITHOUT-ALT
  title: <img> or <area> without alt
  language: html
  kind: best-practice
  category: accessibility
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ([(start_tag (tag_name) @t) (self_closing_tag (tag_name) @t)] @match (#match? @t "^(?i)(img|area)$"))
    filters:
    - node.lacks_re:(?i)\s(alt|:alt|v-bind:alt|\[alt\]|\[attr\.alt\])\s*=|\{\{|\{%
