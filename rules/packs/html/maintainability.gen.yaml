    doc: 'MDN: <img> alt'
    doc_version: HTML Living Standard
    retrieved: '2026-10-09'
    quote: For these reasons and others, provide a useful value for alt whenever possible. Setting this attribute to an empty string ( alt="" ) indicates that this image is not a key part of the content (it's decoration or a tracking pixel),
  examples:
    bad: |
