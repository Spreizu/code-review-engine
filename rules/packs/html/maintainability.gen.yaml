  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (document . (element (start_tag (tag_name) @t) (#match? @t "^(?i)html$")) @match)
  message: Without <!DOCTYPE html> browsers render in quirks mode, with legacy layout behaviour.
