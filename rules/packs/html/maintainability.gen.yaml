- id: HTML-MAINT-POSITIVE-TABINDEX
  title: tabindex greater than zero
  language: html
  kind: best-practice
  category: accessibility
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((attribute (attribute_name) @a) @match (#match? @a "^(?i)tabindex$"))
    filters:
    - node.has_re:=\s*[\x22']?\s*\+?[1-9]
  message: 'Positive tabindex values override the natural focus order and confuse keyboard users: use 0 or -1.'
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes/tabindex
    doc: 'MDN: tabindex'
    doc_version: HTML Living Standard
    retrieved: '2026-10-09'
    quote: Avoid using tabindex values greater than 0 and CSS properties that can change the order of focusable HTML elements ( Ordering flex items ).
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <div tabindex="3">x</div>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <div tabindex="0">x</div>
      </body>
      </html>
  xref:
  - sonar:Web:S6841
  status: active
  rule_version: 1
  tags:
  - maintainability
- id: HTML-MAINT-REMOTE-SCRIPT-WITHOUT-INTEGRITY
  title: Remote script or stylesheet without integrity
  language: html
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (start_tag (tag_name) @t (#match? @t "^(?i)(script|link)$")) @match
    filters:
    - node.has_re:(?i)\b(src|href)\s*=\s*[\x22']?(https?:)?//
    - node.lacks_re:(?i)\bintegrity\s*=
    - node.has_re:(?i)^<script|\brel\s*=\s*[\x22']?stylesheet
  message: 'A compromised CDN can serve altered code that runs with your page''s privileges: pin it with an integrity hash.'
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Subresource_Integrity
    doc: 'MDN: Subresource Integrity'
    doc_version: HTML Living Standard
    retrieved: '2026-10-09'
    quote: It works by allowing you to provide a cryptographic hash that a fetched resource must match.
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <script src="https://cdn.example.com/lib.js"></script>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <script src="https://cdn.example.com/lib.js" integrity="sha384-abc" crossorigin="anonymous"></script>
      </body>
      </html>
  xref:
  - sonar:Web:S5725
  cwe:
  - CWE-353
  owasp:
  - A08:2021
  status: active
  rule_version: 1
  tags:
  - maintainability
