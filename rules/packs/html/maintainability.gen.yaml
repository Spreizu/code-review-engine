- id: HTML-MAINT-OBJECT-WITHOUT-FALLBACK
  title: <object> without fallback content
  language: html
  kind: best-practice
  category: accessibility
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (element (start_tag (tag_name) @t) . (end_tag) (#match? @t "^(?i)object$")) @match
  message: 'When the resource cannot be shown (no plugin, blocked, screen reader) the user gets nothing: put a text alternative or link inside.'
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/object
    doc: 'MDN: <object>'
    doc_version: HTML Living Standard
    retrieved: '2026-10-09'
    quote: Its children provide fallback content when the resource cannot be displayed.
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <object data="report.pdf" type="application/pdf"></object>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <object data="report.pdf" type="application/pdf"><a href="report.pdf">Download the report</a></object>
      </body>
      </html>
