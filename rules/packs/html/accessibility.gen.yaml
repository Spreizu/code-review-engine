      <marquee>Sale today</marquee>
      </main>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <p>Sale today</p>
      </main>
      </body>
      </html>
