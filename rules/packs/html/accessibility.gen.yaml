  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((start_tag (tag_name) @t) @match (#match? @t "^(?i)(input)$"))
      ((self_closing_tag (tag_name) @t) @match (#match? @t "^(?i)(input)$"))
    filters:
    - node.has_re:(?i)\btype\s*=\s*[\x22']?image\b
    - markup.lacks_attr:alt|aria-label|aria-labelledby|title
    - markup.unlabelled
  message: An image button needs alt text that says what it does; without it the button has no name.
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/input/image
    doc: 'MDN: <input type="image">'
    doc_version: WCAG 2.2
    retrieved: '2026-10-09'
    quote: 'userId">User ID</label> <input type="text" id="userId" name="userId" /> </div> <input type="image" id="image" alt="Login" src="/shared-assets/images/examples/login-button.png" /> label { font-size: 0.8rem; } label, input[ty'
  examples:
