    engine: tree-sitter
    query: |
      ((start_tag (tag_name) @t) @match (#match? @t "^(?i)(marquee|blink)$"))
      ((self_closing_tag (tag_name) @t) @match (#match? @t "^(?i)(marquee|blink)$"))
  message: 'Moving or blinking text cannot be paused by the user and these elements are obsolete: use static content.'
  source:
    url: https://www.w3.org/WAI/WCAG22/Understanding/pause-stop-hide.html
    doc: Understanding SC 2.2.2 Pause, Stop, Hide
    doc_version: WCAG 2.2
    retrieved: '2026-10-09'
    quote: 'Criterion (SC) For moving, blinking , scrolling, or auto-updating information, all of the following are true: Moving, blinking, scrolling For any moving, blinking or scrolling information that (1) starts automatically, (2) lasts more than five sec'
  examples:
    bad: |
