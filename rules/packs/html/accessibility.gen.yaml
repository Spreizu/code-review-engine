      <input type="image" src="go.png">
      </main>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <input type="image" src="go.png" alt="Search">
      </main>
      </body>
      </html>
  xref:
  - axe:input-image-alt
