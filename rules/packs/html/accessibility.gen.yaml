- id: HTML-A11Y-MOUSE-WITHOUT-KEYBOARD
  title: Mouse-over handler without a focus equivalent
  language: html
  kind: best-practice
  category: accessibility
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((start_tag (tag_name) @t) @match (#match? @t "^(?i)([a-zA-Z][a-zA-Z0-9-]*)$"))
      ((self_closing_tag (tag_name) @t) @match (#match? @t "^(?i)([a-zA-Z][a-zA-Z0-9-]*)$"))
    filters:
    - markup.has_event:mouseover|mouseenter
    - markup.lacks_event:focus|focusin
  message: 'Behaviour triggered only on mouse-over is unavailable to keyboard users: trigger the same on focus.'
  ai_question: Does the mouse-over handler provide functionality or content (not just a cosmetic effect or prefetch) that keyboard users cannot reach another way?
  source:
    url: https://www.w3.org/WAI/WCAG22/Techniques/failures/F54
    doc: 'WCAG failure F54: pointer-only event handlers'
    doc_version: WCAG 2.2
    retrieved: '2026-10-09'
    quote: Failure of Success Criterion 2.1.1 due to using only pointing-device-specific event handlers (including gesture) for a function | WAI | W3C Skip to content WCAG 2.2 Techniques Examples of ways to meet W
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <div onmouseover="show()">Details</div>
      </main>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <div tabindex="0" onmouseover="show()" onfocus="show()">Details</div>
      </main>
      </body>
      </html>
  xref:
  - jsx-a11y:mouse-events-have-key-events
  - vuejs-accessibility:mouse-events-have-key-events
  wcag:
  - 2.1.1
  status: active
  rule_version: 1
  tags:
  - accessibility
- id: HTML-A11Y-NESTED-INTERACTIVE
  title: Interactive element inside a link or button
  language: html
  kind: best-practice
  category: accessibility
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((start_tag (tag_name) @t) @match (#match? @t "^(?i)(a|button|input|select|textarea)$"))
      ((self_closing_tag (tag_name) @t) @match (#match? @t "^(?i)(a|button|input|select|textarea)$"))
    filters:
    - markup.in:a|button
  message: 'Controls nested in a link or button are not reachable or announced reliably, and HTML forbids the nesting: separate them.'
  source:
    url: https://html.spec.whatwg.org/multipage/text-level-semantics.html
    doc: 'HTML Living Standard: the a element'
    doc_version: WCAG 2.2
    retrieved: '2026-10-09'
    quote: Transparent , but there must be no interactive content descendant, a element descendant, or descendant with the tabindex attribute specified.
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <a href="/order/1"><button type="button">Open</button></a>
      </main>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <a href="/order/1">Open</a>
      <button type="button">Delete</button>
      </main>
      </body>
      </html>
  xref:
  - axe:nested-interactive
  wcag:
  - 4.1.2
  status: active
  rule_version: 1
  tags:
  - accessibility
- id: HTML-A11Y-ROLE-IMG-WITHOUT-NAME
  title: role="img" without an accessible name
  language: html
  kind: best-practice
  category: accessibility
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((start_tag (tag_name) @t) @match (#match? @t "^(?i)([a-zA-Z][a-zA-Z0-9-]*)$"))
      ((self_closing_tag (tag_name) @t) @match (#match? @t "^(?i)([a-zA-Z][a-zA-Z0-9-]*)$"))
    filters:
    - markup.not_hidden
    - markup.attr_re:role:^\s*(img|image)\s*$
    - markup.lacks_attr:alt|aria-label|aria-labelledby|title
    - markup.no_text
  message: 'An element exposed as an image needs a text alternative: add aria-label or aria-labelledby (or a <title> for SVG).'
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/img_role
    doc: 'MDN: ARIA img role'
    doc_version: WCAG 2.2
    retrieved: '2026-10-09'
    quote: emojis, or other content that can be combined to deliver information in a visual manner. html <div role="img" aria-label="Description of the overall image"> <img src="graphic1.png" alt="" /> <img src="graphic2.png" alt="" /> </div
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <div role="img" class="rating-4"></div>
      </main>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <div role="img" class="rating-4" aria-label="4 out of 5 stars"></div>
      <svg role="img"><title>Logo</title></svg>
      </main>
      </body>
      </html>
  xref:
  - axe:role-img-alt
  - axe:svg-img-alt
  wcag:
  - 1.1.1
  status: active
  rule_version: 1
  tags:
  - accessibility
- id: HTML-A11Y-TABLE-WITHOUT-HEADERS
  title: Data table without header cells
  language: html
  kind: best-practice
  category: accessibility
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((start_tag (tag_name) @t) @match (#match? @t "^(?i)(table)$"))
      ((self_closing_tag (tag_name) @t) @match (#match? @t "^(?i)(table)$"))
    filters:
    - markup.lacks_child:th
    - node.lacks_re:\brole\s*=\s*[\x22']?(presentation|none)\b
    - parent.lacks_re:\brole\s*=\s*[\x22']?(columnheader|rowheader)|\bheaders\s*=
  message: 'Without <th> cells, screen readers cannot tell users which column or row a value belongs to: mark up the header row/column.'
  ai_question: Is this a data table (values in rows and columns that need headers), not a layout table?
  source:
    url: https://www.w3.org/WAI/WCAG22/Understanding/info-and-relationships.html
    doc: Understanding SC 1.3.1 Info and Relationships
    doc_version: WCAG 2.2
    retrieved: '2026-10-09'
    quote: Information, structure, and relationships conveyed through presentation can be programmatically determined
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <table>
      <tr><td>Item</td><td>Price</td></tr>
      <tr><td>Tea</td><td>3</td></tr>
      </table>
      </main>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <table>
      <tr><th scope="col">Item</th><th scope="col">Price</th></tr>
      <tr><td>Tea</td><td>3</td></tr>
      </table>
      <table role="presentation"><tr><td>x</td></tr></table>
      </main>
      </body>
      </html>
  xref:
  - axe:td-has-header
  wcag:
  - 1.3.1
  status: active
  rule_version: 1
  tags:
  - accessibility
- id: HTML-A11Y-TH-INVALID-SCOPE
  title: Header cell with an invalid scope
  language: html
  kind: best-practice
  category: accessibility
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((start_tag (tag_name) @t) @match (#match? @t "^(?i)(th)$"))
      ((self_closing_tag (tag_name) @t) @match (#match? @t "^(?i)(th)$"))
    filters:
    - markup.attr_lacks_re:scope:^(?i)(row|col|rowgroup|colgroup|auto)$
  message: scope must be row, col, rowgroup or colgroup; any other value is ignored and the header is not associated.
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/th
    doc: 'MDN: <th>'
    doc_version: WCAG 2.2
    retrieved: '2026-10-09'
    quote: The exact nature of this group is defined by the scope and headers attributes.
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <table><tr><th scope="column">Item</th></tr></table>
      </main>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <table><tr><th scope="col">Item</th></tr></table>
      </main>
      </body>
      </html>
  xref:
  - axe:scope-attr-valid
  wcag:
  - 1.3.1
  status: active
  rule_version: 1
  tags:
  - accessibility
- id: HTML-A11Y-VIDEO-WITHOUT-CAPTIONS
  title: <video> without a captions track
  language: html
  kind: best-practice
  category: accessibility
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((start_tag (tag_name) @t) @match (#match? @t "^(?i)(video)$"))
      ((self_closing_tag (tag_name) @t) @match (#match? @t "^(?i)(video)$"))
    filters:
    - markup.lacks_attr:muted
    - markup.lacks_child:track
  message: 'This video has no <track> for captions: deaf and hard-of-hearing users miss its audio.'
  ai_question: Does the video have meaningful audio (speech, narration) and no captions burned in or provided elsewhere?
  source:
    url: https://www.w3.org/WAI/WCAG22/Understanding/captions-prerecorded.html
    doc: Understanding SC 1.2.2 Captions (Prerecorded)
    doc_version: WCAG 2.2
    retrieved: '2026-10-09'
    quote: Success Criterion (SC) Captions are provided for all prerecorded audio content in synchronized media , except when the media is a media alternative for text and is clearly labeled as such.
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <video src="intro.mp4" controls></video>
      </main>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <video src="intro.mp4" controls>
      <track kind="captions" src="intro.vtt" srclang="en">
      </video>
      <video src="bg.mp4" autoplay muted loop></video>
      </main>
      </body>
      </html>
  xref:
  - axe:video-caption
  wcag:
  - 1.2.2
  status: active
  rule_version: 1
  tags:
  - accessibility
