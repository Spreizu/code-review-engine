    filters:
    - markup.not_hidden
    - node.lacks_re:(?i)\btype\s*=\s*[\x22']?(hidden|submit|reset|button|image)\b
    - node.lacks_re:(:|\[|v-bind:)type\b
    - markup.unlabelled
    - node.lacks_re:\brole\s*=\s*[\x22']?(presentation|none)\b
  message: 'Nothing labels this field, so screen-reader users hear only its type: add a <label for>, wrap it in <label>, or use aria-label/aria-labelledby.'
  source:
    url: https://www.w3.org/WAI/WCAG22/Understanding/labels-or-instructions.html
    doc: Understanding SC 3.3.2 Labels or Instructions
    doc_version: WCAG 2.2
    retrieved: '2026-10-09'
    quote: Success Criterion (SC) Labels or instructions are provided when content requires user input.
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <input type="text" id="q" name="q">
      </main>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <label for="q">Search</label>
      <input type="text" id="q" name="q">
