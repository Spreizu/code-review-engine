- id: HTML-A11Y-LANG-INVALID
  title: lang value that is not a language tag
  language: html
  kind: best-practice
  category: accessibility
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((start_tag (tag_name) @t) @match (#match? @t "^(?i)([a-zA-Z][a-zA-Z0-9-]*)$"))
      ((self_closing_tag (tag_name) @t) @match (#match? @t "^(?i)([a-zA-Z][a-zA-Z0-9-]*)$"))
    filters:
    - markup.has_text_without:lang
    - node.lacks_re:(?i)^<(style|script|template|i18n|docs)\b
    - markup.attr_lacks_re:lang:^([a-zA-Z]{2,3}(-[a-zA-Z0-9]{1,8})*|[iIxX](-[a-zA-Z0-9]{1,8})+|)$
  message: 'Not a BCP 47 language tag (use en, en-GB, pt-BR...): screen readers cannot pick the right voice.'
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes/lang
    doc: 'MDN: lang attribute'
    doc_version: WCAG 2.2
    retrieved: '2026-10-09'
    quote: The attribute contains a single BCP 47 language tag .
  examples:
    bad: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <p lang="english">Hello</p>
      </main>
      </body>
      </html>
    good: |
      <!DOCTYPE html>
      <html lang="en">
      <head><title>Orders</title></head>
      <body>
      <main>
      <p lang="en-GB">Hello</p>
      <p lang="">x</p>
      </main>
      </body>
      </html>
  xref:
  - axe:valid-lang
  - axe:html-lang-valid
  - jsx-a11y:lang
  wcag:
  - 3.1.1
  - 3.1.2
  status: active
  rule_version: 1
  tags:
  - accessibility
