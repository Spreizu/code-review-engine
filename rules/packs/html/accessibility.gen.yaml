- id: HTML-A11Y-CONTROL-WITHOUT-LABEL
  title: Form field without a label
  language: html
  kind: best-practice
  category: accessibility
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((start_tag (tag_name) @t) @match (#match? @t "^(?i)(input|select|textarea)$"))
