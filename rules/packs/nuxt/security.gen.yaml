- id: NUXT-SEC-CACHED-PAYLOAD-001
  title: cache/swr/isr route rule on Nuxt 4.4.x (cross-user payload disclosure)
  language: javascript
  framework: nuxt
  kind: security
  category: security
  severity: major
  applies_to:
    nuxt: '>=4.4.0 <4.5.1'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - nuxt.config.ts
    - nuxt.config.js
    - nuxt.config.mjs
    - '**/nuxt.config.ts'
    - '**/nuxt.config.js'
    - '**/nuxt.config.mjs'
    query: |
      ((pair key: (property_identifier) @r value: (object (pair value: (object (pair key: (property_identifier) @k) @match)))) (#eq? @r "routeRules") (#match? @k "^(swr|isr|cache)$"))
  message: On Nuxt 4.4.0-4.5.0 a cached _payload.json can be served to another user (GHSA-wm8w-6qjm-cv43). Upgrade to 4.5.1 and purge CDN caches; keep caching off pages with per-user data.
  ai_question: Does this cached route render authenticated, user-specific data?
  source:
    url: https://nuxt.com/blog/v4-5-security
    doc: Nuxt blog - Security Patch Releases (4.5.1 / 3.21.10)
    doc_version: Nuxt 4.5.1 / 3.21.10
    retrieved: '2026-10-09'
    quote: on authenticated pages that render user-specific data
  examples:
    bad: |
      export default defineNuxtConfig({ routeRules: { '/account/**': { swr: 60 } } })
    good: |
      export default defineNuxtConfig({ routeRules: { '/blog/**': { prerender: true } } })
  cwe:
  - CWE-524
  status: active
  rule_version: 1
- id: NUXT-SEC-COOKIE-SENSITIVE-001
  title: Sensitive cookie set without httpOnly/secure
  language: javascript
  framework: nuxt
  kind: security
  category: security
  severity: minor
  applies_to:
    nuxt: '>=3.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call_expression function: (identifier) @f arguments: (arguments . (string (string_fragment) @n) .)) @match (#eq? @f "useCookie") (#match? @n "(?i)(token|session|auth|jwt|secret)"))
  message: 'Auth/session cookies need explicit options: secure, sameSite, and httpOnly when set server-side.'
  ai_question: Is this cookie a credential readable by client JS where httpOnly would be appropriate?
  source:
    url: https://nuxt.com/docs/4.x/api/composables/use-cookie
    doc: Nuxt docs - api/composables/use-cookie
    doc_version: Nuxt 4 docs (4.x)
    retrieved: '2026-10-09'
    quote: be careful when setting this to true, as compliant clients will not allow client-side JavaScript
  examples:
    bad: |
      const token = useCookie('auth_token')
    good: |
      const token = useCookie('auth_token', { secure: true, sameSite: 'strict' })
  status: active
  rule_version: 1
- id: NUXT-SEC-ROUTERULE-UPPERCASE-AUTH-001
  title: routeRules authorization key with uppercase characters (case bypass)
  language: javascript
  framework: nuxt
  kind: security
  category: security
  severity: critical
  applies_to:
    nuxt: '>=3.0 <3.21.10 || >=4.0 <4.5.1'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - nuxt.config.ts
    - nuxt.config.js
    - nuxt.config.mjs
    - '**/nuxt.config.ts'
    - '**/nuxt.config.js'
    - '**/nuxt.config.mjs'
    query: |
      ((pair key: (property_identifier) @r value: (object (pair key: (string (string_fragment) @k) value: (object) @v) @match)) (#eq? @r "routeRules") (#match? @k "[A-Z]") (#match? @v "appMiddleware"))
  message: On this Nuxt version route rules match case-sensitively while routing does not, so /admin bypasses the middleware gate on /Admin (GHSA-hxvh-4h3w-prp9). Upgrade to 4.5.1 / 3.21.10 and use lowercase keys.
  source:
    url: https://nuxt.com/blog/v4-5-security
    doc: Nuxt blog - Security Patch Releases (4.5.1 / 3.21.10)
    doc_version: Nuxt 4.5.1 / 3.21.10
    retrieved: '2026-10-09'
    quote: any rule key contains an uppercase character
  examples:
    bad: |
      export default defineNuxtConfig({ routeRules: { '/Admin/**': { appMiddleware: ['auth'] } } })
    good: |
      export default defineNuxtConfig({ routeRules: { '/admin/**': { appMiddleware: ['auth'] } } })
  cwe:
  - CWE-863
  status: active
  rule_version: 1
- id: NUXT-SEC-RTC-SECRET-CLIENT-001
  title: Private runtimeConfig accessed in client code
  language: vue
  framework: nuxt
  kind: security
  category: security
  severity: minor
  applies_to:
    nuxt: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    target: script
    query: |
      ((member_expression object: (call_expression function: (identifier) @f) property: (property_identifier) @p) @match (#eq? @f "useRuntimeConfig") (#not-match? @p "^(public|app)$"))
  message: Only runtimeConfig.public is available in the browser; private keys are undefined on the client (and must never be sent there).
  source:
    url: https://nuxt.com/docs/4.x/guide/going-further/runtime-config
    doc: Nuxt docs - guide/going-further/runtime-config
    doc_version: Nuxt 4 docs (4.x)
    retrieved: '2026-10-09'
    quote: The private keys which are only available within server-side
  examples:
    bad: |
      <script setup>
      const key = useRuntimeConfig().apiSecret
      </script>
    good: |
      <script setup>
      const base = useRuntimeConfig().public.apiBase
      </script>
  status: active
  rule_version: 1
- id: NUXT-SEC-RUNTIME-COMPILER-ISLANDS-001
  title: vue.runtimeCompiler enabled on a Nuxt release with the island-props RCE
  language: javascript
  framework: nuxt
  kind: security
  category: security
  severity: critical
  applies_to:
    nuxt: '>=3.0 <3.21.10 || >=4.0 <4.5.1'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - nuxt.config.ts
    - nuxt.config.js
    - nuxt.config.mjs
    - '**/nuxt.config.ts'
    - '**/nuxt.config.js'
    - '**/nuxt.config.mjs'
    query: |
      ((call_expression function: (identifier) @d arguments: (arguments (object (pair key: (property_identifier) @p value: (object (pair key: (property_identifier) @k value: (true)) @match))))) (#eq? @d "defineNuxtConfig") (#eq? @p "vue") (#eq? @k "runtimeCompiler"))
  message: With the runtime compiler on, server island props that reach dynamic component resolution allow remote code execution on this Nuxt version (GHSA-9473-5f9j-94wq). Upgrade to 4.5.1 / 3.21.10 and turn the runtime compiler off unless you need it.
  source:
    url: https://nuxt.com/blog/v4-5-security
    doc: Nuxt blog - Security Patch Releases (4.5.1 / 3.21.10)
    doc_version: Nuxt 4.5.1 / 3.21.10
    retrieved: '2026-10-09'
    quote: You're affected only if you have enabled vue.runtimeCompiler (which is off by default)
  examples:
    bad: |
      export default defineNuxtConfig({ vue: { runtimeCompiler: true } })
    good: |
      export default defineNuxtConfig({ vue: { runtimeCompiler: false } })
  cwe:
  - CWE-94
  status: active
  rule_version: 1
- id: NUXT-SEC-SERVER-UNVALIDATED-BODY-001
  title: Server route reads the request body without validation
  language: javascript
  framework: nuxt
  kind: security
  category: security
  severity: minor
  applies_to:
    nuxt: '>=3.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - server/**/*.ts
    - server/**/*.js
    - '**/server/**/*.ts'
    - '**/server/**/*.js'
    query: |
      ((call_expression function: (identifier) @f) @match (#match? @f "^(readBody|getQuery|getRouterParams)$"))
  message: Validate untrusted input with readValidatedBody/getValidatedQuery (Standard Schema) before using it.
  ai_question: Is the body/query used without any validation?
  source:
    url: https://nuxt.com/docs/5.x/guide/going-further/server-imports
    doc: Nuxt docs - guide/going-further/server-imports
    doc_version: Nuxt 5 docs (5.x)
    retrieved: '2026-10-09'
    quote: readBody, readValidatedBody Read and parse the request body, optionally validated.
  examples:
    bad: |
      export default defineEventHandler(async (event) => {
        const body = await readBody(event)
        return db.insert(body)
      })
    good: |
      export default defineEventHandler(async (event) => {
        const body = await readValidatedBody(event, schema.parse)
        return db.insert(body)
      })
  status: active
  rule_version: 1
- id: NUXT-SEC-USEHEAD-INNERHTML-001
  title: Inline script/style innerHTML via useHead
  language: javascript
  framework: nuxt
  kind: security
  category: security
  severity: minor
  applies_to:
    nuxt: '>=3.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call_expression function: (identifier) @f arguments: (arguments (object (pair key: (property_identifier) @k) @match))) (#match? @f "^(useHead|useServerHead)$") (#eq? @k "script") (#match? @match "innerHTML|textContent|children"))
  message: Inline head scripts are an XSS sink; never interpolate untrusted data.
  ai_question: Does the inline script content include any untrusted/dynamic data?
  source:
    url: https://nuxt.com/docs/4.x/api/composables/use-head
    doc: Nuxt docs - api/composables/use-head
    doc_version: Nuxt 4 docs (4.x)
    retrieved: '2026-10-09'
    quote: If the data comes from a user or other untrusted source, we recommend you check out useHeadSafe
  examples:
    bad: |
      useHead({ script: [{ innerHTML: userSnippet }] })
    good: |
      useHead({ script: [{ src: '/analytics.js', defer: true }] })
  status: active
  rule_version: 1
- id: NUXT-SEC-USEHEAD-UNTRUSTED-001
  title: useHead with untrusted data (use useHeadSafe)
  language: javascript
  framework: nuxt
  kind: security
  category: security
  severity: major
  applies_to:
    nuxt: '>=3.0'
  detection:
