  language: javascript
  framework: nuxt
  kind: migration
  category: modules
  severity: minor
  applies_to:
    nuxt: '>=4.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression property: (property_identifier) @h) arguments: (arguments . (string (string_fragment) @e))) @match (#eq? @h "hook") (#eq? @e "builder:watch"))
    filters:
    - node.lacks_descendant_text:relative(
  message: Normalise the path with relative(srcDir, resolve(srcDir, path)) to work on Nuxt 3 and 4.
  source:
    url: https://nuxt.com/docs/4.x/getting-started/upgrade
    doc: Nuxt docs - getting-started/upgrade
    doc_version: Nuxt 4 docs (4.x)
    retrieved: '2026-10-09'
    quote: hook now emits a path which is absolute rather than relative to your project srcDir
  examples:
    bad: |
