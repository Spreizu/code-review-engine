  message: Use callOnce (or a plain action) for side effects; useAsyncData may re-run with nullish values.
  ai_question: Does the handler perform a side effect (store mutation/action) rather than returning fetched data?
  source:
    url: https://nuxt.com/docs/4.x/getting-started/data-fetching
    doc: Nuxt docs - getting-started/data-fetching
    doc_version: Nuxt 4 docs (4.x)
    retrieved: '2026-10-09'
