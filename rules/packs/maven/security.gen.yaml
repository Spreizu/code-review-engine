- id: MAVEN-SEC-VERSION-RANGE
  title: Dependency version range
  language: xml
  kind: security
  category: supply-chain
  severity: major
  applies_to:
    maven: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @n) (content (CharData) @match)) (#match? @n "^(version)$") (#match? @match "^\\s*[\\[(][^\\])]*,[^\\])]*[\\])]\\s*$"))
  message: Ranges re-resolve on every build (non-reproducible, can pull a compromised release); pin and update deliberately.
