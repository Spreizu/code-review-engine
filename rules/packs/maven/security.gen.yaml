rules:
- id: MAVEN-SEC-AWS-ACCESS-KEY
  title: AWS access key ID committed
  language: xml
  kind: security
  category: security
  severity: critical
  applies_to:
    maven: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((CharData) @match (#match? @match "(^|[^A-Z0-9])(AKIA|ASIA)[0-9A-Z]{16}([^A-Z0-9]|$)"))
  message: 'Long-term AWS access key committed: rotate it and load credentials from the environment/role instead.'
  source:
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
    doc: AWS access key ID committed
    doc_version: AWS IAM User Guide
    retrieved: '2026-10-09'
    quote: 'Access keys consist of two parts: an access key ID (for example, AKIAIOSFODNN7EXAMPLE ) and a secret access key (for example, wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY ).'
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <aws_access_key_id>AKIAIOSFODNN7EXAMPLE</aws_access_key_id>
        </properties>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <aws_profile>deploy</aws_profile>
        </properties>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-SEC-AZURE-STORAGE-KEY
  title: Azure storage account key in connection string
  language: xml
  kind: security
  category: security
  severity: critical
  applies_to:
    maven: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((CharData) @match (#match? @match "AccountKey=[A-Za-z0-9+/=]{20,}"))
  message: Storage account key committed; prefer managed identity or a Key Vault reference.
  source:
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-configure-connection-string
    doc: Azure storage account key in connection string
    doc_version: Azure Storage docs
    retrieved: '2026-10-09'
    quote: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1; AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==; BlobEndpoint=http:/
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <conn>DefaultEndpointsProtocol=https;AccountName=x;AccountKey=abcdefghijklmnopqrstuvwxyz0123==</conn>
        </properties>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <conn_env>AZURE_STORAGE_CONNECTION_STRING</conn_env>
        </properties>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-SEC-CHECKSUM-POLICY-LAX
  title: checksumPolicy warn/ignore
  language: xml
  kind: security
  category: supply-chain
  severity: major
  applies_to:
    maven: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @n) (content (CharData) @match)) (#match? @n "^(checksumPolicy)$") (#match? @match "^\\s*(warn|ignore)\\s*$"))
  message: Corrupted or tampered artifacts are accepted; use fail.
  source:
    url: https://maven.apache.org/pom.html
    doc: checksumPolicy warn/ignore
    doc_version: Maven 3.10 / 4.0
    retrieved: '2026-10-09'
    quote: <enabled>false</enabled> </releases> <snapshots> <enabled>true</enabled> <updatePolicy>always</updatePolicy> <checksumPolicy>fail</checksumPolicy> </snapshots> <name>Nexus Snapshots</name> <id>snapshots-repo</id> <url>https://oss.sonatype.org/content/repos
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <repositories>
          <repository>
            <id>c</id>
            <url>https://r</url>
            <releases>
              <checksumPolicy>ignore</checksumPolicy>
            </releases>
          </repository>
        </repositories>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <repositories>
          <repository>
            <id>c</id>
            <url>https://r</url>
            <releases>
              <checksumPolicy>fail</checksumPolicy>
            </releases>
          </repository>
        </repositories>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-SEC-GITHUB-TOKEN
  title: GitHub token committed
  language: xml
  kind: security
  category: security
  severity: critical
  applies_to:
    maven: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((CharData) @match (#match? @match "(gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,})"))
  message: 'GitHub token committed: revoke it and use an environment variable/secret.'
  source:
    url: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github
    doc: GitHub token committed
    doc_version: GitHub Docs
    retrieved: '2026-10-09'
