- id: MAVEN-SEC-GPG-PASSPHRASE-IN-POM
  title: GPG passphrase in the POM
  language: xml
  kind: security
  category: security
  severity: critical
  applies_to:
    maven: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @match) (content (CharData) @v)) (#match? @match "^(passphrase|gpg\\.passphrase)$") (#not-match? @v "^\\s*\\$\\{"))
  message: Signing passphrases must come from the agent or MAVEN_GPG_PASSPHRASE, not the POM.
  source:
    url: https://maven.apache.org/plugins/maven-gpg-plugin/usage.html
    doc: GPG passphrase in the POM
    doc_version: GPG plugin 3.2
    retrieved: '2026-10-09'
    quote: In agent-less (batch) sessions, typically on CI, you should provide passphrases via environment variable (see goals).
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <gpg.passphrase>hunter2</gpg.passphrase>
        </properties>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
