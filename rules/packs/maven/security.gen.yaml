  rule_version: 1
- id: MAVEN-SEC-HTTP-REPOSITORY
  title: Repository over plain HTTP
  language: xml
  kind: security
  category: security
  severity: critical
  applies_to:
    maven: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @r) (content (element (STag (Name) @u) (content (CharData) @match)))) (#match? @r "^(repository|pluginRepository|snapshotRepository|mirror)$") (#eq? @u "url") (#match? @match "^\\s*http://"))
  message: HTTP repositories are blocked since Maven 3.8.1 and allow artifact tampering; use HTTPS.
  source:
    url: https://maven.apache.org/docs/3.8.1/release-notes.html
    doc: Repository over plain HTTP
    doc_version: Maven 3.8.1
    retrieved: '2026-10-09'
    quote: 'ded a new external:http:* mirror selector (like existing external:* ), meaning “any external URL using HTTP”. The decision was made to block such external HTTP repositories by default: this is done by providing a mirror in the conf/settings.xml blocking insecure HTTP external URLs.'
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <repositories>
          <repository>
            <id>corp</id>
            <url>http://repo.example.com/m2</url>
          </repository>
        </repositories>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <repositories>
          <repository>
            <id>corp</id>
            <url>https://repo.example.com/m2</url>
          </repository>
        </repositories>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-SEC-JWT-LITERAL
  title: Hard-coded JSON Web Token
  language: xml
  kind: security
  category: security
  severity: major
  applies_to:
    maven: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((CharData) @match (#match? @match "eyJ[A-Za-z0-9_-]{10,}[.]eyJ[A-Za-z0-9_-]{10,}[.][A-Za-z0-9_-]+"))
  message: A bearer token is committed; tokens grant access until they expire.
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    doc: Hard-coded JSON Web Token
    doc_version: OWASP cheat sheet (2026)
    retrieved: '2026-10-09'
    quote: se credentials, Identity and Access Management (IAM) permissions, Secure Shell (SSH) keys, certificates, etc. Many organizations have them hardcoded within the source code in plaintext, littered throughout configuration files and configuration management tools.
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <auth>eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.abc123</auth>
        </properties>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <auth>${AUTH_TOKEN}</auth>
        </properties>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-SEC-PASSWORD-PROPERTY
  title: Password/secret literal in POM properties or configuration
  language: xml
  kind: security
  category: security
  severity: critical
  applies_to:
    maven: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @k) (content (CharData) @match)) (#match? @k "(?i)(password|passwd|secret|token|apikey|api\\.key|privatekey)$") (#not-match? @match "^\\s*(\\$\\{|\\$\\(|<|%|\\{\\{|\\*+$|changeme$|xxx+$|example|#@)"))
  message: Move credentials to settings.xml (encrypted) or environment variables.
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    doc: Password/secret literal in POM properties or configuration
    doc_version: OWASP cheat sheet (2026)
    retrieved: '2026-10-09'
    quote: se credentials, Identity and Access Management (IAM) permissions, Secure Shell (SSH) keys, certificates, etc. Many organizations have them hardcoded within the source code in plaintext, littered throughout configuration files and configuration management tools.
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <db.password>s3cr3t-Pass</db.password>
        </properties>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <db.password>${env.DB_PASSWORD}</db.password>
        </properties>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-SEC-PRIVATE-KEY
  title: PEM private key committed
  language: xml
  kind: security
  category: security
  severity: critical
  applies_to:
    maven: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((CharData) @match (#match? @match "-----BEGIN ([A-Z]+ )?PRIVATE KEY-----"))
    filters:
    - node.has_re:PRIVATE KEY-----([\s|"+]|\\[nr])*[A-Za-z0-9+/]{16}
  message: 'Private key material committed to the repository: revoke it and mount it from a secret store.'
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    doc: PEM private key committed
    doc_version: OWASP cheat sheet (2026)
    retrieved: '2026-10-09'
    quote: se credentials, Identity and Access Management (IAM) permissions, Secure Shell (SSH) keys, certificates, etc. Many organizations have them hardcoded within the source code in plaintext, littered throughout configuration files and configuration management tools.
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <key>-----BEGIN RSA PRIVATE KEY-----MIIEpAIBAAKCAQEAu1SU1L7VLPHCgcBIjt</key>
        </properties>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <key_file>/run/secrets/tls.key</key_file>
        </properties>
      </project>
    regressions:
    - code: |
        <project>
          <modelVersion>4.0.0</modelVersion>
          <properties>
            <pem_header>-----BEGIN PRIVATE KEY-----</pem_header>
          </properties>
        </project>
  status: active
  rule_version: 1
