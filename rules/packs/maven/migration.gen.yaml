rules:
- id: MAVEN-MIG-METAVERSION
  title: LATEST/RELEASE metaversion
  language: xml
  kind: removal
  category: supply-chain
  severity: major
  applies_to:
    maven: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @n) (content (CharData) @match)) (#match? @n "^(version)$") (#match? @match "^\\s*(LATEST|RELEASE)\\s*$"))
  message: Pin an explicit version.
  source:
    url: https://cwiki.apache.org/confluence/display/MAVEN/Maven+3.x+Compatibility+Notes
    doc: LATEST/RELEASE metaversion
    doc_version: Maven 3.x
    retrieved: '2026-10-09'
    quote: These metaversions were also recognized in the <version> element for a <plugin> declaration. For the sake of reproducible builds, Maven 3.x no longer supports usage of these metaversions in the POM. As a result, users will need to replace occurrences of these metaversions with a concrete version.
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <dependencies>
          <dependency>
            <groupId>org.slf4j</groupId>
            <artifactId>slf4j-api</artifactId>
            <version>LATEST</version>
          </dependency>
        </dependencies>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <dependencies>
          <dependency>
            <groupId>org.slf4j</groupId>
            <artifactId>slf4j-api</artifactId>
            <version>2.0.17</version>
          </dependency>
        </dependencies>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-MIG-MODULES-TO-SUBPROJECTS
  title: <modules> in a 4.1.0 model
  language: xml
  kind: deprecation
  category: deprecation
  severity: minor
  applies_to:
    maven: '>=4.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @match)) (#eq? @match "modules"))
    filters:
    - file.has_re:<modelVersion>\s*4\.1\.0
  message: Model 4.1.0 renames modules to subprojects.
  source:
    url: https://maven.apache.org/whatsnewinmaven4.html
    doc: <modules> in a 4.1.0 model
    doc_version: Maven 4.0
    retrieved: '2026-10-09'
    quote: 'Model version 4.1.0 contains a new <subprojects> element analogous to the now deprecated, but still usable, <modules> element. Note : Use the terms multi-project setup and single-project setup to differentiate between a Maven project wi'
  examples:
    bad: |
      <project>
        <modelVersion>4.1.0</modelVersion>
        <modules>
          <module>app</module>
        </modules>
      </project>
    good: |
      <project>
        <modelVersion>4.1.0</modelVersion>
        <subprojects>
          <subproject>app</subproject>
        </subprojects>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-MIG-POM-EXPRESSIONS
  title: ${pom.*} / bare ${version}-style expressions
  language: xml
  kind: deprecation
  category: deprecation
  severity: major
  applies_to:
    maven: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((CharData) @match (#match? @match "\\$\\{(pom\\.[a-zA-Z]|version\\}|artifactId\\}|groupId\\}|basedir\\})"))
  message: Use ${project.*}; Maven 4 removes ${pom.*} support.
  source:
    url: https://maven.apache.org/ref/current/maven-model-builder/
    doc: ${pom.*} / bare ${version}-style expressions
    doc_version: Maven 3.x/4.0
    retrieved: '2026-10-09'
    quote: 'Values are evaluated in sequence from different syntaxes: value evaluation result common examples project.* pom.* ( deprecated ) * ( deprecated ) POM content (see POM reference ) ${project.version} ${project.build.finalName} ${project.artifactId} ${projec'
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <build>
          <finalName>app-${pom.version}</finalName>
        </build>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <build>
          <finalName>app-${project.version}</finalName>
        </build>
