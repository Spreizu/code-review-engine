  status: active
  rule_version: 1
- id: MAVEN-MIG-POM-EXPRESSIONS-REMOVED
  title: ${pom.*} expressions under Maven 4
  language: xml
  kind: removal
  category: removal
  severity: critical
  applies_to:
    maven: '>=4.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((CharData) @match (#match? @match "\\$\\{pom\\.[a-zA-Z]"))
  message: Removed in Maven 4.
  source:
    url: https://maven.apache.org/whatsnewinmaven4.html
    doc: ${pom.*} expressions under Maven 4
    doc_version: Maven 4.0
    retrieved: '2026-10-09'
    quote: moving features that either should never have worked or were only kept for backward compatibility in Maven 3, for example using ${pom.*} expressions.
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <build>
          <finalName>app-${pom.version}</finalName>
        </build>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <build>
          <finalName>app-${project.version}</finalName>
        </build>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-MIG-ROOT-DIRECTORY-HACK
  title: Internal multiModuleProjectDirectory property
  language: xml
  kind: deprecation
  category: deprecation
  severity: minor
  applies_to:
    maven: '>=4.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((CharData) @match (#match? @match "\\$\\{maven\\.multiModuleProjectDirectory\\}"))
  message: Use ${project.rootDirectory} (Maven 4) / ${session.rootDirectory}.
  source:
    url: https://maven.apache.org/whatsnewinmaven4.html
    doc: Internal multiModuleProjectDirectory property
    doc_version: Maven 4.0
    retrieved: '2026-10-09'
    quote: past, some people “hacked” workarounds for the rootDirectory properties, mostly by using internal properties. Starting with Maven 4 those properties were removed or marked as deprecated. See JIRA issue MNG-7038 and the related Pull Request for MNG-7038 for more information.
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <root>${maven.multiModuleProjectDirectory}</root>
        </properties>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <root>${project.rootDirectory}</root>
        </properties>
      </project>
  status: active
  rule_version: 1
