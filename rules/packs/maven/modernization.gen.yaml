rules:
- id: MAVEN-MOD-COMPILER-SOURCE-TARGET
  title: -source/-target instead of --release
  language: xml
  kind: modernization
  category: modernization
  severity: minor
  applies_to:
    maven: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @match)) (#match? @match "^(maven\\.compiler\\.source|maven\\.compiler\\.target)$"))
      ((element (STag (Name) @c) (content (element (STag (Name) @match)))) (#eq? @c "configuration") (#match? @match "^(source|target)$"))
    filters:
    - file.lacks_re:maven\.compiler\.release|<release>
  message: 'Use maven.compiler.release (JDK 9+): it also checks API usage against the target platform.'
  source:
    url: https://maven.apache.org/plugins/maven-compiler-plugin/examples/set-compiler-source-and-target.html
    doc: -source/-target instead of --release
    doc_version: Maven 3.10 / 4.0
    retrieved: '2026-10-09'
    quote: 'rce>8</source> <target>8</target> </configuration> </plugin> </plugins> [...] </build> [...] </project> Note: Merely setting the target option does not guarantee that your code actually runs on a JRE with the specified version. The pitfall is unintended usage of APIs that only exist in later JREs which would make your code fail at runt'
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <maven.compiler.source>17</maven.compiler.source>
          <maven.compiler.target>17</maven.compiler.target>
        </properties>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <maven.compiler.release>17</maven.compiler.release>
        </properties>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-MOD-MODEL-VERSION-410
  title: Model 4.0.0 under Maven 4
  language: xml
  kind: modernization
  category: modernization
  severity: info
  applies_to:
    maven: '>=4.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @n) (content (CharData) @match)) (#match? @n "^(modelVersion)$") (#match? @match "^\\s*4\\.0\\.0\\s*$"))
  message: Maven 4 supports model 4.1.0 (subprojects, parent inference, <sources>, CI-friendly versions); the consumer POM stays 4.0.0.
  source:
    url: https://maven.apache.org/whatsnewinmaven4.html
    doc: Model 4.0.0 under Maven 4
    doc_version: Maven 4.0
    retrieved: '2026-10-09'
    quote: Maven 4 gets rid of this by renaming modules to projects and submodules to subprojects. Model version 4.1.0 contains a new <subprojects> element analogous to the now deprecated, but still usable, <modules> element.
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
      </project>
    good: |
      <project>
        <modelVersion>4.1.0</modelVersion>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-MOD-PARENT-INFERENCE
  title: Fully specified <parent> in a 4.1.0 model
  language: xml
  kind: modernization
  category: modernization
  severity: info
  applies_to:
    maven: '>=4.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @n)) @match (#match? @n "^(parent)$") (#match? @match "<relativePath>"))
    filters:
    - file.has_re:<modelVersion>\s*4\.1\.0
    - node.has_re:<groupId>
  message: Let Maven 4 infer parent coordinates.
  source:
    url: https://maven.apache.org/whatsnewinmaven4.html
    doc: Fully specified <parent> in a 4.1.0 model
    doc_version: Maven 4.0
    retrieved: '2026-10-09'
    quote: Parent inference When using model version 4.1.0, you can omit the <version> , <groupId> , and <artifactId> elements from <parent> by using a relative path. Maven will automatically infer these values by looking for a pom.xml file in the specified directory.
  examples:
    bad: |
      <project>
        <modelVersion>4.1.0</modelVersion>
        <parent>
          <groupId>com.acme</groupId>
          <artifactId>root</artifactId>
          <version>1.0</version>
          <relativePath>..</relativePath>
        </parent>
      </project>
    good: |
      <project>
        <modelVersion>4.1.0</modelVersion>
        <parent/>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-MOD-SOURCE-DIRECTORY-410
  title: <sourceDirectory>/<testSourceDirectory> in a 4.1.0 model
  language: xml
  kind: modernization
  category: modernization
  severity: info
  applies_to:
    maven: '>=4.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @match)) (#match? @match "^(sourceDirectory|testSourceDirectory)$"))
    filters:
    - file.has_re:<modelVersion>\s*4\.1\.0
  message: Model 4.1.0 declares source roots with <sources>.
  source:
    url: https://maven.apache.org/whatsnewinmaven4.html
    doc: <sourceDirectory>/<testSourceDirectory> in a 4.1.0 model
    doc_version: Maven 4.0
    retrieved: '2026-10-09'
    quote: rceDirectory>my-custom-dir/bar</testSourceDirectory> </build> </project> Maven 4 introduces the new <sources> element for this. Multiple <source> elements can be repeated, thus allowing multiple source directories without the need to resort to external plugins (like Build Helper
  examples:
    bad: |
      <project>
