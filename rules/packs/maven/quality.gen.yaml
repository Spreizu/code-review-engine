rules:
- id: MAVEN-QUAL-CI-FRIENDLY-VERSION
  title: Hard-coded version repeated in parent references
  language: xml
  kind: best-practice
  category: maintainability
  severity: info
  applies_to:
    maven: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @n)) @match (#match? @n "^(parent)$") (#match? @match "<version>\\s*[0-9]") (#not-match? @match "\\$\\{revision\\}"))
    filters:
    - file.has_re:<modules>|<subprojects>
  message: In multi-module builds use ${revision} (+ flatten plugin on Maven 3) to avoid editing every POM per release.
  ai_question: Is this an in-reactor parent (same repository) whose version is bumped together with the module?
  source:
    url: https://maven.apache.org/guides/mini/guide-maven-ci-friendly.html
    doc: Hard-coded version repeated in parent references
    doc_version: Maven 3.10 / 4.0
    retrieved: '2026-10-09'
    quote: 'Friendly Versions Starting with Maven 3.5.0-beta-1 you can use the ${revision} , ${sha1} and/or ${changelist} as placeholders for the version in your pom file. Single Project Setup This can look like this: <project> <modelVersion>4.0.0</modelVersion> <parent> <groupId>'
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <modules>
          <module>app</module>
        </modules>
        <parent>
          <groupId>com.acme</groupId>
          <artifactId>root</artifactId>
          <version>1.4.2</version>
        </parent>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <modules>
          <module>app</module>
        </modules>
        <parent>
          <groupId>com.acme</groupId>
          <artifactId>root</artifactId>
          <version>${revision}</version>
        </parent>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-QUAL-IMPORT-SCOPE-NOT-POM
  title: import scope outside dependencyManagement or without type pom
  language: xml
  kind: best-practice
  category: correctness
  severity: major
  applies_to:
    maven: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @n)) @match (#match? @n "^(dependency)$") (#match? @match "<scope>\\s*import\\s*</scope>") (#not-match? @match "<type>\\s*pom\\s*</type>"))
  message: A BOM import without <type>pom</type> is ignored.
  source:
    url: https://maven.apache.org/guides/introduction/introduction-to-dependency-mechanism.html
    doc: import scope outside dependencyManagement or without type pom
    doc_version: Maven 3.10 / 4.0
    retrieved: '2026-10-09'
    quote: Instead, it looks for a jar in the local file system at a specified path. import This scope is only supported on a dependency of type pom in the <dependencyManagement> section. It indicates the dependency is to be replaced with the effective list of dependencies in the specified POM's
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <dependencyManagement>
        <dependencies>
          <dependency>
            <groupId>org.junit</groupId>
            <artifactId>junit-bom</artifactId>
            <version>5.13.4</version>
            <scope>import</scope>
          </dependency>
        </dependencies>
        </dependencyManagement>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <dependencyManagement>
        <dependencies>
          <dependency>
            <groupId>org.junit</groupId>
            <artifactId>junit-bom</artifactId>
            <version>5.13.4</version>
            <type>pom</type>
            <scope>import</scope>
          </dependency>
        </dependencies>
        </dependencyManagement>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-QUAL-PLUGIN-METAVERSION-MISSING
  title: Plugin declared without version
  language: xml
  kind: best-practice
  category: supply-chain
  severity: minor
  applies_to:
    maven: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @n)) @match (#match? @n "^(plugin)$") (#match? @match "<artifactId>") (#not-match? @match "<version>"))
  message: Unpinned plugins take the Super POM/latest default, which changes with the Maven version.
  ai_question: Is the version not managed by pluginManagement here or in a parent POM (e.g. spring-boot-starter-parent)?
  source:
    url: https://maven.apache.org/enforcer/enforcer-rules/requirePluginVersions.html
    doc: Plugin declared without version
    doc_version: Maven 3.10 / 4.0
    retrieved: '2026-10-09'
    quote: 'Surefire Wagon ASF How Apache Works Foundation Data Privacy Sponsoring Apache Thanks Require Plugin Versions This rule enforces that all plugins have a version defined, either in the plugin or pluginManagement section of the pom or a parent pom. The following parameters are supported by this rule: message - an optional message to the user if the rule fa'
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <build>
          <plugins>
            <plugin>
              <artifactId>maven-surefire-plugin</artifactId>
            </plugin>
          </plugins>
        </build>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <build>
          <plugins>
            <plugin>
              <artifactId>maven-surefire-plugin</artifactId>
              <version>3.5.4</version>
            </plugin>
          </plugins>
        </build>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-QUAL-SKIP-TESTS
  title: Tests skipped in the POM
  language: xml
  kind: best-practice
  category: testing
  severity: major
  applies_to:
    maven: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @n) (content (CharData) @match)) (#match? @n "^(skipTests|skip|maven\\.test\\.skip|skipITs)$") (#match? @match "^\\s*true\\s*$"))
    filters:
    - file.has_re:maven\.test\.skip|skipTests|skipITs|surefire|failsafe
  message: Skipping tests in the POM disables them for everyone (and CI).
  ai_question: Is this skip unconditional (not inside a profile intended for quick local builds)?
  source:
    url: https://maven.apache.org/surefire/maven-surefire-plugin/test-mojo.html
    doc: Tests skipped in the POM
    doc_version: Surefire 3.5
    retrieved: '2026-10-09'
    quote: Its use is NOT RECOMMENDED, especially if you enable it using the "maven.test.skip" property, because maven.test.skip disables both running the tests and compiling the tests. Consider using the skipTests parameter instead.
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <maven.test.skip>true</maven.test.skip>
        </properties>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <java.version>21</java.version>
        </properties>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-QUAL-SNAPSHOT-DEPENDENCY
  title: SNAPSHOT dependency
  language: xml
  kind: best-practice
  category: supply-chain
  severity: minor
  applies_to:
    maven: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @n) (content (CharData) @match)) (#match? @n "^(version)$") (#match? @match "-SNAPSHOT\\s*$"))
    filters:
    - parent.lacks_re:<artifactId>[^<]*</artifactId>\s*<version>\$\{project\.version\}
  message: Snapshots change under you; release builds must not depend on them.
  ai_question: Is this an external SNAPSHOT (not a sibling module of the same reactor/version)?
  source:
    url: https://maven.apache.org/guides/getting-started/index.html
    doc: SNAPSHOT dependency
    doc_version: Maven 3.10 / 4.0
    retrieved: '2026-10-09'
    quote: The SNAPSHOT value refers to the ‘latest’ code along a development branch, and provides no guarantee the code is stable or unchanging.
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <dependencies>
          <dependency>
            <groupId>org.slf4j</groupId>
            <artifactId>slf4j-api</artifactId>
            <version>2.1.0-SNAPSHOT</version>
          </dependency>
        </dependencies>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <dependencies>
          <dependency>
            <groupId>org.slf4j</groupId>
            <artifactId>slf4j-api</artifactId>
            <version>2.0.17</version>
          </dependency>
        </dependencies>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-QUAL-SOURCE-ENCODING-MISSING
  title: project.build.sourceEncoding not set
  language: xml
  kind: best-practice
  category: best-practice
  severity: minor
  applies_to:
    maven: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @n)) @match (#eq? @n "project"))
    filters:
    - file.lacks_re:sourceEncoding|<parent>
  message: Without it resources/sources use the platform encoding, so builds differ between machines.
  source:
    url: https://maven.apache.org/general.html
    doc: project.build.sourceEncoding not set
    doc_version: Maven 3.10 / 4.0
    retrieved: '2026-10-09'
    quote: 'as adding the following property to your POM (or one of its parent POMs): <project> <!-- ... --> <properties> <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding> </properties> <!-- ...'
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <artifactId>a</artifactId>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <properties>
          <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
        </properties>
      </project>
  status: active
  rule_version: 1
- id: MAVEN-QUAL-SUREFIRE-OLD-JUNIT5
  title: Old Surefire with JUnit 5
  language: xml
  kind: best-practice
  category: testing
  severity: major
  applies_to:
    maven: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/pom.xml'
    query: |
      ((element (STag (Name) @n)) @match (#match? @n "^(plugin)$") (#match? @match "maven-(surefire|failsafe)-plugin</artifactId>\\s*<version>\\s*2\\.([0-9]|1[0-9]|2[01])\\."))
    filters:
    - file.has_re:junit-jupiter|junit-platform
  message: 'Surefire < 2.22 does not run JUnit Platform tests: they are silently skipped.'
  source:
    url: https://maven.apache.org/surefire/maven-surefire-plugin/examples/junit-platform.html
    doc: Old Surefire with JUnit 5
    doc_version: Surefire 3.5
    retrieved: '2026-10-09'
    quote: 'For example, if you want to write tests with Jupiter, add the test artifact junit-jupiter-engine to the dependencies in POM: <dependencies> [...] <dependency> <groupId>org.junit.jupiter</groupId> <artifactId>junit-jupiter-engine</art'
  examples:
    bad: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <dependencies>
          <dependency>
            <groupId>org.junit.jupiter</groupId>
            <artifactId>junit-jupiter</artifactId>
            <version>5.13.4</version>
          </dependency>
        </dependencies>
        <build>
          <plugins>
            <plugin>
              <artifactId>maven-surefire-plugin</artifactId>
              <version>2.19.1</version>
            </plugin>
          </plugins>
        </build>
      </project>
    good: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <dependencies>
          <dependency>
            <groupId>org.junit.jupiter</groupId>
            <artifactId>junit-jupiter</artifactId>
            <version>5.13.4</version>
          </dependency>
        </dependencies>
        <build>
          <plugins>
            <plugin>
              <artifactId>maven-surefire-plugin</artifactId>
              <version>3.5.4</version>
            </plugin>
          </plugins>
        </build>
      </project>
  status: active
  rule_version: 1
