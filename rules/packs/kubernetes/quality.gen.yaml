rules:
- id: KUBE-QUAL-NO-RESOURCE-LIMITS
  title: Container without resource limits
  language: yaml
  kind: best-practice
  category: security
  severity: info
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.yaml'
    - '**/*.yml'
    query: |
      ((block_mapping_pair key: (flow_node) @c value: (block_node (block_sequence (block_sequence_item (block_node (block_mapping) @match))))) (#eq? @c "containers"))
    filters:
    - file.has_re:(?m)^apiVersion:\s*\S
    - file.has_re:(?m)^kind:\s*\S
    - 'node.lacks_re:(?m)^\s+limits:'
    exclude_tests: true
  message: Without limits one container can exhaust the node's memory or CPU and starve its neighbours (denial of service). Set memory limits and requests.
  ai_question: Is there no LimitRange/policy in this deployment that applies default limits, and is this a long-running workload?
  source:
    url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
    doc: Container without resource limits
    doc_version: Kubernetes docs (v1.37)
    retrieved: '2026-10-09'
    quote: When you specify a resource limit for a container, the kubelet enforces those limits so that the running container is not allowed to use more of that resource than the limit you set.
  examples:
    bad: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: web
      spec:
        containers:
          - name: web
            image: nginx:1.29
    good: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: web
      spec:
        containers:
          - name: web
            image: nginx:1.29
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
  cwe:
  - CWE-770
  owasp:
  - K01:2022
  status: active
  rule_version: 1
