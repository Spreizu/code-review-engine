- id: KUBE-SEC-RBAC-WILDCARD
  title: RBAC rule grants wildcard verbs or resources
  language: yaml
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.yaml'
    - '**/*.yml'
    query: |
      ((block_mapping_pair key: (flow_node) @k value: (_) @match) (#match? @k "^(verbs|resources)$"))
    filters:
    - file.has_re:(?m)^apiVersion:\s*\S
    - file.has_re:(?m)^kind:\s*\S
    - file.has_re:(?m)^kind:\s*(Cluster)?Role\s*$
    - node.has_re:[\"']\*[\"']|^\s*-\s*\*\s*$|\[\s*\*\s*\]
    exclude_tests: true
  message: A wildcard grants every verb or resource, including ones added to the cluster later (CRDs, secrets). List the exact resources and verbs.
  source:
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
    doc: RBAC rule grants wildcard verbs or resources
    doc_version: Kubernetes docs (v1.37)
    retrieved: '2026-10-09'
    quote: Use RoleBindings as opposed to ClusterRoleBindings to give users rights only within a specific namespace. Avoid providing wildcard permissions when possible, especially to all resources. As Kubernetes is an extensible system, providing wildcard access gives rights not just to all object types th
  examples:
    bad: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: ops
      rules:
        - apiGroups: [""]
          resources: ["*"]
          verbs: ["*"]
    good: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: reader
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch"]
