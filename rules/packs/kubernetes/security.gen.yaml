    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    doc: seccomp profile set to Unconfined
    doc_version: Kubernetes docs (v1.37)
    retrieved: '2026-10-09'
    quote: .procMount spec.ephemeralContainers[*].securityContext.procMount Allowed Values Undefined/nil Default Seccomp Seccomp profile must not be explicitly set to Unconfined .
  examples:
    bad: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: web
      spec:
        containers:
          - name: web
            image: nginx:1.29
            securityContext:
              seccompProfile:
                type: Unconfined
    good: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: web
      spec:
        containers:
          - name: web
            image: nginx:1.29
            securityContext:
              seccompProfile:
                type: RuntimeDefault
