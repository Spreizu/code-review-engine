    quote: spec.ephemeralContainers[*].securityContext.seLinuxOptions.role Allowed Values Undefined/"" /proc Mount Type The default /proc masks are set up to reduce attack surface, and should be required. Restricted Fields spec.containers[*].securityContext.procMount spec.initContainers[*].securityContext.procMou
  examples:
