    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
    doc: Secret value written inline in a container env
    doc_version: Kubernetes docs (v1.37)
    retrieved: '2026-10-09'
    quote: A Pod can reference the Secret in a variety of ways, such as in a volume mount or as an environment variable. Secrets are designed for confidential data and ConfigMaps are designed for non-confidential data. The following good practices are intended for both cluster administrators and application developers.
  examples:
    bad: |
