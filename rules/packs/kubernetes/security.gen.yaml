- id: KUBE-SEC-SECCOMP-UNCONFINED
  title: seccomp profile set to Unconfined
  language: yaml
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.yaml'
    - '**/*.yml'
    query: |
      ((block_mapping_pair key: (flow_node) @p value: (block_node (block_mapping (block_mapping_pair key: (flow_node) @k value: (flow_node) @match)))) (#eq? @p "seccompProfile") (#eq? @k "type") (#match? @match "^[\"']?Unconfined[\"']?$"))
    filters:
    - file.has_re:(?m)^apiVersion:\s*\S
    - file.has_re:(?m)^kind:\s*\S
    exclude_tests: true
  message: Unconfined turns off syscall filtering, widening the kernel attack surface. Use RuntimeDefault (or a Localhost profile).
