- id: KUBE-SEC-RUN-AS-ROOT
  title: Container explicitly runs as root
  language: yaml
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.yaml'
    - '**/*.yml'
    query: |
      ((block_mapping_pair key: (flow_node) @k value: (flow_node) @match) (#match? @k "^(runAsUser|runAsNonRoot)$") (#match? @match "^[\"']?(0|false)[\"']?$"))
    filters:
    - file.has_re:(?m)^apiVersion:\s*\S
    - file.has_re:(?m)^kind:\s*\S
    exclude_tests: true
  message: 'The container process runs as UID 0, so any escape or writable host mount acts as root. Run as a non-root UID and set runAsNonRoot: true.'
  source:
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    doc: Container explicitly runs as root
    doc_version: Kubernetes docs (v1.37)
    retrieved: '2026-10-09'
    quote: Running as Non-root user (v1.23+) Containers must not set runAsUser to 0 Restricted Fields spec.securityContext.runAsUser spec.containers[*].securityContext.runAsUser spec.initContai
  examples:
    bad: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: web
      spec:
        containers:
          - name: web
            image: nginx:1.29
            securityContext:
              runAsUser: 0
    good: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: web
      spec:
        containers:
          - name: web
            image: nginx:1.29
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
  cwe:
  - CWE-250
  owasp:
  - K01:2022
  status: active
  rule_version: 1
