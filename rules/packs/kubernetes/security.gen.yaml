       ((block_mapping_pair key: (flow_node) @p value: (block_node (block_mapping (block_mapping_pair key: (flow_node) @k value: (flow_node) @match)))) (#eq? @p "seLinuxOptions") (#eq? @k "user") (#match? @match "."))
       ((block_mapping_pair key: (flow_node) @p value: (block_node (block_mapping (block_mapping_pair key: (flow_node) @k value: (flow_node) @match)))) (#eq? @p "seLinuxOptions") (#eq? @k "role") (#match? @match "."))
