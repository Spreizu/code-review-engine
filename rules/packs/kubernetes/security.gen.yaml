- id: KUBE-SEC-UNSAFE-SYSCTL
  title: Pod sets a sysctl outside the safe set
  language: yaml
  kind: security
  category: security
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.yaml'
    - '**/*.yml'
    query: |
      ((block_mapping_pair key: (flow_node) @k value: (flow_node) @match) (#eq? @k "name") (#match? @match "^[\"']?(kernel|net|vm|fs)\\.") (#not-match? @match "^[\"']?(kernel\\.shm_rmid_forced|net\\.ipv4\\.ip_local_port_range|net\\.ipv4\\.ip_unprivileged_port_start|net\\.ipv4\\.tcp_syncookies|net\\.ipv4\\.ping_group_range|net\\.ipv4\\.ip_local_reserved_ports|net\\.ipv4\\.tcp_keepalive_time|net\\.ipv4\\.tcp_fin_timeout|net\\.ipv4\\.tcp_keepalive_intvl|net\\.ipv4\\.tcp_keepalive_probes|net\\.ipv4\\.tcp_rmem|net\\.ipv4\\.tcp_wmem)[\"']?$"))
    filters:
    - file.has_re:(?m)^apiVersion:\s*\S
    - file.has_re:(?m)^kind:\s*\S
    - 'file.has_re:sysctls:'
    exclude_tests: true
  message: This sysctl is not namespaced per pod (or is not in the baseline safe list), so it can weaken or change kernel behaviour for every container on the node. Remove it or set it at node level deliberately.
  source:
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    doc: Pod sets a sysctl outside the safe set
    doc_version: Kubernetes docs (v1.37)
    retrieved: '2026-10-09'
    quote: ntainers[*].securityContext.seccompProfile.type Allowed Values Undefined/nil RuntimeDefault Localhost Sysctls Sysctls can disable security mechanisms or affect all containers on a host, and should be disallowed except for an allowed "safe" subset.
  examples:
    bad: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: web
      spec:
        securityContext:
          sysctls:
            - name: kernel.msgmax
              value: "65536"
        containers:
          - name: web
            image: nginx:1.29
    good: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: web
      spec:
        securityContext:
          sysctls:
            - name: net.ipv4.ip_local_port_range
              value: "32768 60999"
        containers:
          - name: web
            image: nginx:1.29
  cwe:
  - CWE-693
  owasp:
  - K01:2022
  status: active
  rule_version: 1
- id: KUBE-SEC-WINDOWS-HOSTPROCESS
  title: Windows HostProcess container
  language: yaml
  kind: security
  category: security
  severity: critical
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.yaml'
    - '**/*.yml'
    query: |
      ((block_mapping_pair key: (flow_node) @k value: (flow_node) @match) (#eq? @k "hostProcess") (#match? @match "^[\"']?true[\"']?$"))
    filters:
    - file.has_re:(?m)^apiVersion:\s*\S
    - file.has_re:(?m)^kind:\s*\S
    exclude_tests: true
  message: A HostProcess container runs directly on the Windows node with host privileges. Use it only for node agents.
  ai_question: Is this a Windows node agent (CNI, CSI, monitoring) that genuinely needs host access?
  source:
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    doc: Windows HostProcess container
    doc_version: Kubernetes docs (v1.37)
    retrieved: '2026-10-09'
    quote: Baseline policy specification Control Policy HostProcess Windows Pods offer the ability to run HostProcess containers which enables privileged access to the Windows host machine. Privileged access to the host is disallowed in the Baseline policy.
  examples:
    bad: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: web
      spec:
        containers:
          - name: web
            image: nginx:1.29
            securityContext:
              windowsOptions:
                hostProcess: true
    good: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: web
      spec:
        containers:
          - name: web
            image: nginx:1.29
            securityContext:
              windowsOptions:
                runAsUserName: ContainerUser
  cwe:
  - CWE-250
  owasp:
  - K01:2022
  status: active
  rule_version: 1
