rules:
- id: PKG-SEC-DEP-HTTP-TARBALL
  title: Dependency fetched over plain http://
  language: json
  kind: security
  category: security
  severity: critical
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/package.json'
    query: |
      (document (object (pair key: (string (string_content) @s (#match? @s "^(dependencies|devDependencies|peerDependencies|optionalDependencies)$")) value: (object (pair key: (string) value: (string (string_content) @match (#match? @match "^(git\\+)?http://")))))))
  message: Code fetched over cleartext HTTP can be tampered with in transit.
  source:
    url: https://docs.npmjs.com/cli/v12/configuring-npm/package-json
    doc: Dependency fetched over plain http://
    doc_version: npm 12 docs
    retrieved: '2026-10-09'
    quote: '"npm:pkg@1.0.0" } } URLs as Dependencies You may specify a tarball URL in place of a version range.'
  examples:
    bad: '{"dependencies": {"lib": "http://cdn.example.com/lib-1.0.0.tgz"}}'
    good: '{"dependencies": {"lib": "https://cdn.example.com/lib-1.0.0.tgz"}}'
  status: active
  rule_version: 1
- id: PKG-SEC-DEP-TARBALL-URL
  title: Dependency from a remote tarball URL
  language: json
  kind: security
  category: dependencies
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/package.json'
    query: |
      (document (object (pair key: (string (string_content) @s (#match? @s "^(dependencies|devDependencies|peerDependencies|optionalDependencies)$")) value: (object (pair key: (string) value: (string (string_content) @match (#match? @match "^https://.*[.](tgz|tar[.]gz)$")))))))
  message: Tarball URLs bypass registry metadata, audit and provenance; prefer a registry version.
  source:
    url: https://docs.npmjs.com/cli/v12/configuring-npm/package-json
    doc: Dependency from a remote tarball URL
    doc_version: npm 12 docs
    retrieved: '2026-10-09'
    quote: '"npm:pkg@1.0.0" } } URLs as Dependencies You may specify a tarball URL in place of a version range.'
