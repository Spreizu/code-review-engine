- id: PKG-QUAL-DEP-DUPLICATED
  title: Package listed in both dependencies and devDependencies
  language: json
  kind: anti-pattern
  category: dependencies
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/package.json'
    query: |
      (document (object (pair key: (string (string_content) @a (#eq? @a "dependencies")) value: (object (pair key: (string) @d))) (pair key: (string (string_content) @b (#eq? @b "devDependencies")) value: (object (pair key: (string) @match))) (#eq? @d @match)))
  message: A package in both sections is ambiguous; keep it in one.
  source:
    url: https://docs.npmjs.com/cli/v12/configuring-npm/package-json
    doc: Package listed in both dependencies and devDependencies
    doc_version: npm 12 docs
    retrieved: '2026-10-09'
    quote: probably don't want or need to download and build the external test or documentation framework that you use. In this case, it's best to map these additional items in a devDependencies object. These things will be installed when doing npm link or npm install from the root of a package, and can be mana
  examples:
    bad: '{"dependencies": {"lodash": "^4"}, "devDependencies": {"lodash": "^4"}}'
    good: '{"dependencies": {"lodash": "^4"}}'
  status: active
  rule_version: 1
