- id: PKG-QUAL-EXPORTS-DEFAULT-NOT-LAST
  title: '"default" export condition is not last'
  language: json
  kind: anti-pattern
  category: exports
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/package.json'
    query: |
      (pair key: (string (string_content) @e (#eq? @e "exports")) value: [(object (pair key: (string (string_content) @match (#eq? @match "default"))) (pair)) (object (pair value: (object (pair key: (string (string_content) @match (#eq? @match "default"))) (pair))))])
  message: Conditions are matched in order; anything after "default" is unreachable.
  source:
    url: https://nodejs.org/api/packages.html
    doc: '"default" export condition is not last'
    doc_version: Node.js 26
    retrieved: '2026-10-09'
    quote: Can be a CommonJS or ES module file. This condition should always come last. Within the "exports" object, key order is significant.
  examples:
    bad: '{"exports": {"default": "./index.js", "import": "./index.mjs"}}'
    good: '{"exports": {"import": "./index.mjs", "default": "./index.js"}}'
  status: active
  rule_version: 1
- id: PKG-QUAL-EXPORTS-TYPES-NOT-FIRST
  title: '"types" export condition is not first'
  language: json
  kind: anti-pattern
  category: exports
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
