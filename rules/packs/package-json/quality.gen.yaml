  kind: best-practice
  category: manifest
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/package.json'
    query: |
      (document (object (pair key: (string (string_content) @k (#eq? @k "version")) value: (string (string_content) @match (#not-match? @match "^v?[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$")))))
  message: Use a full MAJOR.MINOR.PATCH version.
