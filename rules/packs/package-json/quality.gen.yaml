    query: |
      (document (object (pair key: (string (string_content) @m (#eq? @m "main"))) @match (pair key: (string (string_content) @e (#eq? @e "exports")))))
  message: When exports exists, main is ignored by modern Node; make sure both point at the same entry (main only serves old tools).
  ai_question: Do "main" and the "." entry of "exports" point to different files (so old and new resolvers load different code)?
