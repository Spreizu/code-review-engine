  source:
    url: https://nodejs.org/api/packages.html
    doc: '"type" field with an invalid value'
    doc_version: Node.js 26
    retrieved: '2026-10-09'
    quote: Explicit markers are .mjs or .cjs extensions, package.json "type" fields with either "module" or "commonjs" values, or the --input-type flag.
  examples:
    bad: '{"type": "esm"}'
    good: '{"type": "module"}'
  status: active
  rule_version: 1
- id: PKG-QUAL-VERSION-NOT-SEMVER
