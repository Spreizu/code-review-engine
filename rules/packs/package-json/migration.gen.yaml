- id: PKG-MIG-LICENSE-OBJECT
  title: Legacy license object / licenses array
  language: json
  kind: deprecation
  category: manifest
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/package.json'
    query: |
      (pair key: (string (string_content) @match (#eq? @match "licenses")))
      (pair key: (string (string_content) @match (#eq? @match "license")) value: (object))
  message: Use a single SPDX expression string, e.g. "(MIT OR Apache-2.0)".
  source:
    url: https://docs.npmjs.com/cli/v12/configuring-npm/package-json
    doc: Legacy license object / licenses array
    doc_version: npm 12 docs
    retrieved: '2026-10-09'
    quote: '"SEE LICENSE IN <filename>" } Then include a file named <filename> at the top level of the package. Some old packages used license objects or a "licenses" property containing an array of license objects: // Not valid metadata { "license" : { "type" : "ISC" , "url" : "https'
  examples:
    bad: '{"license": {"type": "MIT", "url": "https://x"}}'
    good: '{"license": "MIT"}'
  status: active
  rule_version: 1
- id: PKG-MIG-OVERRIDES-OLD-NPM
  title: '`overrides` with npm < 8.3'
  language: json
  kind: migration
  category: dependencies
  severity: major
  applies_to:
    npm: <8.3
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/package.json'
    query: |
      (document (object (pair key: (string (string_content) @k (#eq? @k "overrides")) value: (_) @match)))
  message: npm before 8.3 ignores `overrides`; upgrade npm or the override is silently ineffective.
  source:
    url: https://docs.npmjs.com/cli/v12/configuring-npm/package-json
    doc: '`overrides` with npm < 8.3'
    doc_version: npm 12 docs
    retrieved: '2026-10-09'
    quote: Paths devDependencies peerDependencies peerDependenciesMeta bundleDependencies optionalDependencies overrides Replacing a dependency with a fork packageExtensions engines os cpu libc devEngines private publishConfig workspaces DEFAULT VALUES SEE ALSO Des
  examples:
    bad: '{"overrides": {"foo": "1.0.0"}}'
    good: '{"engines": {"npm": ">=8.3"}, "dependencies": {"foo": "1.0.0"}}'
  status: active
  rule_version: 1
