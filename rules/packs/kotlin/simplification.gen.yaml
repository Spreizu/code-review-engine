- id: KT-SIMP-HELPER-DISTINCT
  title: Hand-written distinct helper
  language: kotlin
  kind: modernization
  category: simplification
  severity: minor
  applies_to:
    kotlin: '*'
  detection:
    mode: ai-confirm
    engine: index
    check: helper-replacement
    config:
      names:
      - unique
      - uniq
      - dedupe
      - removeDuplicates
      - distinctItems
      api: distinct()
      uses:
      - distinct
      - toSet
      requires_loop: true
      max_lines: 40
  message: This hand-written helper re-implements distinct() from the standard library. Use it directly and delete the helper.
  fix: Prefer the simplest code that works. When a shortcut is deliberate, add a `limit:` comment saying how far it holds (e.g. input size, request rate) and what to switch to beyond that.
  ai_question: Does this function behave the same as distinct() for every input its callers pass (same result, ordering and edge cases), so it can be replaced by distinct()?
  source:
    url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.collections/distinct.html
    doc: distinct()
    doc_version: Kotlin 2.2
    retrieved: '2026-10-09'
    quote: List < T > ( source ) Returns a list containing only distinct elements from the given collection.
  examples:
    bad: |
      fun unique(xs: List<String>): List<String> {
          val out = mutableListOf<String>()
          for (x in xs) { if (x !in out) out.add(x) }
          return out
      }
    good: |
      fun tags(xs: List<String>) = xs.distinct()
  tags:
  - simplify
  - index
  - stdlib
  - simplification
  status: active
  rule_version: 1
