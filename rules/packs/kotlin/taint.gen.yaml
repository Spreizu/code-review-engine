- id: KT-TAINT-CMDI
  title: OS command built from request data
  language: kotlin
  kind: security
  category: security
  severity: critical
  applies_to:
    kotlin: '*'
  detection:
    mode: ai-confirm
    engine: taint
    config:
      class: cmdi
    exclude_tests: true
  message: Request data reaches a process/shell command in this function. Avoid the shell, pass a fixed program with separate arguments, and validate values against an allow-list.
  ai_question: Does untrusted request data really flow, along the path shown in the evidence, into this os command built from sink without an effective guard (allow-list, type conversion, encoder or parameter binding) for this context? Answer no if the value is constant on every path, validated, or the sink is not reachable with attacker data.
  source:
    url: https://www.oracle.com/java/technologies/javase/seccodeguide.html
    doc: Secure Coding Guidelines for Java SE (INJECT-4)
    doc_version: current
    retrieved: '2026-10-09'
    quote: Avoid any untrusted data on the command line When creating new processes, do not place any untrusted data on the command line.
  examples:
    bad: |
      import javax.servlet.http.HttpServletRequest

      fun ping(request: HttpServletRequest) {
          val host = request.getParameter("host")
          Runtime.getRuntime().exec("ping -c 1 " + host)
      }
    good: |
      import javax.servlet.http.HttpServletRequest

      fun ping(request: HttpServletRequest) {
          val count = request.getParameter("count").toInt()
          Runtime.getRuntime().exec("ping -c $count localhost")
      }
