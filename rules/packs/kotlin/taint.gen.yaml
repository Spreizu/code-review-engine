    doc: OWASP LDAP Injection Prevention Cheat Sheet
    doc_version: current
    retrieved: '2026-10-09'
    quote: For general information about LDAP please visit lightweight directory access protocol (LDAP) . LDAP Injection is an attack used to exploit web based applications that construct LDAP statements based on user input.
  examples:
    bad: |
