    doc: OWASP Regular expression Denial of Service - ReDoS
    doc_version: current
    retrieved: '2026-10-09'
    quote: tions may reach extreme situations that cause them to work very slowly (exponentially related to input size). An attacker can then cause a program using a Regular Expression (Regex) to enter these extreme situations and then hang for a very long time.
  examples:
    bad: |
      import java.sql.Connection
      import javax.servlet.http.HttpServletRequest

      fun find(request: HttpServletRequest, text: String): Boolean {
          val q = request.getParameter("q")
          return Regex(q).containsMatchIn(text)
      }
