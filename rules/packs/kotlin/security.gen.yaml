- id: KT-SEC-HEADER-FROM-REQUEST
  title: Request value written into a response header
  language: kotlin
  kind: security
  category: security
  severity: minor
  applies_to:
    kotlin: '>=1.6'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
