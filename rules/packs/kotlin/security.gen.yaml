- id: KT-SEC-STACKTRACE-TO-RESPONSE
  title: Stack trace sent in the HTTP response (Kotlin)
  language: kotlin
  kind: security
  category: security
  severity: major
  applies_to:
    kotlin: '>=1.6'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.kt'
    query: |
      ((call_expression [(identifier) (navigation_expression (_) (identifier))] @c (value_arguments (value_argument) @a)) @match (#match? @c "(^|\\.)(respond|respondText|write|print|println)$") (#match? @a "stackTraceToString\\(\\)|printStackTrace"))
    filters:
    - file.has_re:respond|HttpServletResponse|ServerResponse
    exclude_tests: true
  message: The response carries a stack trace or raw exception text, which reveals file paths, library versions and sometimes queries. Log the details server-side and return a generic message with a correlation id.
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
    doc: Stack trace sent in the HTTP response (Kotlin)
    doc_version: OWASP Cheat Sheet Series (current)
    retrieved: '2026-10-09'
    quote: The outcome being that when an unexpected error occurs then a generic response is returned by the application but the error details are logged server side for investigation, and not returned to the user.
  examples:
    bad: |
      fun Application.errors() {
          install(StatusPages) {
              exception<Throwable> { call, cause ->
                  call.respondText(cause.stackTraceToString(), status = HttpStatusCode.InternalServerError)
              }
          }
      }
    good: |
      fun Application.errors() {
          install(StatusPages) {
              exception<Throwable> { call, cause ->
