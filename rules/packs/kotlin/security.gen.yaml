    query: |
      ((call_expression (navigation_expression (_) (identifier) @m) (value_arguments . (value_argument) . (value_argument) @v .)) @match (#match? @m "^(setHeader|addHeader|header|append)$") (#match? @v "(getParameter|getHeader)\\(|\\.(parameters|queryParameters|headers)\\["))
    filters:
    - node.lacks_re:replace\(|filter|encode|sanitize
    exclude_tests: true
  message: A request value goes straight into a response header. If the server stack does not reject CR/LF, the value can split the response or inject headers/cookies. Validate it against an allow-list or strip CR and LF.
  ai_question: Does the header value come from the request without CR/LF filtering, on a server stack that does not reject CR/LF in header values itself?
  source:
    url: https://cwe.mitre.org/data/definitions/113.html
    doc: Request value written into a response header
    doc_version: MITRE CWE
    retrieved: '2026-10-09'
