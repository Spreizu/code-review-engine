  applies_to:
    kotlin: '>=1.6'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.kt'
    query: |
      [((binary_expression left: [(identifier) (navigation_expression)] @l right: [(identifier) (navigation_expression)] @r) @match (#match? @match "^\\S+\\s*[!=]=\\s*\\S+$") (#match? @l "(?i)(signature|hmac|digest|secret|api_?key|(api|access|auth|csrf|xsrf|reset|session|bearer|refresh|expected|stored|provided|given|user|verify|verification|webhook)_?token)$") (#not-match? @r "^(null|nil|None|undefined|NaN|true|false)$"))
               ((binary_expression left: [(identifier) (navigation_expression)] @l2 right: [(identifier) (navigation_expression)] @r2) @match (#match? @match "^\\S+\\s*[!=]=\\s*\\S+$") (#match? @r2 "(?i)(signature|hmac|digest|secret|api_?key|(api|access|auth|csrf|xsrf|reset|session|bearer|refresh|expected|stored|provided|given|user|verify|verification|webhook)_?token)$") (#not-match? @l2 "^(null|nil|None|undefined|NaN|true|false)$"))]
    filters:
    - file.lacks_re:MessageDigest\.isEqual
    exclude_tests: true
  message: A secret (token, signature, HMAC) is compared with an ordinary equality operator, which returns as soon as a byte differs; the response time leaks how much of a guess was right. Use a constant-time comparison.
  ai_question: Is one side a secret (HMAC, signature, API token, password hash) and the other an attacker-supplied value, e.g. from a request?
  source:
    url: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/security/MessageDigest.html
    doc: Secret compared with == instead of MessageDigest.isEqual
    doc_version: Java SE 21 API
    retrieved: '2026-10-09'
    quote: ) Returns the provider of this message digest object. static boolean isEqual (byte[] digesta, byte[] digestb) Compares two digests for equality. void reset () Resets the digest for further use.
  examples:
    bad: |
      fun ok(given: String, expectedSignature: String): Boolean {
          return given == expectedSignature
      }
    good: |
      fun ok(given: ByteArray, expectedSignature: ByteArray): Boolean {
          return java.security.MessageDigest.isEqual(given, expectedSignature)
      }
  cwe:
  - CWE-208
  asvs:
  - V11.2.4
  status: active
  rule_version: 1
  tags:
  - appsec
