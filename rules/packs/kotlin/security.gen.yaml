- id: KT-SEC-XXE
  title: XML parser factory without XXE hardening
  language: kotlin
  kind: security
  category: security
  severity: major
  applies_to:
    kotlin: '>=1.6'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.kt'
    query: |
      ((call_expression (navigation_expression (identifier) @c (identifier) @m)) @match (#match? @c "^(DocumentBuilderFactory|SAXParserFactory|XMLInputFactory|TransformerFactory|SchemaFactory)$") (#match? @m "^(newInstance|newDefaultInstance|newFactory|newDefaultFactory)$"))
    filters:
    - file.lacks_re:disallow-doctype-decl|SUPPORT_DTD|ACCESS_EXTERNAL_DTD|IS_SUPPORTING_EXTERNAL_ENTITIES
    exclude_tests: true
  message: This factory keeps DTDs and external entities enabled, so XML from an untrusted source can read local files or reach internal hosts (XXE). Disable doctype declarations, or set ACCESS_EXTERNAL_DTD/SCHEMA to empty.
  ai_question: Is the XML parsed from an untrusted source, and are DTDs/external entities left enabled for this factory?
  source:
    url: https://www.oracle.com/java/technologies/javase/seccodeguide.html
    doc: XML parser factory without XXE hardening
    doc_version: Secure Coding Guidelines for Java SE (current)
    retrieved: '2026-10-09'
    quote: s to be defined as system entities, such as local files and HTTP URLs within the local intranet or localhost. XML External Entity (XXE) attacks insert local files into XML data which may then be accessible to the client. Similar attacks may be made using XInclude, the XSLT document function, and the XSLT import and include eleme
  examples:
    bad: |
      fun parse(input: InputStream) = DocumentBuilderFactory.newInstance().newDocumentBuilder().parse(input)
    good: |
      fun parse(input: InputStream): Document {
          val f = DocumentBuilderFactory.newInstance()
          f.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true)
          return f.newDocumentBuilder().parse(input)
      }
  cwe:
  - CWE-611
  asvs:
  - V1.5.1
  status: active
  rule_version: 1
  tags:
  - appsec
