  examples:
    bad: |
      fun h(request: HttpServletRequest, response: HttpServletResponse) {
          response.setHeader("X-Trace", request.getParameter("trace"))
      }
    good: |
      fun h(request: HttpServletRequest, response: HttpServletResponse) {
          response.setHeader("X-Trace", request.getParameter("trace")?.filter { it != '\r' && it != '\n' })
