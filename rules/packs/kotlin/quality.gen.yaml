- id: KT-QUAL-VAR-NEVER-REASSIGNED
  title: Local var that could be val
  language: kotlin
  kind: anti-pattern
  category: style
  severity: info
  applies_to:
    kotlin: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.kt'
    - '**/*.kts'
    - '!**/*.gradle.kts'
    query: |
      ((function_body (block (property_declaration (variable_declaration (identifier) @name)) @match)) (#match? @match "^var\\b"))
    filters:
    - node.has_re:^var\s+\w+\s*(:[^=]+)?=
    - node.lacks_re:\bby\b
    - func.count_lt:2:\b{cap:name}\s*(:[^=\n]+)?([-+*/%]?=[^=]|\+\+|--)|(\+\+|--)\s*{cap:name}\b
  message: Prefer immutable locals.
  ai_question: Is this var never reassigned after initialization within the function?
  source:
    url: https://kotlinlang.org/docs/coding-conventions.html
    doc: Local var that could be val
    doc_version: Kotlin 2.4
    retrieved: '2026-10-09'
    quote: '"object" } """ Idiomatic use of language features Immutability Prefer using immutable data to mutable. Always declare local variables and properties as val rather than var if they are not modified after initialization. Always use immutable collection interfaces ( Collection , List , Set , Map ) to declare collections which are'
  examples:
    bad: |
      fun f(): Int {
          var x = compute()
          return x
      }
    good: |
      fun f(): Int {
          val x = compute()
          return x
      }
    regressions:
    - code: |
        fun f(): Int {
            var idx: Map<String, Int>? = null
            if (idx == null) idx = load()
            var n = 0
            repeat(3) { n++ }
            var s = 1
            s += 2
            var on by remember { mutableStateOf(false) }
            return n + s
        }
    - code: |
        class T {
            @Test
            fun testSuspendMain() {
                Assumptions.assumeTrue(dialect == TestDB.POSTGRESQL)

                val latch = CountDownLatch(1)
                var exception: Throwable? = null

                suspend {
                    val db = TestDB.POSTGRESQL.connect()

                    suspendTransaction(db) {
                        SchemaUtils.create(UsersTable)
                    }
                }
                    /**
                     * The main reason for such a coroutine starting is to get
                     * [EmptyCoroutineContext] as coroutine context. It will guarantee
                     * that coroutine dispatcher will be `null` what could lead
                     * to wrong transaction switching
                     */
                    .startCoroutine(object : Continuation<Unit> {
                        override val context = EmptyCoroutineContext

                        override fun resumeWith(result: Result<Unit>) {
                            result.onFailure { exception = it }
                            latch.countDown()
                        }
                    })

                // Wait for completion with timeout
                if (!latch.await(10, TimeUnit.SECONDS)) {
                    throw AssertionError("Test did not complete within 10 seconds")
                }

                assertNull(exception)
            }
        }
  status: active
  rule_version: 1
- id: KT-QUAL-WHEN-SUBJECT-ELSE
  title: when used as statement on a sealed/enum value without else
  language: kotlin
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    kotlin: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.kt'
    - '**/*.kts'
    - '!**/*.gradle.kts'
    query: |
      (when_expression (when_subject) . (when_entry) (when_entry)? .) @match
    filters:
    - node.lacks_re:\belse\b
  message: A non-exhaustive when silently ignores other values.
  ai_question: Is the subject not a sealed/enum/Boolean type covered exhaustively, so other values are silently ignored?
  source:
    url: https://kotlinlang.org/docs/control-flow.html
    doc: when used as statement on a sealed/enum value without else
    doc_version: Kotlin 2.4
    retrieved: '2026-10-09'
    quote: Statements If you use when as a statement, you don't need to cover all possible cases. In this example, some cases aren't covered, so no branch is triggered.
  examples:
    bad: |
      when (x) { "a" -> 1 }
    good: |
      when (x) { "a" -> 1; else -> 0 }
  status: active
  rule_version: 1
