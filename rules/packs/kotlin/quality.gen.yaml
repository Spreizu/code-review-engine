- id: KT-QUAL-NEW-THREAD-CONTEXT-LEAK
  title: newSingleThreadContext/newFixedThreadPoolContext never closed
  language: kotlin
  kind: anti-pattern
  category: resources
  severity: major
  applies_to:
    kotlin: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.kt'
    - '**/*.kts'
    - '!**/*.gradle.kts'
    query: |
      ((function_body (block) @b) @match (#match? @b "new(SingleThread|FixedThreadPool)Context\\(") (#not-match? @b "\\.(use|close)\\b"))
  message: Release the thread with close()/use {} or keep a single top-level instance.
  source:
    url: https://kotlinlang.org/docs/coroutine-context-and-dispatchers.html
    doc: newSingleThreadContext/newFixedThreadPoolContext never closed
    doc_version: kotlinx.coroutines 1.10
    retrieved: '2026-10-09'
    quote: A dedicated thread is a very expensive resource. In a real application it must be either released, when no longer needed, using the close function, or stored in a top-level variable and reused throughout the application.
  examples:
    bad: |
      fun f() {
          val ctx = newSingleThreadContext("w")
          runBlocking(ctx) { work() }
      }
    good: |
      fun f() {
          newSingleThreadContext("w").use { ctx ->
              runBlocking(ctx) { work() }
          }
      }
  status: active
  rule_version: 1
