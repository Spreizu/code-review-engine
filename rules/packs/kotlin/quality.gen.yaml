  language: kotlin
  kind: anti-pattern
  category: concurrency
  severity: major
  applies_to:
    kotlin: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.kt'
    - '**/*.kts'
    - '!**/*.gradle.kts'
    query: |
      ((call_expression (identifier) @b (value_arguments (value_argument (call_expression . (identifier) @match)))) (#match? @b "^(launch|async)$") (#match? @match "^(Job|SupervisorJob)$"))
  message: 'A new Job breaks structured concurrency: the child is no longer cancelled with its parent.'
  source:
    url: https://kotlinlang.org/docs/coroutine-context-and-dispatchers.html
    doc: Job()/SupervisorJob() passed to launch/async
    doc_version: kotlinx.coroutines 1.10
    retrieved: '2026-10-09'
    quote: When a different scope is explicitly specified when launching a coroutine (for example, GlobalScope.launch ), it does not inherit a Job from the parent scope.
  examples:
    bad: |
      fun CoroutineScope.f() {
          launch(Job()) { work() }
      }
    good: |
      fun CoroutineScope.f() {
          launch { work() }
      }
  status: active
  rule_version: 1
