- id: KT-MOD-DATA-OBJECT
  title: object overriding toString() for its name
  language: kotlin
  kind: modernization
  category: modernization
  severity: info
  applies_to:
    kotlin: '>=1.9'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((object_declaration (class_body (function_declaration name: (identifier) @match))) (#eq? @match "toString"))
  message: data object (1.9+) generates toString/equals/hashCode.
  ai_question: Does this object's toString() just return its name (so `data object` is equivalent)?
  source:
    url: https://kotlinlang.org/docs/whatsnew19.html
    doc: object overriding toString() for its name
    doc_version: Kotlin 1.9
    retrieved: '2026-10-09'
    quote: 'Stable data objects for symmetry with data classes Data object declarations, which were introduced in Kotlin 1.8.20 , are now Stable. This includes the functions added for symmetry with data classes: toString() , equals() , and hashCode() .'
  examples:
    bad: |
      object Empty {
          override fun toString() = "Empty"
      }
    good: |
      data object Empty
  status: active
  rule_version: 1
