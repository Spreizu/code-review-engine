- id: KT-MOD-MULTI-DOLLAR
  title: ${'$'} escapes (use multi-dollar interpolation)
  language: kotlin
  kind: modernization
  category: modernization
  severity: info
  applies_to:
    kotlin: '>=2.2'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.kt'
    - '**/*.kts'
    - '!**/*.gradle.kts'
    query: |
      ((string_literal) @match (#match? @match "\\$\\{'\\$'\\}"))
  message: Since Kotlin 2.2, $$"..." treats single $ literally.
  source:
    url: https://kotlinlang.org/docs/coding-conventions.html
    doc: ${'$'} escapes (use multi-dollar interpolation)
    doc_version: Kotlin 2.2
    retrieved: '2026-10-09'
    quote: 'Use curly braces only for longer expressions: println("$name has ${children.size} children") Use multi-dollar string interpolation to treat the dollar sign chars $ as string literals: val KClass<*>.jsonSchema : String get() = $$""" { "$schema": "https://json-schema.org/draft/2020-12/schema",'
  examples:
    bad: |
      val schema = "${'$'}schema"
    good: |
      val schema = $$"$schema"
  status: active
  rule_version: 1
