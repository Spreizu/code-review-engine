  status: active
  rule_version: 1
  tags:
  - maintainability
- id: KT-MAINT-UNUSED-LOCAL
  title: Local variable is never used
  language: kotlin
  kind: best-practice
  category: maintainability
  severity: minor
  applies_to:
    kotlin: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      (property_declaration (variable_declaration (identifier) @name) (#not-match? @name "^_")) @match
    filters:
    - node.has_ancestor:function_declaration|anonymous_function|lambda_literal
    - func.count_lt:2:\b{cap:name}\b
    - node.lacks_re:\bby\b
  message: 'This local variable is assigned but never read: remove it, or use it where it was meant to be used.'
  ai_question: Is the variable really never read (no reflection, template, or dynamic access)?
  source:
    url: https://detekt.dev/docs/rules/style
    doc: detekt UnusedVariable
    doc_version: Kotlin 2.2
    retrieved: '2026-10-09'
    quote: 'Compliant Code: ​ class Foo { private val used = "used" fun greet ( ) { println ( used ) } } UnusedVariable ​ An unused variable can be removed to simplify the source file.'
  examples:
    bad: |
      fun f(a: Int): Int {
          val sum = a + 1
          return a * 2
      }
    good: |
      fun f(a: Int): Int {
          val sum = a + 1
          return sum * 2
      }
  xref:
  - detekt:UnusedVariable
  - sonar:kotlin:S1481
  status: active
  rule_version: 1
  tags:
  - maintainability
- id: KT-MAINT-UNUSED-PARAMETER
