    filters:
    - cap.has_re:recv:(\.asFlow\(\)|flowOf\(|^flow\s*\{|channelFlow\s*\{|callbackFlow\s*\{)
    - cap.has_re:m:^(map|filter|filterNot|onEach|transform|take|drop|distinctUntilChanged|debounce|catch|onStart|onCompletion|flowOn|buffer|conflate|mapLatest|flatMapLatest|flatMapConcat|flatMapMerge)$
