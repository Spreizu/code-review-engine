    - cap.has_re:recv:(asSequence\(\)|\.stream\(\)|sequenceOf\(|generateSequence\(|^sequence\s*\{)
    - cap.has_re:m:^(map|filter|filterNot|flatMap|mapNotNull|onEach|sorted|sortedBy|distinct|take|drop|peek|mapIndexed|filterIsInstance|zip)$
  message: Intermediate sequence/stream operations are lazy; without a terminal operation the lambda never runs.
  source:
    url: https://kotlinlang.org/docs/sequences.html
    doc: 'Kotlin docs: Sequences'
    doc_version: Kotlin 2.2
    retrieved: '2026-10-09'
    quote: Examples of terminal operations are toList() or sum() . Sequence elements can be retrieved only with terminal operations.
  examples:
    bad: |
      fun f(xs: List<Int>) {
          xs.asSequence().map { audit(it) }
      }
    good: |
      fun f(xs: List<Int>) {
          xs.asSequence().map { audit(it) }.toList()
      }
  xref:
  - sonar:kotlin:S3958
  status: active
  rule_version: 1
  tags:
  - maintainability
- id: KT-MAINT-SIZE-COMPARED-TO-NEGATIVE
  title: Size or length compared in a way that is always true or false
  language: kotlin
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    kotlin: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (binary_expression left: (_) @l right: (number_literal) @z (#match? @l "\\.(size|length|count\\(\\))$") (#eq? @z "0")) @match
    filters:
    - node.has_re:(<|>=)\s*0\s*$
  message: 'A size/length is never negative, so `< 0` is always false and `>= 0` always true: compare with `== 0` / `> 0` or use isEmpty.'
  source:
    url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.collections/-collection/size.html
    doc: 'Kotlin stdlib: Collection.size'
    doc_version: Kotlin 2.2
    retrieved: '2026-10-09'
    quote: Int ( source ) Returns the size of the collection.
  examples:
    bad: |
      fun f(xs: List<String>): Boolean {
          return xs.size < 0
      }
    good: |
      fun f(xs: List<String>): Boolean {
          return xs.isEmpty()
      }
  xref:
  - sonar:kotlin:S3981
  status: active
  rule_version: 1
  tags:
  - maintainability
- id: KT-MAINT-THROW-IN-FINALLY
  title: Exception thrown from finally
  language: kotlin
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    kotlin: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (finally_block (block (throw_expression) @match))
  message: 'An exception thrown in finally replaces the one from the try block, which is lost: catch and log inside finally instead.'
  source:
    url: https://detekt.dev/docs/rules/exceptions
    doc: detekt ThrowingExceptionFromFinally
    doc_version: Kotlin 2.2
    retrieved: '2026-10-09'
    quote: IOException ) { println ( e ) // logging is ok here } } ThrowingExceptionFromFinally ​ This rule reports all cases where exceptions are thrown from a finally block.
  examples:
    bad: |
      fun f() {
          try {
              run()
          } finally {
              throw IllegalStateException("cleanup failed")
          }
      }
    good: |
      fun f() {
          try {
              run()
          } finally {
              cleanup()
          }
      }
  xref:
  - detekt:ThrowingExceptionFromFinally
  - sonar:kotlin:S1163
  status: active
  rule_version: 1
  tags:
  - maintainability
