  category: maintainability
  severity: minor
  applies_to:
    kotlin: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (import (qualified_identifier (identifier) @name .) . ) @match
    filters:
    - file.count_lt:2:\b{cap:name}\b
    - cap.lacks_re:name:^(getValue|setValue|provideDelegate|invoke|plus|minus|times|div|rem|contains|get|set|iterator|next|hasNext|compareTo|unaryMinus|unaryPlus|not|inc|dec|rangeTo|rangeUntil|component\d+|plusAssign|minusAssign|timesAssign|divAssign|remAssign|equals)$
  message: 'Nothing in this file refers to the imported name: remove the import.'
  source:
    url: https://detekt.dev/docs/rules/style
    doc: detekt UnusedImport
    doc_version: Kotlin 2.2
    retrieved: '2026-10-09'
    quote: ', 2 ) . sorted ( ) . asReversed ( ) Compliant Code: ​ listOf ( 1 , 2 ) . sortedDescending ( ) UnusedImport ​ This rule reports unused imports.'
  examples:
    bad: |
      import a.b.Foo
      import a.b.Bar

      val x = Foo()
    good: |
      import a.b.Foo

      val x = Foo()
    regressions:
    - code: |
        import a.b.getValue

        val x by lazy { 1 }
