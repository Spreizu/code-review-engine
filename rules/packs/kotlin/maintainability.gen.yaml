- id: KT-MAINT-TOO-MANY-RETURNS
  title: Function has many return statements
  language: kotlin
  kind: best-practice
  category: maintainability
  severity: minor
  applies_to:
    kotlin: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (function_declaration (function_body)) @match
    filters:
    - metric.gt:returns:${max}
  message: ${value} return statements (limit ${max}); fewer exits make the function easier to follow.
  source:
    url: https://detekt.dev/docs/rules/style
    doc: detekt ReturnCount
    doc_version: Kotlin 2.2
    retrieved: '2026-10-09'
    quote: 'ault public fun bar ( ) // public per default } Compliant Code: ​ interface Foo { fun bar ( ) } ReturnCount ​ Restrict the number of returns allowed in methods.'
  examples:
    bad: |
      fun f(a: Boolean, b: Boolean, c: Boolean, d: Boolean, e: Boolean): Int {
          if (a) {
              return 1
          }
          if (b) {
              return 1
          }
          if (c) {
              return 1
          }
          if (d) {
              return 1
          }
          if (e) {
              return 1
          }
          if (a && b) {
              return 2
          }
          return 0
      }
    good: |
      fun f(a: Boolean, b: Boolean, c: Boolean, d: Boolean, e: Boolean): Int {
