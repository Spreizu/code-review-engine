  - maintainability
- id: KT-MAINT-UNUSED-PRIVATE-METHOD
  title: Private function is never called
  language: kotlin
  kind: best-practice
  category: maintainability
  severity: minor
  applies_to:
    kotlin: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      (function_declaration (modifiers (visibility_modifier) @v) name: (identifier) @name (#eq? @v "private")) @match
    filters:
    - file.count_lt:2:\b{cap:name}\b
    - node.lacks_re:^[^{(]*(@\w+|\boperator\b)
  message: 'This private method is not referenced anywhere in the file: delete it, or call it where it was meant to be used.'
  ai_question: Is the private function unreferenced (no reflection, framework callback, or string reference)?
