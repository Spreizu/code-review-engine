- id: KT-MAINT-USELESS-POSTFIX-ASSIGN
  title: Variable assigned its own post-increment
  language: kotlin
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    kotlin: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (assignment left: (identifier) @l right: (unary_expression argument: (identifier) @r) @u (#eq? @l @r)) @match
    filters:
    - cap.has_re:u:(\+\+|--)$
  message: x = x++ stores the old value back, so the increment is lost.
  source:
    url: https://kotlinlang.org/docs/operator-overloading.html
    doc: 'Kotlin docs: Increments and decrements'
    doc_version: Kotlin 2.2
    retrieved: '2026-10-09'
    quote: us() = Point(-x, -y) val point = Point(10, 20) fun main() { println(-point) // prints "Point(x=-10, y=-20)" } Increments and decrements Expression Translated to a++ a.inc() + see below a-- a.dec() + see below The inc() and dec() functions must r
  examples:
    bad: |
      fun f(n: Int) {
          var i = n
          i = i++
          use(i)
      }
    good: |
      fun f(n: Int) {
          var i = n
          i++
          use(i)
      }
