- id: KT-MAINT-UNREACHABLE-CODE
  title: Statement after return/throw can never run
  language: kotlin
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    kotlin: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (block [(return_expression) (throw_expression)] . (_) @match)
    filters:
    - node.lacks_re:^(//|/\*)
  message: 'This statement follows an unconditional return, raise/throw, break or continue in the same block, so it never runs: remove it or move it before the jump.'
  source:
    url: https://detekt.dev/docs/rules/potential-bugs
    doc: detekt UnreachableCode
    doc_version: Kotlin 2.2
    retrieved: '2026-10-09'
    quote: Throwable ) { bar ( ) } } UnreachableCode ​ Reports unreachable code.
  examples:
    bad: |
      fun f(x: Int): Int {
          return x * 2
          println(x)
      }
    good: |
      fun f(x: Int): Int {
          println(x)
          return x * 2
      }
    regressions:
    - code: |
        fun f(x: Int): Int {
            return x * 2
            // trailing note
        }
  xref:
  - detekt:UnreachableCode
  - sonar:kotlin:S1763
  status: active
  rule_version: 1
  tags:
  - maintainability
- id: KT-MAINT-UNUSED-IMPORT
  title: Import is never used
  language: kotlin
