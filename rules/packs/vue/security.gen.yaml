- id: VUE-SEC-NO-TEMPLATE-TARGET-BLANK
  title: Disallow target="_blank" attribute without rel="noopener noreferrer"
  language: vue
  framework: vue
  kind: security
  category: security
  severity: minor
  applies_to:
    vue: '>=2.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    target: template
    query: |
      ((start_tag (tag_name) @t) @match (#match? @match "target=\"_blank\"") (#match? @match "\\shref="))
      ((self_closing_tag (tag_name) @t) @match (#match? @match "target=\"_blank\"") (#match? @match "\\shref="))
    filters:
    - vue.start_tag_lacks_attr:rel
  message: target="_blank" without rel="noopener" lets the opened page access window.opener (reverse tabnabbing) in older browsers.
  source:
    url: https://eslint.vuejs.org/rules/no-template-target-blank.html
    doc: eslint-plugin-vue rule vue/no-template-target-blank
    doc_version: eslint-plugin-vue v10.11
    retrieved: '2026-10-09'
    quote: disallow target="_blank" attribute without rel="noopener noreferrer"
  examples:
    bad: |
      <template>
        <a href="https://ext.example" target="_blank">x</a>
      </template>
    good: |
      <template>
        <a href="https://ext.example" target="_blank" rel="noopener noreferrer">x</a>
      </template>
  tags:
  - eslint-plugin-vue:no-template-target-blank
  status: active
  rule_version: 1
