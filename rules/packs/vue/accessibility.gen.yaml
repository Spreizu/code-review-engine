- id: VUE-A11Y-AMBIGUOUS-LINK-TEXT
  title: Link text that does not say where it goes
  language: vue
  framework: vue
  kind: best-practice
  category: accessibility
  severity: minor
  applies_to:
    vue: '>=2.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    target: template
    query: |
      ((start_tag (tag_name) @t) @match (#match? @t "^(a)$"))
      ((self_closing_tag (tag_name) @t) @match (#match? @t "^(a)$"))
    filters:
    - markup.native
    - markup.not_hidden
    - parent.has_re:(?i)^<a\b[^>]*>\s*(click here|here|read more|more|learn more|link|this link|details|continue)\s*[.!]?\s*</a>$
    - markup.lacks_attr:aria-label|aria-labelledby|title|aria-describedby
  message: '"Click here"/"Read more" links are meaningless in a links list: make the text describe the destination.'
  source:
    url: https://www.w3.org/WAI/WCAG22/Understanding/link-purpose-link-only.html
    doc: Understanding SC 2.4.9 Link Purpose (Link Only)
    doc_version: WCAG 2.2
    retrieved: '2026-10-09'
    quote: Success Criterion (SC) A mechanism is available to allow the purpose of each link to be identified from link text alone, except where the purpose of the link would be ambiguous to users in general .
  examples:
    bad: |
      <template>
        <main>
          <p>Our returns policy changed. <a href="/returns">Read more</a></p>
        </main>
      </template>
    good: |
      <template>
        <main>
          <p>Our returns policy changed. <a href="/returns">Read the returns policy</a></p>
          <a href="/returns" aria-label="Read more about returns">Read more</a>
        </main>
      </template>
  xref:
  - axe:link-name
  - jsx-a11y:anchor-ambiguous-text
  wcag:
  - 2.4.9
  status: active
  rule_version: 1
  tags:
  - accessibility
