- id: VUE-QUAL-WATCH-REACTIVE-PROP-001
  title: watch() on a reactive object's property value
  language: vue
  framework: vue
  kind: anti-pattern
  category: reactivity
  severity: major
  applies_to:
    vue: '>=3.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    target: script
    query: |
      ((call_expression function: (identifier) @w arguments: (arguments . (member_expression) @src)) @match (#eq? @w "watch") (#not-match? @src "\\.value$"))
  message: Passing state.count passes a plain value; use a getter () => state.count.
  ai_question: Is the watched expression a property of a reactive() object (not a ref)?
  source:
    url: https://vuejs.org/guide/essentials/watchers.html
    doc: Vue docs - watchers
    doc_version: Vue 3 docs (vuejs.org)
    retrieved: '2026-10-09'
    quote: Do note that you can't watch a property of a reactive object like this
  examples:
    bad: |
      <script setup>
      watch(state.count, (c) => log(c))
      </script>
    good: |
      <script setup>
      watch(() => state.count, (c) => log(c))
      </script>
  status: active
  rule_version: 1
