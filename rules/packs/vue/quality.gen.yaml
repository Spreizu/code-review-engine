- id: VUE-QUAL-NO-SETUP-PROPS-REACTIVITY-LOSS
  title: Disallow usages that lose the reactivity of props passed to setup
  language: vue
  framework: vue
  kind: best-practice
  category: reactivity
  severity: major
  applies_to:
    vue: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    target: script
    query: |
      ((method_definition name: (property_identifier) @n parameters: (formal_parameters . (required_parameter pattern: (identifier) @p)) body: (statement_block (lexical_declaration (variable_declarator name: (object_pattern) value: (identifier) @v)) @match)) (#eq? @n "setup") (#eq? @p @v))
  message: Destructuring props in setup() loses reactivity; use toRefs(props) or props.x.
  source:
    url: https://eslint.vuejs.org/rules/no-setup-props-reactivity-loss.html
    doc: eslint-plugin-vue rule vue/no-setup-props-reactivity-loss
    doc_version: eslint-plugin-vue v10.11
    retrieved: '2026-10-09'
    quote: disallow usages that lose the reactivity of props passed to setup
  examples:
    bad: |
