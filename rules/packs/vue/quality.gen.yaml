  language: vue
  framework: vue
  kind: anti-pattern
  category: reactivity
  severity: major
  applies_to:
    vue: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    target: script
    query: |
      ((assignment_expression left: (identifier) right: (call_expression function: (identifier) @f)) @match (#eq? @f "reactive"))
  message: Replacing a reactive object disconnects existing watchers/templates; mutate properties or use ref().
  source:
