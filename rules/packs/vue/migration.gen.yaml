      ((pair key: (property_identifier) @k value: (object (pair key: (property_identifier) @w value: [(arrow_function) (function_expression)]) @match)) (#eq? @k "watch"))
  message: 'If the watched value is an array that is mutated in place, Vue 3 needs deep: true (or deep: 1 in 3.5+).'
  ai_question: Is the watched property an array that is mutated in place (push/splice) rather than replaced?
  source:
    url: https://v3-migration.vuejs.org/breaking-changes/watch.html
    doc: Vue 3 Migration Guide - watch
    doc_version: Vue 3 docs (vuejs.org)
    retrieved: '2026-10-09'
    quote: When watching an array, the callback will only trigger when the array is replaced.
  examples:
    bad: |
      <script>
      export default { watch: { items: function (v) { this.save(v) } } }
      </script>
    good: |
      <script>
      export default { watch: { items: { handler(v) { this.save(v) }, deep: true } } }
      </script>
  status: active
  rule_version: 1
