    quote: If you pass an object as nextState , it will be shallowly merged into this.state . If you pass a function as nextState , it will be treated as an updater function . It must be pure, should take the pending state and props as arguments, and should return the object to be sha
  examples:
    bad: |
      class A extends React.Component {
        inc() {
          this.setState({ n: this.state.n + 1 });
        }
      }
    good: |
      class A extends React.Component {
        inc() {
          this.setState((s) => ({ n: s.n + 1 }));
        }
      }
  status: active
  rule_version: 1
- id: REACT-QUAL-STATE-MUTATION
  title: Direct this.state mutation
  language: javascript
  framework: react
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    react: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((assignment_expression left: (member_expression object: (member_expression object: (this) property: (property_identifier) @s))) @match (#eq? @s "state"))
      ((call_expression function: (member_expression object: (member_expression object: (member_expression object: (this) property: (property_identifier) @s)) property: (property_identifier) @m)) @match (#eq? @s "state") (#match? @m "^(push|pop|shift|unshift|splice|sort|reverse)$"))
  message: Mutations don't re-render and corrupt batched updates; call setState with a new object.
  source:
    url: https://react.dev/reference/react/Component
    doc: Direct this.state mutation
    doc_version: React 19.2 (react.dev)
    retrieved: '2026-10-09'
    quote: The state field must be an object. Do not mutate the state directly. If you wish to change the state, call setState with the new state.
  examples:
    bad: |
      class A extends React.Component {
        add() {
          this.state.items.push(1);
        }
      }
    good: |
      class A extends React.Component {
        add() {
          this.setState((s) => ({ items: [...s.items, 1] }));
        }
      }
  xref:
  - https://react.dev/reference/rules/components-and-hooks-must-be-pure
  status: active
  rule_version: 1
- id: REACT-QUAL-TRY-CATCH-AROUND-JSX
  title: try/catch around JSX (use an Error Boundary)
  language: jsx
  framework: react
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    react: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (try_statement body: (statement_block (return_statement [(jsx_element) (jsx_self_closing_element) (parenthesized_expression)] @r))) @match
    filters:
    - node.has_re:<[A-Za-z]
  message: Rendering happens later, outside the try; wrap children in an Error Boundary.
  source:
    url: https://react.dev/reference/eslint-plugin-react-hooks/lints/error-boundaries
    doc: try/catch around JSX (use an Error Boundary)
    doc_version: React 19.2 (react.dev)
    retrieved: '2026-10-09'
    quote: Rule Details Try/catch blocks can’t catch errors that happen during React’s rendering process. Errors thrown in rendering methods or hooks bubble up through the component tree.
  examples:
    bad: |
      function Parent() {
        try {
          return <Child />;
        } catch (e) {
          return <Fallback />;
        }
      }
    good: |
      function Parent() {
        return (
          <ErrorBoundary fallback={<Fallback />}>
            <Child />
          </ErrorBoundary>
        );
      }
  status: active
  rule_version: 1
- id: REACT-QUAL-USE-DIRECTIVE-NOT-FIRST
  title: '''use client''/''use server'' after imports'
  language: javascript
  framework: react
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    react: '>=19.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((program (import_statement) (expression_statement (string (string_fragment) @d)) @match) (#match? @d "^use (client|server)$"))
  message: Directives only count as the first statement; after imports it's a no-op string.
  source:
    url: https://react.dev/reference/rsc/use-client
    doc: '''use client''/''use server'' after imports'
    doc_version: React 19.2 (react.dev)
    retrieved: '2026-10-09'
    quote: ge Building with interactivity and state Using client APIs Using third-party libraries Reference 'use client' Add 'use client' at the top of a file to mark the module and its transitive dependencies as client code. 'use client' ; import { useState } from 'react' ; import { formatDate } from './formatters' ; import Button f
  examples:
    bad: |
      import { useState } from 'react';
      'use client';
      export default function A() {
        return useState(0);
      }
    good: |
      'use client';
      import { useState } from 'react';
      export default function A() {
        return useState(0);
      }
  status: active
  rule_version: 1
- id: REACT-QUAL-USEMEMO-NO-RETURN
  title: useMemo callback without return
  language: javascript
  framework: react
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    react: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (identifier) @f arguments: (arguments . (arrow_function body: (statement_block) @b))) @match (#eq? @f "useMemo") (#not-match? @b "\\breturn\\b"))
  message: useMemo is for values; use useEffect for side effects or return the value.
  source:
    url: https://react.dev/reference/eslint-plugin-react-hooks/lints/use-memo
    doc: useMemo callback without return
    doc_version: React 19.2 (react.dev)
    retrieved: '2026-10-09'
    quote: Rule Details useMemo is for computing and caching expensive values, not for side effects. Without a return value, useMemo returns undefined , which defeats its purpose and likely indicates you’re using the wrong hook.
  examples:
    bad: |
      function App() {
        const v = useMemo(() => {
          track(data);
        }, [data]);
        return v;
      }
    good: |
      function App() {
        const v = useMemo(() => {
          return compute(data);
        }, [data]);
        return v;
      }
  status: active
  rule_version: 1
