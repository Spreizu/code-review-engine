- id: REACT-SEC-DANGEROUSLY-SET-INNER-HTML
  title: dangerouslySetInnerHTML without sanitization
  language: jsx
  framework: react
  kind: security
  category: security
  severity: major
  applies_to:
    react: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((jsx_attribute (property_identifier) @a (jsx_expression) @v) @match (#eq? @a "dangerouslySetInnerHTML") (#not-match? @v "(?i)sanitize|purify|escape"))
  message: Raw HTML from data is an XSS vector; sanitize (DOMPurify / Trusted Types) or render text.
  source:
    url: https://react.dev/reference/react-dom/components/common
    doc: dangerouslySetInnerHTML without sanitization
    doc_version: React 19.2 (react.dev)
    retrieved: '2026-10-09'
    quote: This should be used with extreme caution! If the HTML inside isn’t trusted (for example, if it’s based on user data), you risk introducing an XSS vulnerability.
  examples:
    bad: |
      const el = <div dangerouslySetInnerHTML={{ __html: comment.body }} />;
    good: |
      const el = <div dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(comment.body) }} />;
  status: active
  rule_version: 1
