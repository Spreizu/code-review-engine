    doc: 'javascript: URL in href/src'
    doc_version: React 19
    retrieved: '2026-10-09'
    quote: 'Action ) => state ; Changelog Other breaking changes react-dom : Error for javascript URLs in src and href #26507 react-dom : Remove errorInfo.digest from onRecoverableError #28222 react-dom : Remove unstable_flushCo'
  examples:
