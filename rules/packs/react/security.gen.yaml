- id: REACT-SEC-SERVER-FUNCTION-NO-AUTH
  title: Server Function without authorization check
  language: javascript
  framework: react
  kind: security
  category: security
  severity: critical
  applies_to:
    react: '>=19.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((program (expression_statement (string (string_fragment) @d)) (export_statement declaration: (function_declaration body: (statement_block) @b) @match)) (#eq? @d "use server") (#not-match? @b "(?i)auth|session|currentUser|getUser|verify|permission|can[A-Z]"))
    filters:
    - file.has_re:\A(?:\s|//[^\n]*|/\*(?s:.*?)\*/)*['\"]use server['\"]
  message: Server Functions are public HTTP endpoints; authenticate, authorize and validate inside every one.
  ai_question: Does this exported Server Function mutate data or read private data without an auth/authorization check (directly or in a helper)?
  source:
    url: https://react.dev/reference/rsc/use-server
    doc: Server Function without authorization check
    doc_version: React 19.2 (react.dev)
    retrieved: '2026-10-09'
    quote: cause the underlying network calls are always asynchronous, 'use server' can only be used on async functions. Always treat arguments to Server Functions as untrusted input and authorize any mutations. See security considerations .
  examples:
    bad: |
      'use server';
      export async function deletePost(id) {
        await db.post.delete({ where: { id } });
      }
    good: |
      'use server';
      export async function deletePost(id) {
        const user = await auth();
        if (!user?.canDelete(id)) throw new Error('forbidden');
        await db.post.delete({ where: { id } });
      }
  status: active
  rule_version: 1
