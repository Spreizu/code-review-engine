      ((import_statement (import_clause (named_imports (import_specifier name: (identifier) @n))) source: (string (string_fragment) @s)) @match (#match? @s "^(react-dom)$") (#match? @n "^(useFormState)$"))
      ((call_expression function: (member_expression object: (identifier) @o property: (property_identifier) @p)) @match (#match? @o "^(ReactDOM)$") (#match? @p "^(useFormState)$"))
  message: 'Use React.useActionState (codemod: react/19/replace-use-form-state).'
