    engine: tree-sitter
    query: |
      ((import_statement source: (string (string_fragment) @s)) @match (#match? @s "^(react-test-renderer)$"))
  message: Migrate tests to @testing-library/react (or -native).
  source:
    url: https://react.dev/blog/2024/04/25/react-19-upgrade-guide
    doc: react-test-renderer (deprecated in 19)
    doc_version: React 19
    retrieved: '2026-10-09'
    quote: 'Deprecated: react-test-renderer We are deprecating react-test-renderer because it implements its own renderer environment that doesn’t match the environment users use, promotes testing implementation details, and relies on introspe'
  examples:
    bad: |
