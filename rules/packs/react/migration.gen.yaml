- id: REACT-MIG-USEREF-REQUIRES-ARGUMENT
  title: useRef() without an argument (React 19 types)
  language: typescript
  framework: react
  kind: migration
  category: compatibility
  severity: minor
  applies_to:
    react: '>=19.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (identifier) @f arguments: (arguments . ")")) @match (#eq? @f "useRef"))
      ((call_expression function: (identifier) @f type_arguments: (type_arguments) arguments: (arguments . ")")) @match (#eq? @f "useRef"))
  message: '@types/react 19 requires an initial value: useRef(null) / useRef(undefined).'
  source:
    url: https://react.dev/blog/2024/04/25/react-19-upgrade-guide
    doc: useRef() without an argument (React 19 types)
    doc_version: '@types/react 19'
    retrieved: '2026-10-09'
    quote: A long-time complaint of how TypeScript and React work has been useRef . We’ve changed the types so that useRef now requires an argument. This significantly simplifies its type signature.
  examples:
    bad: |
      const ref = useRef<HTMLDivElement>();
    good: |
      const ref = useRef<HTMLDivElement>(null);
  status: active
  rule_version: 1
