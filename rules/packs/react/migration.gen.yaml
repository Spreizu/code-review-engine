- id: REACT-MIG-UNSAFE-LEGACY-LIFECYCLE
  title: Legacy lifecycle (componentWillMount/ReceiveProps/Update)
  language: javascript
  framework: react
  kind: deprecation
  category: compatibility
  severity: minor
  applies_to:
    react: '>=16.3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((method_definition name: (property_identifier) @m) @match (#match? @m "^(UNSAFE_)?(componentWillMount|componentWillReceiveProps|componentWillUpdate)$"))
  message: These lifecycles are unsafe with concurrent rendering; use componentDidMount/componentDidUpdate/getDerivedStateFromProps.
  source:
    url: https://react.dev/reference/react/Component
    doc: Legacy lifecycle (componentWillMount/ReceiveProps/Update)
    doc_version: React 19.2 (react.dev)
    retrieved: '2026-10-09'
    quote: ', prevState) render() setState(nextState, callback?) shouldComponentUpdate(nextProps, nextState, nextContext) UNSAFE_componentWillMount() UNSAFE_componentWillReceiveProps(nextProps, nextContext) UNSAFE_componentWillUpdate(nextProps, nextState) static contextType static defaultProps static getDerivedStateFromError(error) static getDerivedStateFromProps'
  examples:
    bad: |
      class A extends React.Component {
        componentWillReceiveProps(next) {
          this.setState({ v: next.v });
        }
      }
    good: |
      class A extends React.Component {
        static getDerivedStateFromProps(props) {
          return { v: props.v };
        }
      }
  status: active
  rule_version: 1
- id: REACT-MIG-USE-FORM-STATE
