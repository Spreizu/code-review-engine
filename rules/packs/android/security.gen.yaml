  language: xml
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: config
    files:
    - '**/AndroidManifest.xml'
    config:
      key: manifest.application.@usesCleartextTraffic
      op: equals
      value: 'true'
      case_insensitive: true
  message: Cleartext HTTP is allowed for every host. Traffic can be read and changed on the network; use HTTPS, and if one legacy host needs HTTP allow only that domain in a network security config.
