- id: ANDROID-SEC-NSC-USER-CA
  title: Network security config trusts user-installed CAs
  language: xml
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: config
    files:
    - '**/res/xml/*.xml'
    config:
      key_re: ^network-security-config\.(base-config|domain-config(#\d+)?)\.trust-anchors\.certificates(#\d+)?\.@src$
      op: equals
      value: user
  message: Release builds trust any CA the user (or malware, or an MDM profile) installs, which allows TLS interception. Trust user CAs only inside <debug-overrides>.
