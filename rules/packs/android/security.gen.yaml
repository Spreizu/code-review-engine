- id: ANDROID-SEC-ALLOW-BACKUP
  title: android:allowBackup="true" without backup rules
  language: xml
  kind: security
  category: security
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: config
    files:
    - '**/AndroidManifest.xml'
    config:
      key: manifest.application
      op: matches
      value: \ballowBackup=true\b
      unless_value: \b(fullBackupContent|dataExtractionRules)=
  message: Backups copy the app's private files and databases off the device. Exclude tokens and personal data with dataExtractionRules / fullBackupContent, or turn backup off.
  ai_question: Does the app keep credentials, tokens or personal data in files, databases or shared preferences that this backup would include?
  source:
    url: https://developer.android.com/privacy-and-security/risks/backup-best-practices
    doc: android:allowBackup="true" without backup rules
    doc_version: Android security risks
    retrieved: '2026-10-09'
    quote: recommendations regarding app backups are nuanced, varying between Android versions and device manufacturers. The common theme is that these recommendations aim at ensuring that no sensitive data is leaked.
  examples:
    bad: |
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
        <application android:allowBackup="true">
        </application>
      </manifest>
    good: |
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
        <application android:allowBackup="true" android:dataExtractionRules="@xml/data_extraction_rules">
        </application>
      </manifest>
  cwe:
  - CWE-530
  status: active
  rule_version: 1
- id: ANDROID-SEC-BIOMETRIC-NO-CRYPTO
  title: BiometricPrompt.authenticate without a CryptoObject
  language: kotlin
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.kt'
    query: |
      ((call_expression (navigation_expression (_) (identifier) @m .) (value_arguments . (value_argument) .)) @match (#eq? @m "authenticate"))
    filters:
    - file.has_re:BiometricPrompt
  message: Without a CryptoObject the result is only a callback the app trusts; on a compromised device it can be triggered without a biometric match. Bind the unlock to a Keystore key that requires user authentication.
  ai_question: Does a successful callback here unlock something sensitive (keys, payments, account access) rather than just a convenience gate?
  source:
    url: https://developer.android.com/identity/sign-in/biometric-auth
    doc: BiometricPrompt.authenticate without a CryptoObject
    doc_version: Android developer guide
    retrieved: '2026-10-09'
    quote: hic solution that depends on authentication To further protect sensitive information within your app, you can incorporate cryptography into your biometric authentication workflow using an instance of CryptoObject .
  examples:
    bad: |
      val biometricPrompt = BiometricPrompt(this, executor, callback)
      biometricPrompt.authenticate(promptInfo)
    good: |
      val biometricPrompt = BiometricPrompt(this, executor, callback)
      biometricPrompt.authenticate(promptInfo, BiometricPrompt.CryptoObject(cipher))
  cwe:
  - CWE-287
  status: active
  rule_version: 1
- id: ANDROID-SEC-CLEARTEXT-TRAFFIC
