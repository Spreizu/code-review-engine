    url: https://developer.android.com/guide/topics/manifest/application-element
    doc: android:usesCleartextTraffic="true"
    doc_version: Android manifest reference
    retrieved: '2026-10-09'
    quote: This attribute was added in API level 14. android:usesCleartextTraffic Indicates whether the app intends to use cleartext network traffic, such as cleartext HTTP.
  examples:
    bad: |
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
        <application android:usesCleartextTraffic="true">
        </application>
      </manifest>
    good: |
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
        <application android:networkSecurityConfig="@xml/network_security_config">
