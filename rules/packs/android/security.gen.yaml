- id: ANDROID-SEC-EXPORTED-NO-PERMISSION
  title: Component exported without a permission
  language: xml
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: config
    files:
    - '**/AndroidManifest.xml'
    config:
      key_re: ^manifest\.application\.(activity|activity-alias|service|receiver|provider)(#\d+)?$
      op: matches
      value: \bexported=true\b
      unless_value: \bpermission=
      unless_child: intent-filter(#\d+)?\.category(#\d+)?\.@name=android\.intent\.category\.(LAUNCHER|HOME|LEANBACK_LAUNCHER)$
  message: Any installed app can start this component and pass it data. Set exported="false", or protect it with a signature-level permission and validate every intent extra.
  ai_question: Is this component meant to be reachable by arbitrary apps (a launcher activity, a public share target) or does it expose internal functionality or data?
  source:
    url: https://developer.android.com/privacy-and-security/risks/android-exported
    doc: Component exported without a permission
    doc_version: Android security risks
    retrieved: '2026-10-09'
    quote: 'component (activity, service, broadcast receiver, etc.) can be launched by components of other applications: If true , any app can access the activity and launch it by its exact class name.'
  examples:
    bad: |
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
        <application>
          <service android:name=".SyncService" android:exported="true"/>
        </application>
      </manifest>
    good: |
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
        <application>
          <service android:name=".SyncService" android:exported="true" android:permission="com.example.permission.SYNC"/>
        </application>
      </manifest>
    regressions:
    - code: |
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application>
            <activity android:name=".MainActivity" android:exported="true">
              <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
              </intent-filter>
            </activity>
          </application>
        </manifest>
  cwe:
  - CWE-926
  precision: low
  status: active
  rule_version: 1
