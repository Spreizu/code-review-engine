    doc_version: Android network security configuration
    retrieved: '2026-10-09'
    quote: 's: <base-config cleartextTrafficPermitted="true"> <trust-anchors> <certificates src="system" /> <certificates src="user" /> </trust-anchors> </base-config> <domain-config> syntax: <domain-config cleartextTrafficPermitted =["true"'
  examples:
    bad: |
      <?xml version="1.0" encoding="utf-8"?>
      <network-security-config>
        <base-config>
          <trust-anchors>
            <certificates src="system"/>
            <certificates src="user"/>
          </trust-anchors>
        </base-config>
