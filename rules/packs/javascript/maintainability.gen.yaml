- id: JS-MAINT-USELESS-POSTFIX-ASSIGN
  title: Variable assigned its own post-increment
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    javascript: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (assignment_expression left: (identifier) @l right: (update_expression argument: (identifier) @r) @u (#eq? @l @r)) @match
    filters:
    - cap.has_re:u:(\+\+|--)$
  message: x = x++ writes the old value back, so the increment is lost.
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Increment
    doc: 'MDN: Increment (++)'
    doc_version: ECMAScript 2025
    retrieved: '2026-10-09'
    quote: If used postfix, with operator after operand (for example, x++ ), the increment operator increments and returns the value before incrementing.
  examples:
    bad: |
      function next(i) {
        i = i++;
        return i;
      }
    good: |
      function next(i) {
        i++;
        return i;
      }
  xref:
  - sonar:javascript:S2123
  - sonar:typescript:S2123
  status: active
  rule_version: 1
  tags:
  - maintainability
- id: JS-MAINT-VIDEO-WITHOUT-CAPTIONS
  title: video element without a captions track
  language: jsx
  kind: best-practice
  category: accessibility
  severity: minor
  applies_to:
    javascript: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (jsx_element open_tag: (jsx_opening_element name: (identifier) @t) (#eq? @t "video")) @match
    filters:
    - node.lacks_re:<track\b
    - node.lacks_re:\bmuted\b
  message: Without a captions track deaf and hard-of-hearing users miss the audio.
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/video
    doc: 'MDN: <video>'
    doc_version: ECMAScript 2025
    retrieved: '2026-10-09'
    quote: Modern browsers block audio (or videos with an unmuted audio track) from autoplaying, as sites that automatically play audio can be an unpleasant experience for users.
  examples:
    bad: |
      const V = () => (
        <video src="/intro.mp4" controls>
          <source src="/intro.webm" />
        </video>
      );
    good: |
      const V = () => (
        <video src="/intro.mp4" controls>
          <track kind="captions" src="/intro.vtt" />
        </video>
      );
  xref:
  - sonar:javascript:S4084
  - sonar:typescript:S4084
  status: active
  rule_version: 1
  tags:
  - maintainability
