- id: JS-MAINT-UNUSED-LOCAL
  title: Local variable is never used
  language: javascript
  kind: best-practice
  category: maintainability
  severity: minor
  applies_to:
    javascript: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      (lexical_declaration (variable_declarator name: (identifier) @name) (#not-match? @name "^_")) @match
    filters:
    - node.has_ancestor:function_declaration|function_expression|arrow_function|method_definition|generator_function_declaration
    - func.count_lt:2:(^|[^\w$.]){cap:name}($|[^\w$])
    - func.lacks_re:\beval\(
  message: 'This local variable is assigned but never read: remove it, or use it where it was meant to be used.'
  ai_question: Is the variable really never read (no reflection, template, or dynamic access)?
  source:
    url: https://eslint.org/docs/latest/rules/no-unused-vars
    doc: ESLint rule no-unused-vars
    doc_version: ECMAScript 2025
    retrieved: '2026-10-09'
    quote: Maintained Manage Issues and Pull Requests Review Pull Requests Manage Releases Working Groups no-unused-vars Disallow unused variables ✅ Recommended Using the recommended config from @eslint/js in a configuration file enables this rule 💡 hasSug
  examples:
    bad: |
      function f(a) {
        const sum = a + 1;
        return a * 2;
      }
    good: |
      function f(a) {
        const sum = a + 1;
        return sum * 2;
      }
    regressions:
    - code: |
        const top = 1;
        export { top };
