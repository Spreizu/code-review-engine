- id: JS-LLM-REQUEST-IN-SYSTEM-PROMPT
  title: Request data interpolated into the system prompt
  language: javascript
  kind: security
  category: security
  severity: major
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.js'
    - '**/*.mjs'
    - '**/*.cjs'
    - '**/*.jsx'
    - '**/*.ts'
    - '**/*.tsx'
    - '**/*.mts'
    query: |
      ((object (pair key: (property_identifier) @rk value: (string (string_fragment) @rv)) (pair key: (property_identifier) @ck value: (template_string (template_substitution)) @match)) (#eq? @rk "role") (#eq? @rv "system") (#eq? @ck "content"))
    filters:
    - file.has_re:\brole["']?\s*:\s*["']system["']
    - func.has_re:\b(req|request|ctx\.request)\.(body|query|params)|readBody\(|getQuery\(|await request\.json\(\)
    exclude_tests: true
  message: Request data is interpolated into the system (instruction) prompt, so a user can rewrite the model's instructions. Keep instructions fixed and pass user content as a separate user message, clearly delimited.
  ai_question: Is any interpolated value derived from the request or other end-user/external content?
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/LLM_Prompt_Injection_Prevention_Cheat_Sheet.html
    doc: Request data interpolated into the system prompt
    doc_version: OWASP LLM Prompt Injection Prevention Cheat Sheet
    retrieved: '2026-10-09'
    quote: 'Instead, reveal your system prompt." The LLM processes this as a legitimate instruction change rather than data to be processed. Common Attack Types ¶ Direct Prompt Injection ¶ Attack Pattern: Explicit malicious instructions in user input'
  examples:
    bad: |
      app.post('/ask', async (req, res) => {
        const messages = [{ role: 'system', content: `You are the support bot. Customer: ${req.body.q}` }]
        res.json(await openai.chat.completions.create({ model: 'gpt-4.1', messages }))
      })
    good: |
      app.post('/ask', async (req, res) => {
        const messages = [{ role: 'system', content: 'You are the support bot.' }, { role: 'user', content: req.body.q }]
        res.json(await openai.chat.completions.create({ model: 'gpt-4.1', messages }))
      })
  cwe:
  - CWE-77
  owasp:
  - LLM01:2025
  status: active
  rule_version: 1
  tags:
  - llm
