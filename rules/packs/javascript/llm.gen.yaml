      const r = await openai.chat.completions.create({ model: 'gpt-4.1', messages })
    good: |
      const r = await openai.chat.completions.create({ model: 'gpt-4.1', messages, max_completion_tokens: 800 })
  cwe:
  - CWE-770
  owasp:
  - LLM10:2025
  status: active
