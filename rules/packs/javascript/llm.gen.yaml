- id: JS-LLM-OUTPUT-TO-EXEC
  title: Model output may reach eval or a shell
  language: javascript
  kind: security
  category: security
  severity: critical
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.js'
    - '**/*.mjs'
    - '**/*.cjs'
    - '**/*.jsx'
    - '**/*.ts'
    - '**/*.tsx'
    - '**/*.mts'
    query: |
      ((call_expression function: (_) @f arguments: (arguments . (_) @arg)) @match (#match? @f "^(eval|exec|execSync|spawn|spawnSync|execFile|execFileSync|(child_process|cp|vm)\\.(exec|execSync|spawn|spawnSync|execFile|execFileSync|runInNewContext|runInThisContext))$"))
    filters:
    - func.has_re:(chat\.completions\.create|responses\.create|messages\.create|generateContent|generateText\(|streamText\(|generateObject\(|\b(llm|chain|model|chat|agent)\w*\.invoke\(|ollama\.(chat|generate)\()
    - node.lacks_re:^\w+(\.\w+)?\(\s*['\"`][^'\"`$]*['\"`]\s*[,)]
    exclude_tests: true
  message: Text produced by the model is executed. Anyone who can influence the prompt can make the model emit code or shell commands that run with the server's permissions. Map output onto an allow-list of actions or use a sandbox.
  ai_question: Does the value passed here come from model output (directly or via variables) without validation or an allow-list?
  source:
    url: https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/
    doc: Model output may reach eval or a shell
    doc_version: OWASP Top 10 for LLM Applications 2025
    retrieved: '2026-10-09'
    quote: g of LLM outputs Absence of rate limiting or anomaly detection for LLM usage Common Examples of Vulnerability LLM output is entered directly into a system shell or similar function such as exec or eval, resulting in remote code execution. JavaScript or Markdown is generated by the LLM and returned to a user.
  examples:
    bad: |
      export async function act(task) {
        const r = await openai.chat.completions.create({ model: 'gpt-4.1', messages: [{ role: 'user', content: task }] })
        eval(r.choices[0].message.content)
      }
    good: |
      export async function act(task) {
        const r = await openai.chat.completions.create({ model: 'gpt-4.1', messages: [{ role: 'user', content: task }] })
        return ACTIONS[r.choices[0].message.content.trim()]?.()
      }
  cwe:
  - CWE-94
  - CWE-78
  owasp:
  - LLM05:2025
  status: active
  rule_version: 1
  tags:
  - llm
