    retrieved: '2026-10-09'
    quote: 'userId">User ID</label> <input type="text" id="userId" name="userId" /> </div> <input type="image" id="image" alt="Login" src="/shared-assets/images/examples/login-button.png" /> label { font-size: 0.8rem; } label, input[ty'
