- id: JS-QUAL-NO-COMPARE-NEG-ZERO
  title: Disallow comparing against -0
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((binary_expression operator: ["==" "===" "!=" "!==" "<" ">" "<=" ">="] right: (unary_expression operator: "-" argument: (number) @n)) @match (#eq? @n "0"))
  message: Comparison with -0 also matches +0; use Object.is(x, -0).
  source:
    url: https://eslint.org/docs/latest/rules/no-compare-neg-zero
    doc: ESLint rule no-compare-neg-zero
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow comparing against -0
  examples:
    bad: |
      if (x === -0) {}
    good: |
      if (Object.is(x, -0)) {}
  tags:
  - eslint:no-compare-neg-zero
  status: active
  rule_version: 1
- id: JS-QUAL-NO-COND-ASSIGN
  title: Disallow assignment operators in conditional expressions
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (if_statement condition: (parenthesized_expression (assignment_expression) @match))
      (while_statement condition: (parenthesized_expression (assignment_expression) @match))
  message: Assignment inside a condition is usually a mistyped comparison (= instead of ===).
  source:
    url: https://eslint.org/docs/latest/rules/no-cond-assign
    doc: ESLint rule no-cond-assign
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow assignment operators in conditional expressions
  examples:
    bad: |
      if (user = find(id)) { use(user) }
    good: |
      const user = find(id)
      if (user) { use(user) }
  tags:
  - eslint:no-cond-assign
  status: active
  rule_version: 1
- id: JS-QUAL-NO-CONSOLE
  title: Disallow the use of console
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression object: (identifier) @o)) @match (#eq? @o "console"))
    filters:
    - file.lacks_re:(?m)\b(?:var|let|const|function|class|import)\s+(?:\{[^}]*\b)?console\b|\bfunction\b[^(]*\([^)]*\bconsole\b[^)]*\)|\([^()]*\bconsole\b[^()]*\)\s*=>|\bconsole\s*=>
  message: console calls usually should not ship; use the application logger.
  source:
    url: https://eslint.org/docs/latest/rules/no-console
    doc: ESLint rule no-console
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow the use of console
  examples:
    bad: |
      console.log(user)
    good: |
      logger.debug(user)
    regressions:
    - note: local console binding
      code: |
        const console = createLogger()
        console.log('ready')
  tags:
  - eslint:no-console
  status: active
  rule_version: 1
- id: JS-QUAL-NO-CONST-ASSIGN
  title: Disallow reassigning const, using, and await using variables
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: critical
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((program (lexical_declaration kind: "const" (variable_declarator name: (identifier) @a)) (expression_statement [(assignment_expression left: (identifier) @b) (augmented_assignment_expression left: (identifier) @b) (update_expression argument: (identifier) @b)])) @match (#eq? @a @b))
  message: Assigning to a const binding throws a TypeError at runtime.
  source:
    url: https://eslint.org/docs/latest/rules/no-const-assign
    doc: ESLint rule no-const-assign
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow reassigning const, using, and await using variables
  examples:
    bad: |
      const max = 1
      max = 2
    good: |
      let max = 1
      max = 2
  tags:
  - eslint:no-const-assign
  status: active
  rule_version: 1
- id: JS-QUAL-NO-CONSTANT-BINARY-EXPRESSION
  title: Disallow expressions where the operation doesn't affect the value
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (binary_expression operator: ["==" "===" "!=" "!=="] right: [(array) (object) (arrow_function) (function_expression) (class)] @match)
      (binary_expression left: (unary_expression operator: "!") operator: ["==" "===" "!=" "!=="] right: [(null) (undefined)] @match)
      (binary_expression left: [(array) (object)] @match operator: ["??" "||"])
  message: This comparison/logical expression always evaluates the same way (fresh object identity, boolean vs null, or non-nullish left side).
  source:
    url: https://eslint.org/docs/latest/rules/no-constant-binary-expression
    doc: ESLint rule no-constant-binary-expression
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow expressions where the operation doesn't affect the value
  examples:
    bad: |
      if (list === []) { empty() }
    good: |
      if (list.length === 0) { empty() }
  tags:
  - eslint:no-constant-binary-expression
  status: active
  rule_version: 1
- id: JS-QUAL-NO-CONSTANT-CONDITION
  title: Disallow constant expressions in conditions
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (if_statement condition: (parenthesized_expression [(true) (false) (number) (string) (array) (object)] @match))
      (ternary_expression condition: [(true) (false) (number) (string)] @match)
  message: The condition is a constant, so one branch is dead code.
  source:
    url: https://eslint.org/docs/latest/rules/no-constant-condition
    doc: ESLint rule no-constant-condition
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow constant expressions in conditions
  examples:
    bad: |
      if (true) { run() }
    good: |
      if (enabled) { run() }
  tags:
  - eslint:no-constant-condition
  status: active
  rule_version: 1
- id: JS-QUAL-NO-CONSTRUCTOR-RETURN
  title: Disallow returning value from constructor
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((method_definition name: (property_identifier) @n body: (statement_block (return_statement (_)) @match)) (#eq? @n "constructor"))
  message: Returning a value from a constructor replaces the instance.
  source:
    url: https://eslint.org/docs/latest/rules/no-constructor-return
    doc: ESLint rule no-constructor-return
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow returning value from constructor
  examples:
    bad: |
      class A {
        constructor() { return {} }
      }
    good: |
      class A {
        constructor() { this.x = 1 }
      }
  tags:
  - eslint:no-constructor-return
  status: active
  rule_version: 1
- id: JS-QUAL-NO-CONTROL-REGEX
  title: Disallow control characters in regular expressions
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((regex pattern: (regex_pattern) @match) (#match? @match "\\\\x[01][0-9a-fA-F]|\\\\u00[01][0-9a-fA-F]"))
  message: Control characters in a regex are rarely intended and are invisible in source.
  source:
    url: https://eslint.org/docs/latest/rules/no-control-regex
    doc: ESLint rule no-control-regex
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow control characters in regular expressions
  examples:
    bad: |
      const re = /\x0c/
    good: |
      const re = /\x20/
  tags:
  - eslint:no-control-regex
  status: active
  rule_version: 1
- id: JS-QUAL-NO-DEBUGGER
  title: Disallow the use of debugger
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (debugger_statement) @match
  message: debugger statements must not ship to production.
  source:
    url: https://eslint.org/docs/latest/rules/no-debugger
    doc: ESLint rule no-debugger
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow the use of debugger
  examples:
    bad: |
      function f() {
        debugger
      }
    good: |
      function f() {
        return 1
      }
  tags:
  - eslint:no-debugger
  status: active
  rule_version: 1
- id: JS-QUAL-NO-DELETE-VAR
  title: Disallow deleting variables
  language: javascript
  kind: best-practice
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (unary_expression operator: "delete" argument: (identifier)) @match
  message: delete on a variable does nothing (and is a SyntaxError in strict mode).
  source:
    url: https://eslint.org/docs/latest/rules/no-delete-var
    doc: ESLint rule no-delete-var
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow deleting variables
  examples:
    bad: |
      let x = 1
      delete x
    good: |
      let x = 1
      x = undefined
  tags:
  - eslint:no-delete-var
  status: active
  rule_version: 1
- id: JS-QUAL-NO-DUPE-CLASS-MEMBERS
  title: Disallow duplicate class members
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((class_body (method_definition name: (property_identifier) @a) @m1 (method_definition name: (property_identifier) @b) @match) (#eq? @a @b) (#not-match? @m1 "^(static\\s+)?(get|set)\\s") (#not-match? @match "^(static\\s+)?(get|set)\\s"))
  message: A duplicate class member silently replaces the earlier definition.
  source:
    url: https://eslint.org/docs/latest/rules/no-dupe-class-members
    doc: ESLint rule no-dupe-class-members
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow duplicate class members
  examples:
    bad: |
      class A {
        run() { return 1 }
        run() { return 2 }
      }
    good: |
      class A {
        run() { return 1 }
        stop() { return 2 }
      }
  tags:
  - eslint:no-dupe-class-members
  status: active
  rule_version: 1
- id: JS-QUAL-NO-DUPE-ELSE-IF
  title: Disallow duplicate conditions in if-else-if chains
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((if_statement condition: (_) @a alternative: (else_clause (if_statement condition: (_) @b) @match)) (#eq? @a @b))
  message: The repeated else-if condition can never be true.
  source:
    url: https://eslint.org/docs/latest/rules/no-dupe-else-if
    doc: ESLint rule no-dupe-else-if
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow duplicate conditions in if-else-if chains
  examples:
    bad: |
      if (a) { x() } else if (a) { y() }
    good: |
      if (a) { x() } else if (b) { y() }
  tags:
  - eslint:no-dupe-else-if
  status: active
  rule_version: 1
- id: JS-QUAL-NO-DUPE-KEYS
  title: Disallow duplicate keys in object literals
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((object (pair key: (property_identifier) @a) (pair key: (property_identifier) @b) @match) (#eq? @a @b))
  message: 'Duplicate object keys: the last one wins silently.'
  source:
    url: https://eslint.org/docs/latest/rules/no-dupe-keys
    doc: ESLint rule no-dupe-keys
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow duplicate keys in object literals
  examples:
    bad: |
      const o = { id: 1, name: 'a', id: 2 }
    good: |
      const o = { id: 1, name: 'a' }
  tags:
  - eslint:no-dupe-keys
  status: active
  rule_version: 1
- id: JS-QUAL-NO-DUPLICATE-CASE
  title: Disallow duplicate case labels
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((switch_body (switch_case value: (_) @a) (switch_case value: (_) @b) @match) (#eq? @a @b))
  message: 'Duplicate case label: the second case is unreachable.'
  source:
    url: https://eslint.org/docs/latest/rules/no-duplicate-case
    doc: ESLint rule no-duplicate-case
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow duplicate case labels
  examples:
    bad: |
      switch (x) {
        case 1: a(); break
        case 1: b(); break
      }
    good: |
      switch (x) {
        case 1: a(); break
        case 2: b(); break
      }
  tags:
  - eslint:no-duplicate-case
  status: active
  rule_version: 1
- id: JS-QUAL-NO-DUPLICATE-IMPORTS
  title: Disallow duplicate module imports
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (program (import_statement source: (string)) @match)
    filters:
    - node.dup_import
  message: Merge imports from the same module.
  source:
    url: https://eslint.org/docs/latest/rules/no-duplicate-imports
    doc: ESLint rule no-duplicate-imports
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow duplicate module imports
  examples:
    bad: |
      import { a } from 'lib'
      import { b } from 'lib'
    good: |
      import { a, b } from 'lib'
    regressions:
    - code: |
        import { a } from 'lib'
        import type { B } from 'lib'
      note: type-only import
    - code: |
        import { a } from 'lib'
        import { type B, type C } from 'lib'
      note: inline type specifiers only
    - code: |
        import * as ns from 'lib'
        import { a } from 'lib'
      note: namespace import cannot merge
    - code: |
        import 'lib'
        import { a } from 'lib'
      note: side-effect import
    - code: |
        const m = import('lib')
        import { a } from 'lib'
      note: dynamic import
  tags:
  - eslint:no-duplicate-imports
  status: active
  rule_version: 1
- id: JS-QUAL-NO-ELSE-RETURN
  title: Disallow else blocks after return statements in if statements
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (if_statement consequence: (statement_block (return_statement) .) alternative: (else_clause) @match)
  message: The else is unnecessary after a return.
  source:
    url: https://eslint.org/docs/latest/rules/no-else-return
    doc: ESLint rule no-else-return
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow else blocks after return statements in if statements
  examples:
    bad: |
      function f(a) {
        if (a) { return 1 } else { return 2 }
      }
    good: |
      function f(a) {
        if (a) { return 1 }
        return 2
      }
  tags:
  - eslint:no-else-return
  status: active
  rule_version: 1
- id: JS-QUAL-NO-EMPTY
  title: Disallow empty block statements
  language: javascript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((if_statement consequence: (statement_block) @match) (#match? @match "^\\{\\s*\\}$"))
      ((catch_clause body: (statement_block) @match) (#match? @match "^\\{\\s*\\}$"))
      ((try_statement body: (statement_block) @match) (#match? @match "^\\{\\s*\\}$"))
      ((finally_clause body: (statement_block) @match) (#match? @match "^\\{\\s*\\}$"))
  message: 'Empty block: a silently swallowed error or unfinished code. Add a comment if intended.'
  source:
    url: https://eslint.org/docs/latest/rules/no-empty
    doc: ESLint rule no-empty
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow empty block statements
  examples:
    bad: |
      try { run() } catch (e) {}
    good: |
      try { run() } catch (e) {
        log.warn(e)
      }
  tags:
  - eslint:no-empty
  status: active
  rule_version: 1
- id: JS-QUAL-NO-EMPTY-CHARACTER-CLASS
  title: Disallow empty character classes in regular expressions
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((regex pattern: (regex_pattern) @match) (#match? @match "(^|[^\\\\])\\[\\]"))
  message: An empty character class [] matches nothing.
  source:
    url: https://eslint.org/docs/latest/rules/no-empty-character-class
    doc: ESLint rule no-empty-character-class
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow empty character classes in regular expressions
  examples:
    bad: |
      const re = /^abc[]/
    good: |
      const re = /^abc[a-z]/
  tags:
  - eslint:no-empty-character-class
  status: active
  rule_version: 1
- id: JS-QUAL-NO-EMPTY-FUNCTION
  title: Disallow empty functions
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((function_declaration body: (statement_block) @b) @match (#match? @b "^\\{\\s*\\}$"))
      ((method_definition name: (property_identifier) @n body: (statement_block) @b) @match (#match? @b "^\\{\\s*\\}$") (#not-eq? @n "constructor"))
  message: Empty function without a comment explaining why.
  source:
    url: https://eslint.org/docs/latest/rules/no-empty-function
    doc: ESLint rule no-empty-function
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow empty functions
  examples:
    bad: |
      function noop() {}
    good: |
      function noop() {
        // intentionally empty: default handler
      }
  tags:
  - eslint:no-empty-function
  status: active
  rule_version: 1
- id: JS-QUAL-NO-EMPTY-PATTERN
  title: Disallow empty destructuring patterns
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((variable_declarator name: [(object_pattern) (array_pattern)] @match) (#match? @match "^[\\[{]\\s*[\\]}]$"))
  message: An empty destructuring pattern binds nothing (often a typo for a default value).
  source:
    url: https://eslint.org/docs/latest/rules/no-empty-pattern
    doc: ESLint rule no-empty-pattern
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow empty destructuring patterns
  examples:
    bad: |
      const {} = props
    good: |
      const { title } = props
  tags:
  - eslint:no-empty-pattern
  status: active
  rule_version: 1
- id: JS-QUAL-NO-EMPTY-STATIC-BLOCK
  title: Disallow empty static blocks
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=2022'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((class_static_block body: (statement_block) @b) @match (#match? @b "^\\{\\s*\\}$"))
  message: Empty static initialisation block.
  source:
    url: https://eslint.org/docs/latest/rules/no-empty-static-block
    doc: ESLint rule no-empty-static-block
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow empty static blocks
  examples:
    bad: |
      class A {
        static {}
      }
    good: |
      class A {
        static { init() }
      }
  tags:
  - eslint:no-empty-static-block
  status: active
  rule_version: 1
- id: JS-QUAL-NO-EQ-NULL
  title: Disallow null comparisons without type-checking operators
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (binary_expression operator: ["==" "!="] right: (null)) @match
  message: Loose comparison with null also matches undefined; make the intent explicit.
  source:
    url: https://eslint.org/docs/latest/rules/no-eq-null
    doc: ESLint rule no-eq-null
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow null comparisons without type-checking operators
  examples:
    bad: |
      if (x == null) {}
    good: |
      if (x === null || x === undefined) {}
  tags:
  - eslint:no-eq-null
  status: active
  rule_version: 1
- id: JS-QUAL-NO-EX-ASSIGN
  title: Disallow reassigning exceptions in catch clauses
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((catch_clause parameter: (identifier) @a body: (statement_block (expression_statement (assignment_expression left: (identifier) @b) @match))) (#eq? @a @b))
  message: Reassigning the caught exception loses the original error.
  source:
    url: https://eslint.org/docs/latest/rules/no-ex-assign
    doc: ESLint rule no-ex-assign
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow reassigning exceptions in catch clauses
  examples:
    bad: |
      try { run() } catch (e) {
        e = 10
      }
    good: |
      try { run() } catch (e) {
        const code = 10
      }
  tags:
  - eslint:no-ex-assign
  status: active
  rule_version: 1
- id: JS-QUAL-NO-EXTEND-NATIVE
  title: Disallow extending native types
  language: javascript
  kind: best-practice
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((assignment_expression left: (member_expression object: (member_expression object: (identifier) @o property: (property_identifier) @p))) @match (#match? @o "^(Object|Array|String|Number|Boolean|Function|Date|RegExp|Promise|Map|Set|Error|Symbol)$") (#eq? @p "prototype"))
  message: Extending native prototypes can clash with future standard methods and other libraries.
  source:
    url: https://eslint.org/docs/latest/rules/no-extend-native
    doc: ESLint rule no-extend-native
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow extending native types
  examples:
    bad: |
      Array.prototype.last = function () { return this[this.length - 1] }
    good: |
      const last = (arr) => arr[arr.length - 1]
  tags:
  - eslint:no-extend-native
  status: active
  rule_version: 1
- id: JS-QUAL-NO-EXTRA-BIND
  title: Disallow unnecessary calls to .bind()
  language: javascript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression object: (parenthesized_expression (arrow_function)) property: (property_identifier) @p)) @match (#eq? @p "bind"))
  message: Arrow functions cannot be re-bound; .bind() here is useless.
  source:
    url: https://eslint.org/docs/latest/rules/no-extra-bind
    doc: ESLint rule no-extra-bind
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow unnecessary calls to .bind()
  examples:
    bad: |
      const f = (() => this.x).bind(this)
    good: |
      const f = () => this.x
  tags:
  - eslint:no-extra-bind
  status: active
  rule_version: 1
- id: JS-QUAL-NO-EXTRA-BOOLEAN-CAST
  title: Disallow unnecessary boolean casts
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (if_statement condition: (parenthesized_expression (unary_expression operator: "!" argument: (unary_expression operator: "!")) @match))
      ((if_statement condition: (parenthesized_expression (call_expression function: (identifier) @f) @match)) (#eq? @f "Boolean"))
  message: The condition is already coerced to boolean.
  source:
    url: https://eslint.org/docs/latest/rules/no-extra-boolean-cast
    doc: ESLint rule no-extra-boolean-cast
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow unnecessary boolean casts
  examples:
    bad: |
      if (!!user) {}
    good: |
      if (user) {}
  tags:
  - eslint:no-extra-boolean-cast
  status: active
  rule_version: 1
- id: JS-QUAL-NO-FALLTHROUGH
  title: Disallow fallthrough of case statements
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((switch_body (switch_case [(expression_statement) (if_statement) (lexical_declaration) (variable_declaration) (for_statement)] @last .) @match . [(switch_case) (switch_default)]))
    filters:
    - cap.lacks_re:last:(?s)^if\s*\(.*\b(return|throw|break|continue)\b[^{};]*;?\s*\}\s*else\s*\{.*\b(return|throw|break|continue)\b[^{};]*;?\s*\}$
  message: This case falls through into the next one; add break/return or a // falls through comment.
  source:
    url: https://eslint.org/docs/latest/rules/no-fallthrough
    doc: ESLint rule no-fallthrough
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow fallthrough of case statements
  examples:
    bad: |
      switch (x) {
        case 1:
          a()
        case 2:
          b()
          break
      }
    good: |
      switch (x) {
        case 1:
          a()
          break
        case 2:
          b()
          break
      }
    regressions:
    - note: 'socket.io decodePacket: every branch returns'
      code: |
        switch (t) {
          case 'a':
            if (x) {
              return 1
            } else if (y) {
              return 2
            } else {
              return 3
            }
          default:
            return 0
        }
  tags:
  - eslint:no-fallthrough
  status: active
  rule_version: 1
- id: JS-QUAL-NO-FUNC-ASSIGN
  title: Disallow reassigning function declarations
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((program (function_declaration name: (identifier) @a) (expression_statement (assignment_expression left: (identifier) @b) @match)) (#eq? @a @b))
  message: Reassigning a function declaration is almost always a mistake.
  source:
    url: https://eslint.org/docs/latest/rules/no-func-assign
    doc: ESLint rule no-func-assign
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow reassigning function declarations
  examples:
    bad: |
      function load() {}
      load = null
    good: |
      function load() {}
      const loader = null
  tags:
  - eslint:no-func-assign
  status: active
  rule_version: 1
- id: JS-QUAL-NO-GLOBAL-ASSIGN
  title: Disallow assignments to native objects or read-only global variables
  language: javascript
  kind: best-practice
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((assignment_expression left: (identifier) @a) @match (#match? @a "^(Object|Array|String|Number|Boolean|Math|JSON|Promise|window|globalThis|document|NaN|Infinity)$"))
  message: Assigning to a native global breaks every other user of it.
  source:
    url: https://eslint.org/docs/latest/rules/no-global-assign
    doc: ESLint rule no-global-assign
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow assignments to native objects or read-only global variables
  examples:
    bad: |
      window = {}
    good: |
      const win = {}
  tags:
  - eslint:no-global-assign
  status: active
  rule_version: 1
- id: JS-QUAL-NO-IMPLICIT-COERCION
  title: Disallow shorthand type conversions
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((binary_expression left: (string) @s operator: "+") @match (#match? @s "^(''|\"\")$"))
      ((unary_expression operator: "~" argument: (call_expression function: (member_expression property: (property_identifier) @p))) @match (#eq? @p "indexOf"))
  message: Implicit type coercion is hard to read; use String()/Number()/Boolean() or includes().
  source:
    url: https://eslint.org/docs/latest/rules/no-implicit-coercion
    doc: ESLint rule no-implicit-coercion
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow shorthand type conversions
  examples:
    bad: |
      const s = '' + count
    good: |
      const s = String(count)
  tags:
  - eslint:no-implicit-coercion
  status: active
  rule_version: 1
- id: JS-QUAL-NO-IMPORT-ASSIGN
  title: Disallow assigning to imported bindings
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: critical
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((program (import_statement (import_clause [(identifier) @a (named_imports (import_specifier name: (identifier) @a))])) (expression_statement (assignment_expression left: (identifier) @b) @match)) (#eq? @a @b))
  message: Imported bindings are read-only; assignment throws.
  source:
    url: https://eslint.org/docs/latest/rules/no-import-assign
    doc: ESLint rule no-import-assign
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow assigning to imported bindings
  examples:
    bad: |
      import config from './config'
      config = {}
    good: |
      import config from './config'
      const local = { ...config }
  tags:
  - eslint:no-import-assign
  status: active
  rule_version: 1
- id: JS-QUAL-NO-LABELS
  title: Disallow labeled statements
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (labeled_statement) @match
  message: Labels make control flow hard to follow.
  source:
    url: https://eslint.org/docs/latest/rules/no-labels
    doc: ESLint rule no-labels
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow labeled statements
  examples:
    bad: |
      outer: for (const a of xs) { for (const b of ys) { if (b) break outer } }
    good: |
      for (const a of xs) { if (ys.some(Boolean)) break }
  tags:
  - eslint:no-labels
  status: active
  rule_version: 1
- id: JS-QUAL-NO-LONE-BLOCKS
  title: Disallow unnecessary nested blocks
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((program (statement_block) @match) (#not-match? @match "\\b(let|const|class|function)\\b"))
  message: A standalone block without block-scoped declarations is redundant.
  source:
    url: https://eslint.org/docs/latest/rules/no-lone-blocks
    doc: ESLint rule no-lone-blocks
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow unnecessary nested blocks
  examples:
    bad: |
      {
        run()
      }
    good: |
      run()
  tags:
  - eslint:no-lone-blocks
  status: active
  rule_version: 1
- id: JS-QUAL-NO-LONELY-IF
  title: Disallow if statements as the only statement in else blocks
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (else_clause (statement_block . (if_statement) @match .))
    filters:
    - ancestor.lacks_re:if_statement#2:^if\s*\([^{]*?\)\s*if\b
  message: A lone if inside else can be else if.
  source:
    url: https://eslint.org/docs/latest/rules/no-lonely-if
    doc: ESLint rule no-lonely-if
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow if statements as the only statement in else blocks
  examples:
    bad: |
      if (a) { x() } else {
        if (b) { y() }
      }
    good: |
      if (a) { x() } else if (b) { y() }
  tags:
  - eslint:no-lonely-if
  status: active
  rule_version: 1
- id: JS-QUAL-NO-LOOP-FUNC
  title: Disallow function declarations that contain unsafe references inside loop statements
  language: javascript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      (for_statement initializer: (variable_declaration) body: (statement_block (expression_statement (call_expression arguments: (arguments [(arrow_function) (function_expression)] @match)))))
  message: A function created in a loop captures the loop variable; with var all closures see the final value.
  ai_question: Does the closure capture a var-declared (function-scoped) loop variable or a variable modified later in the loop?
  source:
    url: https://eslint.org/docs/latest/rules/no-loop-func
    doc: ESLint rule no-loop-func
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow function declarations that contain unsafe references inside loop statements
  examples:
    bad: |
      for (var i = 0; i < 3; i++) {
        handlers.push(() => i)
      }
    good: |
      for (let i = 0; i < 3; i++) {
        const n = i
        handlers.push(() => n)
      }
  tags:
  - eslint:no-loop-func
  status: active
  rule_version: 1
- id: JS-QUAL-NO-LOSS-OF-PRECISION
  title: Disallow literal numbers that lose precision
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((number) @match (#match? @match "^[0-9]{16,}[13579]$"))
  message: This integer literal cannot be represented exactly as a double; use BigInt or a string.
  source:
    url: https://eslint.org/docs/latest/rules/no-loss-of-precision
    doc: ESLint rule no-loss-of-precision
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow literal numbers that lose precision
  examples:
    bad: |
      const id = 12345678901234567
    good: |
      const id = 12345678901234567n
  tags:
  - eslint:no-loss-of-precision
  status: active
  rule_version: 1
- id: JS-QUAL-NO-MULTI-ASSIGN
  title: Disallow use of chained assignment expressions
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (assignment_expression right: (assignment_expression)) @match
      (variable_declarator value: (assignment_expression) @match)
  message: Chained assignments are hard to read and can create implicit globals.
  source:
    url: https://eslint.org/docs/latest/rules/no-multi-assign
    doc: ESLint rule no-multi-assign
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow use of chained assignment expressions
  examples:
    bad: |
      a = b = c
    good: |
      a = c
      b = c
  tags:
  - eslint:no-multi-assign
  status: active
  rule_version: 1
- id: JS-QUAL-NO-MULTI-STR
  title: Disallow multiline strings
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((string) @match (#match? @match "\\\\\\n"))
  message: Line-continuation in string literals is easy to break; use template literals or concatenation.
  source:
    url: https://eslint.org/docs/latest/rules/no-multi-str
    doc: ESLint rule no-multi-str
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow multiline strings
  examples:
    bad: |
      const s = 'line one \
      line two'
    good: |
      const s = `line one
      line two`
  tags:
  - eslint:no-multi-str
  status: active
  rule_version: 1
- id: JS-QUAL-NO-NEGATED-CONDITION
  title: Disallow negated conditions
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (if_statement condition: (parenthesized_expression (unary_expression operator: "!")) alternative: (else_clause) @match)
  message: A negated condition with an else branch reads better inverted.
  source:
    url: https://eslint.org/docs/latest/rules/no-negated-condition
    doc: ESLint rule no-negated-condition
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow negated conditions
  examples:
    bad: |
      if (!ok) { fail() } else { pass() }
    good: |
      if (ok) { pass() } else { fail() }
  tags:
  - eslint:no-negated-condition
  status: active
  rule_version: 1
- id: JS-QUAL-NO-NESTED-TERNARY
  title: Disallow nested ternary expressions
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (ternary_expression alternative: (ternary_expression) @match)
      (ternary_expression consequence: (ternary_expression) @match)
  message: Nested ternaries are hard to read.
  source:
    url: https://eslint.org/docs/latest/rules/no-nested-ternary
    doc: ESLint rule no-nested-ternary
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow nested ternary expressions
  examples:
    bad: |
      const s = a ? 'x' : b ? 'y' : 'z'
    good: |
      const s = pick(a, b)
  tags:
  - eslint:no-nested-ternary
  status: active
  rule_version: 1
- id: JS-QUAL-NO-NEW
  title: Disallow new operators outside of assignments or comparisons
  language: javascript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (expression_statement (new_expression) @match)
  message: Constructing an object only for side effects hides intent (and the instance is discarded).
  source:
    url: https://eslint.org/docs/latest/rules/no-new
    doc: ESLint rule no-new
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow new operators outside of assignments or comparisons
  examples:
    bad: |
      new Widget(el)
    good: |
      const widget = new Widget(el)
  tags:
  - eslint:no-new
  status: active
  rule_version: 1
- id: JS-QUAL-NO-NEW-NATIVE-NONCONSTRUCTOR
  title: Disallow new operators with global non-constructor functions
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: critical
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((new_expression constructor: (identifier) @c) @match (#match? @c "^(Symbol|BigInt)$"))
  message: Symbol and BigInt are not constructors; new throws a TypeError.
  source:
    url: https://eslint.org/docs/latest/rules/no-new-native-nonconstructor
    doc: ESLint rule no-new-native-nonconstructor
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow new operators with global non-constructor functions
  examples:
    bad: |
      const s = new Symbol('id')
    good: |
      const s = Symbol('id')
  tags:
  - eslint:no-new-native-nonconstructor
  status: active
  rule_version: 1
- id: JS-QUAL-NO-NONOCTAL-DECIMAL-ESCAPE
  title: Disallow \8 and \9 escape sequences in string literals
  language: javascript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((string) @match (#match? @match "\\\\[89]"))
  message: \8 and \9 are useless legacy escapes.
  source:
    url: https://eslint.org/docs/latest/rules/no-nonoctal-decimal-escape
    doc: ESLint rule no-nonoctal-decimal-escape
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow \8 and \9 escape sequences in string literals
  examples:
    bad: |
      const s = '\8'
    good: |
      const s = '8'
  tags:
  - eslint:no-nonoctal-decimal-escape
  status: active
  rule_version: 1
- id: JS-QUAL-NO-OBJ-CALLS
  title: Disallow calling global object properties as functions
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: critical
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (identifier) @f) @match (#match? @f "^(Math|JSON|Reflect|Atomics)$"))
      ((new_expression constructor: (identifier) @f) @match (#match? @f "^(Math|JSON|Reflect|Atomics|Intl)$"))
  message: Math/JSON/Reflect/Atomics are namespaces, not functions; calling them throws.
  source:
    url: https://eslint.org/docs/latest/rules/no-obj-calls
    doc: ESLint rule no-obj-calls
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow calling global object properties as functions
  examples:
    bad: |
      const m = Math()
    good: |
      const m = Math.max(1, 2)
  tags:
  - eslint:no-obj-calls
  status: active
  rule_version: 1
- id: JS-QUAL-NO-OBJECT-CONSTRUCTOR
  title: Disallow calls to the Object constructor without an argument
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((new_expression constructor: (identifier) @c arguments: (arguments) @a) @match (#eq? @c "Object") (#eq? @a "()"))
  message: Use an object literal.
  source:
    url: https://eslint.org/docs/latest/rules/no-object-constructor
    doc: ESLint rule no-object-constructor
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow calls to the Object constructor without an argument
  examples:
    bad: |
      const o = new Object()
    good: |
      const o = {}
  tags:
  - eslint:no-object-constructor
  status: active
  rule_version: 1
- id: JS-QUAL-NO-OCTAL
  title: Disallow octal literals
  language: javascript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((number) @match (#match? @match "^0[0-7]+$"))
  message: Legacy octal literals are confusing and forbidden in strict mode; use 0o.
  source:
    url: https://eslint.org/docs/latest/rules/no-octal
    doc: ESLint rule no-octal
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow octal literals
  examples:
    bad: |
      const mode = 0755
    good: |
      const mode = 0o755
  tags:
  - eslint:no-octal
  status: active
  rule_version: 1
- id: JS-QUAL-NO-OCTAL-ESCAPE
  title: Disallow octal escape sequences in string literals
  language: javascript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((string) @match (#match? @match "\\\\([1-7]|0[0-9])"))
  message: Octal escapes are deprecated; use \u or \x escapes.
  source:
    url: https://eslint.org/docs/latest/rules/no-octal-escape
    doc: ESLint rule no-octal-escape
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow octal escape sequences in string literals
  examples:
    bad: |
      const s = 'copy \251'
    good: |
      const s = 'copy \u00A9'
  tags:
  - eslint:no-octal-escape
  status: active
  rule_version: 1
- id: JS-QUAL-NO-PARAM-REASSIGN
  title: Disallow reassigning function parameters
  language: javascript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    grammar: javascript
    query: |
      ((function_declaration parameters: (formal_parameters (identifier) @p) body: (statement_block (expression_statement (assignment_expression left: (identifier) @a) @match))) (#eq? @p @a))
  message: Reassigning parameters obscures the original value and mutates arguments in sloppy mode.
  source:
    url: https://eslint.org/docs/latest/rules/no-param-reassign
    doc: ESLint rule no-param-reassign
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow reassigning function parameters
  examples:
    bad: |
      function f(opts) {
        opts = opts || {}
      }
    good: |
      function f(opts) {
        const o = opts || {}
      }
  tags:
  - eslint:no-param-reassign
  status: active
  rule_version: 1
- id: JS-QUAL-NO-PLUSPLUS
  title: Disallow the unary operators ++ and --
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (expression_statement (update_expression) @match)
  message: Unary ++/-- are subject to automatic semicolon insertion pitfalls.
  source:
    url: https://eslint.org/docs/latest/rules/no-plusplus
    doc: ESLint rule no-plusplus
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow the unary operators ++ and --
  examples:
    bad: |
      i++
