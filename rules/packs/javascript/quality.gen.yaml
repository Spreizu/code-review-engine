  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((regex pattern: (regex_pattern) @match) (#match? @match "[^ \\]]  +"))
  message: Multiple literal spaces in a regex are hard to count; use a quantifier.
