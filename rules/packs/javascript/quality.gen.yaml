  tags:
  - eslint:no-unused-expressions
  status: active
  rule_version: 1
- id: JS-QUAL-NO-UNUSED-PRIVATE-CLASS-MEMBERS
  title: Disallow unused private class members
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=2022'
  detection:
    mode: deterministic
    engine: tree-sitter
    grammar: javascript
    query: |
      ((class_body (field_definition property: (private_property_identifier) @f)) @match (#match? @match "^\\{[^#]*#[A-Za-z_$][\\w$]*[^#]*\\}$"))
    capture: f
  message: A private field that is never read is dead state.
  source:
    url: https://eslint.org/docs/latest/rules/no-unused-private-class-members
    doc: ESLint rule no-unused-private-class-members
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow unused private class members
  examples:
    bad: |
      class A {
        #secret = 1
        get() { return 2 }
      }
    good: |
      class A {
        #secret = 1
        get() { return this.#secret }
      }
  tags:
  - eslint:no-unused-private-class-members
  status: active
  rule_version: 1
- id: JS-QUAL-NO-USELESS-CALL
  title: Disallow unnecessary calls to .call() and .apply()
  language: javascript
  kind: best-practice
  category: performance
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression property: (property_identifier) @p) arguments: (arguments . [(undefined) (null)])) @match (#eq? @p "call"))
  message: call() with undefined/null this is a slower plain call.
  source:
    url: https://eslint.org/docs/latest/rules/no-useless-call
    doc: ESLint rule no-useless-call
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow unnecessary calls to .call() and .apply()
  examples:
    bad: |
      fn.call(undefined, a, b)
    good: |
      fn(a, b)
  tags:
  - eslint:no-useless-call
  status: active
  rule_version: 1
- id: JS-QUAL-NO-USELESS-CATCH
  title: Disallow unnecessary catch clauses
  language: javascript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((catch_clause parameter: (identifier) @e body: (statement_block . (throw_statement (identifier) @t) .)) @match (#eq? @e @t))
  message: A catch that only rethrows is redundant.
  source:
    url: https://eslint.org/docs/latest/rules/no-useless-catch
    doc: ESLint rule no-useless-catch
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow unnecessary catch clauses
  examples:
    bad: |
      try { run() } catch (e) {
        throw e
      }
    good: |
      run()
  tags:
  - eslint:no-useless-catch
  status: active
  rule_version: 1
- id: JS-QUAL-NO-USELESS-COMPUTED-KEY
  title: Disallow unnecessary computed property keys in objects and classes
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (pair key: (computed_property_name (string)) @match)
  message: Computed key with a string literal is unnecessary.
