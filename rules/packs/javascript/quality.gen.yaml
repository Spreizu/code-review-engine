- id: JS-QUAL-OPERATOR-ASSIGNMENT
  title: Require or disallow assignment operator shorthand where possible
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((assignment_expression left: (identifier) @a right: (binary_expression left: (identifier) @b operator: ["+" "-" "*" "/" "%" "**"])) @match (#eq? @a @b))
  message: Use the compound assignment operator.
  source:
    url: https://eslint.org/docs/latest/rules/operator-assignment
    doc: ESLint rule operator-assignment
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Require or disallow assignment operator shorthand where possible
  examples:
