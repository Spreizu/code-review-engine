    mode: deterministic
    engine: tree-sitter
    query: |
      ((member_expression object: (identifier) @a) @match (#eq? @a "arguments"))
      ((subscript_expression object: (identifier) @a) @match (#eq? @a "arguments"))
  message: Use rest parameters instead of arguments.
  source:
    url: https://eslint.org/docs/latest/rules/prefer-rest-params
    doc: ESLint rule prefer-rest-params
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Require rest parameters instead of arguments
  examples:
    bad: |
