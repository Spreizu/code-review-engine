    url: https://eslint.org/docs/latest/rules/no-void
    doc: ESLint rule no-void
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow void operators
  examples:
    bad: |
      const u = void 0
    good: |
      const u = undefined
  tags:
  - eslint:no-void
  status: active
  rule_version: 1
- id: JS-QUAL-NO-WARNING-COMMENTS
  title: Disallow specified warning terms in comments
  language: javascript
  kind: best-practice
  category: maintainability
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((comment) @match (#match? @match "(?i)\\b(todo|fixme|xxx)\\b"))
  message: Unresolved TODO/FIXME comment.
