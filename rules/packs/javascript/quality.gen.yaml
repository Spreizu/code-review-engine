    url: https://eslint.org/docs/latest/rules/no-useless-return
    doc: ESLint rule no-useless-return
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow redundant return statements
  examples:
    bad: |
      function f() {
        work()
        return
      }
    good: |
      function f() {
        work()
      }
  tags:
  - eslint:no-useless-return
  status: active
  rule_version: 1
- id: JS-QUAL-NO-VOID
  title: Disallow void operators
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (unary_expression operator: "void") @match
  message: void is confusing; use undefined (or handle the promise explicitly).
