  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((string) @match (#match? @match "\\$\\{[^}]+\\}"))
  message: Template placeholder syntax inside a regular string is printed literally; use a template literal.
  source:
    url: https://eslint.org/docs/latest/rules/no-template-curly-in-string
    doc: ESLint rule no-template-curly-in-string
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow template literal placeholder syntax in regular strings
  examples:
    bad: |
      const msg = 'Hello ${name}'
    good: |
      const msg = `Hello ${name}`
  tags:
  - eslint:no-template-curly-in-string
  status: active
  rule_version: 1
- id: JS-QUAL-NO-THIS-BEFORE-SUPER
  title: Disallow this/super before calling super() in constructors
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: critical
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((class_declaration (class_heritage) body: (class_body (method_definition name: (property_identifier) @n body: (statement_block . (expression_statement [(assignment_expression left: (member_expression object: (this))) (call_expression function: (member_expression object: (this))) (update_expression argument: (member_expression object: (this)))]))))) @match (#eq? @n "constructor"))
  message: this is used before super() in a subclass constructor, which throws a ReferenceError.
  source:
    url: https://eslint.org/docs/latest/rules/no-this-before-super
    doc: ESLint rule no-this-before-super
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow this/super before calling super() in constructors
  examples:
    bad: |
      class Child extends Parent {
        constructor() {
          this.x = 1
          super()
        }
      }
    good: |
      class Child extends Parent {
        constructor() {
          super()
          this.x = 1
        }
      }
  tags:
  - eslint:no-this-before-super
  xref:
  - sonar:javascript:S3854
  - sonar:typescript:S3854
  status: active
  rule_version: 1
- id: JS-QUAL-NO-UNASSIGNED-VARS
  title: Disallow let or var variables that are read but never assigned
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((program (lexical_declaration kind: "let" (variable_declarator name: (identifier) @a !value)) @match (expression_statement (call_expression arguments: (arguments (identifier) @b)))) (#eq? @a @b))
  message: The variable is read but never assigned, so it is always undefined.
  ai_question: Is this variable never assigned anywhere (including in nested functions)?
  source:
    url: https://eslint.org/docs/latest/rules/no-unassigned-vars
    doc: ESLint rule no-unassigned-vars
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow let or var variables that are read but never assigned
  examples:
    bad: |
      let status
      console.log(status)
    good: |
      let status = 'ok'
      console.log(status)
  tags:
  - eslint:no-unassigned-vars
  status: active
  rule_version: 1
- id: JS-QUAL-NO-UNDEF-INIT
  title: Disallow initializing variables to undefined
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (lexical_declaration kind: "let" (variable_declarator value: (undefined)) @match)
  message: Initialising to undefined is redundant.
  source:
    url: https://eslint.org/docs/latest/rules/no-undef-init
    doc: ESLint rule no-undef-init
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow initializing variables to undefined
  examples:
    bad: |
      let x = undefined
    good: |
      let x
  tags:
  - eslint:no-undef-init
  status: active
  rule_version: 1
- id: JS-QUAL-NO-UNDERSCORE-DANGLE
  title: Disallow dangling underscores in identifiers
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((variable_declarator name: (identifier) @match) (#match? @match "^_[A-Za-z]|[A-Za-z]_$"))
  message: 'Dangling underscores do not make things private; use #private fields or module scope.'
  source:
    url: https://eslint.org/docs/latest/rules/no-underscore-dangle
    doc: ESLint rule no-underscore-dangle
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow dangling underscores in identifiers
  examples:
    bad: |
      const _secret = 1
    good: |
      const secret = 1
  tags:
  - eslint:no-underscore-dangle
  status: active
  rule_version: 1
- id: JS-QUAL-NO-UNNEEDED-TERNARY
  title: Disallow ternary operators when simpler alternatives exist
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (ternary_expression consequence: (true) alternative: (false)) @match
      (ternary_expression consequence: (false) alternative: (true)) @match
  message: A ternary returning boolean literals is just the condition.
  source:
    url: https://eslint.org/docs/latest/rules/no-unneeded-ternary
    doc: ESLint rule no-unneeded-ternary
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow ternary operators when simpler alternatives exist
  examples:
    bad: |
      const ok = a > b ? true : false
    good: |
      const ok = a > b
  tags:
  - eslint:no-unneeded-ternary
  status: active
  rule_version: 1
- id: JS-QUAL-NO-UNREACHABLE
  title: Disallow unreachable code after return, throw, continue, and break statements
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (statement_block [(return_statement) (throw_statement) (break_statement) (continue_statement)] . [(expression_statement) (lexical_declaration) (variable_declaration) (if_statement) (for_statement) (return_statement) (throw_statement)] @match)
  message: Code after return/throw/break/continue never runs.
  source:
    url: https://eslint.org/docs/latest/rules/no-unreachable
    doc: ESLint rule no-unreachable
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow unreachable code after return, throw, continue, and break statements
  examples:
    bad: |
      function f() {
        return 1
        cleanup()
      }
    good: |
      function f() {
        cleanup()
        return 1
      }
  tags:
  - eslint:no-unreachable
  status: active
  rule_version: 1
- id: JS-QUAL-NO-UNSAFE-FINALLY
  title: Disallow control flow statements in finally blocks
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (finally_clause body: (statement_block [(return_statement) (throw_statement)] @match))
  message: Control flow in finally overrides the try/catch result and swallows exceptions.
  source:
    url: https://eslint.org/docs/latest/rules/no-unsafe-finally
    doc: ESLint rule no-unsafe-finally
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow control flow statements in finally blocks
  examples:
    bad: |
      try { return a() } finally {
        return 0
      }
    good: |
      try { return a() } finally {
        cleanup()
      }
  tags:
  - eslint:no-unsafe-finally
  status: active
  rule_version: 1
- id: JS-QUAL-NO-UNSAFE-NEGATION
  title: Disallow negating the left operand of relational operators
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (binary_expression left: (unary_expression operator: "!") operator: ["in" "instanceof"]) @match
  message: '! binds tighter than in/instanceof, so this negates the left operand, not the test.'
  source:
    url: https://eslint.org/docs/latest/rules/no-unsafe-negation
    doc: ESLint rule no-unsafe-negation
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow negating the left operand of relational operators
  examples:
    bad: |
      if (!key in obj) {}
    good: |
      if (!(key in obj)) {}
  tags:
  - eslint:no-unsafe-negation
  status: active
  rule_version: 1
- id: JS-QUAL-NO-UNSAFE-OPTIONAL-CHAINING
  title: Disallow use of optional chaining in contexts where the undefined value is not allowed
  language: javascript
  kind: anti-pattern
  category: null-handling
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (parenthesized_expression) @p arguments: (arguments)) @match (#match? @p "^\\(\\s*[\\w$.\\[\\]'\"]*\\?\\.[\\w$.?\\[\\]'\"()]*\\s*\\)$"))
      ((call_expression function: (parenthesized_expression) @p arguments: (template_string)) @match (#match? @p "^\\(\\s*[\\w$.\\[\\]'\"]*\\?\\.[\\w$.?\\[\\]'\"()]*\\s*\\)$"))
      ([(array (spread_element (member_expression (optional_chain)) @match)) (arguments (spread_element (member_expression (optional_chain)) @match))])
      ((new_expression constructor: (parenthesized_expression) @p) @match (#match? @p "^\\(\\s*[\\w$.\\[\\]'\"]*\\?\\.[\\w$.?\\[\\]'\"()]*\\s*\\)$"))
    filters:
    - node.lacks_re:^\(.*\)\s*\?\.
  message: Optional chaining that short-circuits to undefined is then called/spread/constructed, throwing a TypeError.
  source:
    url: https://eslint.org/docs/latest/rules/no-unsafe-optional-chaining
    doc: ESLint rule no-unsafe-optional-chaining
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow use of optional chaining in contexts where the undefined value is not allowed
  examples:
    bad: |
      (obj?.run)()
    good: |
      obj?.run()
    regressions:
    - note: fallback inside the parens
      code: |
        (settings?.handler ?? noop)()
    - note: the call is optional too
      code: |
        (settings?.handler)?.()
    - note: object spread of undefined is allowed
      code: |
        const merged = { ...defaults?.extra }
  tags:
  - eslint:no-unsafe-optional-chaining
  status: active
  rule_version: 1
- id: JS-QUAL-NO-UNUSED-EXPRESSIONS
  title: Disallow unused expressions
  language: javascript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (expression_statement [(identifier) (member_expression) (number) (binary_expression operator: ["==" "===" "!=" "!==" "<" ">" "<=" ">=" "+" "-" "*" "/"])] @match)
  message: The expression has no effect (likely a missing assignment or call).
  source:
    url: https://eslint.org/docs/latest/rules/no-unused-expressions
    doc: ESLint rule no-unused-expressions
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow unused expressions
