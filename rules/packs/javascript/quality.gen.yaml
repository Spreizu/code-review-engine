      i += 1
  tags:
  - eslint:no-plusplus
  status: active
  rule_version: 1
- id: JS-QUAL-NO-PROMISE-EXECUTOR-RETURN
  title: Disallow returning values from Promise executor functions
  language: javascript
  kind: anti-pattern
  category: async
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((new_expression constructor: (identifier) @c arguments: (arguments . (arrow_function body: (_) @b))) @match (#eq? @c "Promise") (#not-match? @b "^\\{"))
    filters:
    - node.lacks_re:(?s)=>\s*\(?\s*(?:setTimeout|setImmediate|queueMicrotask|process\.nextTick|requestAnimationFrame)\s*\(
  message: Values returned from a Promise executor are ignored; returning hints at a misunderstanding (or a forgotten resolve).
  source:
    url: https://eslint.org/docs/latest/rules/no-promise-executor-return
    doc: ESLint rule no-promise-executor-return
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow returning values from Promise executor functions
  examples:
    bad: |
      const p = new Promise((resolve) => resolve(readConfig()))
    good: |
      const p = new Promise((resolve) => { resolve(readConfig()) })
    regressions:
    - note: 'sleep helper: the timer id returned by an expression-bodied executor is ignored and harmless'
      code: |
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
  tags:
  - eslint:no-promise-executor-return
  status: active
  rule_version: 1
- id: JS-QUAL-NO-PROTOTYPE-BUILTINS
  title: Disallow calling some Object.prototype methods directly on objects
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression object: (_) @o property: (property_identifier) @p)) @match (#match? @p "^(hasOwnProperty|isPrototypeOf|propertyIsEnumerable)$") (#not-match? @o "prototype$"))
  message: Calling Object.prototype builtins on the object fails for Object.create(null) objects and can be shadowed by attacker-controlled keys.
  source:
    url: https://eslint.org/docs/latest/rules/no-prototype-builtins
    doc: ESLint rule no-prototype-builtins
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow calling some Object.prototype methods directly on objects
  examples:
    bad: |
      if (obj.hasOwnProperty('id')) {}
    good: |
      if (Object.hasOwn(obj, 'id')) {}
  tags:
  - eslint:no-prototype-builtins
  status: active
  rule_version: 1
- id: JS-QUAL-NO-REGEX-SPACES
  title: Disallow multiple spaces in regular expressions
  language: javascript
