  rule_version: 1
- id: JS-QUAL-NO-SELF-ASSIGN
  title: Disallow assignments where both sides are exactly the same
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((assignment_expression left: (_) @a right: (_) @b) @match (#eq? @a @b))
  message: Self-assignment has no effect.
  source:
    url: https://eslint.org/docs/latest/rules/no-self-assign
    doc: ESLint rule no-self-assign
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow assignments where both sides are exactly the same
  examples:
    bad: |
      count = count
    good: |
      count = next
  tags:
  - eslint:no-self-assign
  status: active
  rule_version: 1
- id: JS-QUAL-NO-SELF-COMPARE
  title: Disallow comparisons where both sides are exactly the same
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((binary_expression left: (_) @a operator: ["==" "===" "!=" "!==" "<" ">" "<=" ">="] right: (_) @b) @match (#eq? @a @b))
    filters:
    - file.lacks_re:<%[=\-_]?\s
  message: Comparing a value with itself is either a bug or an obscure NaN test (use Number.isNaN).
  source:
    url: https://eslint.org/docs/latest/rules/no-self-compare
    doc: ESLint rule no-self-compare
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow comparisons where both sides are exactly the same
  examples:
    bad: |
      if (x === x) {}
    good: |
      if (!Number.isNaN(x)) {}
  tags:
  - eslint:no-self-compare
  status: active
  rule_version: 1
- id: JS-QUAL-NO-SEQUENCES
