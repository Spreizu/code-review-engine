  rule_version: 1
- id: JS-QUAL-PREFER-ARROW-CALLBACK
  title: Require using arrow functions for callbacks
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((arguments (function_expression) @match) (#not-match? @match "\\bthis\\b|\\barguments\\b"))
  message: Use an arrow function for callbacks that do not need their own this.
  source:
    url: https://eslint.org/docs/latest/rules/prefer-arrow-callback
    doc: ESLint rule prefer-arrow-callback
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Require using arrow functions for callbacks
  examples:
    bad: |
      items.forEach(function (x) { use(x) })
    good: |
      items.forEach((x) => use(x))
  tags:
  - eslint:prefer-arrow-callback
  status: active
  rule_version: 1
- id: JS-QUAL-PREFER-DESTRUCTURING
  title: Require destructuring from arrays and/or objects
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((variable_declarator name: (identifier) @n value: (member_expression property: (property_identifier) @p)) @match (#eq? @n @p))
  message: Use object destructuring.
  source:
    url: https://eslint.org/docs/latest/rules/prefer-destructuring
    doc: ESLint rule prefer-destructuring
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Require destructuring from arrays and/or objects
  examples:
