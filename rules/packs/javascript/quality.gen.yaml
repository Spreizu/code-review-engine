    mode: deterministic
    engine: tree-sitter
    query: |
      (expression_statement (sequence_expression) @match)
  message: The comma operator discards all but the last value and hides mistakes.
  source:
    url: https://eslint.org/docs/latest/rules/no-sequences
    doc: ESLint rule no-sequences
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow comma operators
  examples:
    bad: |
      a = 1, b = 2
    good: |
      a = 1
      b = 2
  tags:
  - eslint:no-sequences
  status: active
  rule_version: 1
- id: JS-QUAL-NO-SETTER-RETURN
  title: Disallow returning values from setters
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (method_definition "set" body: (statement_block (return_statement (_)) @match))
  message: Return values from setters are ignored.
  source:
    url: https://eslint.org/docs/latest/rules/no-setter-return
    doc: ESLint rule no-setter-return
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow returning values from setters
  examples:
    bad: |
      class A {
        set v(x) { return this._v = x }
      }
    good: |
      class A {
        set v(x) { this._v = x }
      }
  tags:
  - eslint:no-setter-return
  status: active
  rule_version: 1
- id: JS-QUAL-NO-SHADOW-RESTRICTED-NAMES
  title: Disallow identifiers from shadowing restricted names
  language: javascript
  kind: best-practice
  category: correctness
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((variable_declarator name: (identifier) @n) @match (#match? @n "^(NaN|Infinity|eval|arguments)$"))
  message: Shadowing restricted global names is confusing and error-prone.
  source:
    url: https://eslint.org/docs/latest/rules/no-shadow-restricted-names
    doc: ESLint rule no-shadow-restricted-names
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow identifiers from shadowing restricted names
  examples:
    bad: |
      function f() {
        const Infinity = 0
      }
    good: |
      function f() {
        const limit = 0
      }
  tags:
  - eslint:no-shadow-restricted-names
  status: active
  rule_version: 1
- id: JS-QUAL-NO-SPARSE-ARRAYS
  title: Disallow sparse arrays
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((array) @match (#match? @match "^\\[\\s*,|,\\s*,"))
    filters:
    - node.has_hole
  message: Holes in array literals are easy to misread and behave differently from undefined in iteration methods.
  source:
    url: https://eslint.org/docs/latest/rules/no-sparse-arrays
    doc: ESLint rule no-sparse-arrays
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow sparse arrays
  examples:
    bad: |
      const a = [1, , 3]
    good: |
      const a = [1, undefined, 3]
    regressions:
    - note: 'got/nest: commas inside strings'
      code: |
        const cases = ['', ',', ', ,', '1, ,2']
  tags:
  - eslint:no-sparse-arrays
  status: active
  rule_version: 1
- id: JS-QUAL-NO-TEMPLATE-CURLY-IN-STRING
