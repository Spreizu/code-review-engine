- id: JS-QUAL-PREFER-SPREAD
  title: Require spread operators instead of .apply()
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression property: (property_identifier) @p) arguments: (arguments . [(undefined) (null)])) @match (#eq? @p "apply"))
  message: Use spread instead of .apply().
  source:
    url: https://eslint.org/docs/latest/rules/prefer-spread
    doc: ESLint rule prefer-spread
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Require spread operators instead of .apply()
  examples:
    bad: |
      Math.max.apply(null, nums)
    good: |
      Math.max(...nums)
  tags:
  - eslint:prefer-spread
  status: active
  rule_version: 1
- id: JS-QUAL-PREFER-TEMPLATE
  title: Require template literals instead of string concatenation
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (binary_expression left: (string) operator: "+" right: [(identifier) (member_expression) (call_expression)]) @match
  message: Use a template literal instead of string concatenation.
  source:
    url: https://eslint.org/docs/latest/rules/prefer-template
    doc: ESLint rule prefer-template
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Require template literals instead of string concatenation
  examples:
    bad: |
      const s = 'Hello ' + name
    good: |
      const s = `Hello ${name}`
  tags:
  - eslint:prefer-template
  status: active
  rule_version: 1
- id: JS-QUAL-PRESERVE-CAUGHT-ERROR
  title: Disallow losing originally caught error when re-throwing custom errors
  language: javascript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=2022'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((catch_clause parameter: (identifier) body: (statement_block (throw_statement (new_expression arguments: (arguments) @args)) @match)) (#not-match? @args "cause"))
  message: 'The re-thrown error drops the original; pass { cause: err } to keep the chain.'
  source:
    url: https://eslint.org/docs/latest/rules/preserve-caught-error
    doc: ESLint rule preserve-caught-error
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow losing originally caught error when re-throwing custom errors
  examples:
    bad: |
      try { parse() } catch (err) {
        throw new Error('parse failed')
      }
    good: |
      try { parse() } catch (err) {
        throw new Error('parse failed', { cause: err })
      }
  tags:
  - eslint:preserve-caught-error
  status: active
  rule_version: 1
- id: JS-QUAL-REQUIRE-ATOMIC-UPDATES
  title: Disallow assignments that can lead to race conditions due to usage of await or yield
  language: javascript
  kind: anti-pattern
  category: concurrency
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      (augmented_assignment_expression right: (await_expression)) @match
  message: The left side is read before the await and written after it, so concurrent calls can lose updates.
  ai_question: Is the updated variable shared state that another async call can modify while this function is suspended?
  source:
    url: https://eslint.org/docs/latest/rules/require-atomic-updates
    doc: ESLint rule require-atomic-updates
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow assignments that can lead to race conditions due to usage of await or yield
  examples:
    bad: |
      async function add(x) {
        total += await fetchValue(x)
      }
    good: |
      async function add(x) {
        const v = await fetchValue(x)
        total += v
      }
  tags:
  - eslint:require-atomic-updates
  status: active
  rule_version: 1
- id: JS-QUAL-REQUIRE-AWAIT
  title: Disallow async functions which have no await expression
  language: javascript
  kind: best-practice
  category: async
  severity: minor
  applies_to:
    ecmascript: '>=2017'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((function_declaration "async" body: (statement_block) @b) @match (#not-match? @b "await"))
      ((arrow_function "async" body: (statement_block) @b) @match (#not-match? @b "await"))
      ((method_definition "async" body: (statement_block) @b) @match (#not-match? @b "await"))
  message: 'async function without await: the async wrapper only adds overhead (or an await is missing).'
  source:
    url: https://eslint.org/docs/latest/rules/require-await
    doc: ESLint rule require-await
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow async functions which have no await expression
  examples:
    bad: |
      async function load() {
        return cache.get(k)
      }
    good: |
      async function load() {
        return await db.get(k)
      }
  tags:
  - eslint:require-await
  status: active
  rule_version: 1
- id: JS-QUAL-REQUIRE-UNICODE-REGEXP
  title: Enforce the use of u or v flag on regular expressions
  language: javascript
  kind: best-practice
  category: correctness
  severity: info
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((regex !flags) @match)
      ((regex flags: (regex_flags) @f) @match (#not-match? @f "[uv]"))
  message: Without the u/v flag, regexes treat surrogate pairs as two characters.
  source:
    url: https://eslint.org/docs/latest/rules/require-unicode-regexp
    doc: ESLint rule require-unicode-regexp
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Enforce the use of u or v flag on regular expressions
  examples:
    bad: |
      const re = /😀+/
    good: |
      const re = /😀+/u
  tags:
  - eslint:require-unicode-regexp
  status: active
  rule_version: 1
- id: JS-QUAL-REQUIRE-YIELD
  title: Require generator functions to contain yield
  language: javascript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((generator_function_declaration body: (statement_block) @b) @match (#not-match? @b "yield") (#not-match? @b "^\\{\\s*\\}$"))
  message: A generator that never yields.
  source:
    url: https://eslint.org/docs/latest/rules/require-yield
    doc: ESLint rule require-yield
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Require generator functions to contain yield
  examples:
    bad: |
      function* gen() {
        return 1
      }
    good: |
      function* gen() {
        yield 1
      }
  tags:
  - eslint:require-yield
  status: active
  rule_version: 1
- id: JS-QUAL-SYMBOL-DESCRIPTION
  title: Require symbol descriptions
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (identifier) @f arguments: (arguments) @a) @match (#eq? @f "Symbol") (#eq? @a "()"))
  message: Give symbols a description for debugging.
  source:
    url: https://eslint.org/docs/latest/rules/symbol-description
    doc: ESLint rule symbol-description
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Require symbol descriptions
  examples:
    bad: |
      const s = Symbol()
    good: |
      const s = Symbol('cache-key')
  tags:
  - eslint:symbol-description
  status: active
  rule_version: 1
- id: JS-QUAL-USE-ISNAN
  title: Require calls to isNaN() when checking for NaN
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: critical
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((binary_expression operator: ["==" "===" "!=" "!==" "<" ">" "<=" ">="] right: (identifier) @n) @match (#eq? @n "NaN"))
      ((binary_expression left: (identifier) @n operator: ["==" "===" "!=" "!==" "<" ">" "<=" ">="]) @match (#eq? @n "NaN"))
    filters:
    - file.lacks_re:(?m)\b(?:var|let|const|function|class|import)\s+(?:\{[^}]*\b)?NaN\b|\bfunction\b[^(]*\([^)]*\bNaN\b[^)]*\)|\([^()]*\bNaN\b[^()]*\)\s*=>|\bNaN\s*=>
  message: NaN is never equal to anything (including NaN); use Number.isNaN().
  source:
    url: https://eslint.org/docs/latest/rules/use-isnan
    doc: ESLint rule use-isnan
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Require calls to isNaN() when checking for NaN
  examples:
    bad: |
      if (value === NaN) {}
    good: |
      if (Number.isNaN(value)) {}
    regressions:
    - note: local NaN binding
      code: |
        function check(x, NaN) {
          return x === NaN
        }
  tags:
  - eslint:use-isnan
  status: active
  rule_version: 1
- id: JS-QUAL-VALID-TYPEOF
  title: Enforce comparing typeof expressions against valid strings
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: critical
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((binary_expression left: (unary_expression operator: "typeof") right: (string (string_fragment) @s)) @match (#not-match? @s "^(undefined|object|boolean|number|string|function|symbol|bigint)$"))
  message: typeof never returns this string, so the comparison is always false.
  source:
    url: https://eslint.org/docs/latest/rules/valid-typeof
    doc: ESLint rule valid-typeof
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Enforce comparing typeof expressions against valid strings
  examples:
    bad: |
      if (typeof x === 'strnig') {}
    good: |
      if (typeof x === 'string') {}
  tags:
  - eslint:valid-typeof
  status: active
  rule_version: 1
- id: JS-QUAL-WEB-FETCH-OK-001
  title: fetch() response used without checking response.ok
  language: javascript
  kind: anti-pattern
  category: error-handling
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((statement_block) @match (#match? @match "^\\{[^{}]*\\bfetch\\(") (#match? @match "\\.(json|text|blob|arrayBuffer)\\(\\)") (#not-match? @match "\\.ok\\b|\\.status\\b"))
  message: fetch() resolves for HTTP 4xx/5xx; check response.ok/status before reading the body.
  ai_question: Is the HTTP status of this fetch response never checked before use?
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch
    doc: MDN Using_Fetch
    doc_version: MDN (living standard)
    retrieved: '2026-10-09'
    quote: The fetch() function will reject the promise on some errors, but not if the server responds with an error status like 404
  examples:
    bad: |
      async function load(u) {
        const res = await fetch(u)
        return res.json()
      }
    good: |
      async function load(u) {
        const res = await fetch(u)
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        return res.json()
      }
  tags:
  - web-platform
  status: active
  rule_version: 1
- id: JS-QUAL-WEB-PASSIVE-LISTENER-001
  title: 'Scroll-blocking touch/wheel listeners without { passive: true }'
  language: javascript
  kind: best-practice
  category: performance
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression property: (property_identifier) @p) arguments: (arguments . (string (string_fragment) @e) . (_) .)) @match (#eq? @p "addEventListener") (#match? @e "^(touchstart|touchmove|wheel|mousewheel)$"))
  message: Non-passive touch/wheel listeners force the browser to wait before scrolling.
  ai_question: Does the handler NOT call preventDefault() (so it can be passive)?
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/addEventListener
    doc: MDN addEventListener
    doc_version: MDN (living standard)
    retrieved: '2026-10-09'
    quote: the browser is in general unable to start the default action
  examples:
    bad: |
      el.addEventListener('touchmove', onMove)
    good: |
      el.addEventListener('touchmove', onMove, { passive: true })
  tags:
  - web-platform
  status: active
  rule_version: 1
- id: JS-QUAL-WEB-SORT-DEFAULT-001
  title: Array.prototype.sort() without a comparator sorts numbers as strings
  language: javascript
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression property: (property_identifier) @p) arguments: (arguments) @a) @match (#match? @p "^(sort|toSorted)$") (#eq? @a "()"))
  message: Without a compare function, [10, 9, 1].sort() yields [1, 10, 9].
  ai_question: Does the array contain numbers (or values whose string order differs from the intended order)?
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort
    doc: MDN sort
    doc_version: MDN (living standard)
    retrieved: '2026-10-09'
    quote: The default sort order is ascending, built upon converting the elements into strings
  examples:
    bad: |
      const top = scores.sort()
    good: |
      const top = scores.sort((a, b) => a - b)
  tags:
  - web-platform
  status: active
  rule_version: 1
- id: JS-QUAL-YODA
  title: Require or disallow "Yoda" conditions
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (binary_expression left: [(string) (number)] operator: ["===" "==" "!==" "!="] right: (identifier)) @match
  message: Put the literal on the right side of the comparison.
  source:
    url: https://eslint.org/docs/latest/rules/yoda
    doc: ESLint rule yoda
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Require or disallow "Yoda" conditions
  examples:
    bad: |
      if ('red' === color) {}
    good: |
      if (color === 'red') {}
  tags:
  - eslint:yoda
  status: active
  rule_version: 1
