    url: https://eslint.org/docs/latest/rules/no-warning-comments
    doc: ESLint rule no-warning-comments
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow specified warning terms in comments
  examples:
    bad: |
      // TODO: handle errors
      run()
    good: |
      // handled by the caller
      run()
  tags:
  - eslint:no-warning-comments
  status: active
  rule_version: 1
- id: JS-QUAL-OBJECT-SHORTHAND
