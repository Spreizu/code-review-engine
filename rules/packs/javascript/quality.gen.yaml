    url: https://eslint.org/docs/latest/rules/prefer-regex-literals
    doc: ESLint rule prefer-regex-literals
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow use of the RegExp constructor in favor of regular expression literals
  examples:
    bad: |
      const re = new RegExp('^abc$', 'i')
    good: |
      const re = /^abc$/i
  tags:
  - eslint:prefer-regex-literals
  status: active
  rule_version: 1
- id: JS-QUAL-PREFER-REST-PARAMS
