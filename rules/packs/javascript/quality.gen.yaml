      const re = /foo {3}bar/
  tags:
  - eslint:no-regex-spaces
  status: active
  rule_version: 1
- id: JS-QUAL-NO-RETURN-ASSIGN
  title: Disallow assignment operators in return statements
  language: javascript
  kind: best-practice
  category: correctness
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (return_statement (assignment_expression) @match)
      (arrow_function body: (assignment_expression) @match)
  message: An assignment in a return is often a mistyped comparison.
