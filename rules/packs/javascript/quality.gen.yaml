  tags:
  - eslint:no-useless-computed-key
  status: active
  rule_version: 1
- id: JS-QUAL-NO-USELESS-CONCAT
  title: Disallow unnecessary concatenation of literals or template literals
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((binary_expression left: (string) operator: "+" right: (string)) @match (#not-match? @match "\\n"))
  message: Concatenating two literals on one line is redundant.
  source:
    url: https://eslint.org/docs/latest/rules/no-useless-concat
    doc: ESLint rule no-useless-concat
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow unnecessary concatenation of literals or template literals
  examples:
    bad: |
      const s = 'a' + 'b'
    good: |
      const s = 'ab'
  tags:
  - eslint:no-useless-concat
  status: active
  rule_version: 1
- id: JS-QUAL-NO-USELESS-CONSTRUCTOR
  title: Disallow unnecessary constructors
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((class_declaration body: (class_body (method_definition name: (property_identifier) @n parameters: (formal_parameters) @fp body: (statement_block) @b) @inner)) @match (#eq? @n "constructor") (#eq? @fp "()") (#match? @b "^\\{\\s*\\}$") (#not-match? @match "^class\\s+\\w+\\s+extends"))
    capture: inner
  message: An empty constructor is redundant.
  source:
    url: https://eslint.org/docs/latest/rules/no-useless-constructor
    doc: ESLint rule no-useless-constructor
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow unnecessary constructors
  examples:
    bad: |
      class A {
        constructor() {}
      }
    good: |
      class A {
        constructor() { this.x = 1 }
      }
  tags:
  - eslint:no-useless-constructor
  status: active
  rule_version: 1
- id: JS-QUAL-NO-USELESS-ESCAPE
  title: Disallow unnecessary escape characters
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((string (escape_sequence) @match) (#match? @match "^\\\\[dDwWsS.()\\[\\]]$"))
  message: This escape has no meaning in a string literal (the backslash is dropped), usually a regex escape mistake.
  source:
    url: https://eslint.org/docs/latest/rules/no-useless-escape
    doc: ESLint rule no-useless-escape
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow unnecessary escape characters
  examples:
    bad: |
      const re = new RegExp('\d+')
    good: |
      const re = /\d+/
  tags:
  - eslint:no-useless-escape
  status: active
  rule_version: 1
- id: JS-QUAL-NO-USELESS-RENAME
  title: Disallow renaming import, export, and destructured assignments to the same name
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((pair_pattern key: (property_identifier) @k value: (identifier) @v) @match (#eq? @k @v))
      ((import_specifier name: (identifier) @k alias: (identifier) @v) @match (#eq? @k @v))
  message: Renaming to the same name is redundant.
  source:
    url: https://eslint.org/docs/latest/rules/no-useless-rename
    doc: ESLint rule no-useless-rename
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow renaming import, export, and destructured assignments to the same name
  examples:
    bad: |
      const { a: a } = obj
    good: |
      const { a } = obj
  tags:
  - eslint:no-useless-rename
  status: active
  rule_version: 1
- id: JS-QUAL-NO-USELESS-RETURN
  title: Disallow redundant return statements
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((function_declaration body: (statement_block (return_statement) @match .)) (#match? @match "^return;?$"))
  message: A bare return at the end of a function is redundant.
