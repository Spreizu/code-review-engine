      const { name } = user
  tags:
  - eslint:prefer-destructuring
  status: active
  rule_version: 1
- id: JS-QUAL-PREFER-EXPONENTIATION-OPERATOR
  title: Disallow the use of Math.pow in favor of the ** operator
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=2016'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression object: (identifier) @o property: (property_identifier) @p)) @match (#eq? @o "Math") (#eq? @p "pow"))
  message: Use ** instead of Math.pow.
  source:
    url: https://eslint.org/docs/latest/rules/prefer-exponentiation-operator
    doc: ESLint rule prefer-exponentiation-operator
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow the use of Math.pow in favor of the ** operator
  examples:
    bad: |
      const a = Math.pow(2, 8)
    good: |
      const a = 2 ** 8
  tags:
  - eslint:prefer-exponentiation-operator
  status: active
  rule_version: 1
- id: JS-QUAL-PREFER-NAMED-CAPTURE-GROUP
  title: Enforce using named capture group in regular expression
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=2018'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((regex pattern: (regex_pattern) @match) (#match? @match "(^|[^\\\\])\\(([^?]|$)"))
  message: Use named capture groups for readability.
  source:
    url: https://eslint.org/docs/latest/rules/prefer-named-capture-group
    doc: ESLint rule prefer-named-capture-group
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Enforce using named capture group in regular expression
  examples:
    bad: |
      const re = /(\d{4})-(\d{2})/
    good: |
      const re = /(?<year>\d{4})-(?<month>\d{2})/
  tags:
  - eslint:prefer-named-capture-group
  status: active
  rule_version: 1
- id: JS-QUAL-PREFER-NUMERIC-LITERALS
  title: Disallow parseInt() and Number.parseInt() in favor of binary, octal, and hexadecimal literals
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (identifier) @f arguments: (arguments (string) (number) @n)) @match (#eq? @f "parseInt") (#match? @n "^(2|8|16)$"))
    filters:
    - file.lacks_re:(?m)\b(?:var|let|const|function|class|import)\s+(?:\{[^}]*\b)?parseInt\b|\bfunction\b[^(]*\([^)]*\bparseInt\b[^)]*\)|\([^()]*\bparseInt\b[^()]*\)\s*=>|\bparseInt\s*=>
  message: Use binary/octal/hex literals instead of parseInt on a literal.
  source:
    url: https://eslint.org/docs/latest/rules/prefer-numeric-literals
    doc: ESLint rule prefer-numeric-literals
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow parseInt() and Number.parseInt() in favor of binary, octal, and hexadecimal literals
  examples:
    bad: |
      const n = parseInt('111110111', 2)
    good: |
      const n = 0b111110111
    regressions:
    - note: parseInt parameter
      code: |
        function read(parseInt) {
          return parseInt('101', 2)
        }
  tags:
  - eslint:prefer-numeric-literals
  status: active
  rule_version: 1
- id: JS-QUAL-PREFER-OBJECT-SPREAD
  title: Disallow using Object.assign with an object literal as the first argument and prefer the use of object spread instead
  language: javascript
  kind: best-practice
  category: style
  severity: info
  applies_to:
    ecmascript: '>=2018'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression object: (identifier) @o property: (property_identifier) @p) arguments: (arguments . (object) @first)) @match (#eq? @o "Object") (#eq? @p "assign") (#match? @first "^\\{\\s*\\}$"))
    filters:
    - node.lacks_re:\.\.\.|\b(get|set)\s+[\w$\[]|__proto__
    - file.lacks_re:(?m)^\s*(?:(?:const|let|var)\s+)?Object\s*=
  message: Use object spread instead of Object.assign({}, ...).
  source:
    url: https://eslint.org/docs/latest/rules/prefer-object-spread
    doc: ESLint rule prefer-object-spread
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow using Object.assign with an object literal as the first argument and prefer the use of object spread instead
  examples:
    bad: |
      const c = Object.assign({}, a, b)
    good: |
      const c = { ...a, ...b }
    regressions:
    - note: spread argument
      code: |
        const c = Object.assign({}, ...parts)
    - note: getter is invoked by assign
      code: |
        const c = Object.assign({}, { get id() { return next() } })
    - note: local Object binding
      code: |
        const Object = makeShim()
        const c = Object.assign({}, a)
  tags:
  - eslint:prefer-object-spread
  status: active
  rule_version: 1
- id: JS-QUAL-PREFER-PROMISE-REJECT-ERRORS
  title: Require using Error objects as Promise rejection reasons
  language: javascript
  kind: best-practice
  category: async
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression object: (identifier) @o property: (property_identifier) @p) arguments: (arguments . [(string) (number) (template_string) (object)])) @match (#eq? @o "Promise") (#eq? @p "reject"))
  message: Reject with Error objects so stack traces survive.
  source:
    url: https://eslint.org/docs/latest/rules/prefer-promise-reject-errors
    doc: ESLint rule prefer-promise-reject-errors
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Require using Error objects as Promise rejection reasons
  examples:
    bad: |
      return Promise.reject('failed')
    good: |
      return Promise.reject(new Error('failed'))
  tags:
  - eslint:prefer-promise-reject-errors
  status: active
  rule_version: 1
- id: JS-QUAL-PREFER-REGEX-LITERALS
