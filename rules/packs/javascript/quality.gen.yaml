    url: https://eslint.org/docs/latest/rules/no-regex-spaces
    doc: ESLint rule no-regex-spaces
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Disallow multiple spaces in regular expressions
