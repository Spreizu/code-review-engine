    url: https://eslint.org/docs/latest/rules/object-shorthand
    doc: ESLint rule object-shorthand
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: Require or disallow method and property shorthand syntax for object literals
