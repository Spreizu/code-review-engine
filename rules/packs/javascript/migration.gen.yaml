    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression property: (property_identifier) @p)) @match (#eq? @p "toGMTString"))
  message: Use toUTCString().
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toUTCString
    doc: MDN toUTCString
    doc_version: MDN (living standard)
    retrieved: '2026-10-09'
    quote: toGMTString()
  examples:
    bad: |
      const s = d.toGMTString()
    good: |
      const s = d.toUTCString()
  tags:
  - web-platform
  status: active
  rule_version: 1
- id: JS-MIG-WEB-UNLOAD-001
  title: unload event listeners are deprecated
  language: javascript
  kind: deprecation
  category: performance
  severity: minor
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression property: (property_identifier) @p) arguments: (arguments . (string (string_fragment) @e))) @match (#eq? @p "addEventListener") (#eq? @e "unload"))
  message: unload is unreliable and disables the back/forward cache; use visibilitychange or pagehide.
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/API/Window/unload_event
    doc: MDN unload_event
    doc_version: MDN (living standard)
    retrieved: '2026-10-09'
    quote: Developers should avoid using this event.
  examples:
    bad: |
      window.addEventListener('unload', save)
    good: |
      document.addEventListener('visibilitychange', save)
  tags:
  - web-platform
  status: active
  rule_version: 1
