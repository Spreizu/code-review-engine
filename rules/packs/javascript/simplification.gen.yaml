      max_lines: 25
      dependency: lodash
  message: This hand-written helper re-implements lodash debounce/throttle from the installed dependency lodash. Use it directly and delete the helper.
  fix: Prefer the simplest code that works. When a shortcut is deliberate, add a `limit:` comment saying how far it holds (e.g. input size, request rate) and what to switch to beyond that.
  ai_question: Does this function behave the same as lodash debounce/throttle for every input its callers pass (same result, ordering and edge cases), so it can be replaced by lodash debounce/throttle?
  source:
    url: https://lodash.com/docs/4.17.15
    doc: lodash _.debounce
    doc_version: MDN (2026)
    retrieved: '2026-10-09'
    quote: ders. curried ( 3 )( 1 , _)( 2 ); // => [1, 2, 3] _.debounce(func, [wait=0], [options={}]) source npm package Creates a debounced function that delays invoking func until after wait milliseconds have elapsed since the last time the debounced function was invoked.
  examples:
    bad: |
      function debounce(fn, ms) {
        let t
        return (...a) => {
          clearTimeout(t)
