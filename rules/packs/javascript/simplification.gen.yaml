- id: JS-SIMP-LOOP-SOME
  title: Loop that is Array.prototype.some
  language: javascript
  kind: modernization
  category: simplification
  severity: minor
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (for_in_statement body: (statement_block . (if_statement condition: (parenthesized_expression) @c consequence: [(statement_block . (return_statement (true)) .) (return_statement (true))] !alternative) .) (#not-match? @c "^\\(\\s*\\w+\\s*===")) @match
  message: Use xs.some(predicate) / xs.every(predicate).
  fix: Prefer the simplest code that works. When a shortcut is deliberate, add a `limit:` comment saying how far it holds (e.g. input size, request rate) and what to switch to beyond that.
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/some
    doc: Loop that is Array.prototype.some
    doc_version: MDN (2026)
    retrieved: '2026-10-09'
    quote: See full compatibility Learn more The some() method of Array instances returns true if it finds an element in the array that satisfies the provided testing function.
  examples:
    bad: |
      function anyAdmin(users) {
        for (const u of users) {
          if (u.role === 'admin' && u.active) return true
        }
        return false
      }
    good: |
      function anyAdmin(users) {
        return users.some((u) => u.role === 'admin' && u.active)
      }
