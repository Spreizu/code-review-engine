- id: JS-SEC-TIMING-COMPARE
  title: Secret compared with === instead of a constant-time check
  language: javascript
  kind: security
  category: security
  severity: minor
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      [((binary_expression left: [(identifier) (member_expression) (subscript_expression)] @l right: [(identifier) (member_expression) (subscript_expression)] @r) @match (#match? @l "(?i)(signature|hmac|digest|secret|api_?key|(api|access|auth|csrf|xsrf|reset|session|bearer|refresh|expected|stored|provided|given|user|verify|verification|webhook)_?token)$") (#not-match? @r "^(null|nil|None|undefined|NaN|true|false)$") (#match? @match "^\\S+\\s*[!=]==?\\s*\\S+$"))
               ((binary_expression left: [(identifier) (member_expression) (subscript_expression)] @l2 right: [(identifier) (member_expression) (subscript_expression)] @r2) @match (#match? @r2 "(?i)(signature|hmac|digest|secret|api_?key|(api|access|auth|csrf|xsrf|reset|session|bearer|refresh|expected|stored|provided|given|user|verify|verification|webhook)_?token)$") (#not-match? @l2 "^(null|nil|None|undefined|NaN|true|false)$") (#match? @match "^\\S+\\s*[!=]==?\\s*\\S+$"))]
    filters:
    - file.lacks_re:timingSafeEqual
    exclude_tests: true
  message: A secret (token, signature, HMAC) is compared with an ordinary equality operator, which returns as soon as a byte differs; the response time leaks how much of a guess was right. Use a constant-time comparison.
  ai_question: Is one side a secret (HMAC, signature, API token, password hash) and the other an attacker-supplied value, e.g. from a request?
  source:
    url: https://nodejs.org/api/crypto.html
    doc: Secret compared with === instead of a constant-time check
    doc_version: Node.js crypto docs
    retrieved: '2026-10-09'
    quote: ction compares the underlying bytes that represent the given ArrayBuffer , TypedArray , or DataView instances using a constant-time algorithm.
  examples:
    bad: |
      function check(req) {
        const expected = sign(req.body)
        return req.headers['x-sig'] === expectedSignature
      }
    good: |
      function check(req) {
        const a = Buffer.from(req.headers['x-sig'])
        const b = Buffer.from(expectedSignature)
        return a.length === b.length && crypto.timingSafeEqual(a, b)
      }
    regressions:
    - code: |
        if (token === undefined) return
    - code: |
        if (typeof token === 'string') x()
    - code: |
        if (data === token) return
  cwe:
  - CWE-208
  asvs:
  - V11.2.4
  status: active
  rule_version: 1
  tags:
  - appsec
