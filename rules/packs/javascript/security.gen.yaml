      ((call_expression function: (member_expression property: (property_identifier) @p) arguments: (arguments [(member_expression property: (property_identifier) @s) (object (pair value: (member_expression property: (property_identifier) @s)))])) @match (#match? @p "^(send|json|end|write|jsonp|render)$") (#eq? @s "stack"))
    filters:
    - func.lacks_re:NODE_ENV|isDev|development
    exclude_tests: true
