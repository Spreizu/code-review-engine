  ai_question: Can the inserted HTML contain user-controlled data that is not sanitized?
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/API/Element/insertAdjacentHTML
    doc: MDN insertAdjacentHTML
    doc_version: MDN (living standard)
    retrieved: '2026-10-09'
    quote: APIs like this are known as injection sinks
  examples:
    bad: |
      el.insertAdjacentHTML('beforeend', comment.body)
    good: |
      el.insertAdjacentText('beforeend', comment.body)
  tags:
  - web-platform
  status: active
  rule_version: 1
- id: JS-SEC-WEB-POSTMESSAGE-STAR-001
  title: postMessage with targetOrigin '*'
  language: javascript
  kind: security
  category: security
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression property: (property_identifier) @p) arguments: (arguments (_) . (string) @s)) @match (#eq? @p "postMessage") (#match? @s "^['\"]\\*['\"]$"))
  message: '''*'' sends the message to whatever origin the window currently has, leaking data to a navigated/hostile frame.'
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage
    doc: MDN postMessage
    doc_version: MDN (living standard)
    retrieved: '2026-10-09'
    quote: Always provide a specific targetOrigin, not *, if you know where the other window's document should be located.
  examples:
    bad: |
      frame.contentWindow.postMessage(token, '*')
    good: |
      frame.contentWindow.postMessage(token, 'https://app.example.com')
  tags:
  - web-platform
  status: active
  rule_version: 1
- id: JS-SEC-WS-CLEARTEXT
  title: WebSocket opened over cleartext ws://
  language: javascript
  kind: security
  category: security
  severity: major
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((new_expression constructor: (identifier) @c arguments: (arguments . [(string) (template_string)] @u)) @match (#match? @c "^(WebSocket|ReconnectingWebSocket)$") (#match? @u "^['\"`]ws://"))
    filters:
    - node.lacks_re:ws://(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])
    exclude_tests: true
  message: The WebSocket connects over ws://, so messages (and any token sent on them) travel unencrypted and can be read or injected on the network. Use wss://.
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/WebSocket_Security_Cheat_Sheet.html
    doc: WebSocket opened over cleartext ws://
    doc_version: OWASP Cheat Sheet Series (current)
    retrieved: '2026-10-09'
    quote: nd tampering. // Secure - always use this const socket = new WebSocket ( 'wss://app.example.com/socket' ); // Insecure - never use in production // const socket = new WebSocket('ws://app.example.com/socket'); See the Transport Layer Security Cheat Sheet
  examples:
    bad: |
      const socket = new WebSocket('ws://chat.example.com/socket')
    good: |
      const socket = new WebSocket('wss://chat.example.com/socket')
    regressions:
    - code: |
        const dev = new WebSocket('ws://localhost:8080/hmr')
  cwe:
  - CWE-319
  asvs:
  - V4.4.1
  status: active
  rule_version: 1
  tags:
  - appsec
