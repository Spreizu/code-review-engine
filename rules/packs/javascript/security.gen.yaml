- id: JS-SEC-JWT-ALG-NONE
  title: JWT verification accepts the 'none' algorithm
  language: javascript
  kind: security
  category: security
  severity: critical
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((pair key: (property_identifier) @k value: (array (string (string_fragment) @v))) @match (#eq? @k "algorithms") (#match? @v "^(?i)none$"))
    exclude_tests: true
  message: Allowing 'none' lets a token without any signature pass verification, so every claim can be forged. List only the signing algorithms you actually use.
  source:
    url: https://github.com/auth0/node-jsonwebtoken
    doc: JWT verification accepts the 'none' algorithm
    doc_version: jsonwebtoken README
    retrieved: '2026-10-09'
    quote: 'l be decoded using base64 and the token verification will use the original random bytes. options algorithms : List of strings with the names of the allowed algorithms. For instance, ["HS256", "HS384"] .'
  examples:
    bad: |
      jwt.verify(token, key, { algorithms: ['HS256', 'none'] })
    good: |
      jwt.verify(token, key, { algorithms: ['HS256'] })
  cwe:
  - CWE-347
  asvs:
  - V9.1.2
  status: active
  rule_version: 1
  tags:
  - appsec
- id: JS-SEC-JWT-DECODE-NO-VERIFY
  title: jwt.decode() result used without jwt.verify()
  language: javascript
  kind: security
  category: security
  severity: major
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression object: (identifier) @o property: (property_identifier) @p)) @match (#match? @o "^(jwt|jsonwebtoken|JWT)$") (#eq? @p "decode"))
    filters:
    - file.has_re:jsonwebtoken
    - func.lacks_re:\.verify\(
    exclude_tests: true
  message: jwt.decode() does not check the signature, so anyone can forge the claims it returns. Use jwt.verify() with the key and an algorithms allow-list before trusting any claim.
  ai_question: Are the decoded claims used for an authentication or authorisation decision without a jwt.verify() on the same token?
  source:
    url: https://github.com/auth0/node-jsonwebtoken
    doc: jwt.decode() result used without jwt.verify()
    doc_version: jsonwebtoken README
    retrieved: '2026-10-09'
    quote: '(Click to expand) jwt.decode(token [, options]) (Synchronous) Returns the decoded payload without verifying if the signature is valid. Warning: This will not verify whether the signature is valid.'
  examples:
    bad: |
      const jwt = require('jsonwebtoken')
      function user(req) {
        return jwt.decode(req.headers.authorization.slice(7)).sub
      }
    good: |
      const jwt = require('jsonwebtoken')
      function user(req) {
        return jwt.verify(req.headers.authorization.slice(7), process.env.JWT_KEY, { algorithms: ['HS256'] }).sub
      }
  cwe:
  - CWE-347
  asvs:
  - V9.1.1
  status: active
  rule_version: 1
  tags:
  - appsec
- id: JS-SEC-LATEX-SHELL-ESCAPE
  title: TeX engine started with -shell-escape
  language: javascript
  kind: security
  category: security
  severity: major
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (_) @f arguments: (arguments [(array [(string) (template_string)] @s) (string) @s (template_string) @s])) @match (#match? @f "(^|\\.)(spawn|spawnSync|exec|execSync|execFile|execFileSync)$") (#match? @s "(^['\"`]|\\s)--?(shell-escape|enable-write18)(['\"`]|\\s)"))
    exclude_tests: true
  message: The TeX engine runs with shell escape enabled, so a document that contains \write18 (or \immediate\write18) executes arbitrary shell commands. When any part of the document comes from users this is command execution; drop -shell-escape (TeX Live's restricted mode is the default).
  source:
    url: https://tug.org/texlive/doc/texlive-en/texlive-en.html
    doc: TeX engine started with -shell-escape
    doc_version: OWASP Cheat Sheet Series (current)
    retrieved: '2026-10-09'
    quote: n in the installer (see section 3.2.4 ), or override the value after installation by running tlmgr conf texmf shell_escape 0 .
  examples:
    bad: |
      const { spawn } = require('child_process')
      spawn('xelatex', ['-shell-escape', file])
    good: |
      const { spawn } = require('child_process')
      spawn('xelatex', ['-no-shell-escape', file])
  cwe:
  - CWE-78
  asvs:
  - V1.2.8
  status: active
  rule_version: 1
  tags:
  - appsec
- id: JS-SEC-LIBXML-NOENT
  title: 'libxmljs parse with noent: true (entity substitution)'
  language: javascript
  kind: security
  category: security
  severity: major
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression property: (property_identifier) @m) arguments: (arguments (object (pair key: (property_identifier) @k value: (true))))) @match (#match? @m "^(parseXml|parseXmlString|parseXmlAsync|parseHtml)$") (#eq? @k "noent"))
    exclude_tests: true
  message: 'noent: true makes libxml2 substitute entities, including external ones, so a DOCTYPE in the input can read local files or reach internal URLs (XXE). Leave it off.'
  source:
    url: https://gnome.pages.gitlab.gnome.org/libxml2/html/parser_8h.html
    doc: 'libxmljs parse with noent: true (entity substitution)'
    doc_version: libxml2 API docs
    retrieved: '2026-10-09'
    quote: XML_PARSE_NOENT Despite the confusing name, this option enables substitution of entities. The resulting tree won't contain any entity reference nodes.
  examples:
    bad: |
      const libxmljs = require('libxmljs')
      const doc = libxmljs.parseXml(req.body, { noent: true })
    good: |
      const libxmljs = require('libxmljs')
      const doc = libxmljs.parseXml(req.body, { noent: false, nonet: true })
  cwe:
  - CWE-611
  asvs:
  - V1.5.1
  status: active
  rule_version: 1
  tags:
  - appsec
- id: JS-SEC-LOG-INJECTION
  title: Request data formatted into a log message
  language: javascript
  kind: security
  category: security
  severity: minor
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression object: (_) @l property: (property_identifier) @n) arguments: (arguments . [(template_string) (binary_expression)] @msg)) @match (#match? @l "^(logger|log|console|req\\.log|fastify\\.log)$") (#match? @n "^(debug|info|warn|error|log)$") (#match? @msg "\\b(req|request)\\.(query|body|params|headers)\\b"))
    exclude_tests: true
  message: Request data goes into the log line unchanged, so CR/LF in it forges extra log entries (and other control characters can attack log viewers). Pass it as a structured/parameterised argument and strip or encode CR/LF (or use a JSON log encoder).
