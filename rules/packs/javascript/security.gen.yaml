- id: JS-SEC-STATIC-IV
  title: createCipheriv with a constant IV
  language: javascript
  kind: security
  category: security
  severity: major
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression property: (property_identifier) @p) arguments: (arguments (_) (_) [(string) (call_expression function: (member_expression object: (identifier) @b property: (property_identifier) @a) arguments: (arguments . [(string) (number)]))] @iv)) @match (#eq? @p "createCipheriv") (#eq? @b "Buffer") (#match? @a "^(from|alloc)$"))
    exclude_tests: true
  message: 'The IV/nonce is a constant, so every message encrypted with this key reuses it: equal plaintexts give equal ciphertexts (CBC) or the keystream repeats (CTR/GCM). Generate a fresh random IV per message and store it with the ciphertext.'
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    doc: createCipheriv with a constant IV
    doc_version: OWASP Cheat Sheet Series (current)
    retrieved: '2026-10-09'
    quote: Enforce the mode's limits on message size, encryption operations, and initialization vector (IV) uniqueness across all instances sharing the key.
  examples:
    bad: |
      const c = crypto.createCipheriv('aes-256-cbc', key, Buffer.alloc(16))
    good: |
      const iv = crypto.randomBytes(16)
      const c = crypto.createCipheriv('aes-256-cbc', key, iv)
  cwe:
  - CWE-329
  - CWE-1204
  asvs:
  - V11.3.4
  status: active
  rule_version: 1
  tags:
  - appsec
- id: JS-SEC-STORAGE-SECRET
