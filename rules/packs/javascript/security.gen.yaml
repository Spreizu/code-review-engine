- id: JS-SEC-NODE-CHILD-EXEC-INJECTION-001
  title: Shell command built from interpolated input (child_process.exec)
  language: javascript
  kind: security
  category: security
  severity: critical
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call_expression function: [(identifier) @f (member_expression property: (property_identifier) @f)] arguments: (arguments . [(template_string (template_substitution)) (binary_expression)])) @match (#match? @f "^(exec|execSync)$"))
    filters:
