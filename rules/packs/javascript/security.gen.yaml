    doc: Request data formatted into a log message
    doc_version: OWASP Cheat Sheet Series (current)
    retrieved: '2026-10-09'
    quote: Writing invalidated user input to log files can allow an attacker to forge log entries or inject malicious content into the logs.
  examples:
    bad: |
      logger.info(`login attempt for ${req.body.user}`)
    good: |
      logger.info({ user: req.body.user }, 'login attempt')
  cwe:
  - CWE-117
  asvs:
  - V16.4.1
  status: active
  rule_version: 1
  tags:
  - appsec
- id: JS-SEC-MASS-ASSIGN-BODY
  title: Request body passed whole to a model write
  language: javascript
  kind: security
  category: security
  severity: major
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression property: (property_identifier) @m) arguments: (arguments (member_expression object: (identifier) @r property: (property_identifier) @b))) @match (#match? @m "^(create|insertMany|insertOne|findByIdAndUpdate|findOneAndUpdate|updateOne|updateMany|update|upsert|build|assign|save|merge)$") (#match? @r "^(req|request|ctx)$") (#eq? @b "body"))
    exclude_tests: true
  message: The whole request body is written to the model, so a client can set fields it should not (role, isAdmin, ownerId, price). Pick the allowed fields explicitly or validate against a schema that strips unknown keys.
  ai_question: Does the model have fields the client must not set (role, admin flags, ownership, prices), with no schema validation stripping unknown keys before this call?
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html
    doc: Request body passed whole to a model write
    doc_version: OWASP Mass Assignment Cheat Sheet
    retrieved: '2026-10-09'
    quote: ct Mapper) Flexjson (JSON Object Mapper) References Mass Assignment Cheat Sheet ¶ Introduction ¶ Definition ¶ Software frameworks sometimes allow developers to automatically bind HTTP request parameters into program code variables or objects to make using that framework easier on developers.
  examples:
    bad: |
      app.post('/users', async (req, res) => {
        res.json(await User.create(req.body))
      })
