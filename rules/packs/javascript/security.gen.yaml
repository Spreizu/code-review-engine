- id: JS-SEC-CONTENT-DISPOSITION-CONCAT
  title: Content-Disposition built by string concatenation
  language: javascript
  kind: security
  category: security
  severity: minor
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression property: (property_identifier) @p) arguments: (arguments . (string (string_fragment) @h) . [(binary_expression) (template_string (template_substitution))] .)) @match (#match? @p "^(setHeader|set|header|append)$") (#match? @h "(?i)^content-disposition$"))
    exclude_tests: true
  message: 'The download file name is concatenated into Content-Disposition as-is: quotes, semicolons or CR/LF in it break the header (header injection, a different file name or type). Build the header with a helper that quotes and encodes it (res.attachment() / content-disposition package) or use filename*=UTF-8''''<percent-encoded>.'
  ai_question: Can the file name come from users or uploaded metadata?
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Disposition
    doc: Content-Disposition built by string concatenation
    doc_version: MDN (current)
    retrieved: '2026-10-09'
    quote: 'sition: attachment Content-Disposition: attachment; filename="file name.jpg" Content-Disposition: attachment; filename*=UTF-8''''file%20name.jpg The quotes around the file name are optional, but are necessary if you use special cha'
  examples:
    bad: |
      res.setHeader('Content-Disposition', 'attachment; filename="' + file.name + '"')
    good: |
      res.attachment(file.name)
  cwe:
  - CWE-113
  asvs:
  - V5.4.2
  status: active
  rule_version: 1
  tags:
  - appsec
