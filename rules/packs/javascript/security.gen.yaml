- id: JS-SEC-NOSQL-REQUEST-FILTER
  title: MongoDB query filter taken from the request body/query
  language: javascript
  kind: security
  category: security
  severity: major
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression property: (property_identifier) @m) arguments: (arguments . (_) @a)) @match (#match? @m "^(find|findOne|findOneAndUpdate|findOneAndDelete|findOneAndReplace|updateOne|updateMany|deleteOne|deleteMany|countDocuments|exists)$") (#match? @a "^(req|request)\\.(body|query)(\\.\\w+)?$|:\\s*(req|request)\\.(body|query)\\.[\\w.]+\\s*[,}]"))
    filters:
    - file.has_re:mongoose|mongodb|monk
    - file.lacks_re:sanitizeFilter|mongo-sanitize|mongoSanitize
    exclude_tests: true
  message: 'A JSON body can carry objects such as {"$ne": null} instead of strings, turning an equality match into an operator query (login bypass, data dump). Cast fields to strings, validate the body schema, or enable sanitizeFilter.'
