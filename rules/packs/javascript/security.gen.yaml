- id: JS-SEC-COOKIE-WITHOUT-HOST-PREFIX
  title: Session cookie set without the __Host- prefix
  language: javascript
  kind: security
  category: security
  severity: minor
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression object: (identifier) @o property: (property_identifier) @p) arguments: (arguments . (string (string_fragment) @n) (_) (object) @opts)) @match (#eq? @p "cookie") (#match? @o "^(res|response|reply)$") (#match? @n "(?i)(sess|auth|token|sid|jwt)") (#not-match? @n "^__(Host|Secure)-"))
    filters:
    - 'cap.lacks_re:opts:\bdomain\s*:'
    exclude_tests: true
  message: This session/auth cookie has no __Host- prefix, so a sibling subdomain (or a network attacker on http://) can plant a cookie with the same name that the app then trusts (cookie tossing/fixation). Name it __Host-<name> and set Secure, Path=/ and no Domain.
  ai_question: Is this a session or authentication cookie for a single host (no Domain needed for sharing across subdomains)?
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie
    doc: Session cookie set without the __Host- prefix
    doc_version: MDN (current)
    retrieved: '2026-10-09'
    quote: 'Cookies with names starting with __Secure- must be set with the Secure attribute by a secure page (HTTPS). __Host- : Cookies with names starting with __Host- must be set with the Secure attribute by a secure page (HTTPS).'
  examples:
    bad: |
      app.post('/login', (req, res) => {
        res.cookie('session', token, { secure: true, httpOnly: true, sameSite: 'lax' })
        res.end()
      })
    good: |
      app.post('/login', (req, res) => {
        res.cookie('__Host-session', token, { secure: true, httpOnly: true, sameSite: 'lax', path: '/' })
        res.end()
      })
