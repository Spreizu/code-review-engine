  - V1.2.4
  status: active
  rule_version: 1
  tags:
  - appsec
- id: JS-SEC-OAUTH-NO-STATE-PKCE
  title: OAuth authorization URL without state or PKCE
  language: javascript
  kind: security
  category: security
  severity: minor
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ([(string) (template_string)] @match (#match? @match "response_type=code"))
    filters:
    - node.has_re:response_type=code
    - node.lacks_re:[?&](state|code_challenge)=
    exclude_tests: true
  message: The authorization request asks for a code but carries neither state nor a PKCE code_challenge, so an attacker can inject their own authorization code into the victim's session (login CSRF). Send a PKCE code_challenge (S256), and a per-request state bound to the session.
  ai_question: Is this URL sent as-is (state and code_challenge are not appended elsewhere before redirecting)?
  source:
    url: https://www.rfc-editor.org/rfc/rfc9700.html
    doc: OAuth authorization URL without state or PKCE
    doc_version: RFC 9700
    retrieved: '2026-10-09'
    quote: Open redirectors can enable exfiltration of authorization codes and access tokens. ¶ Clients MUST prevent Cross-Site Request Forgery (CSRF).
  examples:
    bad: |
      const authUrl = `https://idp.example.com/authorize?response_type=code&client_id=${id}&redirect_uri=${cb}`
    good: |
      const authUrl = `https://idp.example.com/authorize?response_type=code&client_id=${id}&redirect_uri=${cb}&state=${state}&code_challenge=${challenge}&code_challenge_method=S256`
  cwe:
  - CWE-352
  asvs:
  - V10.2.1
  status: active
  rule_version: 1
  tags:
  - appsec
- id: JS-SEC-REGEX-INJECTION
  title: Request data used as a RegExp pattern
  language: javascript
  kind: security
  category: security
  severity: major
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ([(new_expression constructor: (identifier) @c arguments: (arguments . (_) @a)) (call_expression function: (identifier) @c arguments: (arguments . (_) @a))] @match (#eq? @c "RegExp") (#match? @a "^((req|request)\\.(query|body|params)|ctx\\.(query|params|request\\.body))\\b"))
    exclude_tests: true
  message: Request data becomes a regular expression, so a user can inject metacharacters to change what matches or send a catastrophically backtracking pattern that ties up the server (ReDoS). Escape the value first (RegExp.escape or a lodash escapeRegExp) or match it as plain text.
  source:
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/escape
    doc: Request data used as a RegExp pattern
    doc_version: MDN (current)
    retrieved: '2026-10-09'
    quote: See full compatibility Learn more The RegExp.escape() static method escapes any potential regex syntax characters in a string, and returns a new string that can be safely used as a literal pattern for the RegExp() construct
  examples:
    bad: |
      app.get('/find', (req, res) => {
        const re = new RegExp(req.query.q, 'i')
        res.json(items.filter((i) => re.test(i.name)))
      })
    good: |
      app.get('/find', (req, res) => {
        const re = new RegExp(RegExp.escape(req.query.q), 'i')
        res.json(items.filter((i) => re.test(i.name)))
      })
  cwe:
  - CWE-730
  asvs:
  - V1.2.9
  status: active
  rule_version: 1
  tags:
  - appsec
- id: JS-SEC-SECRET-IN-QUERY-STRING
