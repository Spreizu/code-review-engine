    doc: Secret sent in a URL query string
    doc_version: OWASP Cheat Sheet Series (current)
    retrieved: '2026-10-09'
    quote: Michal Biesiada Description Information exposure through query strings in URL is when sensitive data is passed to parameters in the URL.
  examples:
