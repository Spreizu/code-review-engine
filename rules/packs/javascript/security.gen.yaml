- id: JS-SEC-SESSION-NO-MAXAGE
  title: express-session without cookie maxAge/expires
  language: javascript
  kind: security
  category: security
  severity: minor
  applies_to:
    ecmascript: '>=2015'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (identifier) @s arguments: (arguments . (object) @cfg)) @match (#match? @s "^(session|expressSession)$"))
    filters:
    - file.has_re:express-session
    - cap.lacks_re:cfg:\b(maxAge|expires)\b
    exclude_tests: true
  message: 'No cookie maxAge/expires is set, so the session lives as long as the browser keeps running (often days) and is never ended for inactivity. Set cookie.maxAge (with rolling: true for an idle timeout) and expire sessions server-side in the store.'
  source:
    url: https://expressjs.com/en/resources/middleware/session.html
    doc: express-session without cookie maxAge/expires
    doc_version: Express docs
    retrieved: '2026-10-09'
    quote: By default, no maximum age is set.
  examples:
    bad: |
      const session = require('express-session')
      app.use(session({ secret: process.env.SESSION_SECRET, resave: false, saveUninitialized: false }))
    good: |
      const session = require('express-session')
      app.use(session({ secret: process.env.SESSION_SECRET, resave: false, saveUninitialized: false, rolling: true, cookie: { maxAge: 30 * 60 * 1000 } }))
  cwe:
