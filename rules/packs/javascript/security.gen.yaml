    doc: MongoDB query filter taken from the request body/query
    doc_version: Mongoose API docs
    retrieved: '2026-10-09'
    quote: 'Mongoose.prototype.sanitizeFilter() Parameters: filter «object» Sanitizes query filters against query selector injection attacks by wrapping any nested objects that have a property whose name starts with $ in a $eq .'
  examples:
    bad: |
      const mongoose = require('mongoose')
      app.post('/login', async (req, res) => {
        const u = await User.findOne({ name: req.body.name, password: req.body.password })
        res.json(!!u)
      })
    good: |
      const mongoose = require('mongoose')
      mongoose.set('sanitizeFilter', true)
      app.post('/login', async (req, res) => {
        const u = await User.findOne({ name: String(req.body.name) })
        res.json(!!u)
      })
