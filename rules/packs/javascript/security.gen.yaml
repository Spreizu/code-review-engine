      ((new_expression constructor: (identifier) @c) @match (#eq? @c "Function"))
      ((call_expression function: (identifier) @c) @match (#eq? @c "Function"))
  message: The Function constructor evaluates strings as code (like eval) - an injection sink and CSP violation.
