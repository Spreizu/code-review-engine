- id: JS-SEC-NO-SCRIPT-URL
  title: 'Disallow javascript: URLs'
  language: javascript
  kind: security
  category: security
  severity: major
  applies_to:
    ecmascript: '>=3'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((string) @match (#match? @match "^['\"]\\s*(?i)javascript:"))
    filters:
    - parentkind.lacks_re:array:^\[\s*(?:['"][^'"]*['"]\s*,\s*)*['"][^'"]*['"]\s*,?\s*\]$
    - parent.lacks_re:^(?s).*(===?|!==?)\s*['"]\s*(?i:javascript):[^'"]*['"]\s*$|^\s*['"]\s*(?i:javascript):[^'"]*['"]\s*(===?|!==?)
    - ancestor.lacks_re:call_expression:^[\w$.\[\]()]*\.(startsWith|endsWith|includes|indexOf|test|match|has)\(
  message: 'javascript: URLs are a form of eval and an XSS vector.'
  source:
    url: https://eslint.org/docs/latest/rules/no-script-url
    doc: ESLint rule no-script-url
    doc_version: ESLint v10.12 (docs/latest)
    retrieved: '2026-10-09'
    quote: 'Disallow javascript: URLs'
  examples:
    bad: |
      a.href = 'javascript:void(0)'
    good: |
      a.addEventListener('click', onClick)
    regressions:
    - code: |
        const UNSAFE_PROTOCOLS = new Set([
          'javascript:',
          'vbscript:',
          'data:',
        ])
    - code: |
        if (url.protocol === 'javascript:') {
          throw new Error('blocked')
        }
