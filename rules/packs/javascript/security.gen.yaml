    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call_expression function: (identifier) @h arguments: (arguments (object (pair key: (property_identifier) @k value: (false)) @match))) (#eq? @h "helmet") (#match? @k "^(contentSecurityPolicy|strictTransportSecurity|hsts|xContentTypeOptions|noSniff|referrerPolicy|crossOriginOpenerPolicy|frameguard|xFrameOptions)$"))
    exclude_tests: true
  message: A browser protection header (CSP, HSTS, nosniff, Referrer-Policy, COOP or frame options) is disabled for every response. Configure it instead of turning it off.
