        region = "eu-north-1"
      }
  status: active
  rule_version: 1
- id: TF-MIG-REQUIRED-PROVIDERS-LEGACY-STRING
  title: required_providers entry as bare version string (no source)
  language: hcl
  kind: deprecation
  category: modernization
  severity: minor
  applies_to:
    terraform: '>=0.13'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @rp (body (attribute (identifier) (expression (literal_value (string_lit))) ) @match)) (#eq? @rp "required_providers"))
  message: Since 0.13 use the object form with source (namespace/name) and version.
  source:
    url: https://developer.hashicorp.com/terraform/language/providers/requirements
    doc: required_providers entry as bare version string (no source)
    doc_version: Terraform 1.16
    retrieved: '2026-10-09'
    quote: Require providers Each Terraform module must declare which providers it requires, so that Terraform can install and use them.
  examples:
    bad: |
      terraform {
        required_providers {
          aws = "~> 3.0"
        }
      }
    good: |
      terraform {
        required_providers {
          aws = {
            source  = "hashicorp/aws"
            version = "~> 3.0"
          }
        }
      }
  status: active
  rule_version: 1
