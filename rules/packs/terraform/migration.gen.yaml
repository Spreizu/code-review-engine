- id: TF-MIG-DEPRECATED-INDEX
  title: Legacy dot index (foo.0)
  language: hcl
  kind: deprecation
  category: modernization
  severity: minor
  applies_to:
    terraform: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      (index (legacy_index)) @match
  message: Use square-bracket indexing (web[0]).
  source:
    url: https://raw.githubusercontent.com/terraform-linters/tflint-ruleset-terraform/main/docs/rules/terraform_deprecated_index.md
    doc: Legacy dot index (foo.0)
    doc_version: tflint-ruleset-terraform 0.13
    retrieved: '2026-10-09'
    quote: orm supports traditional square brackets for accessing list items by index or using the splat operator (`*`). However, for backward compatibility, Terraform continues to support accessing list items with the dot syntax normally used for attributes. While Terraform does not print warnings for this syntax, it is no longer documented and its use is discourage
  examples:
    bad: |
      output "id" {
        value = aws_instance.web.0.id
      }
    good: |
      output "id" {
        value = aws_instance.web[0].id
      }
  status: active
  rule_version: 1
