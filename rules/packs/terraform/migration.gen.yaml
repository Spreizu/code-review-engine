- id: TF-MIG-LIST-MAP-FUNCTIONS
  title: list()/map() functions (removed)
  language: hcl
  kind: removal
  category: compatibility
  severity: major
  applies_to:
    terraform: '>=0.15'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((function_call (identifier) @f) @match (#match? @f "^(list|map)$"))
    filters:
    - ancestor.lacks_re:attribute:^type\s*=
  message: list()/map() no longer exist; use [ ... ] / { ... } literals (or tolist/tomap).
  source:
    url: https://developer.hashicorp.com/terraform/language/functions/list
    doc: list()/map() functions (removed)
    doc_version: Terraform 1.16
    retrieved: '2026-10-09'
    quote: .8.x v1.7.x v1.6.x v1.5.x v1.4.x v1.3.x v1.2.x v1.1.x list Function The list function is no longer available. Prior to Terraform v0.12 it was the only available syntax for writing a literal list inside an expression, but Terraform v0.12 introduced a new first-class syntax.
  examples:
    bad: |
      locals {
        zones = list("a", "b")
      }
    good: |
      locals {
        zones = ["a", "b"]
      }
    regressions:
    - note: list(string)/map(string) are type constraints in variable blocks, not the removed functions
      code: |
        variable "tags" {
          type    = map(string)
          default = {}
        }

        variable "subnets" {
          type = object({
            cidrs = list(string)
          })
        }
  xref:
  - https://developer.hashicorp.com/terraform/language/functions/map
  status: active
  rule_version: 1
- id: TF-MIG-PROVIDER-VERSION-ARGUMENT
  title: version argument in a provider block
  language: hcl
  kind: deprecation
  category: modernization
  severity: minor
  applies_to:
    terraform: '>=0.13'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt (body (attribute (identifier) @an (expression) @val) @match)) (#eq? @bt "provider") (#match? @an "^(version)$"))
  message: Move version constraints to terraform { required_providers { ... } }.
  source:
    url: https://developer.hashicorp.com/terraform/language/providers/configuration
    doc: version argument in a provider block
    doc_version: Terraform 1.16
    retrieved: '2026-10-09'
    quote: String Optional version A version constraint for the provider. This argument is deprecated. String Optional Provider-specific arguments The body of the provider block contains configuration arguments f
  examples:
    bad: |
      provider "aws" {
        region  = "eu-north-1"
        version = "~> 5.0"
      }
    good: |
