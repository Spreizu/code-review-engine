    doc: Legacy attribute-only splat (.*.)
    doc_version: Terraform 1.16
    retrieved: '2026-10-09'
    quote: Otherwise, the meaning of the expression may be unclear to future readers. Legacy (Attribute-only) Splat Expressions Earlier versions of the Terraform language had a slightly different version of splat expressions, which Terra
  examples:
    bad: |
      output "ids" {
        value = aws_instance.web.*.id
      }
    good: |
      output "ids" {
        value = aws_instance.web[*].id
      }
  xref:
  - https://raw.githubusercontent.com/terraform-linters/tflint-ruleset-terraform/main/docs/rules/terraform_deprecated_index.md
