    doc: Comparison with [] to test emptiness
    doc_version: tflint-ruleset-terraform 0.13
    retrieved: '2026-10-09'
    quote: '-linters/tflint-ruleset-terraform/blob/v0.1.0/docs/rules/terraform_empty_list_equality.md ``` ## Why The `==` operator can only return true when the two operands have identical types, and the type of `[]` alone (without any further type conversions) is an empty tuple rather than a list of ob'
  examples:
    bad: |
      locals {
        none = var.subnets == []
      }
