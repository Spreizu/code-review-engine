- id: TF-QUAL-WORKSPACE-REMOTE
  title: terraform.workspace with a remote backend
  language: hcl
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    terraform: <1.1.0
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((expression (variable_expr (identifier) @t) (get_attr (identifier) @w)) @match (#eq? @t "terraform") (#eq? @w "workspace"))
    filters:
    - file.has_re:backend\s+"remote"
  message: Remote execution always reports "default"; pass the environment as a variable.
  source:
    url: https://raw.githubusercontent.com/terraform-linters/tflint-ruleset-terraform/main/docs/rules/README.md
    doc: terraform.workspace with a remote backend
    doc_version: tflint-ruleset-terraform 0.13
    retrieved: '2026-10-09'
    quote: '`terraform.workspace` should not be used with a "remote" backend with remote execution in Terraform v1.0.x'
  examples:
    bad: |
      terraform {
        backend "remote" {
          organization = "acme"
        }
      }

      locals {
        env = terraform.workspace
      }
    good: |
      terraform {
        backend "remote" {
          organization = "acme"
        }
      }

