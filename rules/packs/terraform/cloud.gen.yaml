- id: TF-CLOUD-GCP-PRIMITIVE-ROLE
  title: Basic role (owner/editor) granted on a project/folder/org
  language: hcl
  kind: security
  category: security
  severity: major
  applies_to:
    tf-provider.google: '>=5.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt . (string_lit) @rt (body (attribute (identifier) @an (expression) @match))) (#eq? @bt "resource") (#match? @rt "^.google_(project|folder|organization)_iam_(member|binding).$") (#eq? @an "role") (#match? @match "^\"roles/(owner|editor)\"$"))
    exclude_tests: true
  message: Owner/Editor include thousands of permissions across every service, so a leaked credential for this principal compromises the whole project. Grant predefined or custom roles scoped to the job.
  ai_question: Is the member a workload/service account or broad group rather than a small break-glass admin group?
  source:
    url: https://cloud.google.com/iam/docs/roles-overview
    doc: Basic role (owner/editor) granted on a project/folder/org
    doc_version: Google Cloud docs (2026)
    retrieved: '2026-10-09'
    quote: Basic roles include thousands of permissions across all Google Cloud services. In production environments, do not grant basic roles unless there is no alternative. Instead, grant the most limited predefined roles or custom roles that meet your needs.
  examples:
    bad: |
      resource "google_project_iam_member" "this" {
        project = var.project
        role    = "roles/editor"
        member  = "serviceAccount:${google_service_account.app.email}"
      }
    good: |
      resource "google_project_iam_member" "this" {
        project = var.project
        role    = "roles/storage.objectAdmin"
        member  = "serviceAccount:${google_service_account.app.email}"
      }
  cwe:
  - CWE-250
  owasp:
  - A01:2021
  - A01:2025
  status: active
  rule_version: 1
  tags:
  - cloud
- id: TF-CLOUD-GCP-SERIAL-PORT-ENABLED
  title: Interactive serial console enabled
  language: hcl
  kind: security
  category: security
  severity: minor
  applies_to:
    tf-provider.google: '>=5.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt . (string_lit) @rt (body (attribute (identifier) @an (expression) @match))) (#eq? @bt "resource") (#match? @rt "^.(google_compute_instance|google_compute_instance_template|google_compute_project_metadata|google_compute_project_metadata_item).$") (#match? @an "^(metadata|key)$") (#match? @match "serial-port-enable\"?\\s*[=:]\\s*\"?(true|TRUE|1)"))
    exclude_tests: true
  message: The serial console is reachable from anywhere and bypasses VPC firewall rules; only IAM and the OS login protect it. Leave it off and enable it temporarily for debugging.
  source:
    url: https://cloud.google.com/compute/docs/troubleshooting/troubleshooting-using-serial-console
    doc: Interactive serial console enabled
    doc_version: Google Cloud docs (2026)
    retrieved: '2026-10-09'
    quote: 'Caution: The interactive serial console does not support IP-based access restrictions such as IP allowlists, unless you use VPC Service Controls .'
  examples:
    bad: |
      resource "google_compute_instance" "this" {
        name         = "vm"
        machine_type = "e2-small"
        metadata = {
          "serial-port-enable" = "true"
        }
      }
    good: |
      resource "google_compute_instance" "this" {
        name         = "vm"
        machine_type = "e2-small"
        metadata = {
          "enable-oslogin" = "TRUE"
        }
      }
  cwe:
  - CWE-284
  owasp:
  - A05:2021
  - A02:2025
  status: active
  rule_version: 1
  tags:
  - cloud
- id: TF-CLOUD-GCP-SQL-SSL-OPTIONAL
  title: Cloud SQL accepts unencrypted connections
  language: hcl
  kind: security
  category: security
  severity: major
  applies_to:
    tf-provider.google: '>=5.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt . (string_lit) @rt (body (block (identifier) @nb (body (attribute (identifier) @an (expression) @val) @match)))) (#eq? @bt "resource") (#match? @rt "^.(google_sql_database_instance).$") (#match? @nb "^(ip_configuration)$") (#match? @an "^(ssl_mode|require_ssl)$") (#match? @val "^(false|\"ALLOW_UNENCRYPTED_AND_ENCRYPTED\")$"))
      ((block (identifier) @bt . (string_lit) @rt (body (block (identifier) @s (body (block (identifier) @nb (body (attribute (identifier) @an (expression) @val) @match)))))) (#eq? @bt "resource") (#match? @rt "^.google_sql_database_instance.$") (#eq? @s "settings") (#eq? @nb "ip_configuration") (#match? @an "^(ssl_mode|require_ssl)$") (#match? @val "^(false|\"ALLOW_UNENCRYPTED_AND_ENCRYPTED\")$"))
    exclude_tests: true
  message: Clients may connect without TLS, sending credentials and query results in clear text. Use ssl_mode = "ENCRYPTED_ONLY" (or TRUSTED_CLIENT_CERTIFICATE_REQUIRED).
  source:
    url: https://cloud.google.com/sql/docs/mysql/configure-ssl-instance
    doc: Cloud SQL accepts unencrypted connections
    doc_version: Google Cloud docs (2026)
    retrieved: '2026-10-09'
    quote: 'TANCE_NAME \ --ssl-mode= SSL_ENFORCEMENT_MODE Replace SSL_ENFORCEMENT_MODE with one of the following options: ALLOW_UNENCRYPTED_AND_ENCRYPTED allows non-SSL/non-TLS and SSL/TLS connections. For SSL connections, the client certificate is not verified.'
  examples:
    bad: |
      resource "google_sql_database_instance" "this" {
        name             = "main"
        database_version = "POSTGRES_17"

        settings {
          tier = "db-f1-micro"

          ip_configuration {
            ssl_mode = "ALLOW_UNENCRYPTED_AND_ENCRYPTED"
          }
        }
      }
    good: |
      resource "google_sql_database_instance" "this" {
        name             = "main"
        database_version = "POSTGRES_17"

        settings {
          tier = "db-f1-micro"

          ip_configuration {
            ssl_mode = "ENCRYPTED_ONLY"
          }
        }
      }
  cwe:
  - CWE-319
  owasp:
  - A02:2021
  - A04:2025
  status: active
  rule_version: 1
  tags:
  - cloud
