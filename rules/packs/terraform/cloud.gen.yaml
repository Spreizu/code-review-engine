- id: TF-CLOUD-AZURE-STORAGE-PUBLIC-BLOBS
  title: Storage account allows anonymous blob access
  language: hcl
  kind: security
  category: security
  severity: major
  applies_to:
    tf-provider.azurerm: '>=3.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt . (string_lit) @rt (body (attribute (identifier) @an (expression) @val) @match)) (#eq? @bt "resource") (#match? @rt "^.(azurerm_storage_account).$") (#match? @an "^(allow_nested_items_to_be_public|allow_blob_public_access)$") (#match? @val "^true$"))
    exclude_tests: true
  message: Any container in the account can be switched to anonymous read, a common source of data leaks. Disallow it at the account level and serve public files through a CDN or SAS.
  ai_question: Is this account meant to serve public static content? Answer yes only if it clearly is.
  source:
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-prevent
    doc: Storage account allows anonymous blob access
    doc_version: Microsoft Learn (2026)
    retrieved: '2026-10-09'
    quote: zure Resource Manager storage account offers a setting to allow or disallow anonymous access for the account. Microsoft recommends disallowing anonymous access for your storage accounts for optimal security. When anonymous access is permitted at the account level, blob data isn't available for anonymous read access
  examples:
    bad: |
      resource "azurerm_storage_account" "this" {
        name                            = "appdata"
        account_tier                    = "Standard"
        allow_nested_items_to_be_public = true
      }
    good: |
      resource "azurerm_storage_account" "this" {
        name                            = "appdata"
        account_tier                    = "Standard"
        allow_nested_items_to_be_public = false
      }
  cwe:
  - CWE-284
  owasp:
  - A01:2021
  - A01:2025
  status: active
  rule_version: 1
  tags:
  - cloud
- id: TF-CLOUD-GCP-BUCKET-PUBLIC
  title: Cloud Storage bucket granted to allUsers/allAuthenticatedUsers
  language: hcl
  kind: security
  category: security
  severity: major
  applies_to:
    tf-provider.google: '>=5.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt . (string_lit) @rt (body (attribute (identifier) @an (expression) @match))) (#eq? @bt "resource") (#match? @rt "^.(google_storage_bucket_iam_member|google_storage_bucket_iam_binding|google_storage_object_access_control|google_storage_bucket_access_control|google_storage_default_object_access_control).$") (#match? @an "^(member|members|entity)$") (#match? @match "allUsers|allAuthenticatedUsers"))
    exclude_tests: true
  message: Everyone on the internet can read (or list) the bucket's objects. Grant specific principals, or serve public files through a CDN with signed URLs.
  ai_question: Is this bucket meant to host public content (a static site or public downloads)? Answer yes only if it clearly is.
  source:
    url: https://cloud.google.com/storage/docs/access-control/making-data-public
    doc: Cloud Storage bucket granted to allUsers/allAuthenticatedUsers
    doc_version: Google Cloud docs (2026)
    retrieved: '2026-10-09'
    quote: ts in a bucket publicly readable To make all objects in a bucket readable to everyone on the public internet, grant the principal allUsers the Storage Object Viewer ( roles/storage.objectViewer ) role on the bucket.
  examples:
