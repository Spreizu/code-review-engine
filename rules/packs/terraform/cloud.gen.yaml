- id: TF-CLOUD-GCP-FIREWALL-ADMIN-OPEN
  title: Firewall allows SSH/RDP from 0.0.0.0/0
  language: hcl
  kind: security
  category: security
  severity: critical
  applies_to:
    tf-provider.google: '>=5.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt . (string_lit) @rt (body) @match) (#eq? @bt "resource") (#match? @rt "^.google_compute_firewall.$") (#match? @match "source_ranges\\s*=\\s*\\[[^\\]]*\"0\\.0\\.0\\.0/0\"") (#match? @match "ports\\s*=\\s*\\[[^\\]]*\"(22|3389)\"|protocol\\s*=\\s*\"all\"") (#not-match? @match "direction\\s*=\\s*\"EGRESS\""))
    exclude_tests: true
  message: SSH/RDP open to the internet is brute-forced constantly. Restrict source_ranges, or use IAP TCP forwarding (35.235.240.0/20).
  source:
    url: https://cloud.google.com/vpc/docs/firewalls
    doc: Firewall allows SSH/RDP from 0.0.0.0/0
    doc_version: Google Cloud docs (2026)
    retrieved: '2026-10-09'
    quote: p:0-65535 icmp Permits incoming connections to VM instances from other instances within the same VPC network. default-allow-ssh ingress 65534 0.0.0.0/0 allow tcp:22 Lets you connect to instances with tools such as ssh , scp , or sftp .
  examples:
    bad: |
      resource "google_compute_firewall" "this" {
        name    = "allow-ssh"
        network = google_compute_network.main.name

        allow {
          protocol = "tcp"
          ports    = ["22"]
        }

        source_ranges = ["0.0.0.0/0"]
      }
    good: |
      resource "google_compute_firewall" "this" {
        name    = "allow-ssh-iap"
        network = google_compute_network.main.name

        allow {
          protocol = "tcp"
          ports    = ["22"]
        }

        source_ranges = ["35.235.240.0/20"]
      }
  cwe:
  - CWE-284
  owasp:
  - A01:2021
  - A01:2025
  status: active
  rule_version: 1
  tags:
  - cloud
- id: TF-CLOUD-GCP-GKE-CLIENT-CERT
  title: GKE issues a legacy client certificate
  language: hcl
  kind: security
  category: security
  severity: major
  applies_to:
    tf-provider.google: '>=5.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt . (string_lit) @rt (body (block (identifier) @nb (body (block (identifier) @cc (body (attribute (identifier) @an (expression) @val) @match)))))) (#eq? @bt "resource") (#match? @rt "^.google_container_cluster.$") (#eq? @nb "master_auth") (#eq? @cc "client_certificate_config") (#eq? @an "issue_client_certificate") (#eq? @val "true"))
    exclude_tests: true
  message: The cluster issues a long-lived admin client certificate that cannot be revoked. Disable it and authenticate with IAM/OIDC.
  source:
    url: https://cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster
    doc: GKE issues a legacy client certificate
    doc_version: Google Cloud docs (2026)
    retrieved: '2026-10-09'
    quote: Best practices Leave legacy client authentication methods disabled Leave ABAC disabled Leave the DenyServiceExternalIPs admission controller enabled Leave legacy client authent
  examples:
    bad: |
      resource "google_container_cluster" "this" {
        name     = "prod"
        location = "europe-north1"

        master_auth {
          client_certificate_config {
            issue_client_certificate = true
          }
        }
      }
    good: |
      resource "google_container_cluster" "this" {
        name     = "prod"
        location = "europe-north1"

        master_auth {
          client_certificate_config {
            issue_client_certificate = false
          }
        }
      }
  cwe:
  - CWE-287
  owasp:
  - A07:2021
  - A07:2025
  status: active
  rule_version: 1
  tags:
  - cloud
