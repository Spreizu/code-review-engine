pack: terraform
pack_version: 2026.10.0
rules:
- id: TF-MOD-EPHEMERAL-SECRET-VARIABLE
  title: Secret variable could be ephemeral
  language: hcl
  kind: modernization
  category: security
  severity: info
  applies_to:
    terraform: '>=1.10'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt . (string_lit) @n) @match (#eq? @bt "variable") (#match? @n "(?i)(password|passwd|secret|token|api_?key|private_?key|credentials?)") (#not-match? @match "ephemeral\\s*=\\s*true"))
  message: Terraform 1.10+ can keep secrets out of state/plan entirely (ephemeral vars + write-only arguments).
  ai_question: Is the value only passed to write-only/ephemeral contexts (so ephemeral = true is possible)?
  source:
    url: https://developer.hashicorp.com/terraform/language/values/variables
    doc: Secret variable could be ephemeral
    doc_version: Terraform 1.16
    retrieved: '2026-10-09'
    quote: You can add the ephemeral argument to your variable configuration to omit the variable from state and plan files. Adding the ephemeral argument does add restrictions to the values you can assign that variable.
  examples:
    bad: |
      variable "db_password" {
        type      = string
        sensitive = true
      }
    good: |
      variable "db_password" {
        type      = string
        sensitive = true
        ephemeral = true
      }
  status: active
  rule_version: 1
- id: TF-MOD-NULL-RESOURCE
  title: null_resource (use terraform_data)
  language: hcl
  kind: modernization
  category: modernization
  severity: info
  applies_to:
    terraform: '>=1.4'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt . (string_lit) @rt) @match (#eq? @bt "resource") (#match? @rt "^.(null_resource).$"))
  message: terraform_data (1.4+) is built in — no hashicorp/null provider needed.
  source:
    url: https://developer.hashicorp.com/terraform/language/resources/terraform-data
    doc: null_resource (use terraform_data)
    doc_version: Terraform 1.16
    retrieved: '2026-10-09'
    quote: erraform_data resource is useful for storing values which need to follow a manage resource lifecycle, and for triggering provisioners when there is no other logical managed resource in which to place them.
  examples:
    bad: |
      resource "null_resource" "deploy" {
        triggers = {
          v = var.version
        }
      }
    good: |
      resource "terraform_data" "deploy" {
        triggers_replace = [var.version]
      }
  status: active
  rule_version: 1
