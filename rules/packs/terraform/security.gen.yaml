    - '**/*.tf'
    query: |
      ((template_literal) @match (#match? @match "-----BEGIN ([A-Z]+ )?PRIVATE KEY-----"))
    filters:
    - node.has_re:PRIVATE KEY-----([\s|"+]|\\[nr])*[A-Za-z0-9+/]{16}
  message: 'Private key material committed to the repository: revoke it and mount it from a secret store.'
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    doc: PEM private key committed
    doc_version: OWASP cheat sheet (2026)
    retrieved: '2026-10-09'
    quote: se credentials, Identity and Access Management (IAM) permissions, Secure Shell (SSH) keys, certificates, etc. Many organizations have them hardcoded within the source code in plaintext, littered throughout configuration files and configuration management tools.
  examples:
    bad: |
      locals {
        key = "-----BEGIN RSA PRIVATE KEY-----MIIEpAIBAAKCAQEAu1SU1L7VLPHCgcBIjt"
      }
    good: |
      locals {
        key_file = "/run/secrets/tls.key"
      }
    regressions:
    - code: |
        locals {
          pem_header = "-----BEGIN PRIVATE KEY-----"
        }
  status: active
  rule_version: 1
- id: TF-SEC-REMOTE-STATE-DATA
  title: terraform_remote_state data source
  language: hcl
  kind: security
  category: security
  severity: minor
  applies_to:
    terraform: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt . (string_lit) @rt) @match (#eq? @bt "data") (#match? @rt "^.(terraform_remote_state).$"))
  message: Remote state access grants read of the whole state (incl. secrets); publish needed values explicitly (SSM, tfe_outputs).
  ai_question: Does the consumer need read access to the full producer state?
  source:
    url: https://developer.hashicorp.com/terraform/language/state/remote-state-data
    doc: terraform_remote_state data source
    doc_version: Terraform 1.16
    retrieved: '2026-10-09'
    quote: he HCP Terraform/Enterprise Provider to access remote state outputs in HCP Terraform or Terraform Enterprise. The tfe_outputs data source is more secure because it does not require full access to workspace state to fetch outputs.
  examples:
    bad: |
      data "terraform_remote_state" "net" {
        backend = "s3"
        config = {
          bucket = "tf-state"
          key    = "net.tfstate"
        }
      }
    good: |
      data "aws_ssm_parameter" "vpc_id" {
        name = "/net/vpc_id"
      }
  status: active
  rule_version: 1
- id: TF-SEC-SECRET-VARIABLE-DEFAULT
  title: Secret variable with a literal default
  language: hcl
  kind: security
  category: security
  severity: critical
  applies_to:
    terraform: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt . (string_lit) @n (body (attribute (identifier) @an (expression (literal_value (string_lit) @match))))) (#eq? @bt "variable") (#match? @n "(?i)(password|passwd|secret|token|api_?key|private_?key|credentials?)") (#eq? @an "default") (#not-match? @match "^.\\s*.$"))
  message: A committed default is a committed secret; supply it via TF_VAR_*, a secret manager or ephemeral input.
  source:
    url: https://developer.hashicorp.com/terraform/language/values/variables
    doc: Secret variable with a literal default
    doc_version: Terraform 1.16
    retrieved: '2026-10-09'
    quote: 'nsitive values in variables If you are defining a variable for sensitive data such as an API key or password, use the sensitive argument to prevent Terraform from displaying the value in CLI output: variable "database_password" { type = string description = "Password for the RDS database instance" sensitiv'
  examples:
    bad: |
      variable "db_password" {
        type      = string
        sensitive = true
        default   = "hunter2!"
      }
    good: |
      variable "db_password" {
        type      = string
        sensitive = true
      }
  status: active
  rule_version: 1
- id: TF-SEC-SENSITIVE-OUTPUT
  title: Secret-looking output not marked sensitive
  language: hcl
  kind: security
  category: security
  severity: major
  applies_to:
    terraform: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt . (string_lit) @n) @match (#eq? @bt "output") (#match? @n "(?i)(password|passwd|secret|token|api_?key|private_?key|credentials?)") (#not-match? @match "sensitive\\s*=\\s*true"))
  message: Mark secret outputs sensitive.
  source:
    url: https://developer.hashicorp.com/terraform/language/values/outputs
    doc: Secret-looking output not marked sensitive
    doc_version: Terraform 1.16
    retrieved: '2026-10-09'
    quote: 'Sensitive values in outputs If you are outputting sensitive data such as a password or API key, use the sensitive argument to prevent Terraform from displaying the value in CLI output: output "database_password" { description = "Auto-generated password for the RDS database instance" value = a'
  examples:
    bad: |
      output "db_password" {
        value = random_password.db.result
      }
    good: |
      output "db_password" {
        value     = random_password.db.result
        sensitive = true
      }
  status: active
  rule_version: 1
