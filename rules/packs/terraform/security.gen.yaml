- id: TF-SEC-SLACK-TOKEN
  title: Slack token committed
  language: hcl
  kind: security
  category: security
  severity: critical
  applies_to:
    terraform: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((template_literal) @match (#match? @match "xox[abposr]-[0-9A-Za-z-]{10,}"))
  message: 'Slack token committed: revoke and move to a secret store.'
  source:
    url: https://docs.slack.dev/authentication/tokens/
    doc: Slack token committed
    doc_version: Slack developer docs
    retrieved: '2026-10-09'
    quote: Bot token strings begin with xoxb- .
  examples:
    bad: |
      locals {
        slack = "xoxb-1234567890-abcdefghij"
      }
    good: |
      locals {
        slack_env = "SLACK_BOT_TOKEN"
      }
  status: active
  rule_version: 1
- id: TF-SEC-STRIPE-LIVE-KEY
  title: Stripe live secret key committed
  language: hcl
  kind: security
  category: security
  severity: critical
  applies_to:
    terraform: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((template_literal) @match (#match? @match "(sk|rk)_live_[0-9A-Za-z]{10,}"))
  message: 'Stripe live secret/restricted key committed: roll it.'
  source:
    url: https://docs.stripe.com/keys
    doc: Stripe live secret key committed
    doc_version: Stripe docs
    retrieved: '2026-10-09'
    quote: Sandbox keys start with pk _ test _ for publishable keys, rk _ test _ for restricted keys, and sk _ test _ for secret keys.
  examples:
    bad: |
      locals {
        stripe = "sk_live_51Hxxxxxxxxxxxxxxxxx"
      }
    good: |
      locals {
        stripe = "pk_live_51Hxxxxxxxxxxxxxxx"
      }
  status: active
  rule_version: 1
- id: TF-SEC-URL-CREDENTIALS
  title: Credentials embedded in a URL
  language: hcl
