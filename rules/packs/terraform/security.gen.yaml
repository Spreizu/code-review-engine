- id: TF-SEC-AWS-SG-ADMIN-PORT-OPEN
  title: SSH/RDP open to 0.0.0.0/0
  language: hcl
  kind: security
  category: security
  severity: critical
  applies_to:
    terraform: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @i (body) @b) @match (#eq? @i "ingress") (#match? @b "0[.]0[.]0[.]0/0|::/0") (#match? @b "from_port\\s*=\\s*(22|3389|0)\\b|protocol\\s*=\\s*.-1."))
      ((block (identifier) @bt . (string_lit) @rt (body) @b) @match (#eq? @bt "resource") (#match? @rt "^.(aws_vpc_security_group_ingress_rule|aws_security_group_rule).$") (#match? @b "0[.]0[.]0[.]0/0|::/0") (#match? @b "from_port\\s*=\\s*(22|3389)\\b|ip_protocol\\s*=\\s*.-1.|protocol\\s*=\\s*.-1.") (#not-match? @b "type\\s*=\\s*.egress."))
  message: Admin ports open to the internet are brute-forced constantly; restrict sources (or use SSM Session Manager).
  source:
    url: https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html
    doc: SSH/RDP open to 0.0.0.0/0
    doc_version: Amazon VPC User Guide
    retrieved: '2026-10-09'
    quote: ollowing represents an inbound rule for a security group that references security group sg-0abcdef1234567890. This rule allows inbound SSH traffic from the instances associated with sg-0abcdef1234567890. Source Protocol Port range sg-0abcdef1234567890 TCP 22 When referencing a security group in a security group
  examples:
    bad: |
      resource "aws_security_group" "this" {
        name = "bastion"

        ingress {
          from_port   = 22
          to_port     = 22
          protocol    = "tcp"
          cidr_blocks = ["0.0.0.0/0"]
        }
      }
    good: |
      resource "aws_security_group" "this" {
        name = "bastion"

        ingress {
          from_port   = 22
          to_port     = 22
          protocol    = "tcp"
          cidr_blocks = [var.admin_cidr]
        }
      }
  status: active
  rule_version: 1
