- id: TF-SEC-AWS-IAM-WILDCARD-ADMIN
  title: IAM policy granting Action "*"
  language: hcl
  kind: security
  category: security
  severity: critical
  applies_to:
    terraform: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((attribute (identifier) @a (expression) @match) (#match? @a "^(policy|inline_policy|assume_role_policy)$") (#match? @match "(?i)\"?action\"?\\s*[:=]\\s*\\[?\\s*\"\\*\""))
      ((attribute (identifier) @a (expression) @match) (#eq? @a "actions") (#match? @match "^\\[\\s*\"\\*\"\\s*\\]$"))
  message: Wildcard actions grant admin; scope actions and resources (least privilege).
  source:
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
    doc: IAM policy granting Action "*"
    doc_version: AWS IAM User Guide
    retrieved: '2026-10-09'
    quote: Apply least-privilege permissions When you set permissions with IAM policies, grant only the permissions required to perform a task. You do this by defining the actions that can be taken on specific resources under specific conditions, also k
  examples:
    bad: |
      resource "aws_iam_policy" "this" {
        name   = "app"
        policy = jsonencode({
          Version   = "2012-10-17"
          Statement = [{ Effect = "Allow", Action = "*", Resource = "*" }]
        })
      }
    good: |
      resource "aws_iam_policy" "this" {
        name   = "app"
        policy = jsonencode({
          Version   = "2012-10-17"
          Statement = [{ Effect = "Allow", Action = ["s3:GetObject"], Resource = "arn:aws:s3:::app/*" }]
        })
      }
  status: active
  rule_version: 1
- id: TF-SEC-AWS-PROVIDER-HARDCODED-CREDENTIALS
  title: Static credentials in provider "aws"
  language: hcl
  kind: security
  category: security
  severity: critical
  applies_to:
    terraform: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt (body (attribute (identifier) @an (expression) @val) @match)) (#eq? @bt "provider") (#match? @an "^(access_key|secret_key|token)$") (#match? @val "^.[A-Za-z0-9/+=]{8,}.$"))
  message: Use env vars, shared config/SSO or an assumed role; rotate the leaked key.
