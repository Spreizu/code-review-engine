- id: TF-SEC-AWS-RDS-PUBLICLY-ACCESSIBLE
  title: RDS instance publicly accessible
  language: hcl
  kind: security
  category: security
  severity: major
  applies_to:
    terraform: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt . (string_lit) @rt (body (attribute (identifier) @an (expression) @val) @match)) (#eq? @bt "resource") (#match? @rt "^.(aws_db_instance|aws_rds_cluster_instance|aws_redshift_cluster).$") (#match? @an "^(publicly_accessible)$") (#eq? @val "true"))
  message: Keep databases in private subnets; reach them through the app tier or a bastion/SSM.
  source:
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html
    doc: RDS instance publicly accessible
    doc_version: Amazon RDS User Guide
    retrieved: '2026-10-09'
    quote: Note The DB subnet group for a Local Zone can have only one subnet. If you want your DB instance in the VPC to be publicly accessible, make sure to turn on the VPC attributes DNS hostnames and DNS resolution .
  examples:
    bad: |
      resource "aws_db_instance" "this" {
        engine              = "postgres"
        instance_class      = "db.t4g.micro"
        publicly_accessible = true
      }
    good: |
      resource "aws_db_instance" "this" {
        engine              = "postgres"
        instance_class      = "db.t4g.micro"
        publicly_accessible = false
      }
  status: active
  rule_version: 1
