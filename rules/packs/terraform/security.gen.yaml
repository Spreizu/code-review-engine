- id: TF-SEC-AWS-S3-PUBLIC-ACCESS-BLOCK-OFF
  title: S3 Block Public Access setting disabled
  language: hcl
  kind: security
  category: security
  severity: major
  applies_to:
    terraform: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt . (string_lit) @rt (body (attribute (identifier) @an (expression) @val) @match)) (#eq? @bt "resource") (#match? @rt "^.(aws_s3_bucket_public_access_block|aws_s3_account_public_access_block).$") (#match? @an "^(block_public_acls|block_public_policy|ignore_public_acls|restrict_public_buckets)$") (#eq? @val "false"))
  message: Turn on all four Block Public Access settings.
  source:
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
    doc: S3 Block Public Access setting disabled
    doc_version: Amazon S3 User Guide
    retrieved: '2026-10-09'
    quote: help ensure that all of your Amazon S3 access points, buckets, and objects have their public access blocked, we recommend that you turn on all four settings for block public access for your account. For organizations managing multiple accounts, consider using organization-level Block Public Access policies
  examples:
    bad: |
      resource "aws_s3_bucket_public_access_block" "this" {
        bucket                  = aws_s3_bucket.b.id
        block_public_acls       = false
        block_public_policy     = true
        ignore_public_acls      = true
        restrict_public_buckets = true
      }
    good: |
      resource "aws_s3_bucket_public_access_block" "this" {
        bucket                  = aws_s3_bucket.b.id
        block_public_acls       = true
        block_public_policy     = true
        ignore_public_acls      = true
        restrict_public_buckets = true
      }
  status: active
  rule_version: 1
