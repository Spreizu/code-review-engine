- id: TF-SEC-AWS-ACCESS-KEY
  title: AWS access key ID committed
  language: hcl
  kind: security
  category: security
  severity: critical
  applies_to:
    terraform: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((template_literal) @match (#match? @match "(^|[^A-Z0-9])(AKIA|ASIA)[0-9A-Z]{16}([^A-Z0-9]|$)"))
  message: 'Long-term AWS access key committed: rotate it and load credentials from the environment/role instead.'
  source:
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
    doc: AWS access key ID committed
    doc_version: AWS IAM User Guide
    retrieved: '2026-10-09'
    quote: 'Access keys consist of two parts: an access key ID (for example, AKIAIOSFODNN7EXAMPLE ) and a secret access key (for example, wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY ).'
  examples:
    bad: |
      locals {
        aws_access_key_id = "AKIAIOSFODNN7EXAMPLE"
      }
    good: |
      locals {
        aws_profile = "deploy"
      }
  status: active
  rule_version: 1
- id: TF-SEC-AWS-AMI-MOST-RECENT-NO-OWNER
  title: aws_ami most_recent without owners/filter
  language: hcl
  kind: security
  category: security
  severity: major
  applies_to:
    terraform: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt . (string_lit) @rt) @match (#eq? @bt "data") (#match? @rt "^.aws_ami.$") (#match? @match "most_recent\\s*=\\s*true") (#not-match? @match "\\bowners\\s*=|\\bfilter\\s*\\{"))
  message: Without owners anyone can publish a matching newer AMI (AMI squatting); v6 rejects this config.
  source:
    url: https://raw.githubusercontent.com/hashicorp/terraform-provider-aws/main/website/docs/guides/version-6-upgrade.html.markdown
    doc: aws_ami most_recent without owners/filter
    doc_version: AWS provider 6.0
    retrieved: '2026-10-09'
    quote: 'ovider configuration, **or** - Set its value to `regional` and verify functionality. ## Data Source `aws_ami` When using `most_recent = true`, your configuration **must now include** `owners` or a `filter` that identifies the image by `image-id` or `owner-id`.'
  examples:
    bad: |
      data "aws_ami" "ubuntu" {
        most_recent = true
        name_regex  = "^ubuntu-24.04"
      }
    good: |
      data "aws_ami" "ubuntu" {
        most_recent = true
        owners      = ["099720109477"]
        name_regex  = "^ubuntu-24.04"
      }
  status: active
  rule_version: 1
- id: TF-SEC-AWS-EBS-UNENCRYPTED
  title: EBS volume encryption disabled
