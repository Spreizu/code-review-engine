- id: TF-SEC-MODULE-MUTABLE-REF
  title: Module pinned to a branch
  language: hcl
  kind: security
  category: supply-chain
  severity: minor
  applies_to:
    terraform: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt (body (attribute (identifier) @an (expression) @val) @match)) (#eq? @bt "module") (#match? @an "^(source)$") (#match? @val "[?&]ref=(main|master|develop|dev|trunk|HEAD)([&\"]|$)"))
  message: A branch ref is not a pin; use a tag or commit SHA.
  source:
    url: https://raw.githubusercontent.com/terraform-linters/tflint-ruleset-terraform/main/docs/rules/terraform_module_pinned_source.md
    doc: Module pinned to a branch
    doc_version: tflint-ruleset-terraform 0.13
    retrieved: '2026-10-09'
    quote: Pinning to a mutable reference, such as a branch
  examples:
    bad: |
      module "vpc" {
        source = "git::https://example.com/vpc.git?ref=main"
      }
    good: |
      module "vpc" {
        source = "git::https://example.com/vpc.git?ref=v1.2.0"
      }
  status: active
  rule_version: 1
- id: TF-SEC-MODULE-PINNED-SOURCE
  title: Git/Mercurial module source without a pinned ref
  language: hcl
  kind: security
  category: supply-chain
  severity: major
  applies_to:
    terraform: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.tf'
    query: |
      ((block (identifier) @bt (body (attribute (identifier) @an (expression) @val) @match)) (#eq? @bt "module") (#match? @an "^(source)$") (#match? @val "^.(git::|hg::|git@|github[.]com/|bitbucket[.]org/)") (#not-match? @val "[?&]ref="))
  message: Unpinned VCS modules change under you (supply-chain risk); pin ?ref= to a tag or commit SHA.
  source:
    url: https://raw.githubusercontent.com/terraform-linters/tflint-ruleset-terraform/main/docs/rules/terraform_module_pinned_source.md
    doc: Git/Mercurial module source without a pinned ref
    doc_version: tflint-ruleset-terraform 0.13
    retrieved: '2026-10-09'
    quote: 'm_module_pinned_source.md ``` ## Why Terraform allows you to source modules from source control repositories. If you do not pin the revision to use, the dependency you require may introduce unexpected breaking changes. To prevent this, always specify an explicit version to check out.'
