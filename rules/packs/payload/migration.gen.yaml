- id: PAYLOAD-MIG-OVERRIDE-ACCESS-DEFAULT
  title: Trusted Local API call relying on overrideAccess default
  language: javascript
  framework: payload
  kind: migration
  category: correctness
  severity: major
  applies_to:
    payload: '>=4.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
