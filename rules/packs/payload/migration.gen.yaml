    url: https://raw.githubusercontent.com/payloadcms/payload/main/docs/migration-guide/v4.mdx
    doc: Trusted Local API call relying on overrideAccess default
    doc_version: Payload 4.0
    retrieved: '2026-10-09'
    quote: 'ess is now enforced by default #overrideaccess-now-defaults-to-false-on-local-api-operations `overrideAccess` now defaults to `false` on Local API operations, so omitting it respects Access Control instead.'
