- id: PAYLOAD-MIG-VALIDATE-OPERATION-SIDE-EFFECT
  title: beforeChange side effects run on validate operation
  language: javascript
  framework: payload
  kind: migration
  category: correctness
  severity: major
  applies_to:
    payload: '>=4.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((pair key: (property_identifier) @k value: (array (_ body: (_) @b))) @match (#match? @k "^(beforeChange|beforeValidate)$") (#match? @b "await\\s+\\w+") (#not-match? @b "validate"))
  message: v4 runs beforeChange for on-demand validation; skip external side effects when operation === 'validate'.
  ai_question: Does the awaited call have external side effects (API calls, emails, writes) that must not run during validation?
  source:
    url: https://raw.githubusercontent.com/payloadcms/payload/main/docs/migration-guide/v4.mdx
    doc: beforeChange side effects run on validate operation
    doc_version: Payload 4.0
    retrieved: '2026-10-09'
    quote: rgument for collection, global, and field `beforeValidate` and `beforeChange` hooks also includes `validate`. On-demand validation runs these hooks without saving the candidate. Update exhaustive operation checks and skip external side effects that should only run during `create` or `up
  examples:
    bad: |
      export const Customers = {
        slug: 'customers',
        hooks: { beforeChange: [async ({ data }) => { await syncCustomerWithStripe(data); return data }] },
      }
    good: |
      export const Customers = {
        slug: 'customers',
        hooks: { beforeChange: [async ({ data, operation }) => { if (operation === 'validate') return data; await syncCustomerWithStripe(data); return data }] },
      }
  status: active
  rule_version: 1
