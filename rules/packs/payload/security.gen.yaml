- id: PAYLOAD-SEC-LOGIN-LOCKOUT-DISABLED
  title: 'Auth collection disables login lockout (maxLoginAttempts: 0)'
  language: javascript
  framework: payload
  kind: security
  category: security
  severity: major
  applies_to:
    payload: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((pair key: (property_identifier) @k value: (number) @v) @match (#eq? @k "maxLoginAttempts") (#eq? @v "0"))
  message: 0 turns off account lockout, leaving password guessing unthrottled. Use a small number with a lockTime.
  source:
    url: https://payloadcms.com/docs/production/preventing-abuse
    doc: 'Auth collection disables login lockout (maxLoginAttempts: 0)'
    doc_version: Payload 3.x docs
    retrieved: '2026-10-09'
    quote: Limit Failed Login Attempts Set the max number of failed login attempts before a user account is locked out for a period of time.
  examples:
    bad: |
      export const Users = {
        slug: 'users',
        auth: { maxLoginAttempts: 0 },
        fields: [],
      }
    good: |
      export const Users = {
        slug: 'users',
        auth: { maxLoginAttempts: 5, lockTime: 600 * 1000 },
        fields: [],
      }
  status: active
  rule_version: 1
