- id: PAYLOAD-SEC-OPEN-WRITE-ACCESS
  title: create/update/delete access always true
  language: javascript
  framework: payload
  kind: security
  category: security
  severity: critical
  applies_to:
    payload: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((pair key: (property_identifier) @a value: (object (pair key: (property_identifier) @k value: (arrow_function body: (true))) @match)) (#eq? @a "access") (#match? @k "^(create|update|delete|unlock|admin|readVersions)$"))
  message: Anyone (unauthenticated) can modify data; replacing the default Boolean(user) check removes protection.
  ai_question: Is anonymous write intended here (e.g. public form submissions with field-level protections)?
  source:
    url: https://payloadcms.com/docs/access-control/overview
    doc: create/update/delete access always true
    doc_version: Payload 3.x docs
    retrieved: '2026-10-09'
    quote: Collection Access Control Global Access Control Field Access Control Default Access Control Payload provides default Access Control so that your data is secured behind Authentication without additional configuration. To do this, Payload sets a default function that simply checks if a user is present on the request.
  examples:
    bad: |
      export const Posts = {
        slug: 'posts',
        access: { update: () => true },
      }
    good: |
      export const Posts = {
        slug: 'posts',
        access: { update: ({ req: { user } }) => Boolean(user) },
      }
  status: active
  rule_version: 1
- id: PAYLOAD-SEC-PUBLIC-READ-VERSIONS
  title: Public read without readVersions (versions become public)
  language: javascript
  framework: payload
  kind: security
  category: security
  severity: critical
  applies_to:
    payload: '>=4.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((pair key: (property_identifier) @a value: (object (pair key: (property_identifier) @r value: (arrow_function body: (true)))) @o) @match (#eq? @a "access") (#eq? @r "read") (#not-match? @o "readVersions"))
  message: In v4 drafts/old versions inherit public read; add readVersions.
  source:
    url: https://raw.githubusercontent.com/payloadcms/payload/main/docs/migration-guide/v4.mdx
    doc: Public read without readVersions (versions become public)
    doc_version: Payload 4.0
    retrieved: '2026-10-09'
    quote: 'lt. ### Version read access inherits collection and global read access When `readVersions` is not configured, version access now inherits the Collection or Global `read` Access Control instead of requiring an authenticated user by default.'
  examples:
    bad: |
      export const Posts = {
        slug: 'posts',
        access: { read: () => true },
        fields: [],
      }
    good: |
      export const Posts = {
        slug: 'posts',
        access: { read: () => true, readVersions: ({ req: { user } }) => Boolean(user) },
        fields: [],
      }
  status: active
  rule_version: 1
- id: PAYLOAD-SEC-UPLOAD-NO-MIME-TYPES
  title: Upload collection without mimeTypes
  language: javascript
  framework: payload
  kind: security
  category: security
  severity: minor
  applies_to:
    payload: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((pair key: (property_identifier) @k value: (object) @o) @match (#eq? @k "upload") (#not-match? @o "mimeTypes"))
    filters:
    - 'file.has_re:slug\s*:'
  message: Accepting any file type invites stored-XSS (SVG/HTML) and abuse.
  source:
    url: https://payloadcms.com/docs/upload/overview
    doc: Upload collection without mimeTypes
    doc_version: Payload 3.x docs
    retrieved: '2026-10-09'
    quote: More mimeTypes Restrict mimeTypes in the file picker. Array of valid mimetypes or mimetype wildcards More pasteURL Controls whether files can be uploaded from remo
  examples:
    bad: |
      export const Media = {
        slug: 'media',
        upload: { staticDir: dir },
      }
    good: |
      export const Media = {
        slug: 'media',
        upload: { staticDir: dir, mimeTypes: ['image/*', 'application/pdf'] },
      }
  status: active
  rule_version: 1
