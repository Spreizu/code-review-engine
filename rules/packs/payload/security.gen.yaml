- id: PAYLOAD-SEC-AUTH-COLLECTION-VERSIONS
  title: 'Auth collection without versions: false'
  language: javascript
  framework: payload
  kind: security
  category: security
  severity: major
  applies_to:
    payload: '>=4.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((object (pair key: (property_identifier) @a) (pair key: (property_identifier) @f)) @match (#eq? @a "auth") (#eq? @f "fields") (#not-match? @match "\\bversions\\s*:"))
  message: Versioning auth collections stores password hashes/tokens history.
  source:
    url: https://raw.githubusercontent.com/payloadcms/payload/main/docs/migration-guide/v4.mdx
    doc: 'Auth collection without versions: false'
    doc_version: Payload 4.0
    retrieved: '2026-10-09'
    quote: 's do **not** get versions by default — the built-in user collection already ships with `versions: false`, and you should do the same for any custom auth collection.'
  examples:
    bad: |
      export const Users: CollectionConfig = {
        slug: 'users',
        auth: true,
        fields: [],
      }
    good: |
      export const Users: CollectionConfig = {
        slug: 'users',
        auth: true,
        fields: [],
        versions: false,
      }
  status: active
  rule_version: 1
- id: PAYLOAD-SEC-CORS-WILDCARD
  title: 'Payload cors: ''*'' accepts every origin'
  language: javascript
  framework: payload
  kind: security
  category: security
  severity: major
  applies_to:
    payload: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((pair key: (property_identifier) @k value: (string (string_fragment) @v)) @match (#match? @k "^(cors|origins)$") (#eq? @v "*"))
    filters:
    - file.has_re:buildConfig
  message: Every website can call this API from a browser. List the frontends that need access (and set csrf for cookie auth).
  ai_question: Does this API serve authenticated or non-public data (rather than being a fully public, read-only content API)?
  source:
    url: https://payloadcms.com/docs/configuration/overview
    doc: 'Payload cors: ''*'' accepts every origin'
    doc_version: Payload 3.x docs
    retrieved: '2026-10-09'
    quote: 'can be configured with either a whitelist array of URLS to allow CORS requests from, a wildcard string ( * ) to accept incoming requests from any domain, or an object with the following properties: Option Description origins Either a whitelist array of URLS to a'
  examples:
    bad: |
      export default buildConfig({
        cors: '*',
        collections: [Posts],
      })
    good: |
      export default buildConfig({
        cors: [process.env.FRONTEND_URL],
        collections: [Posts],
      })
  status: active
  rule_version: 1
- id: PAYLOAD-SEC-ENDPOINT-NO-AUTH
  title: Custom endpoint handler never checks the caller
  language: javascript
  framework: payload
  kind: security
  category: security
  severity: critical
  applies_to:
    payload: '>=3.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((pair key: (property_identifier) @e value: (array (object (pair key: (property_identifier) @h value: [(arrow_function) (function_expression)] @fn)) @match)) (#eq? @e "endpoints") (#eq? @h "handler") (#not-match? @fn "user|access|auth|apiKey|api_key|secret|signature|token|verify|headers|overrideAccess:\\s*false"))
  message: 'Payload does not authenticate custom endpoints. Check req.user (or a signature/API key) before doing work, and run Local API calls with the user and overrideAccess: false.'
  ai_question: Does this endpoint read non-public data or change state without any authentication/authorization check (it is not a deliberately public endpoint like a health check)?
  source:
    url: https://payloadcms.com/docs/rest-api/overview
    doc: Custom endpoint handler never checks the caller
    doc_version: Payload 3.x docs
    retrieved: '2026-10-09'
    quote: e Payload Config, collections , and globals and accessed respective of the api and slugs you have configured. Custom endpoints are not authenticated by default.
  examples:
    bad: |
      export const Orders = {
        slug: 'orders',
        endpoints: [{ path: '/:id/refund', method: 'post', handler: async (req) => {
          await req.payload.update({ collection: 'orders', id: req.routeParams.id, data: { refunded: true } })
          return Response.json({ ok: true })
        } }],
      }
    good: |
      export const Orders = {
        slug: 'orders',
        endpoints: [{ path: '/:id/refund', method: 'post', handler: async (req) => {
          if (!req.user) return Response.json({ error: 'forbidden' }, { status: 403 })
          await req.payload.update({ collection: 'orders', id: req.routeParams.id, data: { refunded: true }, user: req.user, overrideAccess: false, req })
          return Response.json({ ok: true })
        } }],
      }
  status: active
  rule_version: 1
- id: PAYLOAD-SEC-FIELD-ACCESS-QUERY
  title: Field access function returns a query object
  language: javascript
  framework: payload
  kind: security
  category: security
  severity: critical
  applies_to:
    payload: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((object (pair key: (property_identifier) @t) (pair key: (property_identifier) @a value: (object (pair value: [(arrow_function) (function_expression)] @match)))) (#eq? @t "type") (#eq? @a "access") (#match? @match "=>\\s*\\(\\s*\\{|return\\s*\\{"))
  message: Field access must return a boolean. A Where object is truthy, so this grants access to everyone instead of filtering. Compare against doc/siblingData and return true/false.
  source:
    url: https://payloadcms.com/docs/access-control/fields
    doc: Field access function returns a query object
    doc_version: Payload 3.x docs
    retrieved: '2026-10-09'
    quote: 'Field = { 4 // ... 5 access : { 6 7 // ... 8 } , 9 } Note: Field Access Control does not support returning Query constraints like Collection Access Control does.'
  examples:
    bad: |
      const salary = {
        name: 'salary',
        type: 'number',
        access: { read: ({ req }) => ({ owner: { equals: req.user?.id } }) },
      }
    good: |
      const salary = {
        name: 'salary',
        type: 'number',
        access: { read: ({ req, doc }) => Boolean(req.user && doc?.owner === req.user.id) },
      }
  status: active
  rule_version: 1
- id: PAYLOAD-SEC-HARDCODED-SECRET
  title: Hardcoded Payload secret
  language: javascript
  framework: payload
  kind: security
  category: security
  severity: critical
  applies_to:
    payload: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (identifier) @f arguments: (arguments (object (pair key: (property_identifier) @k value: [(string) (template_string)]) @match))) (#eq? @f "buildConfig") (#eq? @k "secret"))
  message: Load the secret from the environment; a committed secret lets anyone forge tokens.
  source:
    url: https://payloadcms.com/docs/configuration/overview
    doc: Hardcoded Payload secret
    doc_version: Payload 3.x docs
    retrieved: '2026-10-09'
    quote: More details . secret * A secure, unguessable string that Payload will use for any encryption workflows - for example, password salt / hashing.
  examples:
    bad: |
      export default buildConfig({
        secret: 'my-secret',
      })
    good: |
      export default buildConfig({
        secret: process.env.PAYLOAD_SECRET,
      })
  status: active
  rule_version: 1
- id: PAYLOAD-SEC-LOCAL-API-REQUEST-CONTEXT
  title: Local API in a request/server-action without access control
  language: javascript
  framework: payload
  kind: security
  category: security
  severity: major
  applies_to:
    payload: '>=3.0 <4.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression object: (_) @o property: (property_identifier) @m) arguments: (arguments (object) @a)) @match (#match? @o "(^|\\.)payload$") (#match? @m "^(find|findByID|findGlobal|create|update|updateGlobal|delete|count|findVersions|duplicate)$") (#not-match? @a "overrideAccess"))
    filters:
    - file.has_re:['\"]use server['\"]|export\s+(async\s+)?function\s+(GET|POST|PUT|PATCH|DELETE)\b|NextRequest
  message: Code acting for a user must enforce access (overrideAccess:false + user).
  ai_question: Does this Local API call act on behalf of an end user (route handler / server action / page), not a trusted job or seed script?
  source:
    url: https://payloadcms.com/docs/access-control/overview
    doc: Local API in a request/server-action without access control
    doc_version: Payload 3.x docs
    retrieved: '2026-10-09'
    quote: 'true` if a user is found 3 // and `false` if it is undefined or null 4 return Boolean ( user ) 5 } Important: In the Local API , all Access Control is skipped by default. This allows your server to have full control over your application.'
  examples:
    bad: |
      'use server'
      export async function deletePost(id) {
        await payload.delete({ collection: 'posts', id })
      }
    good: |
      'use server'
      export async function deletePost(id, user) {
        await payload.delete({ collection: 'posts', id, user, overrideAccess: false })
      }
  status: active
  rule_version: 1
- id: PAYLOAD-SEC-LOCAL-API-USER-WITHOUT-OVERRIDE
  title: Local API call passes user but not overrideAccess:false
  language: javascript
  framework: payload
  kind: security
  category: security
  severity: critical
  applies_to:
    payload: '>=3.0 <4.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression object: (_) @o property: (property_identifier) @m) arguments: (arguments (object) @a)) @match (#match? @o "(^|\\.)payload$") (#match? @m "^(find|findByID|findGlobal|create|update|updateGlobal|delete|count|findVersions|duplicate)$") (#match? @a "\\buser\\s*[:,}]") (#not-match? @a "overrideAccess"))
