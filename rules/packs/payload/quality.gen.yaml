  framework: payload
  kind: anti-pattern
  category: correctness
  severity: critical
  applies_to:
    payload: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (identifier) @f) @match (#match? @f "^use(State|Effect|Reducer|Ref|Field|Form|FormFields|Config|DocumentInfo|Translation|Auth|Locale|ListQuery)$"))
    filters:
    - file.has_re:@payloadcms/ui
    - file.lacks_re:\A(?:\s|//[^\n]*|/\*(?s:.*?)\*/)*['\"]use client['\"]
  message: Add 'use client' at the top of the file.
  source:
    url: https://payloadcms.com/docs/migration-guide/overview
    doc: Admin component uses hooks without 'use client'
    doc_version: Payload 3.0
    retrieved: '2026-10-09'
    quote: '''/src/components/Logout#MyComponent'' 11 } 12 } 13 }, 14 }) For more details, see the Documentation . All Custom Components are now server-rendered by default, and therefore, cannot use state or hooks directly. If you’re using Custom Components in your app that requires state or hooks, add the ''use client'' directive at'
  examples:
    bad: |
