- id: PAYLOAD-QUAL-AFTERCHANGE-SELF-UPDATE
  title: afterChange updating its own collection (infinite loop)
  language: javascript
  framework: payload
  kind: anti-pattern
  category: correctness
  severity: critical
  applies_to:
    payload: '>=3.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((pair key: (property_identifier) @k value: (array (_ body: (_) @b))) @match (#eq? @k "afterChange") (#match? @b "\\.update\\s*\\(") (#not-match? @b "context"))
  message: 'Guard with req.context (pass context: { skipHook: true }) or use beforeChange.'
  ai_question: Does this afterChange update the same collection/document that triggered it without a context guard?
  source:
    url: https://payloadcms.com/docs/hooks/context
    doc: afterChange updating its own collection (infinite loop)
    doc_version: Payload 3.x docs
    retrieved: '2026-10-09'
    quote: 'Preventing infinite loops : Calling payload.update() on the same document that triggered an afterChange hook will create an infinite loop, control the flow by assigning a no-op condition to context Passing data to Local API : Setting values on the'
  examples:
    bad: |
      export const Customers = {
        slug: 'customers',
        hooks: { afterChange: [async ({ doc, req }) => { await req.payload.update({ collection: 'customers', id: doc.id, data: {}, req }) }] },
      }
    good: |
      export const Customers = {
        slug: 'customers',
        hooks: { afterChange: [async ({ doc, req, context }) => { if (context.skip) return; await req.payload.update({ collection: 'customers', id: doc.id, data: {}, req, context: { skip: true } }) }] },
      }
  status: active
  rule_version: 1
