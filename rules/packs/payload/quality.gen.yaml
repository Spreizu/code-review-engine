- id: PAYLOAD-QUAL-PAGINATION-FALSE-NO-LIMIT
  title: 'find with pagination: false and no limit loads every document'
  language: javascript
  framework: payload
  kind: best-practice
  category: performance
  severity: minor
  applies_to:
