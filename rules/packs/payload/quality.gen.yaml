- id: PAYLOAD-QUAL-TRANSACTION-NOT-FINISHED
  title: beginTransaction without commit/rollback in the same function
  language: javascript
  framework: payload
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    payload: '>=3.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression object: (member_expression property: (property_identifier) @db) property: (property_identifier) @m)) @match (#eq? @db "db") (#eq? @m "beginTransaction"))
    filters:
    - func.lacks_re:commitTransaction[\s\S]*rollbackTransaction|rollbackTransaction[\s\S]*commitTransaction
  message: A started transaction must be committed on success and rolled back on failure, or it holds a session/locks and the writes never land. Wrap the work in try/catch with commitTransaction and rollbackTransaction.
  ai_question: Is the transaction ID not handed to a caller/helper that commits or rolls it back?
  source:
    url: https://payloadcms.com/docs/database/transactions
    doc: beginTransaction without commit/rollback in the same function
    doc_version: Payload 3.x docs
    retrieved: '2026-10-09'
    quote: eginTransaction - Starts a new session and returns a transaction ID for use in other Payload Local API calls. payload.db.commitTransaction - Takes the identifier for the transaction, finalizes any changes.
  examples:
    bad: |
      async function transfer(payload, a, b) {
        const transactionID = await payload.db.beginTransaction()
        const req = { transactionID }
        await payload.update({ collection: 'accounts', id: a, data: { balance: 0 }, req })
      }
    good: |
      async function transfer(payload, a, b) {
        const transactionID = await payload.db.beginTransaction()
        const req = { transactionID }
        try {
          await payload.update({ collection: 'accounts', id: a, data: { balance: 0 }, req })
          await payload.db.commitTransaction(transactionID)
        } catch (e) {
          await payload.db.rollbackTransaction(transactionID)
          throw e
        }
      }
  status: active
  rule_version: 1
- id: PAYLOAD-QUAL-VALIDATE-RETURNS-FALSE
  title: Field validate returns false (passes silently)
  language: javascript
  framework: payload
  kind: anti-pattern
  category: correctness
  severity: critical
  applies_to:
    payload: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((pair key: (property_identifier) @k value: [(arrow_function) (function_expression)] @match) (#eq? @k "validate") (#match? @match "return\\s+false\\b|=>\\s*false\\s*[,}\\n]|=>\\s*false$|\\|\\|\\s*false\\b|\\?\\s*true\\s*:\\s*false\\b"))
  message: Payload treats only a returned string as an error, so false lets the invalid value through on the server. Return an error message string instead.
  source:
    url: https://payloadcms.com/docs/fields/overview
    doc: Field validate returns false (passes silently)
    doc_version: Payload 3.x docs
    retrieved: '2026-10-09'
    quote: ( value ) => Boolean ( value ) || 'This field is required' , 7 } Custom validation functions should return either true or a string representing the error message to display in API responses.
  examples:
    bad: |
      const field = {
        name: 'sku',
        type: 'text',
        validate: (value) => /^[A-Z0-9-]+$/.test(value) || false,
      }
    good: |
      const field = {
