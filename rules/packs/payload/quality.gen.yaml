  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call_expression function: (member_expression object: (_) @o property: (property_identifier) @m) arguments: (arguments (object) @a)) @match (#match? @o "(^|\\.)payload$") (#match? @m "^(find|findByID|findGlobal|create|update|updateGlobal|delete|count|findVersions|duplicate)$") (#eq? @m "find") (#match? @a "pagination\\s*:\\s*false") (#not-match? @a "\\blimit\\b"))
