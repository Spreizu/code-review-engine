- id: VUEUSE-QUAL-COMPOSABLE-IN-ASYNC-CALLBACK
  title: VueUse composable created inside an async callback
  language: javascript
  framework: vueuse
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    vueuse: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (identifier) @cb arguments: (arguments (arrow_function body: (_) @b))) @match (#match? @cb "^(setTimeout|setInterval|requestAnimationFrame|queueMicrotask)$") (#match? @b "\\b(useEventListener|onClickOutside|useIntervalFn|useTimeoutFn|useRafFn|useResizeObserver|useMutationObserver|useIntersectionObserver|onKeyStroke|useMediaQuery|useWebSocket|useEventSource|useScroll|useInfiniteScroll|useStorage|useLocalStorage|useSessionStorage)\\s*\\("))
      ((call_expression function: (member_expression property: (property_identifier) @m) arguments: (arguments (arrow_function body: (_) @b))) @match (#match? @m "^(then|addEventListener|on)$") (#match? @b "\\b(useEventListener|onClickOutside|useIntervalFn|useTimeoutFn|useRafFn|useResizeObserver|useMutationObserver|useIntersectionObserver|onKeyStroke|useMediaQuery|useWebSocket|useEventSource|useScroll|useInfiniteScroll|useStorage|useLocalStorage|useSessionStorage)\\s*\\("))
  message: Outside the synchronous setup scope there is no owner to dispose it — the listener/timer leaks after unmount. Create it in setup or wrap in effectScope().
  source:
    url: https://vueuse.org/guide/best-practice
    doc: VueUse composable created inside an async callback
    doc_version: VueUse 15
    retrieved: '2026-10-09'
    quote: Similar to Vue's watch and computed that will be disposed when the component is unmounted, VueUse's functions also clean up the side-effects automatically.
  examples:
    bad: |
      setTimeout(() => {
        useEventListener(window, 'resize', onResize)
      }, 100)
    good: |
      useEventListener(window, 'resize', onResize)
  status: active
  rule_version: 1
- id: VUEUSE-QUAL-MODULE-SCOPE-LISTENER
  title: Listener composable at module scope (never disposed)
  language: javascript
  framework: vueuse
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    vueuse: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.ts'
    - '**/*.js'
    - '**/*.mjs'
    - '**/*.mts'
    query: |
      ((program [(expression_statement (call_expression function: (identifier) @f)) (lexical_declaration (variable_declarator value: (call_expression function: (identifier) @f)))] @match) (#match? @f "^(useEventListener|onClickOutside|useIntervalFn|useTimeoutFn|useRafFn|useResizeObserver|useMutationObserver|useIntersectionObserver|onKeyStroke|useMediaQuery|useWebSocket|useEventSource|useScroll|useInfiniteScroll|useStorage|useLocalStorage|useSessionStorage)$"))
    filters:
    - file.has_re:@vueuse/
  message: Module-level side effects have no component scope; use createGlobalState/createSharedComposable or an effectScope you can stop (HMR/tests leak otherwise).
  ai_question: Is this module-scope side effect intended to live for the app lifetime and safe under HMR/tests/SSR?
  source:
    url: https://vueuse.org/guide/best-practice
    doc: Listener composable at module scope (never disposed)
    doc_version: VueUse 15
    retrieved: '2026-10-09'
    quote: stop = useEventListener ( ' mousemove ' , () => {}) // ... // unregister the event listener manually stop () Not all functions return a stop handler so a more general solution is to use the effectScope API from Vue.
  examples:
    bad: |
      import { useEventListener } from '@vueuse/core'
      useEventListener(window, 'online', sync)
    good: |
      import { effectScope } from 'vue'
      import { useEventListener } from '@vueuse/core'
      export const scope = effectScope(true)
      scope.run(() => useEventListener(window, 'online', sync))
  status: active
  rule_version: 1
- id: VUEUSE-QUAL-NUXT-USEFETCH-SHADOW
  title: VueUse useFetch in a Nuxt app
  language: javascript
  framework: vueuse
  kind: best-practice
  category: performance
  severity: info
  applies_to:
    vueuse: '*'
    nuxt: '>=3.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((import_statement (import_clause (named_imports (import_specifier name: (identifier) @n))) source: (string (string_fragment) @s)) @match (#match? @s "^(@vueuse/core)$") (#match? @n "^(useFetch)$"))
  message: Nuxt's useFetch dedupes and transfers SSR payloads; VueUse's runs again on the client.
  ai_question: Does this component render on the server where SSR data transfer/deduplication matters?
  source:
    url: https://vueuse.org/core/useFetch/
    doc: VueUse useFetch in a Nuxt app
    doc_version: VueUse 15
    retrieved: '2026-10-09'
    quote: When using with Nuxt 3, this function will NOT be auto imported in favor of Nuxt's built-in useFetch() . Use explicit import if you want to use the function from VueUse.
  examples:
    bad: |
      import { useFetch } from '@vueuse/core'
      const { data } = useFetch('/api/user').json()
    good: |
      const { data } = await useFetch('/api/user')
  status: active
  rule_version: 1
- id: VUEUSE-QUAL-UNWRAPPED-ARGUMENT
  title: Passing .value to a VueUse composable (loses reactivity)
  language: javascript
  framework: vueuse
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    vueuse: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((call_expression function: (identifier) @f arguments: (arguments (member_expression property: (property_identifier) @v))) @match (#match? @f "^(use[A-Z]\\w*|on[A-Z]\\w*|watch[A-Z]\\w*|ref[A-Z]\\w*)$") (#eq? @v "value"))
    filters:
    - file.has_re:@vueuse/
  message: Pass the ref or a getter (() => x.value) so the composable tracks changes.
  ai_question: Is the callee a VueUse composable that accepts MaybeRefOrGetter, and should it react to changes of this value?
  source:
    url: https://vueuse.org/guide/best-practice
    doc: Passing .value to a VueUse composable (loses reactivity)
    doc_version: VueUse 15
    retrieved: '2026-10-09'
    quote: To make it flexible, most of the VueUse functions also accept refs for the arguments because refs are reactive.
  examples:
    bad: |
      import { useTitle } from '@vueuse/core'
      useTitle(pageTitle.value)
    good: |
      import { useTitle } from '@vueuse/core'
      useTitle(pageTitle)
  status: active
  rule_version: 1
- id: VUEUSE-QUAL-USE-MEMOIZE-NO-CLEAR
  title: useMemoize without clear()
  language: javascript
  framework: vueuse
  kind: anti-pattern
  category: performance
  severity: minor
  applies_to:
    vueuse: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((call_expression function: (identifier) @f) @match (#eq? @f "useMemoize"))
    filters:
    - 'file.lacks_re:\.clear\(\)|cache\s*:'
  message: Unbounded caches grow forever; call clear()/delete() or pass a bounded cache.
  source:
    url: https://vueuse.org/core/useMemoize/
    doc: useMemoize without clear()
    doc_version: VueUse 15
    retrieved: '2026-10-09'
    quote: The results are not cleared automatically. Call clear() in case you no longer need the results or use own caching mechanism to avoid memory leaks.
  examples:
    bad: |
      const getUser = useMemoize((id) => fetchUser(id))
    good: |
      const getUser = useMemoize((id) => fetchUser(id), { cache: new LRUCache({ max: 100 }) })
      onUnmounted(() => getUser.clear())
  status: active
  rule_version: 1
