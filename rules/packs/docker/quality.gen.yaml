    retrieved: '2026-10-09'
    quote: ADD or COPY ADD and COPY are functionally similar. COPY supports basic copying of files into the container, from the build context or from a stage in a multi-st
  examples:
    bad: |
      FROM alpine
      ADD . /app
    good: |
      FROM alpine
      COPY . /app
    regressions:
    - code: |
        FROM alpine
        ADD vendor.tar.gz /opt/
    - code: |
        FROM alpine
