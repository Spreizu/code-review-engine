    url: https://docs.docker.com/reference/build-checks/json-args-recommended/
    doc: 'Docker build check: json-args-recommended'
    doc_version: Dockerfile frontend 1.28 / Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: 'SON arguments recommended for ENTRYPOINT/CMD to prevent unintended behavior related to OS signals Description ENTRYPOINT and CMD instructions both support two different syntaxes for arguments: Shell form: CMD my-cmd start Exec form: CMD ["my-cmd", "start"] When you use shell form, the executable runs'
  examples:
    bad: |
      FROM node
      CMD npm start
    good: |
      FROM node
      CMD ["npm", "start"]
  status: active
  rule_version: 1
- id: DOCKER-QUAL-LATEST-TAG
  title: Base image without a pinned tag (or :latest)
