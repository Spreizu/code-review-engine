    retrieved: '2026-10-09'
    quote: l be used Description If you have multiple CMD , HEALTHCHECK , or ENTRYPOINT instructions in your Dockerfile, only the last occurrence is used.
  examples:
    bad: |
      FROM alpine
      CMD ["a"]
      CMD ["b"]
    good: |
      FROM alpine
      CMD ["b"]
  status: active
