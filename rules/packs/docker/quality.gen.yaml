    retrieved: '2026-10-09'
    quote: install -y dev-tooling FROM base AS prod COPY --from = build /app /app The tag or digest values are optional. If you omit either of them, the builder assumes a latest tag by default. The builder returns an error if it can't find the tag value.
  examples:
