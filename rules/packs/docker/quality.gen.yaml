- id: DOCKER-QUAL-WORKDIR-RELATIVE-PATH
  title: Build check workdir-relative-path
  language: dockerfile
  kind: anti-pattern
  category: build-check
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/Dockerfile'
    - '**/Dockerfile.*'
    - '**/*.dockerfile'
    - '**/Containerfile'
    - '**/Containerfile.*'
    query: |
      (workdir_instruction (path) @match (#not-match? @match "^[\"']?(/|[$]|[A-Za-z]:)"))
  message: Use absolute WORKDIR paths; relative ones depend on the base image's working dir.
  source:
    url: https://docs.docker.com/reference/build-checks/workdir-relative-path/
    doc: 'Docker build check: workdir-relative-path'
    doc_version: Dockerfile frontend 1.28 / Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: ying WORKDIR in a build stage, you can use an absolute path, like /build , or a relative path, like ./build . Using a relative path means that the working directory is relative to whatever the previous working directory was.
  examples:
    bad: |
      FROM alpine
      WORKDIR app/src
    good: |
      FROM alpine
      WORKDIR /app/src
    regressions:
    - code: |
        FROM alpine
        WORKDIR "/srv/app"
    - code: |
        FROM alpine
        WORKDIR "${APP_HOME}"
    - code: |
        FROM mcr.microsoft.com/windows/servercore
        WORKDIR 'C:\app'
  status: active
  rule_version: 1
