  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/Dockerfile'
    - '**/Dockerfile.*'
    - '**/*.dockerfile'
    - '**/Containerfile'
    - '**/Containerfile.*'
    query: |
      ((run_instruction (shell_command) @match) (#match? @match "[^|][|][^|]"))
    filters:
    - node.lacks_re:pipefail
    - file.lacks_re:(?im)^\s*SHELL\s.*pipefail
  message: Without pipefail only the last command's exit status counts.
  source:
    url: https://docs.docker.com/build/building/best-practices/
    doc: RUN pipeline without set -o pipefail
    doc_version: Dockerfile frontend 1.28 / Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: If you want the command to fail due to an error at any stage in the pipe, prepend set -o pipefail && to ensure that an unexpected error prevents the build from inadvertently succeeding.
