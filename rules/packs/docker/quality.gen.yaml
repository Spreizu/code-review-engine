    - '**/Containerfile'
    - '**/Containerfile.*'
    query: |
      ((run_instruction) @match (#match? @match "(apt-get|apt|yum|dnf|zypper) +(-[a-z]+ +)*install"))
    filters:
    - 'node.lacks_re: -y | --yes | --assumeyes | --non-interactive |DEBIAN_FRONTEND=noninteractive'
  message: 'Without -y / --non-interactive the build stops waiting for a confirmation that will never come: pass -y (and DEBIAN_FRONTEND=noninteractive in the same RUN if the package asks debconf questions).'
  source:
    url: https://docs.docker.com/build/building/best-practices/
    doc: Package install without a noninteractive flag
    doc_version: Dockerfile frontend 1.28 / Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: Always combine RUN apt-get update with apt-get install -y in the same RUN statement.
