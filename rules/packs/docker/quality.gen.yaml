  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/Dockerfile'
    - '**/Dockerfile.*'
    - '**/*.dockerfile'
    - '**/Containerfile'
    - '**/Containerfile.*'
    query: |
      ((run_instruction (shell_command) @match) (#match? @match "^(npm (ci|install)|yarn install|pnpm install|pip install|go mod download|go build|cargo build|apt-get install|apk add|composer install|bundle install|mvn |gradle )"))
    filters:
    - parent.lacks_re:--mount=type=cache
  message: A cache mount keeps the package cache across builds without bloating layers.
  source:
    url: https://docs.docker.com/build/cache/optimize/
    doc: Package install without a cache mount
    doc_version: Dockerfile frontend 1.28 / Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: 'Use cache mounts : Cache mounts let you specify a persistent package cache to be used during builds. The persistent cache helps speed up build steps, especially steps that involve installing packages using a pa'
  examples:
    bad: |
