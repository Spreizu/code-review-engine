    doc: 'Docker build check: invalid-default-arg-in-from'
    doc_version: Dockerfile frontend 1.28 / Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: Description An ARG used in an image reference should be valid when no build arguments are used. An image build should not require --build-arg to be used to produce a valid build.
  examples:
    bad: |
      ARG TAG=
      FROM alpine:${TAG}
    good: |
      ARG TAG=3.20
      FROM alpine:${TAG}
  status: active
  rule_version: 1
- id: DOCKER-QUAL-JSON-ARGS-RECOMMENDED
  title: Build check json-args-recommended
