  message: Tags are mutable; pin a digest for reproducible, tamper-evident builds (and let a bot update it).
  ai_question: Is this a production/release Dockerfile where a mutable tag (not a digest) is a real supply-chain/reproducibility concern?
  source:
    url: https://docs.docker.com/build/building/best-practices/
    doc: Base image not pinned by digest
    doc_version: Dockerfile frontend 1.28 / Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: iners Don't install unnecessary packages Decouple applications Sort multi-line arguments Leverage build cache Pin base image versions Build and test your images in CI Dockerfile instructions FROM LABEL RUN CMD EXPOSE ENV ADD or COPY ENTRYPOINT
  examples:
    bad: |
      FROM node:24-alpine
