- id: DOCKER-QUAL-HEALTHCHECK-MISSING
  title: Long-running service image without HEALTHCHECK
  language: dockerfile
  kind: anti-pattern
  category: best-practice
  severity: info
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/Dockerfile'
    - '**/Dockerfile.*'
    - '**/*.dockerfile'
    - '**/Containerfile'
    - '**/Containerfile.*'
    query: |
      (source_file) @match
    filters:
    - node.is_root
    - file.has_re:(?im)^\s*EXPOSE\s
    - file.lacks_re:(?im)^\s*HEALTHCHECK\s
  message: Declare a HEALTHCHECK so orchestrators can detect a hung service (unless your platform probes health itself).
  ai_question: Is this a long-running network service image deployed somewhere without its own health probing (e.g. plain Docker/Compose rather than Kubernetes probes)?
  source:
    url: https://docs.docker.com/reference/dockerfile/
    doc: Long-running service image without HEALTHCHECK
    doc_version: Dockerfile frontend 1.28 / Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: ning a command inside the container) HEALTHCHECK NONE (disable any healthcheck inherited from the base image) The HEALTHCHECK instruction tells Docker how to test a container to check that it's still working.
  examples:
    bad: |
      FROM nginx
      EXPOSE 80
      CMD ["nginx", "-g", "daemon off;"]
    good: |
      FROM nginx
      EXPOSE 80
      HEALTHCHECK CMD curl -f http://localhost/ || exit 1
      CMD ["nginx", "-g", "daemon off;"]
  status: active
  rule_version: 1
- id: DOCKER-QUAL-INVALID-DEFAULT-ARG-IN-FROM
