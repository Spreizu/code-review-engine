    - '**/*.dockerfile'
    - '**/Containerfile'
    - '**/Containerfile.*'
    query: |
      ([(cmd_instruction) (entrypoint_instruction)] @match (#match? @match "\\[\\s*[^\\s\"\'\\]]"))
  message: Exec form must be a JSON array of quoted strings; unquoted tokens are parsed as shell form (or fail to parse).
  source:
    url: https://docs.docker.com/reference/dockerfile/
    doc: CMD/ENTRYPOINT exec form is not a JSON array of strings
    doc_version: Dockerfile frontend 1.28 / Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: The exec form is parsed as a JSON array, which means that you must use double-quotes (") around words not single-quotes (').
  examples:
    bad: |
      FROM alpine
