- id: DOCKER-SEC-COPY-GIT-DIR
  title: Repository .git directory copied into the image
  language: dockerfile
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/Dockerfile'
    - '**/Dockerfile.*'
    - '**/*.dockerfile'
    - '**/Containerfile'
    query: |
      ([((copy_instruction (path) @p) @match) ((add_instruction (path) @p) @match)] (#match? @p "(^|/)\\.git/?$"))
    exclude_tests: true
  message: The .git directory ends up in the image, exposing full history (including removed secrets) to anyone who can pull it. Keep .git out of images (list it in .dockerignore) and pass a commit id as a build arg instead.
  source:
    url: https://docs.docker.com/build/concepts/context/
    doc: Repository .git directory copied into the image
    doc_version: Docker docs
    retrieved: '2026-10-09'
    quote: tories Remote context with Dockerfile from stdin Remote tarballs Empty context How to build without a context .dockerignore files Filename and location Syntax Named contexts Using named contexts in a Dockerfile Use cases for named co
  examples:
    bad: |
      FROM python:3.13-slim
      COPY .git /app/.git
    good: |
      FROM python:3.13-slim
      COPY src /app/src
  cwe:
  - CWE-538
  asvs:
  - V13.4.1
  status: active
  rule_version: 1
  tags:
  - appsec
- id: DOCKER-SEC-COPY-SECRET-FILE
  title: Credential file copied into the image
  language: dockerfile
  kind: security
  category: security
  severity: critical
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/Dockerfile'
    - '**/Dockerfile.*'
    - '**/*.dockerfile'
    - '**/Containerfile'
    - '**/Containerfile.*'
    query: |
      ((copy_instruction (path) @match) (#match? @match "(^|/)(\\.npmrc|\\.pypirc|\\.netrc|\\.env|id_rsa|id_ed25519|\\.aws|\\.docker/config\\.json|credentials\\.json|\\.git-credentials)$"))
      ((add_instruction (path) @match) (#match? @match "(^|/)(\\.npmrc|\\.pypirc|\\.netrc|\\.env|id_rsa|id_ed25519|\\.aws|credentials\\.json)$"))
  message: Files copied into a layer stay in the image history even if deleted later; use RUN --mount=type=secret.
  source:
    url: https://docs.docker.com/build/building/secrets/
    doc: Credential file copied into the image
    doc_version: Dockerfile frontend 1.28 / Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: entication for remote contexts HTTP authentication scheme Multiple hosts HTTP authentication for COPY and ADD A build secret is any piece of sensitive information, such as a password or API token, consumed as part of your application's build process.
  examples:
    bad: |
      FROM node:22
      COPY .npmrc /root/.npmrc
      RUN npm ci
    good: |
      FROM node:22
      RUN --mount=type=secret,id=npmrc,target=/root/.npmrc npm ci
  status: active
  rule_version: 1
- id: DOCKER-SEC-CURL-PIPE-SHELL
  title: RUN pipes a download straight into a shell
  language: dockerfile
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/Dockerfile'
    - '**/Dockerfile.*'
    - '**/*.dockerfile'
    - '**/Containerfile'
    - '**/Containerfile.*'
    query: |
      ((run_instruction) @match (#match? @match "(curl|wget)[^|;&]*[|] *(sudo +)?(ba|z|da)?sh"))
  message: Executing unverified remote scripts at build time is a supply-chain risk; download, verify (checksum/signature), then run.
  source:
    url: https://docs.docker.com/build/building/best-practices/
    doc: RUN pipes a download straight into a shell
    doc_version: Dockerfile frontend 1.28 / Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: If you want the command to fail due to an error at any stage in the pipe, prepend set -o pipefail && to ensure that an unexpected error prevents the build from inadvertently succeeding.
  examples:
    bad: |
      FROM debian
      RUN curl -fsSL https://get.example.com | sh
    good: |
      FROM debian
      ADD --checksum=sha256:0123abcd https://get.example.com/install.sh /tmp/install.sh
      RUN sh /tmp/install.sh
  status: active
  rule_version: 1
- id: DOCKER-SEC-ENV-SECRET-LAYER
  title: Secret written by ENV persists in the layer
  language: dockerfile
  kind: security
  category: security
  severity: critical
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/Dockerfile'
    - '**/Dockerfile.*'
    - '**/*.dockerfile'
    - '**/Containerfile'
    - '**/Containerfile.*'
    query: |
      (env_instruction (env_pair name: (_) @n value: (_) @match) (#match? @n "(?i)(?i)^.*(password|passwd|pwd|secret|client_secret|api[_-]?key|apikey|access[_-]?token|auth[_-]?token|private[_-]?key|secret[_-]?key)$"))
  message: Unsetting an ENV later does not remove it from earlier layers or `docker history`.
  source:
    url: https://docs.docker.com/build/building/best-practices/
    doc: Secret written by ENV persists in the layer
    doc_version: Dockerfile frontend 1.28 / Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: lets you change a single ENV instruction to automatically bump the version of the software in your container. Each ENV line creates a new intermediate layer, just like RUN commands. This means that even if you unset the environment variable in a future layer, it still persists in this layer
  examples:
    bad: |
      FROM alpine
      ENV DB_PASSWORD=hunter2
    good: |
      FROM alpine
      RUN --mount=type=secret,id=db_password ./configure
  status: active
  rule_version: 1
- id: DOCKER-SEC-NO-USER
  title: Image never switches to a non-root user
  language: dockerfile
  kind: security
  category: security
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/Dockerfile'
    - '**/Dockerfile.*'
    - '**/*.dockerfile'
    - '**/Containerfile'
    - '**/Containerfile.*'
    query: |
      (source_file) @match
    filters:
    - node.is_root
    - file.lacks_re:(?im)^\s*USER\s
    - file.has_re:(?im)^\s*(CMD|ENTRYPOINT)\s
  message: 'No USER instruction: the container runs as root unless the base image sets a user.'
  ai_question: Is this a runtime image whose base image does not already set a non-root USER (e.g. not distroless:nonroot, not an image whose docs state it runs unprivileged)?
  source:
    url: https://docs.docker.com/build/building/best-practices/
    doc: Image never switches to a non-root user
    doc_version: Dockerfile frontend 1.28 / Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: 'USER If a service can run without privileges, use USER to change to a non-root user. Start by creating the user and group in the Dockerfile with something like the following example: ]\s+/gm, '''''
  examples:
    bad: |
      FROM node:24
      COPY . /app
      CMD ["node", "/app/index.js"]
    good: |
      FROM node:24
      COPY . /app
      USER node
      CMD ["node", "/app/index.js"]
  status: active
  rule_version: 1
- id: DOCKER-SEC-SECRETS-USED-IN-ARG-OR-ENV
  title: Build check secrets-used-in-arg-or-env
  language: dockerfile
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/Dockerfile'
    - '**/Dockerfile.*'
    - '**/*.dockerfile'
    - '**/Containerfile'
    - '**/Containerfile.*'
    query: |
      ([(arg_instruction name: (_) @match) (env_instruction (env_pair name: (_) @match))] (#match? @match "(?i)(^|_)(password|passwd|secret|token|api_?key|access_?key|private_?key|credentials?)($|_)"))
  message: ARG/ENV values persist in image metadata/history; use RUN --mount=type=secret.
  source:
    url: https://docs.docker.com/reference/build-checks/secrets-used-in-arg-or-env/
    doc: 'Docker build check: secrets-used-in-arg-or-env'
    doc_version: Dockerfile frontend 1.28 / Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: ile it is common to pass secrets to running processes through environment variables during local development, setting secrets in a Dockerfile using ENV or ARG is insecure because they persist in the final image.
  examples:
    bad: |
      FROM alpine
      ARG GITHUB_TOKEN
    good: |
      FROM alpine
      RUN --mount=type=secret,id=github_token cat /run/secrets/github_token
  status: active
  rule_version: 1
- id: DOCKER-SEC-USER-ROOT
  title: Final USER is root
  language: dockerfile
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/Dockerfile'
    - '**/Dockerfile.*'
    - '**/*.dockerfile'
    - '**/Containerfile'
    - '**/Containerfile.*'
    query: |
      ((user_instruction user: (_) @match) (#match? @match "^(root|0)(:|$)"))
    filters:
    - file.count_lt:1:(?is)USER\s+{text}\s.*\n\s*USER\s+[^r0\s]
  message: The container runs as root; switch back to an unprivileged user.
  source:
    url: https://docs.docker.com/build/building/best-practices/
    doc: Final USER is root
    doc_version: Dockerfile frontend 1.28 / Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: 'USER If a service can run without privileges, use USER to change to a non-root user. Start by creating the user and group in the Dockerfile with something like the following example: ]\s+/gm, '''''
  examples:
    bad: |
      FROM alpine
      USER root
      CMD ["app"]
    good: |
      FROM alpine
      USER root
      RUN apk add curl
      USER app
      CMD ["app"]
  status: active
  rule_version: 1
