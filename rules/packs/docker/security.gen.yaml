  language: yaml
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/compose.yaml'
    - '**/compose.yml'
    - '**/compose.*.yaml'
    - '**/compose.*.yml'
    - '**/docker-compose.yaml'
    - '**/docker-compose.yml'
    - '**/docker-compose.*.yaml'
    - '**/docker-compose.*.yml'
    query: |
      (block_mapping_pair key: (flow_node) @s (#eq? @s "services") value: (block_node (block_mapping (block_mapping_pair value: (block_node (block_mapping (block_mapping_pair key: (flow_node) @k (#eq? @k "security_opt") value: (_ (_ (_ (flow_node) @match (#match? @match "unconfined")))))))))))
  message: Disabling seccomp/AppArmor removes kernel attack-surface filtering.
  source:
    url: https://docs.docker.com/reference/compose-file/services/
    doc: security_opt disables seccomp/AppArmor
    doc_version: Compose Specification (docker compose 5.6)
    retrieved: '2026-10-09'
    quote: '"MY_TOKEN" security_opt security_opt overrides the default labeling scheme for each container. Options accept either option=value or option:value syntax.'
