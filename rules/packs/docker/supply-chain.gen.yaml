rules:
- id: DOCKER-SUPPLY-DOWNLOAD-NO-CHECKSUM
  title: RUN downloads an archive or binary without verifying it
  language: dockerfile
  kind: security
  category: supply-chain
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/Dockerfile'
    - '**/Dockerfile.*'
    - '**/*.dockerfile'
    - '**/Containerfile'
    - '**/Containerfile.*'
    query: |
      ((run_instruction) @match (#match? @match "(curl|wget) [^&;|]*https?://[^ ]+[.](tar[.]gz|tgz|tar[.]xz|tar[.]bz2|zip|deb|rpm|apk|jar|AppImage|bin|exe|msi)") (#not-match? @match "sha(1|224|256|384|512)sum|shasum|gpg +--verify|gpgv|cosign +verify|minisign|--checksum|openssl +dgst|rpm +-K|dpkg-sig"))
    exclude_tests: true
  message: 'Nothing checks that the file is the one you reviewed: a compromised mirror, a re-tagged release or a MITM changes the image silently. Verify a pinned sha256 (sha256sum -c, or ADD --checksum=) or a signature before unpacking.'
  source:
    url: https://docs.docker.com/build/building/best-practices/
    doc: RUN downloads an archive or binary without verifying it
    doc_version: Dockerfile frontend 1.28 / Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: than manually adding files using something like wget and tar , because it ensures a more precise build cache. ADD also has built-in support for checksum validation of the remote resources, and a protocol for parsing branches, tags, and subdirectories from Git URLs .
  examples:
    bad: |
      FROM debian:12-slim
      RUN curl -fsSLo /tmp/tool.tar.gz https://example.invalid/tool-1.2.tar.gz && tar -xzf /tmp/tool.tar.gz -C /usr/local
    good: |
      FROM debian:12-slim
      RUN curl -fsSLo /tmp/tool.tar.gz https://example.invalid/tool-1.2.tar.gz \
       && echo "9f2c0e1d  /tmp/tool.tar.gz" | sha256sum -c - \
       && tar -xzf /tmp/tool.tar.gz -C /usr/local
  cwe:
  - CWE-829
  - CWE-494
  owasp:
  - A08:2021
  - A03:2025
  status: active
  rule_version: 1
  tags:
  - supply-chain
- id: DOCKER-SUPPLY-GO-INSTALL-LATEST
  title: RUN go install ...@latest
  language: dockerfile
  kind: security
  category: supply-chain
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/Dockerfile'
    - '**/Dockerfile.*'
    - '**/*.dockerfile'
    - '**/Containerfile'
    - '**/Containerfile.*'
    query: |
      ((run_instruction) @match (#match? @match "go +install +[^ ]+@(latest|master|main)( |$)"))
    exclude_tests: true
  message: '@latest resolves to whatever was tagged most recently, so the tool in the image changes between builds. Pin a version (Go then verifies it against the checksum database).'
  source:
    url: https://pkg.go.dev/cmd/go
    doc: RUN go install ...@latest
    doc_version: Go 1.25 cmd/go
    retrieved: '2026-10-09'
    quote: Cross compiled binaries are installed in $GOOS_$GOARCH subdirectories of the above. If the arguments have version suffixes (like @latest or @v1.0.0), "go install" builds packages in module-aware mode, ignoring the go.mod file in the current directory or any parent directory, if there is one.
  examples:
    bad: |
      FROM golang:1.23
      RUN go install golang.org/x/tools/cmd/goimports@latest
    good: |
      FROM golang:1.23
      RUN go install golang.org/x/tools/cmd/goimports@v0.24.0
  cwe:
  - CWE-829
  - CWE-494
  owasp:
  - A08:2021
  - A03:2025
  status: active
  rule_version: 1
  tags:
  - supply-chain
- id: DOCKER-SUPPLY-NPM-INSTALL
  title: RUN npm install instead of npm ci
  language: dockerfile
  kind: security
  category: supply-chain
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/Dockerfile'
    - '**/Dockerfile.*'
    - '**/*.dockerfile'
    - '**/Containerfile'
    - '**/Containerfile.*'
    query: |
      ((run_instruction) @match (#match? @match "(?m)(^|[;&|(]|RUN|^ *-) *npm +(install|i)( +--?[a-zA-Z][a-zA-Z=-]*)* *([;&|)]|$)"))
    exclude_tests: true
  message: '`npm install` re-resolves every semver range and may rewrite the lockfile, so two builds of the same commit can install different code (including a freshly published malicious version). Use `npm ci`, which installs exactly what package-lock.json records and fails when it is out of date.'
  source:
    url: https://docs.npmjs.com/cli/v11/commands/npm-ci
    doc: RUN npm install instead of npm ci
    doc_version: Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: ': clean-install, ic, install-clean, isntall-clean Description This command is similar to npm install , except it''s meant to be used in automated environments such as test platforms, continuous integration, and deployment -- or any situation where you want to make sure you''re doing a clean install of your dependencies.'
  examples:
    bad: |
      FROM node:22.11-slim
      COPY package*.json ./
      RUN npm install --omit=dev
    good: |
      FROM node:22.11-slim
      COPY package*.json ./
      RUN npm ci --omit=dev
  cwe:
  - CWE-829
  - CWE-494
  owasp:
  - A08:2021
  - A03:2025
  status: active
  rule_version: 1
  tags:
  - supply-chain
- id: DOCKER-SUPPLY-PIP-UNPINNED
  title: RUN pip install of packages without a version
  language: dockerfile
  kind: security
  category: supply-chain
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/Dockerfile'
    - '**/Dockerfile.*'
    - '**/*.dockerfile'
    - '**/Containerfile'
    - '**/Containerfile.*'
    query: |
      ((run_instruction) @match (#match? @match "pip3? +install( +--?[a-zA-Z][a-zA-Z=-]*)*( +[A-Za-z][A-Za-z0-9_.-]*)+ *([;&|]|$)") (#not-match? @match "pip3? +install[^&;|]*( -r | -c | -e |--requirement|--constraint|--editable|==|~=|>=|<=|!=|@| [.] |[.]whl|/|[$])") (#not-match? @match "install +(-U +|--upgrade +|--no-cache-dir +|-q +)*(pip|setuptools|wheel)( +(pip|setuptools|wheel))* *($|&&|;)"))
    exclude_tests: true
  message: 'Each build installs whatever version PyPI serves that day, so the image is not reproducible and a compromised release lands without a code change. Pin versions (better: install from a requirements file with --require-hashes).'
  source:
    url: https://pip.pypa.io/en/stable/topics/secure-installs/
    doc: RUN pip install of packages without a version
    doc_version: Docker docs 2026-10
    retrieved: '2026-10-09'
    quote: Enable Hash-checking Mode , by passing --require-hashes
  examples:
    bad: |
      FROM python:3.13-slim
      RUN pip install --no-cache-dir flask gunicorn
    good: |
      FROM python:3.13-slim
      RUN pip install --no-cache-dir flask==3.1.0 gunicorn==23.0.0
  cwe:
  - CWE-829
  - CWE-494
  owasp:
  - A08:2021
  - A03:2025
  status: active
  rule_version: 1
  tags:
  - supply-chain
