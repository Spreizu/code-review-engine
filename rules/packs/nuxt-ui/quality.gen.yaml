        <UApp><NuxtPage /></UApp>
      </template>
  status: active
  rule_version: 1
- id: NUXTUI-QUAL-CONTENT-MODULE-ORDER
  title: '@nuxt/content registered before @nuxt/ui'
  language: javascript
  framework: nuxt-ui
  kind: best-practice
  category: correctness
  severity: major
  applies_to:
    nuxt-ui: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((pair key: (property_identifier) @m value: (array (string (string_fragment) @c) (string (string_fragment) @u)) @match) (#eq? @m "modules") (#eq? @c "@nuxt/content") (#match? @u "^@nuxt/ui(-pro)?$"))
  message: Put @nuxt/ui before @nuxt/content, otherwise the Nuxt UI prose components are not registered for markdown.
  source:
    url: https://ui.nuxt.com/docs/getting-started/integrations/content
    doc: '@nuxt/content registered before @nuxt/ui'
    doc_version: Nuxt UI 4.x
    retrieved: '2026-10-09'
    quote: 'defineNuxtConfig ( { modules : [ '' @nuxt/ui '' , '' @nuxt/content '' ] , css : [ '' ~/assets/css/main.css '' ] } ) You need to register @nuxt/content after @nuxt/ui in the modules array, otherwise the prose components will not be available.'
  examples:
    bad: |
      export default defineNuxtConfig({
        modules: ['@nuxt/content', '@nuxt/ui'],
      })
    good: |
      export default defineNuxtConfig({
        modules: ['@nuxt/ui', '@nuxt/content'],
      })
  status: active
  rule_version: 1
- id: NUXTUI-QUAL-RAW-PALETTE-CLASS
  title: Raw Tailwind palette color instead of a semantic color
  language: vue
  framework: nuxt-ui
  kind: best-practice
  category: maintainability
  severity: info
  applies_to:
