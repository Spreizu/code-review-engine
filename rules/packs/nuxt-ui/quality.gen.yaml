- id: NUXTUI-QUAL-APP-WRAPPER-MISSING
  title: app.vue without <UApp>
  language: vue
  framework: nuxt-ui
  kind: best-practice
  category: correctness
  severity: major
  applies_to:
    nuxt-ui: '>=3.0'
  detection:
    mode: deterministic
    engine: tree-sitter
    target: template
    files:
    - app.vue
    - app/app.vue
    - '**/app/app.vue'
    - src/App.vue
    - '**/src/App.vue'
    query: |
      ((document (template_element) @match) (#not-match? @match "<(UApp|u-app)[\\s>]"))
  message: Wrap the root in <UApp>; toasts, tooltips and useOverlay depend on it.
  source:
    url: https://ui.nuxt.com/docs/getting-started/installation/nuxt
    doc: app.vue without <UApp>
    doc_version: Nuxt UI 4.11
    retrieved: '2026-10-09'
    quote: ig " ] } Wrap your app with App component app.vue < template > < UApp > < NuxtPage /> </ UApp > </ template > The App component sets up global config and is required for Toast , Tooltip and programmatic overlays . Use a Nuxt template Get started with one of our official templates by using the Use this template button on G
  examples:
