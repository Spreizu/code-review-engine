- id: NUXTUI-MIG-SCHEMA-TRANSFORM-STATE
  title: Relying on schema transforms mutating form state
  language: vue
  framework: nuxt-ui
  kind: migration
  category: migration
  severity: minor
  applies_to:
    nuxt-ui: '>=4.0'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    target: template
    query: |
      ((start_tag (tag_name) @t [(attribute) (directive_attribute)] @a) @match (#match? @t "^(UForm|u-form)$") (#match? @a "^:schema="))
      ((self_closing_tag (tag_name) @t [(attribute) (directive_attribute)] @a) @match (#match? @t "^(UForm|u-form)$") (#match? @a "^:schema="))
    filters:
    - node.has_re:@submit=\"[^\"]*\bstate\b
  message: Read transformed values from the submit event (event.data), not from state.
  ai_question: Does the submit handler/other code read `state` expecting schema-transformed (coerced/trimmed/defaulted) values?
  source:
    url: https://ui.nuxt.com/docs/getting-started/migration/v4
    doc: Relying on schema transforms mutating form state
    doc_version: Nuxt UI 4
    retrieved: '2026-10-09'
    quote: 'Here are the key changes you need to be aware of: Schema transformations will only be applied to the @submit data and will no longer mutate the form''s state. This provides better predictability and prevents unexpected state mutations.'
  examples:
    bad: |
      <template>
        <UForm :state="state" :schema="schema" @submit="save(state)" />
      </template>
    good: |
      <template>
        <UForm :state="state" :schema="schema" @submit="(e) => save(e.data)" />
      </template>
  status: active
  rule_version: 1
