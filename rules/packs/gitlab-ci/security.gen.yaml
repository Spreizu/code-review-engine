pack: gitlab-ci
pack_version: 2026.10.0
rules:
- id: GITLAB-SEC-CURL-PIPE-SHELL
  title: Job script pipes a download straight into a shell
  language: yaml
  kind: security
  category: security
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - .gitlab-ci.yml
    - '**/.gitlab-ci.yml'
    - '**/*.gitlab-ci.yml'
    - .gitlab/ci/**/*.yml
    query: |
      ((block_mapping_pair key: (flow_node) @k value: (_) @match) (#match? @k "^(script|before_script|after_script)$") (#match? @match "(curl|wget)[^|\\n]*\\|\\s*(sudo\\s+)?(-E\\s+)?(ba|z|da)?sh\\b"))
    exclude_tests: true
  message: Whatever the server returns at that moment runs in the job, with its CI/CD variables. Download to a file, verify a pinned checksum or signature, then run it.
  source:
    url: https://github.com/ossf/scorecard/blob/main/docs/checks.md
    doc: Job script pipes a download straight into a shell
    doc_version: OpenSSF Scorecard checks (main)
    retrieved: '2026-10-09'
    quote: Medium (possible compromised dependencies) This check tries to determine if the project pins dependencies used during its build and release process.
  examples:
    bad: |
      build:
        image: node:22.11
        script:
          - curl -fsSL https://get.example.dev/install.sh | sh
          - make
    good: |
      build:
        image: node:22.11
        script:
          - curl -fsSLo install.sh https://get.example.dev/install.sh
          - echo "3b1f...  install.sh" | sha256sum -c -
          - sh install.sh
  cwe:
  - CWE-494
  owasp:
  - A08:2021
  - A08:2025
  status: active
  rule_version: 1
- id: GITLAB-SEC-IMAGE-UNPINNED
  title: Job image without a version tag or digest (or :latest)
  language: yaml
  kind: security
  category: security
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - .gitlab-ci.yml
    - '**/.gitlab-ci.yml'
    - '**/*.gitlab-ci.yml'
    - .gitlab/ci/**/*.yml
    query: |
      ((block_mapping_pair key: (flow_node) @k value: (flow_node) @match) (#match? @k "^(image|name)$") (#match? @match "^[\"']?[a-z0-9][\\w./-]*(:latest)?[\"']?$"))
    filters:
    - node.lacks_re:\$
    - 'ancestor.has_re:block_mapping_pair:^(image|services|default|[\w.-]+):'
    exclude_tests: true
  message: The job runs whatever the registry serves under that name today, so a new upstream release (or a compromised tag) changes your build without a commit. Pin a version tag, ideally with an @sha256 digest.
  source:
    url: https://github.com/ossf/scorecard/blob/main/docs/checks.md
    doc: Job image without a version tag or digest (or :latest)
    doc_version: OpenSSF Scorecard checks (main)
    retrieved: '2026-10-09'
    quote: Medium (possible compromised dependencies) This check tries to determine if the project pins dependencies used during its build and release process.
  examples:
    bad: |
      test:
        image: python
        script:
          - pytest
    good: |
      test:
        image: python:3.13.1-slim
        script:
          - pytest
  cwe:
  - CWE-829
  - CWE-494
  owasp:
  - A08:2021
  - A03:2025
  status: active
  rule_version: 1
- id: GITLAB-SEC-REMOTE-INCLUDE-NO-INTEGRITY
  title: include:remote without an integrity hash
  language: yaml
  kind: security
  category: security
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - .gitlab-ci.yml
    - '**/.gitlab-ci.yml'
    - '**/*.gitlab-ci.yml'
    - .gitlab/ci/**/*.yml
    query: |
      ((block_mapping_pair key: (flow_node) @k value: (flow_node) @match) (#eq? @k "remote") (#match? @match "^[\"']?https?://"))
    filters:
    - 'file.lacks_re:integrity:'
    exclude_tests: true
  message: 'The pipeline definition is fetched from another server on every run; whoever controls that file controls your jobs and their variables. Add integrity: with the file''s SHA256 (GitLab 17.9+), or vendor the file.'
  source:
    url: https://docs.gitlab.com/ci/yaml/
    doc: include:remote without an integrity hash
    doc_version: GitLab Docs (18.x)
    retrieved: '2026-10-09'
    quote: 'include with: rules:if . rules:changes . rules:exists . include:integrity History Introduced in GitLab 17.9. Use integrity with include:remote to specify a SHA256 hash of the included remote file. If integrity does not match the actual content, the remote file is not processed and the pipeline fails.'
  examples:
    bad: |
      include:
        - remote: 'https://example.com/ci/templates/build.yml'
    good: |
      include:
        - remote: 'https://example.com/ci/templates/build.yml'
          integrity: 'sha256-L3/GAoKaw0Arw6hDCKeKQlV1QPEgHYxGBHsH4zG1IY8='
  cwe:
  - CWE-829
  - CWE-494
  owasp:
  - A08:2021
  - A08:2025
  status: active
  rule_version: 1
