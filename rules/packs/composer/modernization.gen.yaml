pack: composer
pack_version: 2026.10.0
rules:
- id: COMPOSER-MOD-PHP-EOL
  title: require.php allows end-of-life PHP versions
  language: json
  kind: modernization
  category: runtime
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/composer.json'
    query: |
      (document (object (pair key: (string (string_content) @s (#eq? @s "require")) value: (object (pair key: (string (string_content) @p (#eq? @p "php")) value: (string (string_content) @match (#match? @match "^[\\^~>= ]*(5|7|8[.][01])([.]|$| |[|])")))))))
  message: The PHP constraint admits branches without security support.
  source:
    url: https://www.php.net/supported-versions.php
    doc: require.php allows end-of-life PHP versions
    doc_version: php.net supported versions (2026-10)
    retrieved: '2026-10-09'
    quote: Once the four years of support are completed, the branch reaches its end of life and is no longer supported.
  examples:
    bad: '{"require": {"php": ">=7.4"}}'
    good: '{"require": {"php": "^8.3"}}'
  status: active
  rule_version: 1
- id: COMPOSER-MOD-PSR0-AUTOLOAD
  title: PSR-0 autoloading
  language: json
  kind: modernization
  category: autoload
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/composer.json'
    query: |
      (pair key: (string (string_content) @a (#match? @a "^autoload(-dev)?$")) value: (object (pair key: (string (string_content) @match (#eq? @match "psr-0")))))
  message: Migrate to PSR-4.
  source:
    url: https://getcomposer.org/doc/04-schema.md
    doc: PSR-0 autoloading
    doc_version: Composer 2.10 docs
    retrieved: '2026-10-09'
    quote: PSR-4 and PSR-0 autoloading, classmap generation and files includes are supported. PSR-4 is the recommended way since it offers greater ease of use (no need to regenerate the autoloader when you add classes).
  examples:
    bad: '{"autoload": {"psr-0": {"Acme_": "src/"}}}'
    good: '{"autoload": {"psr-4": {"Acme\\": "src/"}}}'
  status: active
  rule_version: 1
