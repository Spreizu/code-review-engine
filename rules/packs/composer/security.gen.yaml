- id: COMPOSER-SEC-DISABLE-TLS
  title: disable-tls enabled
  language: json
  kind: security
  category: security
  severity: critical
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/composer.json'
    query: |
      (document (object (pair key: (string (string_content) @c (#eq? @c "config")) value: (object (pair key: (string (string_content) @k (#eq? @k "disable-tls")) value: (true) @match)))))
  message: All HTTPS downloads fall back to unencrypted HTTP.
  source:
    url: https://getcomposer.org/doc/06-config.md
    doc: disable-tls enabled
    doc_version: Composer 2.10 docs
    retrieved: '2026-10-09'
    quote: If set to true all HTTPS URLs will be tried with HTTP instead and no network level encryption is performed. Enabling this is a security risk and is NOT recommended. The better way is to enable the php_openssl extension in php.ini.
  examples:
    bad: '{"config": {"disable-tls": true}}'
    good: '{"config": {"disable-tls": false}}'
  status: active
  rule_version: 1
