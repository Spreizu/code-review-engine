- id: COMPOSER-SEC-ALLOW-ALL-PLUGINS
  title: 'allow-plugins: true (every plugin may run code)'
  language: json
  kind: security
  category: security
  severity: major
  applies_to:
    composer: '>=2.2'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/composer.json'
    query: |
      (document (object (pair key: (string (string_content) @c (#eq? @c "config")) value: (object (pair key: (string (string_content) @k (#eq? @k "allow-plugins")) value: (true) @match)))))
  message: Allow-list plugins by name; `true` lets any (transitively installed) plugin execute code.
  source:
    url: https://getcomposer.org/doc/06-config.md
    doc: 'allow-plugins: true (every plugin may run code)'
    doc_version: Composer 2.10 docs
    retrieved: '2026-10-09'
    quote: As of Composer 2.2.0, the allow-plugins option adds a layer of security allowing you to restrict which Composer plugins are able to execute code during a Composer run.
  examples:
    bad: '{"config": {"allow-plugins": true}}'
    good: '{"config": {"allow-plugins": {"composer/installers": true}}}'
  status: active
  rule_version: 1
