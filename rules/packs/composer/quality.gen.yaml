  language: json
  kind: best-practice
  category: manifest
  severity: info
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/composer.json'
    query: |
      (document (object (pair key: (string (string_content) @k (#eq? @k "name")) value: (string) @match)))
    filters:
    - 'file.lacks_re:"license"\s*:'
    - file.lacks_re:"type"\s*:\s*"project"
  message: Declare an SPDX license (or "proprietary").
  source:
    url: https://getcomposer.org/doc/04-schema.md
    doc: Library without a license
    doc_version: Composer 2.10 docs
    retrieved: '2026-10-09'
    quote: later GPL-3.0-only / GPL-3.0-or-later LGPL-2.1-only / LGPL-2.1-or-later LGPL-3.0-only / LGPL-3.0-or-later MIT Optional, but it is highly recommended to supply this. More identifiers are listed at the SPDX Open Source License Registry .
