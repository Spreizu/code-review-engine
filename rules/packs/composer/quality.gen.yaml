- id: COMPOSER-QUAL-REQ-STAR
  title: Dependency constraint * (any version)
  language: json
  kind: anti-pattern
  category: dependencies
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/composer.json'
    query: |
      (document (object (pair key: (string (string_content) @s (#match? @s "^require(-dev)?$")) value: (object (pair key: (string (string_content) @pkg) value: (string (string_content) @match (#match? @match "^\\*$")))))))
    filters:
    - cap.lacks_re:pkg:^(php|php-64bit|php-ipv6|php-zts|php-debug|hhvm|composer|composer-plugin-api|composer-runtime-api)$|^(ext|lib)-
  message: '`*` accepts every future major release.'
  source:
    url: https://getcomposer.org/doc/articles/versions.md
    doc: Dependency constraint * (any version)
    doc_version: Composer 2.10 docs
    retrieved: '2026-10-09'
    quote: 'Note: Be careful when using unbounded ranges as you might end up unexpectedly installing versions that break backwards compatibility.'
  examples:
    bad: '{"require": {"monolog/monolog": "*"}}'
    good: '{"require": {"monolog/monolog": "^3.9"}}'
  status: active
  rule_version: 1
- id: COMPOSER-QUAL-REQ-UNBOUNDED
  title: Unbounded >= constraint
  language: json
  kind: anti-pattern
  category: dependencies
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/composer.json'
    query: |
      (document (object (pair key: (string (string_content) @s (#match? @s "^require(-dev)?$")) value: (object (pair key: (string (string_content) @pkg) value: (string (string_content) @match (#match? @match "^>=?\\s*[0-9][^,| <]*$")))))))
    filters:
    - cap.lacks_re:pkg:^(php|php-64bit|php-ipv6|php-zts|php-debug|hhvm|composer|composer-plugin-api|composer-runtime-api)$|^(ext|lib)-
  message: Use the caret operator (^7.0) so a future major cannot be installed.
  source:
    url: https://getcomposer.org/doc/articles/versions.md
    doc: Unbounded >= constraint
    doc_version: Composer 2.10 docs
    retrieved: '2026-10-09'
    quote: 'Note: Be careful when using unbounded ranges as you might end up unexpectedly installing versions that break backwards compatibility. Consider using the caret operator instead for safety.'
  examples:
    bad: '{"require": {"guzzlehttp/guzzle": ">=7.0"}}'
    good: '{"require": {"guzzlehttp/guzzle": "^7.0"}}'
  status: active
  rule_version: 1
- id: COMPOSER-QUAL-VERSION-FIELD
  title: Explicit `version` field
  language: json
  kind: best-practice
  category: manifest
  severity: minor
  applies_to:
