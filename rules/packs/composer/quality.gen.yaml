- id: COMPOSER-QUAL-REQ-DEV-BRANCH
  title: Requires a dev-* branch
  language: json
  kind: anti-pattern
  category: dependencies
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/composer.json'
    query: |
      (document (object (pair key: (string (string_content) @s (#match? @s "^require$")) value: (object (pair key: (string (string_content) @pkg) value: (string (string_content) @match (#match? @match "^dev-|[.]x-dev$")))))))
  message: A moving branch is not reproducible and silently pulls unreleased code.
  source:
    url: https://getcomposer.org/doc/articles/versions.md
    doc: Requires a dev-* branch
    doc_version: Composer 2.10 docs
    retrieved: '2026-10-09'
    quote: 'Branches # If you want Composer to check out a branch instead of a tag, you need to point it to the branch using the special dev-* prefix (or sometimes suffix; see below).'
  examples:
    bad: '{"require": {"acme/lib": "dev-main"}}'
    good: '{"require": {"acme/lib": "^2.1"}}'
  status: active
  rule_version: 1
