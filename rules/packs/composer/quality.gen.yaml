- id: COMPOSER-QUAL-OPTIMIZE-AUTOLOADER
  title: Project without optimize-autoloader
  language: json
  kind: best-practice
  category: performance
  severity: info
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/composer.json'
    query: |
      (document (object (pair key: (string (string_content) @k (#eq? @k "type")) value: (string (string_content) @match (#eq? @match "project")))))
