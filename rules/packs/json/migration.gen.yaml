- id: JSON-MIG-SCHEMA-ITEMS-ARRAY
  title: 'Tuple `items: [...]` in a 2020-12 schema'
  language: json
  kind: migration
  category: json-schema
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (pair key: (string (string_content) @match (#eq? @match "items")) value: (array))
    filters:
    - file.has_re:json-schema\.org/draft/2020-12
  message: In 2020-12 tuple validation uses prefixItems; array-form items is invalid.
  source:
    url: https://json-schema.org/understanding-json-schema/reference/array
    doc: 'Tuple `items: [...]` in a 2020-12 schema'
    doc_version: JSON Schema 2020-12
    retrieved: '2026-10-09'
    quote: To do this, we use the prefixItems keyword.
  examples:
    bad: '{"$schema": "https://json-schema.org/draft/2020-12/schema", "items": [{"type": "string"}]}'
    good: '{"$schema": "https://json-schema.org/draft/2020-12/schema", "prefixItems": [{"type": "string"}]}'
  status: active
  rule_version: 1
