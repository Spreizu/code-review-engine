  rule_version: 1
- id: JSON-MIG-SCHEMA-ID-NO-DOLLAR
  title: Draft-4 `id` keyword in a newer schema
  language: json
  kind: migration
  category: json-schema
  severity: minor
  applies_to:
    any: '*'
