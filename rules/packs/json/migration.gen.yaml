rules:
- id: JSON-MIG-SCHEMA-ADDITIONAL-ITEMS
  title: '`additionalItems` in a 2020-12 schema'
  language: json
  kind: removal
  category: json-schema
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (pair key: (string (string_content) @match (#eq? @match "additionalItems")))
    filters:
    - file.has_re:json-schema\.org/draft/2020-12
  message: 2020-12 removed additionalItems; use `items` after prefixItems.
  source:
    url: https://json-schema.org/understanding-json-schema/reference/array
    doc: '`additionalItems` in a 2020-12 schema'
    doc_version: JSON Schema 2020-12
    retrieved: '2026-10-09'
    quote: Draft 4 - 2019-09 Before to Draft 2020-12, you would use the additionalItems keyword to constrain additional items on a tuple.
  examples:
    bad: '{"$schema": "https://json-schema.org/draft/2020-12/schema", "additionalItems": false}'
    good: '{"$schema": "https://json-schema.org/draft/2020-12/schema", "items": false}'
  status: active
  rule_version: 1
- id: JSON-MIG-SCHEMA-BOOLEAN-EXCLUSIVE
  title: Boolean exclusiveMinimum/Maximum (draft-4 style)
  language: json
  kind: migration
  category: json-schema
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (pair key: (string (string_content) @match (#match? @match "^exclusive(Minimum|Maximum)$")) value: [(true) (false)])
    filters:
    - file.lacks_re:draft-0[34]
  message: Since draft 6 exclusiveMinimum/Maximum take numbers; booleans are draft-4 only.
  source:
    url: https://json-schema.org/understanding-json-schema/reference/numeric
    doc: Boolean exclusiveMinimum/Maximum (draft-4 style)
    doc_version: JSON Schema 2020-12
    retrieved: '2026-10-09'
    quote: Range Ranges of numbers are specified using a combination of the minimum and maximum keywords, (or exclusiveMinimum and exclusiveMaximum for expressing exclusive range).
  examples:
    bad: '{"minimum": 0, "exclusiveMinimum": true}'
    good: '{"exclusiveMinimum": 0}'
  status: active
  rule_version: 1
