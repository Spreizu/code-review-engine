rules:
- id: JSON-SEC-AWS-ACCESS-KEY
  title: AWS access key ID committed
  language: json
  kind: security
  category: security
  severity: critical
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((string_content) @match (#match? @match "^(AKIA|ASIA)[0-9A-Z]{16}$"))
  message: 'Long-term AWS access key in a JSON file: rotate it and load credentials from the environment/role instead.'
  source:
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
    doc: AWS access key ID committed
    doc_version: AWS IAM User Guide
    retrieved: '2026-10-09'
    quote: 'Access keys consist of two parts: an access key ID (for example, AKIAIOSFODNN7EXAMPLE ) and a secret access key (for example, wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY ).'
  examples:
    bad: '{"aws_access_key_id": "AKIAIOSFODNN7EXAMPLE"}'
    good: '{"aws_profile": "deploy"}'
  status: active
  rule_version: 1
- id: JSON-SEC-AZURE-STORAGE-KEY
  title: Azure storage account key in connection string
  language: json
  kind: security
  category: security
  severity: critical
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((string_content) @match (#match? @match "AccountKey=[A-Za-z0-9+/=]{20,}"))
  message: Storage account key committed; prefer Microsoft Entra ID / managed identity or a Key Vault reference.
  source:
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-configure-connection-string
    doc: Azure storage account key in connection string
    doc_version: Azure Storage docs
    retrieved: '2026-10-09'
    quote: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1; AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==; BlobEndpoint=http:/
  examples:
    bad: '{"conn": "DefaultEndpointsProtocol=https;AccountName=x;AccountKey=abcdefghijklmnopqrstuvwxyz0123=="}'
    good: '{"conn_env": "AZURE_STORAGE_CONNECTION_STRING"}'
  status: active
  rule_version: 1
- id: JSON-SEC-GCP-SERVICE-ACCOUNT-KEY
  title: Google Cloud service account key file committed
  language: json
  kind: security
  category: security
  severity: critical
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((object (pair key: (string (string_content) @k) value: (string (string_content) @v))) @match (#eq? @k "type") (#eq? @v "service_account"))
    filters:
    - node.has_re:"private_key"
  message: A service account key JSON is in the repo; delete/rotate the key and use workload identity federation or ADC.
  source:
    url: https://cloud.google.com/iam/docs/best-practices-for-managing-service-account-keys
    doc: Google Cloud service account key file committed
    doc_version: Google Cloud IAM docs
    retrieved: '2026-10-09'
    quote: Best practices for managing service account keys | Identity and Access Management (IAM) | Google Cloud Documentation Skip to main content Documentation close
  examples:
    bad: '{"type": "service_account", "private_key_id": "1", "private_key": "-----BEGIN PRIVATE KEY-----\n..."}'
    good: '{"type": "external_account"}'
  status: active
  rule_version: 1
- id: JSON-SEC-GITHUB-TOKEN
  title: GitHub token committed
  language: json
  kind: security
  category: security
  severity: critical
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((string_content) @match (#match? @match "^(gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,})$"))
  message: 'GitHub token (ghp_/gho_/ghu_/ghs_/ghr_/github_pat_) committed: revoke it and use an environment variable/secret.'
  source:
    url: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github
    doc: GitHub token committed
    doc_version: GitHub Docs
    retrieved: '2026-10-09'
    quote: Token type Prefix More information Personal access token (classic) ghp_ Managing your personal access tokens Fine-grained personal access token github_pat_ Managing your personal ac
  examples:
    bad: '{"token": "ghp_aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789"}'
    good: '{"token_env": "GITHUB_TOKEN"}'
  status: active
  rule_version: 1
- id: JSON-SEC-HTTP-URL
  title: Plain http:// endpoint
  language: json
  kind: security
  category: security
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((string_content) @match (#match? @match "^http://"))
    filters:
    - node.lacks_re:^http://(localhost|127\.|0\.0\.0\.0|\[::1\]|json-schema\.org|www\.w3\.org|schemas?\.|xmlns)
  message: Cleartext http:// endpoint in configuration; use https unless this is a local/dev URL or an identifier.
  ai_question: Is this an actual network endpoint used at runtime over cleartext HTTP (not localhost, a namespace/identifier URI, or a schema $id)?
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html
    doc: Plain http:// endpoint
    doc_version: OWASP cheat sheet (2026)
    retrieved: '2026-10-09'
    quote: verless FaaS Security Session Management Software Supply Chain Security Subdomain Takeover Prevention Symfony TLS Cipher String Third Party Javascript Management Third Party Payment Gateway Integration Threat Modeling Trans
  examples:
    bad: '{"api": "http://api.example.com/v1"}'
    good: '{"api": "https://api.example.com/v1"}'
  status: active
  rule_version: 1
- id: JSON-SEC-JWT-LITERAL
  title: Hard-coded JSON Web Token
  language: json
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((string_content) @match (#match? @match "^eyJ[A-Za-z0-9_-]{10,}[.]eyJ[A-Za-z0-9_-]{10,}[.][A-Za-z0-9_-]+$"))
  message: A bearer token is committed; tokens grant access until they expire.
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    doc: Hard-coded JSON Web Token
    doc_version: OWASP cheat sheet (2026)
    retrieved: '2026-10-09'
    quote: se credentials, Identity and Access Management (IAM) permissions, Secure Shell (SSH) keys, certificates, etc. Many organizations have them hardcoded within the source code in plaintext, littered throughout configuration files and configuration management tools.
  examples:
    bad: '{"auth": "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.abc123"}'
    good: '{"auth": "${AUTH_TOKEN}"}'
  status: active
  rule_version: 1
- id: JSON-SEC-PRIVATE-KEY
  title: PEM private key embedded in JSON
  language: json
  kind: security
  category: security
  severity: critical
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((string_content) @match (#match? @match "-----BEGIN ([A-Z]+ )?PRIVATE KEY-----"))
  message: 'Private key material committed to the repository: revoke it and mount it from a secret store.'
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    doc: PEM private key embedded in JSON
    doc_version: OWASP cheat sheet (2026)
    retrieved: '2026-10-09'
    quote: se credentials, Identity and Access Management (IAM) permissions, Secure Shell (SSH) keys, certificates, etc. Many organizations have them hardcoded within the source code in plaintext, littered throughout configuration files and configuration management tools.
  examples:
    bad: '{"key": "-----BEGIN RSA PRIVATE KEY-----\nMIIE..."}'
    good: '{"key_file": "/run/secrets/tls.key"}'
  status: active
  rule_version: 1
- id: JSON-SEC-PROTO-KEY
  title: __proto__ / constructor.prototype key in JSON data
  language: json
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (pair key: (string (string_content) @match (#match? @match "^(__proto__|prototype|constructor)$")))
  message: Keys like __proto__/constructor in data enable prototype pollution when merged into JS objects; reject or sanitise them.
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Prototype_Pollution_Prevention_Cheat_Sheet.html
    doc: __proto__ / constructor.prototype key in JSON data
    doc_version: OWASP cheat sheet (2026)
    retrieved: '2026-10-09'
    quote: ': let obj = Object . create ( null ); If object literals are required then as a last resort you could use the __proto__ property: let obj = { __proto__ : null }; Use object "freeze" and "seal" mechanisms ¶ Freezing built-in proto'
  examples:
    bad: '{"__proto__": {"isAdmin": true}}'
    good: '{"profile": {"isAdmin": false}}'
  status: active
  rule_version: 1
- id: JSON-SEC-SECRET-FIELD
  title: Secret-looking field with a literal value
  language: json
  kind: security
  category: security
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      (pair key: (string (string_content) @k (#match? @k "(?i)^(password|passwd|pwd|secret|client_secret|api[_-]?key|apikey|access[_-]?token|auth[_-]?token|private[_-]?key|secret[_-]?key)$")) value: (string (string_content) @match (#not-match? @match "^(\\$\\{|<|%|\\{\\{|\\*+$|changeme$|xxx+$|example)")))
  message: Field name suggests a credential and the value is a literal; confirm it is not a real secret.
  ai_question: Is this value a real credential (not a placeholder, test fixture, or documented example)? Answer from the snippet.
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    doc: Secret-looking field with a literal value
    doc_version: OWASP cheat sheet (2026)
    retrieved: '2026-10-09'
    quote: se credentials, Identity and Access Management (IAM) permissions, Secure Shell (SSH) keys, certificates, etc. Many organizations have them hardcoded within the source code in plaintext, littered throughout configuration files and configuration management tools.
  examples:
    bad: '{"password": "S3cr3t!"}'
    good: '{"password": "${DB_PASSWORD}"}'
  status: active
  rule_version: 1
- id: JSON-SEC-SLACK-TOKEN
  title: Slack token committed
  language: json
  kind: security
  category: security
  severity: critical
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((string_content) @match (#match? @match "^xox[abposr]-[0-9A-Za-z-]{10,}"))
  message: 'Slack token committed: revoke and move to a secret store.'
  source:
    url: https://docs.slack.dev/authentication/tokens/
    doc: Slack token committed
    doc_version: Slack developer docs
    retrieved: '2026-10-09'
    quote: Bot token strings begin with xoxb- .
  examples:
    bad: '{"slack": "xoxb-1234567890-abcdefghij"}'
    good: '{"slack_env": "SLACK_BOT_TOKEN"}'
  status: active
  rule_version: 1
- id: JSON-SEC-STRIPE-LIVE-KEY
  title: Stripe live secret key committed
  language: json
  kind: security
  category: security
  severity: critical
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
