- id: JSON-QUAL-UNSAFE-INTEGER
  title: Integer outside the interoperable IEEE-754 range
  language: json
  kind: anti-pattern
  category: interoperability
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((number) @match (#match? @match "^-?[0-9]{16,}$"))
  message: Integers beyond ±(2^53-1) silently lose precision in JavaScript and many other parsers; send large IDs as strings.
  source:
    url: https://www.rfc-editor.org/rfc/rfc8259
    doc: Integer outside the interoperable IEEE-754 range
    doc_version: RFC 8259 (2017)
    retrieved: '2026-10-09'
