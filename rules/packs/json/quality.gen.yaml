- id: JSON-QUAL-NON-ISO-DATE
  title: Date not in RFC 3339 / ISO 8601 format
  language: json
  kind: best-practice
  category: interoperability
  severity: info
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((string_content) @match (#match? @match "^[0-9]{1,2}/[0-9]{1,2}/[0-9]{2,4}( |$)|^[0-9]{1,2}-[0-9]{1,2}-(19|20)[0-9]{2}( |$)|^[0-9]{1,2}[.][0-9]{1,2}[.](19|20)[0-9]{2}( |$)"))
  message: Use RFC 3339 timestamps (e.g. 2025-12-31T00:00:00Z); locale formats are ambiguous.
  source:
    url: https://www.rfc-editor.org/rfc/rfc7493
    doc: Date not in RFC 3339 / ISO 8601 format
    doc_version: RFC 7493 (I-JSON)
    retrieved: '2026-10-09'
    quote: It is RECOMMENDED that all such data items be expressed as string values in ISO 8601 format, as specified in [ RFC3339 ], with the additional restrictions that uppercase rather than lowercase letters b
  examples:
