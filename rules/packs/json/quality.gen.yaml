      ((string_content) @match (#match? @match "[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F\\t]"))
  message: Control characters (including TAB) must be escaped inside JSON strings.
  source:
    url: https://www.rfc-editor.org/rfc/rfc8259
    doc: Unescaped control character inside a string
    doc_version: RFC 8259 (2017)
    retrieved: '2026-10-09'
    quote: 'hin the quotation marks, except for the characters that MUST be escaped: quotation mark, reverse solidus, and the control characters (U+0000 through U+001F).'
  examples:
    bad: "{\"a\": \"x\ty\"}"
    good: '{"a": "x\ty"}'
  status: active
  rule_version: 1
- id: JSON-QUAL-DUPLICATE-KEY
  title: Duplicate object member name
  language: json
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (object (pair key: (string) @match))
    filters:
    - node.dup_sibling_key
  message: 'Duplicate key in the same object: parsers disagree on which value wins (last, first, or error).'
  source:
    url: https://www.rfc-editor.org/rfc/rfc8259
    doc: Duplicate object member name
    doc_version: RFC 8259 (2017)
    retrieved: '2026-10-09'
    quote: A single comma separates a value from a following name. The names within an object SHOULD be unique. object = begin-object [ member *( value-separator member ) ] end-object member = string name-separator value
  examples:
    bad: '{"name": "a", "port": 80, "name": "b"}'
    good: '{"name": "a", "port": 80}'
    regressions:
    - note: same key in sibling objects
      code: '{"a": {"id": 1}, "b": {"id": 2}}'
  status: active
  rule_version: 1
- id: JSON-QUAL-EXCESS-PRECISION
  title: Decimal with more precision than binary64 can hold
  language: json
  kind: anti-pattern
  category: interoperability
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((number) @match (#match? @match "[.][0-9]{17,}"))
  message: More than ~17 significant digits cannot survive a round-trip through binary64; use a string (or a decimal type) for exact values.
  source:
    url: https://www.rfc-editor.org/rfc/rfc8259
    doc: Decimal with more precision than binary64 can hold
    doc_version: RFC 8259 (2017)
    retrieved: '2026-10-09'
    quote: Since software that implements IEEE 754 binary64 (double precision) numbers [ IEEE754 ] is generally available and widely used, good interoperability can be achieved by implementations
  examples:
    bad: '{"price": 0.123456789012345678901}'
    good: '{"price": "0.123456789012345678901"}'
  status: active
  rule_version: 1
- id: JSON-QUAL-LEADING-ZERO
  title: Number with a leading zero
  language: json
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
