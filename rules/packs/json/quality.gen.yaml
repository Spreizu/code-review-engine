- id: JSON-QUAL-BOM
  title: Byte order mark at start of JSON text
  language: json
  kind: anti-pattern
  category: interoperability
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (document) @match
    filters:
    - "file.has_re:^\uFEFF"
  message: Remove the UTF-8 BOM; many JSON parsers reject it.
  source:
    url: https://www.rfc-editor.org/rfc/rfc8259
    doc: Byte order mark at start of JSON text
    doc_version: RFC 8259 (2017)
    retrieved: '2026-10-09'
    quote: chosen to use the UTF-8 encoding, to the extent that it is the only encoding that achieves interoperability. Implementations MUST NOT add a byte order mark (U+FEFF) to the beginning of a networked-transmitted JSON text. In the interests of interoperability, implementations that parse JSON texts MAY ignore the presence of a byte
  examples:
    bad: "\uFEFF{\"a\": 1}"
    good: '{"a": 1}'
  status: active
  rule_version: 1
- id: JSON-QUAL-COMMENT
  title: Comments are not valid JSON
  language: json
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '!**/tsconfig*.json'
    - '!**/jsconfig*.json'
    - '!**/.vscode/**'
    - '!**/devcontainer.json'
    - '!**/.devcontainer/**'
    - '!**/*.jsonc'
    - '!**/.eslintrc.json'
    - '!**/.babelrc'
    - '!**/turbo.json'
    - '!**/deno.json'
    - '!**/biome.json'
    - '!**/.swcrc'
    query: |
      (comment) @match
  message: Comments are not allowed in JSON (only insignificant whitespace is). Use JSONC/JSON5 tooling explicitly or move the note to documentation.
  source:
    url: https://www.rfc-editor.org/rfc/rfc8259
    doc: Comments are not valid JSON
    doc_version: RFC 8259 (2017)
    retrieved: '2026-10-09'
    quote: 'ws ; : colon value-separator = ws %x2C ws ; , comma Bray Standards Track [Page 5] RFC 8259 JSON December 2017 Insignificant whitespace is allowed before or after any of the six structural characters. ws = *( %x20 / ; Space %x09 / ; Horizontal tab %x0A / ; Line feed or New line %x0D ) ; Carriage return 3 .'
  examples:
    bad: |-
      // port
      {"port": 80}
    good: '{"port": 80}'
  status: active
  rule_version: 1
- id: JSON-QUAL-CONTROL-CHAR
  title: Unescaped control character inside a string
  language: json
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    any: '*'
