- id: JSON-QUAL-SCHEMA-REF-SIBLINGS
  title: Keywords next to $ref are ignored (draft ≤ 7)
  language: json
  kind: anti-pattern
  category: json-schema
  severity: major
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (object (pair key: (string (string_content) @r (#eq? @r "$ref"))) (pair key: (string (string_content) @match (#not-match? @match "^[$](ref|id|comment|schema)$|^(title|description)$"))))
    filters:
    - file.has_re:draft-0[4-7]
  message: In draft 4-7 an object with $ref is only a reference; sibling keywords are ignored. Wrap in allOf or move to 2019-09+.
  source:
    url: https://json-schema.org/understanding-json-schema/structuring
    doc: Keywords next to $ref are ignored (draft ≤ 7)
    doc_version: JSON Schema 2020-12
    retrieved: '2026-10-09'
    quote: "\"string\" } } , \" required \" : [ \"street_address\" , \"city\" , \"state\" ] } \uFEFF $ref A schema can reference another schema using the $ref keyword."
  examples:
    bad: '{"$schema": "http://json-schema.org/draft-07/schema#", "properties": {"a": {"$ref": "#/definitions/x", "minLength": 2}}}'
    good: '{"$schema": "http://json-schema.org/draft-07/schema#", "properties": {"a": {"allOf": [{"$ref": "#/definitions/x"}, {"minLength": 2}]}}}'
  status: active
  rule_version: 1
