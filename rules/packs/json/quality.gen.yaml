  rule_version: 1
- id: JSON-QUAL-LONE-SURROGATE
  title: Unpaired UTF-16 surrogate escape
  language: json
  kind: anti-pattern
  category: interoperability
  severity: minor
  applies_to:
    any: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((string (escape_sequence)) @match)
    filters:
    - node.has_re:\\u[dD][89abAB][0-9a-fA-F]{2}
    - node.lacks_re:\\u[dD][89abAB][0-9a-fA-F]{2}\\u[dD][c-fC-F]
  message: A high surrogate escape must be followed by a low surrogate; lone surrogates are rejected by I-JSON and corrupt UTF-8 output.
  source:
    url: https://www.rfc-editor.org/rfc/rfc7493
    doc: Unpaired UTF-16 surrogate escape
    doc_version: RFC 7493 (I-JSON)
    retrieved: '2026-10-09'
    quote: Object member names, and string values in arrays and object members, MUST NOT include code points that identify Surrogates or Noncharacters as defined by [ UNICODE ].
  examples:
    bad: '{"s": "\uD800x"}'
    good: '{"s": "\uD83D\uDE00"}'
  status: active
  rule_version: 1
