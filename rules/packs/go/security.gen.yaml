- id: GO-SEC-ATOI-NARROWING
  title: strconv result narrowed to a smaller integer type
  language: go
  kind: security
  category: security
  severity: minor
  applies_to:
    go: '>=1.18'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.go'
    query: |
      ((call_expression function: (identifier) @t arguments: (argument_list . (identifier) .)) @match (#match? @t "^(int8|int16|int32|uint8|uint16|uint32)$"))
    filters:
    - func.has_re:strconv\.(Atoi|ParseInt\([^)]*,\s*(0|64)\)|ParseUint\([^)]*,\s*(0|64)\))
    - func.lacks_re:math\.(Max|Min)(Int|Uint)(8|16|32)
    exclude_tests: true
  message: A value parsed as a full-size int is converted to a smaller type, so large inputs wrap around silently (a port, size or index becomes negative or small). Parse with the target bitSize (ParseInt(s, 10, 16)) or range-check before converting.
  ai_question: Is the converted value derived from strconv.Atoi/ParseInt(...,64) on external input without a range check?
  source:
    url: https://pkg.go.dev/strconv
    doc: strconv result narrowed to a smaller integer type
    doc_version: Go strconv docs
    retrieved: '2026-10-09'
    quote: 'Output: uint (base 10):42 uint (base 16):2a Share Format Run func Atoi ¶ func Atoi(s string ) ( int , error ) Atoi is equivalent to ParseInt(s, 10, 0), converted to type int. Example ¶ package main import ( "fmt" "strconv" ) func main() { v := "10" if s, err := strconv.Atoi(v); err ='
  examples:
    bad: "package p\n\nimport \"strconv\"\n\nfunc port(s string) int16 {\n\tn, _ := strconv.Atoi(s)\n\treturn int16(n)\n}\n"
    good: "package p\n\nimport \"strconv\"\n\nfunc port(s string) int16 {\n\tn, _ := strconv.ParseInt(s, 10, 16)\n\treturn int16(n)\n}\n"
  cwe:
  - CWE-190
  - CWE-681
  asvs:
  - V1.4.2
  status: active
  rule_version: 1
  tags:
  - appsec
