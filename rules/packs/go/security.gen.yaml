- id: GO-SEC-STATIC-IV
  title: Block mode created with a constant IV
  language: go
  kind: security
  category: security
  severity: major
  applies_to:
    go: '>=1.18'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.go'
    query: |
      ((call_expression function: (selector_expression operand: (identifier) @pkg field: (field_identifier) @f) arguments: (argument_list (_) [(type_conversion_expression operand: (interpreted_string_literal)) (call_expression function: (identifier) @mk) (composite_literal)] @iv)) @match (#eq? @pkg "cipher") (#match? @f "^(NewCBCEncrypter|NewCBCDecrypter|NewCTR|NewOFB|NewCFBEncrypter|NewCFBDecrypter)$"))
    exclude_tests: true
  message: 'The IV/nonce is a constant, so every message encrypted with this key reuses it: equal plaintexts give equal ciphertexts (CBC) or the keystream repeats (CTR/GCM). Generate a fresh random IV per message and store it with the ciphertext.'
  source:
    url: https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    doc: Block mode created with a constant IV
    doc_version: OWASP Cheat Sheet Series (current)
    retrieved: '2026-10-09'
    quote: Enforce the mode's limits on message size, encryption operations, and initialization vector (IV) uniqueness across all instances sharing the key.
  examples:
    bad: "package p\n\nimport \"crypto/cipher\"\n\nfunc enc(b cipher.Block) cipher.BlockMode {\n\treturn cipher.NewCBCEncrypter(b, []byte(\"0123456789abcdef\"))\n}\n"
    good: "package p\n\nimport (\n\t\"crypto/cipher\"\n\t\"crypto/rand\"\n)\n\nfunc enc(b cipher.Block) cipher.BlockMode {\n\tiv := make([]byte, b.BlockSize())\n\trand.Read(iv)\n\treturn cipher.NewCBCEncrypter(b, iv)\n}\n"
  cwe:
  - CWE-329
  - CWE-1204
  asvs:
  - V11.3.4
  status: active
  rule_version: 1
  tags:
  - appsec
