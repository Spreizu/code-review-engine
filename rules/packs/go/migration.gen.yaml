- id: GO-MIG-DSA
  title: crypto/dsa (deprecated legacy algorithm)
  language: go
  kind: deprecation
  category: security
  severity: major
  applies_to:
    go: '>=1.16'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (import_spec path: (interpreted_string_literal) @match (#eq? @match "\"crypto/dsa\""))
  message: Use Ed25519, ECDSA or RSA.
  source:
    url: https://pkg.go.dev/crypto/dsa
    doc: crypto/dsa (deprecated legacy algorithm)
    doc_version: Go 1.27
    retrieved: '2026-10-09'
    quote: 'Deprecated: DSA is a legacy algorithm, and modern alternatives such as Ed25519 (implemented by package crypto/ed25519) should be used instead.'
  examples:
    bad: |
      import "crypto/dsa"
    good: |
      import "crypto/ed25519"
  status: active
  rule_version: 2
