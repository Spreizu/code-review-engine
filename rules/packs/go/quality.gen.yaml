    quote: 'Analyzer testinggoroutine ¶ testinggoroutine: report calls to (*testing.T).Fatal from goroutines started by a test Functions that abruptly terminate a test, such as the Fatal, Fatalf, FailNow, and Skip{,f,Now} methods of *te'
  examples:
    bad: "func TestX(t *testing.T) {\n\tgo func() {\n\t\tt.Fatal(\"x\")\n\t}()\n}\n"
    good: "func TestX(t *testing.T) {\n\tgo func() {\n\t\tt.Error(\"x\")\n\t}()\n}\n"
