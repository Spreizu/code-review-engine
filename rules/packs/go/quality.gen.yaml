- id: GO-QUAL-DEFER-IN-LOOP
  title: defer inside a loop
  language: go
  kind: anti-pattern
  category: resource
  severity: minor
  applies_to:
    go: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (for_statement body: (block (statement_list (defer_statement) @match)))
  message: 'Deferred calls run when the function returns, not per iteration: resources pile up.'
  source:
    url: https://go.dev/doc/effective_go#defer
    doc: defer inside a loop
    doc_version: Effective Go
    retrieved: '2026-10-09'
    quote: it means that the close sits near the open, which is much clearer than placing it at the end of the function. The arguments to the deferred function (which include the receiver if the function is a method) are evaluated when the defer executes, not when the call executes.
  examples:
    bad: "func f() {\n\tfor _, p := range paths {\n\t\tf, _ := os.Open(p)\n\t\tdefer f.Close()\n\t}\n}\n"
    good: "func f() {\n\tfor _, p := range paths {\n\t\tfunc() {\n\t\t\tf, _ := os.Open(p)\n\t\t\tdefer f.Close()\n\t\t}()\n\t}\n}\n"
  status: active
  rule_version: 1
