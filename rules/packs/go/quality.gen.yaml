- id: GO-QUAL-HTTP-BODY-NOT-CLOSED
  title: HTTP response body never closed
  language: go
  kind: anti-pattern
  category: resources
  severity: major
  applies_to:
    go: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((function_declaration body: (block) @b) @match (#match? @b "\\b(\\w+)\\s*,\\s*\\w+\\s*:?=\\s*(http\\.(Get|Post|Head|PostForm)|\\w*([Cc]lient|http\\.DefaultClient)\\.(Get|Post|Head|PostForm|Do))\\(") (#not-match? @b "Body\\.Close\\(\\)"))
    filters:
    - node.lacks_re:^func[^{]*\*http\.Response|\breturn\s+&?\w*[Rr]es(p|ponse)?\w*\s*(,|\n|$)|\b\w*([Cc]lose|[Dd]rain|[Dd]iscard)\w*\(\s*\w*[Rr]es(p|ponse)?\w*\s*[,)]
  message: Unclosed bodies leak connections and file descriptors.
  ai_question: Is the response returned/handed off to a caller that closes it? If not, this is a leak.
  source:
    url: https://pkg.go.dev/net/http
    doc: HTTP response body never closed
    doc_version: Go 1.27
    retrieved: '2026-10-09'
    quote: '&buf) ... resp, err := http.PostForm("http://example.com/form", url.Values{"key": {"Value"}, "id": {"123"}}) The caller must close the response body when finished with it: resp, err := http.Get("http://example.com/") if err != nil { // handle error } defer resp.Body.Close() body,'
  examples:
    bad: "func f() error {\n\tresp, err := http.Get(u)\n\tif err != nil {\n\t\treturn err\n\t}\n\t_ = resp\n\treturn nil\n}\n"
    good: "func f() error {\n\tresp, err := http.Get(u)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer resp.Body.Close()\n\treturn nil\n}\n"
    regressions:
    - code: "func Fetch(u string) (*http.Response, error) {\n\tresp, err := http.Get(u)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\treturn resp, nil\n}\n"
    - code: "func f(u string) error {\n\tresp, err := http.Get(u)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer closeBody(resp)\n\treturn nil\n}\n"
    - code: "import \"net/http\"\n\nfunc FromCache(items []string, c Cache) int {\n\tn := 0\n\tfor _, it := range items {\n\t\tif _, ok := c.Get(it); ok {\n\t\t\tn++\n\t\t}\n\t}\n\treturn n\n}\n"
      note: 'self-scan: c.Get on a cache, not an HTTP client'
  status: active
  rule_version: 1
