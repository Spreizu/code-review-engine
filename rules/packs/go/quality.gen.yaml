  rule_version: 1
- id: GO-QUAL-VET-TIMEFORMAT
  title: Time layout 2006-02-01 (day/month swapped)
  language: go
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    go: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (call_expression function: (selector_expression field: (field_identifier) @f (#match? @f "^(Format|Parse|ParseInLocation|AppendFormat)$")) arguments: (argument_list (interpreted_string_literal) @match (#match? @match "2006-02-01")))
  message: The reference layout is 2006-01-02; 02-01 swaps month and day.
  source:
    url: https://pkg.go.dev/golang.org/x/tools/go/analysis/passes/timeformat
    doc: go vet timeformat
    doc_version: Go 1.27
    retrieved: '2026-10-09'
    quote: 'Analyzer timeformat ¶ timeformat: check for calls of (time.Time).Format or time.Parse with 2006-02-01 The timeformat checker looks for time formats with the 2006-02-01 (yyyy-dd-mm) format.'
  examples:
    bad: |
      var s = t.Format("2006-02-01")
    good: |
      var s = t.Format("2006-01-02")
  status: active
  rule_version: 1
- id: GO-QUAL-VET-UNMARSHAL
  title: Unmarshal into a non-pointer
  language: go
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    go: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      (call_expression function: (selector_expression operand: (identifier) @p (#match? @p "^(json|xml|yaml|gob|asn1)$") field: (field_identifier) @f (#eq? @f "Unmarshal")) arguments: (argument_list (_) [(identifier) (composite_literal) (selector_expression)] @match))
    filters:
    - func.lacks_re:\b{cap:match}\s+(any\b|interface\s*\{|\*)|\b{cap:match}\s*:?=\s*(&|new\()
  message: Unmarshal needs a pointer; with a value it returns InvalidUnmarshalError and fills nothing.
  ai_question: Is the destination argument a non-pointer value (not a variable that already holds a pointer or interface)?
  source:
    url: https://pkg.go.dev/golang.org/x/tools/go/analysis/passes/unmarshal
    doc: go vet unmarshal
    doc_version: Go 1.27
    retrieved: '2026-10-09'
    quote: 'Analyzer unmarshal ¶ unmarshal: report passing non-pointer or non-interface values to unmarshal The unmarshal analysis reports calls to functions such as json.Unmarshal in which the argument type is not a'
  examples:
    bad: "func f() {\n\tvar c Config\n\tjson.Unmarshal(b, c)\n}\n"
    good: "func f() {\n\tvar c Config\n\tjson.Unmarshal(b, &c)\n}\n"
    regressions:
    - code: "func readJSON(p string, v any) error {\n\tb, err := os.ReadFile(p)\n\tif err != nil {\n\t\treturn err\n\t}\n\treturn json.Unmarshal(b, v)\n}\n"
    - code: "func f(b []byte) {\n\tc := &Config{}\n\tjson.Unmarshal(b, c)\n}\n"
  status: active
  rule_version: 1
- id: GO-QUAL-VET-UNREACHABLE
  title: Unreachable code after return/panic
  language: go
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    go: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (block (statement_list (return_statement) . (comment)* . [(expression_statement) (short_var_declaration) (assignment_statement) (if_statement) (for_statement) (return_statement) (var_declaration) (go_statement) (defer_statement) (inc_statement) (dec_statement) (send_statement) (expression_switch_statement) (type_switch_statement) (select_statement) (block)] @match))
      ((block (statement_list (expression_statement (call_expression function: (identifier) @p)) . (comment)* . [(expression_statement) (short_var_declaration) (assignment_statement) (if_statement) (for_statement) (return_statement) (var_declaration) (go_statement) (defer_statement) (inc_statement) (dec_statement) (send_statement) (expression_switch_statement) (type_switch_statement) (select_statement) (block)] @match)) (#eq? @p "panic"))
    filters:
    - func.lacks_re:\bpanic\s*(:=|=[^=])
  message: Statements after an unconditional return never run.
  source:
    url: https://pkg.go.dev/golang.org/x/tools/go/analysis/passes/unreachable
    doc: go vet unreachable
    doc_version: Go 1.27
    retrieved: '2026-10-09'
    quote: 'Analyzer unreachable ¶ unreachable: check for unreachable code The unreachable analyzer finds statements that execution can never reach because they are preceded by a retur'
  examples:
    bad: "func f() int {\n\treturn 1\n\tlog.Println(\"never\")\n}\n"
    good: "func f() int {\n\tlog.Println(\"now\")\n\treturn 1\n}\n"
    regressions:
    - code: "func f(x bool) int {\n\tif x {\n\t\treturn 2 // early\n\t}\n\treturn 1 // trailing comment is not code\n}\n"
      note: 'self-scan: a trailing comment after return is a sibling node, not a statement'
    - code: "func g() {\n\tpanic(\"boom\") // explain\n}\n"
      note: comment after panic
    - code: "func h() {\n\tvar panic = func(int) {}\n\tpanic(2)\n\tprintln(\"still runs\")\n}\n"
      note: 'fixture triage (go vet unreachable): a local variable named panic is not the builtin'
  status: active
  rule_version: 1
- id: GO-QUAL-VET-UNUSEDRESULT
  title: Result of a pure function discarded
  language: go
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    go: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (expression_statement (call_expression function: (selector_expression operand: (identifier) @p field: (field_identifier) @f)) @match (#match? @p "^(fmt|errors|strings|bytes|sort|slices|maps)$") (#match? @f "^(Sprint|Sprintf|Sprintln|Errorf|New|Clone|Compact|Repeat|ToLower|ToUpper|TrimSpace|Replace|ReplaceAll|Join|Split|Fields)$"))
  message: The call has no side effects; its result is the only point.
  source:
    url: https://pkg.go.dev/golang.org/x/tools/go/analysis/passes/unusedresult
    doc: go vet unusedresult
    doc_version: Go 1.27
    retrieved: '2026-10-09'
    quote: 'Analyzer unusedresult ¶ unusedresult: check for unused results of calls to some functions Some functions like fmt.Errorf return a result and have no side effects, so it is always a mistake to discard'
  examples:
    bad: "func f() {\n\tfmt.Sprintf(\"%d\", 1)\n}\n"
    good: "func f() string {\n\treturn fmt.Sprintf(\"%d\", 1)\n}\n"
  status: active
  rule_version: 1
- id: GO-QUAL-VET-WAITGROUP-ADD-IN-GOROUTINE
  title: WaitGroup.Add called inside the goroutine
  language: go
  kind: anti-pattern
  category: concurrency
  severity: major
  applies_to:
    go: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (go_statement (call_expression function: (func_literal body: (block (statement_list . (expression_statement (call_expression function: (selector_expression field: (field_identifier) @a (#eq? @a "Add"))) @match))))))
  message: Add inside the goroutine races with Wait; call Add before `go` (or use wg.Go on Go 1.25+).
  source:
    url: https://pkg.go.dev/golang.org/x/tools/go/analysis/passes/waitgroup
    doc: go vet waitgroup
    doc_version: Go 1.27
    retrieved: '2026-10-09'
    quote: 'Analyzer waitgroup ¶ waitgroup: check for misuses of sync.WaitGroup This analyzer detects mistaken calls to the (*sync.WaitGroup).Add method from inside a new goroutine, causing'
  examples:
    bad: "func f() {\n\tgo func() {\n\t\twg.Add(1)\n\t\tdefer wg.Done()\n\t}()\n}\n"
    good: "func f() {\n\twg.Add(1)\n\tgo func() {\n\t\tdefer wg.Done()\n\t}()\n}\n"
  status: active
  rule_version: 1
