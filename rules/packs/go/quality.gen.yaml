- id: GO-QUAL-CTX-IN-STRUCT
  title: context.Context stored in a struct
  language: go
  kind: anti-pattern
  category: maintainability
  severity: minor
  applies_to:
    go: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (field_declaration name: (field_identifier) type: (qualified_type package: (package_identifier) @p name: (type_identifier) @t) (#eq? @p "context") (#eq? @t "Context")) @match
  message: Pass the Context explicitly to each function that needs it.
  source:
    url: https://pkg.go.dev/context
    doc: context.Context stored in a struct
    doc_version: Go 1.27
    retrieved: '2026-10-09'
    quote: Do not store Contexts inside a struct type; instead, pass a Context explicitly to each function that needs it.
  examples:
    bad: "type Worker struct {\n\tctx context.Context\n}\n"
    good: |
      type Worker struct{}

      func (w *Worker) Run(ctx context.Context) {}
    regressions:
    - code: "type valueCtx struct {\n\tcontext.Context\n\tv any\n}\n"
  xref:
  - containedctx:containedctx
  status: active
  rule_version: 1
