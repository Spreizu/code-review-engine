  source:
    url: https://go.dev/ref/spec
    doc: 'Go spec: Return statements'
    doc_version: Go 1.25
    retrieved: '2026-10-09'
    quote: 'g of cases case c <- 1: } } select {} // block forever Return statements A "return" statement in a function F terminates the execution of F , and optionally provides one or more result values.'
  examples:
