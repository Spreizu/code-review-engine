- id: GO-MAINT-REVERSED-COMPOUND-OPERATOR
  title: '`=+` / `=-` / `=!` looks like a reversed compound assignment'
  language: go
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    go: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (assignment_statement) @match
    filters:
    - node.has_re:^[^=\n]*[\w\])]\s+=[+\-](\s|[\w($])
  message: '`x =+ y` assigns +y (it is not `x += y`); write the compound operator, or `x = +y` with the space after `=` if a plain assignment was meant.'
  source:
    url: https://go.dev/ref/spec
    doc: 'Go spec: Assignment statements'
    doc_version: Go 1.25
    retrieved: '2026-10-09'
    quote: 'y be parenthesized. x = 1 *p = f() a[i] = 23 (k) = <-ch // same as: k = <-ch An assignment operation x op = y where op is a binary arithmetic operator is equivalent to x = x op (y) but evaluates x only once.'
  examples:
    bad: "package p\n\nfunc f(n int) {\n\ttotal =- n\n}\n"
    good: "package p\n\nfunc f(n int) {\n\ttotal -= n\n}\n"
    regressions:
    - code: "package p\n\nfunc f(n int) {\n\ttotal = -n\n}\n"
  xref:
  - sonar:go:S2757
  status: active
  rule_version: 1
  tags:
  - maintainability
