- id: GO-MAINT-TX-WITHOUT-ROLLBACK
  title: Transaction committed without a rollback path
  language: go
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    go: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (short_var_declaration left: (expression_list . (identifier) @v) right: (expression_list (call_expression function: (selector_expression field: (field_identifier) @f))) (#match? @f "^(Begin|BeginTx)$")) @match
    filters:
    - func.has_re:\b{cap:v}\.Commit\(
    - func.lacks_re:\b{cap:v}\.Rollback\(
  message: 'An early return leaves the transaction open, holding its connection and locks: defer tx.Rollback() right after Begin.'
  source:
    url: https://go.dev/doc/database/execute-transactions
    doc: 'Go docs: Executing transactions'
    doc_version: Go 1.25
    retrieved: '2026-10-09'
    quote: t a Tx for making transaction requests. tx, err := db.BeginTx(ctx, nil) if err != nil { return fail(err) } // Defer a rollback in case anything fails.
  examples:
    bad: "package p\n\nfunc f(ctx context.Context, db *sql.DB) error {\n\ttx, err := db.BeginTx(ctx, nil)\n\tif err != nil {\n\t\treturn err\n\t}\n\tif _, err := tx.ExecContext(ctx, q); err != nil {\n\t\treturn err\n\t}\n\treturn tx.Commit()\n}\n"
    good: "package p\n\nfunc f(ctx context.Context, db *sql.DB) error {\n\ttx, err := db.BeginTx(ctx, nil)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer tx.Rollback()\n\tif _, err := tx.ExecContext(ctx, q); err != nil {\n\t\treturn err\n\t}\n\treturn tx.Commit()\n}\n"
  xref:
  - sonar:godre:S8168
  status: active
  rule_version: 1
  tags:
  - maintainability
