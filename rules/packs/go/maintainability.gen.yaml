    mode: deterministic
    engine: tree-sitter
    query: |
      (if_statement !initializer consequence: (block (statement_list . (if_statement !initializer !alternative) .)) !alternative) @match
  message: 'This if is the only statement inside another if and neither has an else: join the two conditions with a logical AND.'
  source:
    url: https://go.dev/ref/spec
    doc: 'Go spec: If statements'
    doc_version: Go 1.25
    retrieved: '2026-10-09'
    quote: '["foo"] = 42 // setting m1["foo"] changes m2["foo"] as well fmt.Println(m2["foo"]) // prints 42 If statements "If" statements specify the conditional execution of two branches according to the value of a boolean expression.'
  examples:
