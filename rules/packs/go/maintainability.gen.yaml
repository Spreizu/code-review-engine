- id: GO-MAINT-HARDCODED-IP
  title: Hard-coded IP address
  language: go
  kind: best-practice
  category: maintainability
  severity: minor
  applies_to:
    go: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '!**/*_test.go'
    - '!**/testdata/**'
    query: |
      (interpreted_string_literal) @match
    filters:
    - node.has_re:^[\x22\x27](?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)[\x22\x27]$
    - node.lacks_re:^[\x22\x27](127\.|0\.0\.0\.0|255\.255\.255\.255|192\.0\.2\.|198\.51\.100\.|203\.0\.113\.)
  message: 'A literal IP address ties the code to one network layout: read it from configuration or resolve a host name.'
  ai_question: Is this the address of a real host or network (not a version number, a test fixture or a documentation example)?
  source:
    url: https://12factor.net/config
    doc: 'The Twelve-Factor App: Config'
    doc_version: Go 1.25
    retrieved: '2026-10-09'
    quote: This is a violation of twelve-factor, which requires strict separation of config from code .
  examples:
    bad: |
      package p

      var host = "10.20.30.40"
    good: |
      package p

      import "os"

      var host = os.Getenv("DB_HOST")
    regressions:
    - code: |
        package p

        var local = "127.0.0.1"
  xref:
  - sonar:go:S1313
  status: active
  rule_version: 1
  tags:
  - maintainability
- id: GO-MAINT-IDENTICAL-OPERANDS
  title: Same expression on both sides of an operator
  language: go
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    go: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (binary_expression left: (_) @l operator: ["<" ">" "<=" ">=" "&&" "||" "-" "/" "%" "&" "|"] right: (_) @r (#eq? @l @r)) @match
    filters:
    - cap.lacks_re:l:[(]|\+\+|--|\bawait\b|^[\d.]+$
    - cap.lacks_re:l:^(true|false|True|False|null|nil|None|-?\d[\w.]*|'[^']*'|\x22[^\x22]*\x22)$
  message: Both operands are the same expression, so the result is constant (or the second operand was meant to be something else).
  source:
    url: https://staticcheck.dev/docs/checks/
    doc: staticcheck SA4000
    doc_version: Go 1.25
    retrieved: '2026-10-09'
    quote: s SA3001 Assigning to b.N in benchmarks distorts the results SA4 Code that isn't really doing anything SA4000 Binary operator has identical expressions on both sides SA4001 &*x gets simplified to x , it does not copy x SA4003 Comparing unsigned values against negative values
  examples:
    bad: "package p\n\nfunc inRange(lo, hi, x int) bool {\n\treturn x >= lo && x >= lo\n}\n"
    good: "package p\n\nfunc inRange(lo, hi, x int) bool {\n\treturn x >= lo && x <= hi\n}\n"
    regressions:
    - code: "package p\n\nfunc f() int {\n\treturn next() - next()\n}\n"
  xref:
  - staticcheck:SA4000
  - sonar:go:S1764
  status: active
  rule_version: 1
  tags:
  - maintainability
