    filters:
    - node.lacks_re:\]\s*[!=]=|\b(Get\w*|Value|Load|Interface|Lookup)\([^()]*\)\s*[!=]=|^\s*(true|false)\s*[!=]=\s*\w+\[
  message: 'Comparing with true/false adds nothing: use the expression itself, or negate it.'
