    good: "package p\n\nfunc f(a, b, c, d, e bool) int {\n\tif a && b {\n\t\tg()\n\t}\n\treturn 0\n}\n"
    regressions:
    - code: "package p\n\nfunc f(a, b, c, d, e bool) int {\n\tif a {\n\t\tif b {\n\t\t\tg()\n\t\t} else {\n\t\t\th()\n\t\t}\n\t}\n\treturn 0\n}\n"
