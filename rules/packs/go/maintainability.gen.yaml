    doc: staticcheck S1002
    doc_version: Go 1.25
    retrieved: '2026-10-09'
    quote: se plain channel send or receive instead of single-case select S1001 Replace for loop with call to copy S1002 Omit comparison with boolean constant S1003 Replace call to strings.Index with strings.Contains S1004 Replace call to bytes.Compare with bytes.Equa
  examples:
    bad: "package p\n\nfunc f(done bool) {\n\tif done == true {\n\t\tstop()\n\t}\n}\n"
    good: "package p\n\nfunc f(done bool) {\n\tif done {\n\t\tstop()\n\t}\n}\n"
    regressions:
    - code: "package p\n\nfunc f(m map[string]any) bool {\n\treturn m[\"x\"] == true\n}\n"
    - code: "package p\n\nfunc f(ctx C) bool {\n\treturn GetVar(ctx, k) == true\n}\n"
  xref:
  - gosimple:S1002
  - revive:bool-literal-in-expr
  - sonar:go:S1125
  status: active
  rule_version: 1
  tags:
  - maintainability
- id: GO-MAINT-BUSY-WAIT-LOOP
  title: Loop that spins with an empty body
  language: go
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    go: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (for_statement body: (block) @b) @match
    filters:
    - node.has_re:^for(\s+[^;{]*)?\s*\{\s*\}$
    - node.lacks_re:^for[^{]*\brange\b
  message: 'Spinning on a variable burns a CPU and, without synchronisation, may never observe the write: wait on a channel, sync.WaitGroup or sync.Cond.'
  source:
    url: https://go.dev/ref/mem
    doc: The Go Memory Model
    doc_version: Go 1.25
    retrieved: '2026-10-09'
    quote: 'This version can (incorrectly) print an empty string instead of "hello, world" . Another incorrect idiom is busy waiting for a value, as in: var a string var done bool func setup() { a = "hello, world" done = true } func main() { go setup() f'
  examples:
    bad: "package p\n\nfunc f(ready bool) error {\n\tfor !ready {\n\t}\n\treturn nil\n}\n"
    good: "package p\n\nfunc f(readyCh chan struct{}) error {\n\t<-readyCh\n\treturn nil\n}\n"
  xref:
  - sonar:godre:S8259
  status: active
  rule_version: 1
  tags:
  - maintainability
