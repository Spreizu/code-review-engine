rules:
- id: GO-MAINT-ALL-BRANCHES-SAME
  title: Every branch runs the same code
  language: go
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    go: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      [(if_statement) (expression_switch_statement) (type_switch_statement)] @match
    filters:
    - branches.all_same
    - parentkind.lacks_re:if_statement:.
  message: 'All branches of this if/switch (including the else/default) do the same thing, so the condition has no effect: drop the condition or make the branches differ as intended.'
  source:
    url: https://raw.githubusercontent.com/mgechev/revive/master/RULES_DESCRIPTIONS.md
    doc: revive rule identical-ifelseif-branches
    doc_version: Go 1.25
    retrieved: '2026-10-09'
    quote: An `if ... else if` chain with identical branches makes maintenance harder and might be a source of bugs.
  examples:
    bad: "package p\n\nfunc f(a int) int {\n\tif a == 1 {\n\t\tsave(1)\n\t} else {\n\t\tsave(1)\n\t}\n\treturn 0\n}\n"
    good: "package p\n\nfunc f(a int) int {\n\tif a == 1 {\n\t\tsave(1)\n\t} else {\n\t\tsave(2)\n\t}\n\treturn 0\n}\n"
    regressions:
    - code: "package p\n\nfunc f(a int) int {\n\tif a == 1 {\n\t\tsave(1)\n\t} else if a == 2 {\n\t\tsave(1)\n\t}\n\treturn 0\n}\n"
  xref:
  - revive:identical-branches
  - sonar:go:S3923
  status: active
  rule_version: 1
  tags:
  - maintainability
- id: GO-MAINT-BACKGROUND-CONTEXT-WITH-CTX
  title: New background context where a ctx parameter exists
  language: go
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    go: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      (call_expression function: (selector_expression operand: (identifier) @p field: (field_identifier) @f) (#eq? @p "context") (#match? @f "^(Background|TODO)$")) @match
    filters:
    - ancestor.has_re:function_declaration|method_declaration|func_literal:^[^{]*\b\w*[cC]tx\s+context\.Context\b
  message: The function already receives a ctx; starting from Background drops its cancellation and deadline. Pass ctx (or context.WithoutCancel(ctx) for deliberately detached work).
  ai_question: 'Is this really a case of: New background context where a ctx parameter exists? Answer from the code shown.'
  source:
    url: https://pkg.go.dev/context
    doc: 'Go docs: context.Background'
    doc_version: Go 1.25
    retrieved: '2026-10-09'
    quote: It is never canceled, has no values, and has no deadline. It is typically used by the main function, initialization, and tests, and as the top-level Context for incoming requests.
  examples:
    bad: "package p\n\nfunc f(ctx context.Context, db *sql.DB) error {\n\treturn load(context.Background(), db)\n}\n"
    good: "package p\n\nfunc f(ctx context.Context, db *sql.DB) error {\n\treturn load(ctx, db)\n}\n"
    regressions:
    - code: "package p\n\nfunc f(db *sql.DB) error {\n\tctx := context.Background()\n\th := func(ctx context.Context) error { return nil }\n\treturn h(ctx)\n}\n"
  xref:
  - sonar:godre:S8239
  status: active
  rule_version: 1
  tags:
  - maintainability
- id: GO-MAINT-BOOLEAN-LITERAL-COMPARISON
