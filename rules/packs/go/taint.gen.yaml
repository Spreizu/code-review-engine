    doc_version: current
    retrieved: '2026-10-09'
    quote: tions may reach extreme situations that cause them to work very slowly (exponentially related to input size). An attacker can then cause a program using a Regular Expression (Regex) to enter these extreme situations and then hang for a very long time.
  examples:
    bad: "package main\n\nimport (\n\t\"net/http\"\n\t\"regexp\"\n)\n\nfunc handler(w http.ResponseWriter, r *http.Request) {\n\tre, _ := regexp.Compile(r.URL.Query().Get(\"q\"))\n\t_ = re\n}\n"
