- id: GO-MOD-STRINGSBUILDER
  title: String concatenation in a loop
  language: go
  kind: modernization
  category: modernization
  severity: minor
  applies_to:
    go: '>=1.10'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (for_statement body: (block (statement_list (assignment_statement operator: "+=" right: (expression_list [(interpreted_string_literal) (call_expression function: (selector_expression operand: (identifier) @x (#eq? @x "fmt")))])) @match)))
  message: Repeated += on strings is quadratic; use strings.Builder.
  source:
    url: https://pkg.go.dev/golang.org/x/tools/go/analysis/passes/modernize
    doc: gopls/go fix modernize
    doc_version: Go 1.27
    retrieved: '2026-10-09'
    quote: 'Analyzer stringsbuilder ¶ stringsbuilder: replace += with strings.Builder This analyzer replaces repeated string += string concatenation operations with calls to Go 1.10''s strings.Bui'
  examples:
    bad: "func f() string {\n\tfor _, v := range s {\n\t\tout += fmt.Sprint(v)\n\t}\n\treturn out\n}\n"
    good: "func f() string {\n\tvar b strings.Builder\n\tfor _, v := range s {\n\t\tfmt.Fprint(&b, v)\n\t}\n\treturn b.String()\n}\n"
  status: active
  rule_version: 1
- id: GO-MOD-STRINGSCUTPREFIX
  title: HasPrefix + TrimPrefix
  language: go
  kind: modernization
  category: modernization
  severity: info
  applies_to:
    go: '>=1.20'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (if_statement !initializer condition: (call_expression function: (selector_expression operand: (identifier) @p (#match? @p "^(strings|bytes)$") field: (field_identifier) @f (#match? @f "^Has(Prefix|Suffix)$")) arguments: (argument_list) @args) consequence: (block) @b) @match
    filters:
    - cap.has_re:b:\b(strings|bytes)\.Trim(Prefix|Suffix){cap:args}
  message: Use strings.CutPrefix/CutSuffix (Go 1.20).
  source:
    url: https://pkg.go.dev/golang.org/x/tools/go/analysis/passes/modernize
    doc: gopls/go fix modernize
    doc_version: Go 1.27
    retrieved: '2026-10-09'
    quote: where code first checks for a prefix with `strings.HasPrefix` and then removes it with `strings.TrimPrefix`. It replaces this two-step process with a single call to `strings.CutPrefix`, introduced in Go 1.20. The analyzer also handles the equivalent functions in the `bytes` package.
  examples:
    bad: "func f() {\n\tif strings.HasPrefix(s, p) {\n\t\tuse(strings.TrimPrefix(s, p))\n\t}\n}\n"
    good: "func f() {\n\tif after, ok := strings.CutPrefix(s, p); ok {\n\t\tuse(after)\n\t}\n}\n"
    regressions:
    - code: "func f(p *parser, q byte) {\n\tif strings.HasPrefix(p.rest(), strings.Repeat(string(q), 3)) {\n\t\tp.i += 3\n\t\tv := strings.TrimPrefix(p.s[p.i:], \"\\n\")\n\t\tuse(v)\n\t}\n}\n"
  status: active
  rule_version: 1
- id: GO-MOD-STRINGSSEQ
  title: Ranging over strings.Split / Fields
  language: go
  kind: modernization
  category: modernization
  severity: info
  applies_to:
    go: '>=1.24'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (for_statement (range_clause left: (expression_list (identifier) @u (#eq? @u "_") (identifier)) right: (call_expression function: (selector_expression operand: (identifier) @p (#match? @p "^(strings|bytes)$") field: (field_identifier) @f (#match? @f "^(Split|Fields)$")))) @match)
  message: Use strings.SplitSeq/FieldsSeq (Go 1.24) to avoid allocating the slice.
  source:
    url: https://pkg.go.dev/golang.org/x/tools/go/analysis/passes/modernize
    doc: gopls/go fix modernize
    doc_version: Go 1.27
    retrieved: '2026-10-09'
    quote: It replaces for range strings.Split(...) with the more efficient for range strings.SplitSeq(...) which was added in Go 1.24 and avoids allocating a slice for the substrings.
  examples:
    bad: "func f() {\n\tfor _, part := range strings.Split(s, \",\") {\n\t\tuse(part)\n\t}\n}\n"
    good: "func f() {\n\tfor part := range strings.SplitSeq(s, \",\") {\n\t\tuse(part)\n\t}\n}\n"
  status: active
  rule_version: 1
- id: GO-MOD-TESTINGCONTEXT
  title: context.WithCancel + defer cancel in a test
  language: go
  kind: modernization
  category: modernization
  severity: info
  applies_to:
    go: '>=1.24'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*_test.go'
    query: |
      (statement_list (short_var_declaration left: (expression_list . (identifier) . (identifier) @c .) right: (expression_list . (call_expression function: (selector_expression operand: (identifier) @p (#eq? @p "context") field: (field_identifier) @f (#eq? @f "WithCancel")) arguments: (argument_list . (call_expression function: (selector_expression operand: (identifier) @p2 (#eq? @p2 "context") field: (field_identifier) @f2 (#match? @f2 "^(Background|TODO)$"))) .)) .)) @match . (defer_statement (call_expression function: (identifier) @d arguments: (argument_list) .)) (#eq? @c @d))
    filters:
    - ancestor.has_re:function_declaration|method_declaration|func_literal:^[^{]*\*testing\.[TBF]\b
    - func.count_lt:3:(^|[^\w.]){cap:c}\b
  message: 'Use t.Context() (Go 1.24): cancelled when the test ends.'
  source:
    url: https://pkg.go.dev/golang.org/x/tools/go/analysis/passes/modernize
    doc: gopls/go fix modernize
    doc_version: Go 1.27
    retrieved: '2026-10-09'
    quote: ontext.WithCancel with t.Context in tests The testingcontext analyzer simplifies context management in tests. It replaces the manual creation of a cancellable context, ctx, cancel := context.WithCancel(context.Background()) defer cancel() with a single call to t.Context(), wh
  examples:
    bad: "func TestX(t *testing.T) {\n\tctx, cancel := context.WithCancel(context.Background())\n\tdefer cancel()\n\trun(ctx)\n}\n"
    good: "func TestX(t *testing.T) {\n\tctx := t.Context()\n\trun(ctx)\n}\n"
    regressions:
    - code: "func TestX(t *testing.T) {\n\tctx := context.Background()\n\trun(ctx)\n}\n"
    - code: "func TestMain(m *testing.M) {\n\tctx, cancel := context.WithCancel(context.Background())\n\tdefer cancel()\n\trun(ctx)\n}\n"
    - code: "func TestX(t *testing.T) {\n\tctx, cancel := context.WithCancel(context.Background())\n\tdefer cancel()\n\tgo stop(cancel)\n\trun(ctx)\n}\n"
  status: active
  rule_version: 1
