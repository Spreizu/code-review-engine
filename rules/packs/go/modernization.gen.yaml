    query: |
      (call_expression function: (selector_expression operand: (identifier) @p (#eq? @p "sort") field: (field_identifier) @f (#match? @f "^(Slice|SliceStable)$")) arguments: (argument_list (_) (func_literal))) @match
    filters:
    - node.lacks_re:return \w+\[\w+\] < \w+\[\w+\] \}
  message: slices.SortFunc/SortStableFunc (Go 1.21) are type-safe and faster than reflection-based sort.Slice.
