      (for_statement (for_clause initializer: (short_var_declaration right: (expression_list (binary_expression left: (call_expression function: (identifier) @l (#eq? @l "len")) operator: "-" right: (int_literal) @one (#eq? @one "1")))) update: (dec_statement))) @match
  message: Use slices.Backward (Go 1.23).
  source:
    url: https://pkg.go.dev/golang.org/x/tools/go/analysis/passes/modernize
    doc: gopls/go fix modernize
    doc_version: Go 1.27
    retrieved: '2026-10-09'
    quote: 'suggests replacing manually-written backward loops of the form for i := len(s) - 1; i >= 0; i-- { use(s[i]) } with the more readable Go 1.23 style using slices.Backward: for _, v := range slices.Backward(s) { use(v) } If the loop index is needed beyond just indexing into the sl'
  examples:
    bad: "func f() {\n\tfor i := len(s) - 1; i >= 0; i-- {\n\t\tuse(s[i])\n\t}\n}\n"
    good: "func f() {\n\tfor _, v := range slices.Backward(s) {\n\t\tuse(v)\n\t}\n}\n"
  status: active
  rule_version: 1
- id: GO-MOD-SLICESCLIP
