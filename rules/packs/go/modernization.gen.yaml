- id: GO-MOD-SLICESCONTAINS
  title: Loop that is slices.Contains
  language: go
  kind: modernization
  category: modernization
  severity: info
  applies_to:
    go: '>=1.21'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (for_statement (range_clause left: (expression_list (identifier) @u (#eq? @u "_") (identifier) @v)) body: (block (statement_list . (if_statement !initializer condition: [(binary_expression left: (identifier) @l operator: "==") (binary_expression operator: "==" right: (identifier) @l)] consequence: (block (statement_list . (return_statement (expression_list . (true) .)) .))) .)) (#eq? @l @v)) @match
  message: Use slices.Contains (Go 1.21).
  source:
    url: https://pkg.go.dev/golang.org/x/tools/go/analysis/passes/modernize
    doc: gopls/go fix modernize
    doc_version: Go 1.27
    retrieved: '2026-10-09'
    quote: tainsFunc The slicescontains analyzer simplifies loops that check for the existence of an element in a slice. It replaces them with calls to `slices.Contains` or `slices.ContainsFunc`, which were added in Go 1.21.
  examples:
    bad: "func has(s []string, x string) bool {\n\tfor _, v := range s {\n\t\tif v == x {\n\t\t\treturn true\n\t\t}\n\t}\n\treturn false\n}\n"
    good: "func has(s []string, x string) bool {\n\treturn slices.Contains(s, x)\n}\n"
    regressions:
    - note: 'self-scan 2026-10-10: existence probe (os.Stat in an if initializer, returns a pair) is not a membership test'
      code: "func find(paths []string) (string, bool) {\n\tfor _, p := range paths {\n\t\tif _, err := os.Stat(p); err == nil {\n\t\t\treturn p, true\n\t\t}\n\t}\n\treturn \"\", false\n}\n"
    - note: comparison that does not involve the loop variable
      code: "func any(xs []int, a, b int) bool {\n\tfor _, x := range xs {\n\t\tif a == b {\n\t\t\treturn true\n\t\t}\n\t\t_ = x\n\t}\n\treturn false\n}\n"
  status: active
  rule_version: 1
