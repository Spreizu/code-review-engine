    quote: 'start with an underscore are not deprecated: <?php class _MyClass {} Using trigger_error() with E_USER_ERROR Calling trigger_error() with error_level being equal to E_USER_ERROR is now deprecated. Such usages should be replaced by either throwing an exception, or calling exit() , whichever is more appropr'
  examples:
    bad: |
      <?php
      trigger_error('bad', E_USER_ERROR);
    good: |
      <?php
      throw new RuntimeException('bad');
  status: active
  rule_version: 1
- id: PHP-MIG-UTF8-ENCODE
  title: utf8_encode()/utf8_decode()
  language: php
  kind: deprecation
  category: deprecation
  severity: major
  applies_to:
    php: '>=8.2'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((function_call_expression function: (name) @match) (#match? @match "(?i)^(utf8_encode|utf8_decode)$"))
  message: Deprecated in 8.2 (they only handle Latin-1); use mb_convert_encoding/UConverter.
  source:
    url: https://www.php.net/manual/en/migration82.deprecated.php
    doc: Deprecated features in PHP 8.2
    doc_version: PHP 8.2
    retrieved: '2026-10-09'
    quote: Standard utf8_encode() and utf8_decode() have been deprecated.
  examples:
    bad: |
      <?php
      $s = utf8_encode($s);
    good: |
      <?php
      $s = mb_convert_encoding($s, 'UTF-8', 'ISO-8859-1');
  status: active
  rule_version: 1
