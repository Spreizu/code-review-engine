- id: PHP-SEC-CSV-FORMULA-INJECTION
  title: fputcsv with request-derived values
  language: php
  kind: security
  category: security
  severity: minor
  applies_to:
    php: '>=7.4'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    files:
    - '**/*.php'
    query: |
      ((function_call_expression function: (name) @f) @match (#eq? @f "fputcsv"))
    filters:
    - file.has_re:\$_(GET|POST|REQUEST)\b|->(input|get|post)\(|Request\b
    exclude_tests: true
  message: Cells starting with =, +, -, @, tab or CR are run as formulas when the export is opened in a spreadsheet, so user-supplied text can execute formulas or exfiltrate data. Prefix such values with a single quote (and quote every field) before writing.
  ai_question: Do any of the written cell values come from users (form fields, names, comments) without neutralising a leading = + - @ tab or CR?
  source:
    url: https://owasp.org/www-community/attacks/CSV_Injection
    doc: fputcsv with request-derived values
    doc_version: OWASP Cheat Sheet Series (current)
    retrieved: '2026-10-09'
    quote: 'Timo Goosen, Albinowax Contributor(s): kingthorin, Prasun Srivastav CSV Injection, also known as Formula Injection, occurs when websites embed untrusted input inside CSV files.'
  examples:
    bad: |
      <?php
      $out = fopen('php://output', 'w');
      fputcsv($out, [$_POST['name'], $_POST['comment']]);
    good: |
      <?php
      $out = fopen('php://output', 'w');
      fputcsv($out, ['total', $total]);
  cwe:
  - CWE-1236
  asvs:
  - V1.2.10
  status: active
  rule_version: 1
  tags:
  - appsec
