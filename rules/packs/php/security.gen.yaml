- id: PHP-SEC-DOUBLE-ENCODING
  title: Value encoded twice with the same function
  language: php
  kind: security
  category: security
  severity: minor
  applies_to:
    php: '>=7.4'
  detection:
    mode: deterministic
    engine: tree-sitter
    files:
    - '**/*.php'
    query: |
      ((function_call_expression function: (name) @f arguments: (arguments . (argument (function_call_expression function: (name) @g)) .)) @match (#eq? @f @g) (#match? @f "^(htmlspecialchars|htmlentities|urlencode|rawurlencode)$"))
    exclude_tests: true
  message: 'The value is encoded twice, so the receiver decodes it once and is left with escape sequences (%2520, &amp;lt;): output is garbled, and a filter that checks the once-decoded text can be bypassed. Encode exactly once, at the boundary where the value enters the target syntax.'
  source:
    url: https://owasp.org/www-community/Double_Encoding
    doc: Value encoded twice with the same function
    doc_version: OWASP Cheat Sheet Series (current)
    retrieved: '2026-10-09'
    quote: Accept x Store Donate Join Double Encoding Description This attack technique consists of encoding user request parameters twice in hexadecimal format in order to bypass security controls or cause unexpected behavior from the application.
  examples:
    bad: |
      <?php
      echo htmlspecialchars(htmlspecialchars($title));
    good: |
      <?php
      echo htmlspecialchars($title);
  cwe:
  - CWE-116
  asvs:
  - V1.1.2
  status: active
  rule_version: 1
  tags:
  - appsec
