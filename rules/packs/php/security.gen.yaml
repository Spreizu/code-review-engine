- id: PHP-SEC-UNSERIALIZE-INPUT
  title: unserialize() on untrusted data
  language: php
  kind: security
  category: security
  severity: critical
  applies_to:
    php: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((function_call_expression function: (name) @match) (#match? @match "(?i)^(unserialize)$"))
    filters:
    - parent.lacks_re:allowed_classes
  message: unserialize() can instantiate arbitrary classes (object injection); use JSON or allowed_classes => false.
  ai_question: Can the serialized data be influenced by a user (cookie, request, DB value written from input) and is allowed_classes not restricted?
  source:
    url: https://www.php.net/manual/en/function.unserialize.php
    doc: unserialize() on untrusted data
    doc_version: PHP Manual (2026)
    retrieved: '2026-10-09'
    quote: Warning Do not pass untrusted user input to unserialize() regardless of the options value of allowed_classes .
  examples:
    bad: |
      <?php
      $o = unserialize($_COOKIE['cart']);
    good: |
      <?php
      $o = json_decode($_COOKIE['cart'], true, 512, JSON_THROW_ON_ERROR);
  status: active
  rule_version: 1
