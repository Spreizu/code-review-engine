  kind: security
  category: security
  severity: major
  applies_to:
    php: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      ((function_call_expression function: (name) @f arguments: (arguments . (argument (string) @n) . (argument) .)) @match (#eq? @f "setcookie") (#match? @n "(?i)(session|sid|token|auth|jwt|remember)"))
  message: Only name and value are passed, so the cookie is readable by JavaScript and sent over HTTP. Pass the options array with secure, httponly and samesite.
  source:
    url: https://www.php.net/manual/en/function.setcookie.php
    doc: Session/token cookie set without secure/httponly
    doc_version: PHP Manual (2026)
    retrieved: '2026-10-09'
    quote: ly on secure connection (e.g. with respect to $_SERVER["HTTPS"] ). httponly When true the cookie will be made accessible only through the HTTP protocol.
  examples:
    bad: |
      <?php
      setcookie('session_id', $sid);
    good: |
      <?php
      setcookie('session_id', $sid, ['secure' => true, 'httponly' => true, 'samesite' => 'Lax']);
  xref:
  - sonar:php:S2092
  - sonar:php:S3330
  cwe:
  - CWE-614
  - CWE-1004
  status: active
  rule_version: 1
- id: PHP-SEC-SHELL-INJECTION
  title: Shell command built from request data
  language: php
  kind: security
  category: security
  severity: critical
  applies_to:
    php: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((function_call_expression function: (name) @f arguments: (arguments . (argument) @a)) @match (#match? @f "(?i)^(exec|system|passthru|shell_exec|popen|proc_open|pcntl_exec)$") (#match? @a "\\$_(GET|POST|REQUEST|COOKIE|FILES|SERVER)|\\$[a-zA-Z_]"))
    filters:
    - parent.lacks_re:escapeshell(arg|cmd)
    - taint.clean:cmdi
  message: Escape every argument with escapeshellarg() (or use proc_open with an argv array, 7.4+).
  ai_question: Does the command include data that is not a constant or already escaped with escapeshellarg?
  source:
    url: https://www.php.net/manual/en/function.escapeshellarg.php
    doc: Shell command built from request data
    doc_version: PHP Manual (2026)
    retrieved: '2026-10-09'
    quote: '— Escape a string to be used as a shell argument Description function escapeshellarg ( string $arg ): string escapeshellarg() adds single quotes around a string and quotes/escapes any existing single quotes allowing you to pass a string directly to a shell function and having it be treated as a single safe argument'
  examples:
    bad: |
      <?php
      system('convert ' . $_GET['f'] . ' out.png');
    good: |
      <?php
