    mode: ai-confirm
    engine: tree-sitter
    query: |
      (method_declaration body: (compound_statement (exit_statement) @match))
  message: Exiting from library code prevents callers from handling the failure.
  ai_question: Is this reusable/library code (not a CLI entrypoint) terminating the process?
  source:
    url: https://www.php.net/manual/en/function.exit.php
    doc: exit()/die() in class code
    doc_version: PHP 8.5
    retrieved: '2026-10-09'
    quote: 'lian Portuguese Russian Turkish Ukrainian Chinese (Simplified) Other exit (PHP 4, PHP 5, PHP 7, PHP 8) exit — Terminate the current script with a status code or message Description function exit ( string | int $status = 0 ): never Terminates execution of the script.'
