- id: PHP-QUAL-HARDCODED-URI
  title: Hard-coded absolute URI
  language: php
  kind: best-practice
  category: maintainability
  severity: minor
  applies_to:
    php: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      ((string (string_content) @match) (#match? @match "(?i)^https?://[a-z0-9]"))
      ((encapsed_string (string_content) @match) (#match? @match "(?i)^https?://[a-z0-9]"))
    filters:
    - node.lacks_re:(?i)example\\.(com|org|net)|localhost|127\\.0\\.0\\.1|schema\\.org|w3\\.org|php\\.net
  message: An absolute URL baked into source has to change in every environment; take the origin from configuration.
  ai_question: Is this a real deployment URL (API, asset host) rather than a test fixture, schema.org IRI or example.com documentation string?
  source:
    url: https://www.php.net/manual/en/language.types.string.php
    doc: Hard-coded absolute URI
    doc_version: PHP 8.5
    retrieved: '2026-10-09'
    quote: A string literal can be specified in four different ways.
  examples:
    bad: |
      <?php
      $url = 'https://api.pay.internal/v1/users';
    good: |
      <?php
      $url = getenv('API_BASE') . '/v1/users';
  xref:
  - sonar:php:S1075
  status: active
  rule_version: 1
