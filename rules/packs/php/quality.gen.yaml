- id: PHP-QUAL-ERROR-SUPPRESSION
  title: '@ error suppression'
  language: php
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    php: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (error_suppression_expression) @match
  message: '@ hides errors; handle them explicitly.'
  source:
    url: https://www.php.net/manual/en/language.operators.errorcontrol.php
    doc: '@ error suppression'
    doc_version: PHP 8.5
    retrieved: '2026-10-09'
    quote: 'hinese (Simplified) Other Error Control Operators PHP supports one error control operator: the at sign ( @ ). When prepended to an expression in PHP, any diagnostic error that might be generated by that expression will be suppressed. If a custom error handler function is set with set_error_handler() , it will still be called even though the'
  examples:
    bad: |
      <?php
      $c = @file_get_contents($p);
    good: |
      <?php
      $c = file_get_contents($p);
      if ($c === false) { throw new RuntimeException('read failed'); }
  status: active
  rule_version: 1
- id: PHP-QUAL-EXIT-IN-LIBRARY
  title: exit()/die() in class code
  language: php
  kind: anti-pattern
  category: correctness
  severity: minor
  applies_to:
    php: '*'
  detection:
    mode: ai-confirm
    engine: tree-sitter
    query: |
      (method_declaration body: (compound_statement (exit_statement) @match))
  message: Exiting from library code prevents callers from handling the failure.
  ai_question: Is this reusable/library code (not a CLI entrypoint) terminating the process?
  source:
    url: https://www.php.net/manual/en/function.exit.php
    doc: exit()/die() in class code
    doc_version: PHP 8.5
    retrieved: '2026-10-09'
    quote: 'lian Portuguese Russian Turkish Ukrainian Chinese (Simplified) Other exit (PHP 4, PHP 5, PHP 7, PHP 8) exit — Terminate the current script with a status code or message Description function exit ( string | int $status = 0 ): never Terminates execution of the script.'
  examples:
    bad: |
      <?php
      class S { public function run() { exit(1); } }
    good: |
      <?php
      class S { public function run(): int { return 1; } }
  status: active
  rule_version: 1
