  detection:
    mode: ai-confirm
    engine: taint
    config:
      class: cmdi
    exclude_tests: true
  message: Request data reaches a process/shell command in this function. Avoid the shell, pass a fixed program with separate arguments, and validate values against an allow-list.
  ai_question: Does untrusted request data really flow, along the path shown in the evidence, into this os command built from sink without an effective guard (allow-list, type conversion, encoder or parameter binding) for this context? Answer no if the value is constant on every path, validated, or the sink is not reachable with attacker data.
  source:
    url: https://www.php.net/manual/en/function.escapeshellarg.php
    doc: 'PHP Manual: escapeshellarg'
    doc_version: current
    retrieved: '2026-10-09'
    quote: 'g ): string escapeshellarg() adds single quotes around a string and quotes/escapes any existing single quotes allowing you to pass a string directly to a shell function and having it be treated as a single safe argument.'
  examples:
    bad: |
      <?php
      $host = $_GET["host"];
      system("ping -c 1 " . $host);
    good: |
      <?php
      $host = escapeshellarg($_GET["host"]);
      system("ping -c 1 " . $host);
