- id: PHP-MAINT-ALL-BRANCHES-SAME
  title: Every branch runs the same code
  language: php
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    php: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      [(if_statement) (switch_statement)] @match
    filters:
    - branches.all_same
  message: 'All branches of this if/switch (including the else/default) do the same thing, so the condition has no effect: drop the condition or make the branches differ as intended.'
  source:
    url: https://www.php.net/manual/en/control-structures.switch.php
    doc: 'PHP manual: switch'
    doc_version: PHP 8.4
    retrieved: '2026-10-09'
    quote: sian Turkish Ukrainian Chinese (Simplified) Other switch (PHP 4, PHP 5, PHP 7, PHP 8) The switch statement is similar to a series of if statements on the same expression.
  examples:
    bad: |
      <?php
      function f($a) {
          if ($a == 1) {
              save(1);
          } else {
              save(1);
          }
          return 0;
      }
    good: |
      <?php
      function f($a) {
          if ($a == 1) {
              save(1);
          } else {
              save(2);
          }
          return 0;
      }
    regressions:
    - code: |
        <?php
        function f($a) {
            if ($a == 1) {
                save(1);
            } elseif ($a == 2) {
                save(1);
            }
            return 0;
        }
  xref:
  - sonar:php:S3923
  status: active
  rule_version: 1
  tags:
  - maintainability
