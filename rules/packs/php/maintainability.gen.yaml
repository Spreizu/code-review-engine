- id: PHP-MAINT-SWITCH-FALLTHROUGH
  title: switch case falls through to the next case
  language: php
  kind: anti-pattern
  category: correctness
  severity: major
  applies_to:
    php: '*'
  detection:
    mode: deterministic
    engine: tree-sitter
    query: |
      (switch_block (case_statement (_) @last .) @c . [(case_statement) (default_statement)]) @match
    filters:
    - cap.has_re:c:^case\s+(?:[^:]|::)+?:\s*[^\s:]
    - cap.lacks_re:c:\b(break|return|throw|continue|exit|die|goto)\b[^;]*;\s*(//[^\n]*|/\*[\s\S]*?\*/|\s)*$
    - cap.lacks_re:c:(?i)fall[s -]?through|no break
    - cap.has_re:last:(;|\})\s*$
    - cap.lacks_re:last:^(break|return|throw|continue|exit|die|goto)\b|\b(break|return|throw|continue)\b[^;]*;(\s|\})*$
  message: Without break the next case's statements run too; add break/return, or comment an intended fall-through.
  source:
    url: https://www.php.net/manual/en/control-structures.switch.php
    doc: 'PHP manual: switch'
    doc_version: PHP 8.4
    retrieved: '2026-10-09'
    quote: If you don't write a break statement at the end of a case's statement list, PHP will go on executing the statements of the following case.
  examples:
    bad: |
      <?php
      function f($a, $xs)
      {
          switch ($a) {
              case 1:
                  start();
              case 2:
                  stop();
                  break;
          }
      }
    good: |
      <?php
      function f($a, $xs)
      {
          switch ($a) {
              case 1:
                  start();
                  break;
              case 2:
                  stop();
                  break;
          }
      }
    regressions:
    - code: |
        <?php
        function f($a, $xs)
        {
            switch ($a) {
                case Rule::ROOT:
                    return 1;
                case Rule::FIXED:
                case Rule::LOCKED:
                    return 3;
            }
        }
    - code: |
        <?php
        function f($a, $xs)
        {
            switch ($a) {
                case 1:
                    $n = count($xs);
                    log($n);
                    return 'add ' . implode(' and ', array_map(static function ($x) {
                        return $x;
                    }, $xs)) . ' now';
                case 2:
                    return '';
            }
        }
